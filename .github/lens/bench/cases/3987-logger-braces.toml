# #3987 — fix(context): bind activity log context instead of passing it to loguru format.
# Answer key from an independent review (Claude Code, Opus 5.5) of this exact head.
# lens's first live review found only `fixture-restore`, at medium.

[source]
base = "560590321fab55c78ef59d2ccf0f69cb2ecf9ee4"
head = "3396813fe8c56b8c2f66ff4ff7c556db5fd4baba"
title = "fix(context): FND-2570 bind activity log context instead of passing it to loguru format"
body = '''
## Summary

Inside an activity, logging through `_WorkflowSafeLogger` (`self.logger` / the task context logger) can **raise and fail the task** when the message contains a brace, and `exc_info=True` silently drops the traceback.

`_log`'s activity branch passed its kwargs — the `correlation_id` it injects whenever a correlation context exists (every activity), plus any caller context such as `records=3` or `exc_info=True` — straight into loguru's `logger.<level>(message, **kwargs)`. Loguru runs `message.format(**kwargs)` whenever it receives kwargs, so any `{` / `}` in the message raised `KeyError` / `IndexError` / `ValueError`. Loguru also does not treat an `exc_info` kwarg as an exception; it lands in `extra` and the traceback is lost.

## Change

`application_sdk/app/context.py`, activity branch of `_WorkflowSafeLogger._log` only — do what the `get_logger()` adapter already does (`logger_adaptor.py`, `bind(**kwargs)` + `opt(exception=...)`).

Loguru never receives kwargs, so it never `str.format`s on them — the whole crash class goes, with no escaping logic. The workflow-context branch is untouched.

**Contract change (deliberate):** keyword arguments are **context fields** (bound extras), not `str.format` placeholders. So `info("n={n}", n=3)` now logs `n={n}` (with `n` bound as context) on both paths, where the activity path used to render `n=3`. A search of the SDK and 74 local connector clones found no call that relies on keyword placeholders; local clones may trail `main`.

`{}`-style **positional** args are unchanged (loguru still formats `info("x {}", 5)`, as the adapter does).
'''

# The fix is incomplete in the same function: the probe-failure path still passes
# exc_info=True straight to loguru (traceback lost). An unchanged-code suggestion: low.

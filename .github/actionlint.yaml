# actionlint configuration.
#
# Enabled after three consecutive @sdk-loop startup failures that a schema
# validator would have caught before merge: a duplicate `description` key, and
# a `needs.<job>` reference to a job the caller did not depend on. Both make
# GitHub refuse to parse the workflow, and a workflow GitHub will not parse
# runs NO jobs — so the symptom is silence, not an error, and CI stays green
# while the lane is dead.
#
# ── About the ignores below ────────────────────────────────────────────────
# Every one is a checked FALSE POSITIVE, not deferred work. Each was read
# against GitHub's own documentation or the surrounding intent before being
# listed here, and the reason is recorded so a future reader does not have to
# repeat the check. If actionlint ever learns these, delete the entry.
#
# shellcheck is disabled at the hook (`-shellcheck=`): 64 pre-existing findings
# in `run:` blocks, a separate and far lower-stakes concern than a workflow
# that will not start. Worth its own pass.

# NOT self-hosted labels — `self-hosted-runner.labels` is the only knob
# actionlint offers for teaching it a runner label, and these are ordinary
# GitHub-hosted ones.
#
# actionlint hardcodes the GitHub-hosted label list in its source and only
# refreshes it in a release. Upstream has been dormant since 2026-04-19, so
# v1.7.12 (2026-03-30) is still the newest release and it predates the
# `ubuntu-26.04` runner images (first published 2026-08-31). Requests for the
# label have been open since 2026-06-12: rhysd/actionlint#682, #683, #723.
#
# The values are globs (`path.Match`), so one pattern covers every future
# Ubuntu bump instead of a per-version treadmill. They are deliberately narrow
# — the `NN.04` shape is required, so typos are still caught: `ubunto-26.04`,
# `ubuntu-26.4` and `macos-99` all remain errors. Verified against v1.7.12.
#
# Delete this block if actionlint resumes releases and learns the labels.
self-hosted-runner:
  labels:
    - "ubuntu-2*.04"
    - "ubuntu-2*.04-arm"

paths:
  # FALSE POSITIVE — `$cron-daily` is a GitHub starter-workflow placeholder,
  # not a cron expression.
  #
  # Files under .github/workflow-templates/ are starter workflows: GitHub
  # substitutes `$default-branch`, `$protected-branches` and `$cron-daily`
  # when a repo adopts one. Only the cron placeholder trips actionlint — the
  # other two sit in string fields it does not parse. Expanding it here would
  # mean committing a schedule the templates deliberately leave to the
  # adopting repo.
  #
  # Scoped to this directory, and to the placeholder shape specifically, so a
  # genuinely malformed cron in a template is still an error.
  .github/workflow-templates/**/*.{yml,yaml}:
    ignore:
      - 'invalid CRON format "\$cron-[a-z]+" in schedule event'

  # FALSE POSITIVE — actionlint's `job` context type is out of date.
  #
  # `job.workflow_sha` is REAL and documented: "the commit SHA of the workflow
  # file that defines the current job". GitHub documents job.workflow_ref,
  # job.workflow_sha, job.workflow_repository and job.workflow_file_path, and
  # notes only that they are unavailable on GitHub Enterprise Server. There is
  # no `github.job_workflow_sha` — the property lives on `job`, not `github`.
  #
  # These reusable workflows use it deliberately, and the reason is worth
  # keeping: it pins the SDK script checkout to the same commit as the workflow
  # executing it, so no caller-supplied ref can reach a checkout whose payload
  # is then run. Rewriting it would BREAK that provenance pinning.
  #
  # Verified against docs.github.com on 2026-08-31; actionlint 1.7.12 still
  # models `job` as {check_run_id, container, services, status}.
  .github/workflows/tests-reusable.yaml:
    ignore:
      - 'property "workflow_sha" is not defined'
  .github/workflows/e2e-full-reusable.yaml:
    ignore:
      - 'property "workflow_sha" is not defined'
  .github/workflows/build-and-scan.yaml:
    ignore:
      - 'property "workflow_sha" is not defined'

  # FALSE POSITIVE — deliberate kill switch, not dead code left by accident.
  # The job body and its input are retained on purpose so callers that still
  # pass `unit_tests_workflow_file` keep validating; unit-test enforcement
  # moved to the `certify` job (#1943). The file says "Revert this line to
  # re-enable the gate", which is exactly what a constant condition is for.
  .github/workflows/build-and-publish-app.yaml:
    ignore:
      - 'constant expression "false" in condition'

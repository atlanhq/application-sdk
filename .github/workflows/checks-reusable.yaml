name: Pre-commit Checks (reusable)

# Body of the fleet's `checks.yml`, hoisted out of the consumer repos (FND-1994).
#
# `checks.yml` and `conformance-upload-sarif.yaml` were the only two bootstrap
# templates in which a consumer repo carried a third-party action pin. Every
# other template is already a thin `atlanhq/application-sdk/...@main` caller.
# Moving the two pins here puts them where Mend already maintains them, instead
# of in ~80 copies that no fleet engine is permitted to rewrite.
#
# Runs in the CALLER's context — `actions/checkout` checks out the consumer
# repo, `setup-deps` syncs the consumer's lock, and `pre-commit/action` runs the
# consumer's `.pre-commit-config.yaml`. That is the same property
# `renovate-auto-approve-reusable.yml` already depends on; it is not re-derived
# here.
#
# `setup-deps` is referenced by its full `atlanhq/application-sdk/...@main`
# path, NOT as `uses: ./.github/actions/setup-deps`. A relative `uses:` inside a
# reusable workflow resolves against the CALLER's checkout, not this
# repository's — the trap `MANAGED_ACTION_FILES` in `conformance.bootstrap.
# render` exists to work around — so the local form would look for the action in
# the consumer repo and fail with "Can't find action.yml".
#
# Caller visibility: this workflow is public (application-sdk) and its callers
# are private fleet repos. Private caller → public reusable is supported. The
# unsupported direction is the reverse, which fails as a `startup_failure`:
# zero jobs, no check run, invisible to `gh pr checks`.

on:
  workflow_call:
    inputs:
      skip-on-bump-pr:
        description: >-
          Skip every job on a bump-version PR's own `pull_request` run (FND-3947).
          Each job still files its check run, as `skipped`, under its full
          `<caller job> / <job name>` context, so the PR's required checks
          resolve without billing a runner. Release Gate stays the blocker: it
          fails until a `/gate-check` verdict passes on the head commit, and
          `/gate-check` dispatches the caller, which this does not skip. Only
          a caller whose Release Gate reads that verdict may set it: a caller
          whose Release Gate passes on a label would let a skipped run through.
        type: boolean
        required: false
        default: false
      system_deps:
        description: >-
          Space-separated apt packages to install before `setup-deps` runs
          `uv sync`: a dependency with no manylinux wheel is built from sdist on
          the runner and needs its C headers present first. Empty (the default)
          skips the step entirely. Managed per-repo by `bootstrap`'s
          `--system-deps`, which validates every token against a Debian package
          name before it is ever rendered into the caller.
        type: string
        required: false
        default: ""
      private-git-deps:
        description: >-
          Set true when the app pins a PRIVATE atlanhq git dependency (e.g.
          query-redaction). `setup-deps` runs `uv sync` before any hook, and an
          unauthenticated clone of a private atlanhq repo fails there, so with
          this flag the job mints a read-only fleet App token and hands it to
          that sync (and the uv.lock check) alone, through git_auth.py; no git
          config is written, so no hook can read it (FND-4740). Requires
          FLEET_APP_ID and FLEET_APP_PRIVATE_KEY (`secrets: inherit`, or an
          explicit mapping naming both). Managed per-repo by `bootstrap`, which
          reads the opt-in back off the caller so a re-sync cannot delete it.
        type: boolean
        required: false
        default: false
    secrets:
      ORG_PAT_GITHUB:
        required: false
        description: >-
          No longer read (FND-4740: private git dependencies use a read-only
          fleet App token). Still declared so a caller that maps it explicitly
          keeps parsing: passing an undeclared secret fails at startup.
      FLEET_APP_ID:
        required: false
        description: >-
          GitHub App id; with `private-git-deps`, mints the read-only token
          that reaches the private atlanhq git dependency. Optional: a caller
          with only public deps passes nothing.
      FLEET_APP_PRIVATE_KEY:
        required: false
        description: Private key paired with FLEET_APP_ID.

jobs:
  # Merge-queue entry only: did combining with the base change the tree?
  # Pre-commit reads the tree and nothing else, so on a queue commit whose tree
  # is exactly the PR head's it can only repeat the PR's green verdict
  # (FND-3321). Skipped (not billed) on every other event. An empty output —
  # skipped or failed — is not `'true'`, so pre-commit then runs as before.
  # Same job as conformance-reusable.yaml's; see docs/standards/ci.md ("What a
  # merge-queue entry re-runs").
  queue-diff:
    name: Queue tree diff
    if: >-
      !(inputs.skip-on-bump-pr && github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump-version')) &&
      (github.event_name == 'merge_group')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      identical: ${{ steps.diff.outputs.identical }}
    steps:
      # Credentials stay persisted: the script fetches the PR head from this
      # same remote, and the repo may be private.
      - name: Checkout queue commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch queue_tree_diff.py from SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts/queue_tree_diff.py
          sparse-checkout-cone-mode: false
          path: _sdk
          persist-credentials: false

      - name: Compare the queue commit with the PR head
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_SHA: ${{ github.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 _sdk/.github/scripts/queue_tree_diff.py

  pre-commit:
    name: Pre-commit
    needs: [queue-diff]
    # `!cancelled()` so the skipped `queue-diff` on a PR does not skip this
    # job too. The one skip is an identical queue tree; the skipped job still
    # files its `Pre-commit` check run, which a required context counts as a
    # pass. Keep `name:` static so that run carries the same context string.
    if: >-
      ${{ !(inputs.skip-on-bump-pr && github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump-version')) &&
      (!cancelled() && needs.queue-diff.outputs.identical != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package list crosses a repository boundary as a workflow input, so
      # it is passed through `env:` rather than interpolated into the `run:`
      # line: an expression interpolated into shell is expanded before the shell
      # ever parses it, an env var is not. `normalize_system_deps` already
      # rejects anything outside `APT_PACKAGE_RE` on the way in; this keeps that
      # from being the only thing standing between a hand-edited caller and the
      # runner. Unquoted on purpose — the value is a package *list* and word
      # splitting is what turns it into separate arguments.
      - name: Install system dependencies
        if: inputs.system_deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system_deps }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086  # deliberate word splitting: package list
          sudo apt-get install -y $SYSTEM_DEPS

      # Private atlanhq git deps (FND-4740): a read-only fleet App token, handed
      # to setup-deps' `uv sync` and the uv.lock check alone, through
      # git_auth.py's scoped GIT_CONFIG_* env. No git config is written, so no
      # pre-commit hook can read it. `continue-on-error` so a caller that did
      # not pass the App secrets gets the named error below. Same steps as
      # conformance-reusable.yaml.
      - name: "Mint read-only token for private git dependencies"
        id: git-deps-token
        if: inputs.private-git-deps
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          # Read is all a clone needs; the sync runs build backends.
          permission-contents: read

      # Condition stays in `if:`, never in the shell (docs/standards/ci.md).
      - name: "Require the token when private-git-deps is set"
        if: inputs.private-git-deps && steps.git-deps-token.outputs.token == ''
        run: |
          echo "::error title=No token for private git dependencies::private-git-deps is true but the fleet App token did not mint. Pass FLEET_APP_ID and FLEET_APP_PRIVATE_KEY (secrets: inherit, or name both in an explicit secrets: mapping)."
          exit 1

      - uses: atlanhq/application-sdk/.github/actions/setup-deps@main
        with:
          git-auth-token: ${{ inputs.private-git-deps && steps.git-deps-token.outputs.token || '' }}

      # A refused Renovate lock bump is withheld by writing a lock no
      # `--locked` / `--check` consumer accepts (renovate_uv_lock_bounded.py,
      # `withhold`). The required `scan / Build Image` used to be what rejected
      # it; since FND-3328 that job skips on every PR but the bump-version PR,
      # so this required job does it instead. Runs only when uv.lock differs
      # from the base (see check_uv_lock.py). Script fetched at this workflow's
      # own SHA, into its own path, and removed before pre-commit sees the tree.
      - name: Fetch check_uv_lock.py from SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts/check_uv_lock.py
            .github/scripts/git_auth.py
          sparse-checkout-cone-mode: false
          path: .sdk-lock-check
          persist-credentials: false

      # Through git_auth.py: with a cold uv cache, checking the lock can
      # re-resolve, which clones the private dependency. Without a token (the
      # flag unset) the wrapper runs the check exactly as before.
      - name: uv.lock matches pyproject.toml
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GIT_TOKEN: ${{ inputs.private-git-deps && steps.git-deps-token.outputs.token || '' }}
          PRIVATE_GIT_DEPS: ${{ inputs.private-git-deps }}
        run: python3 .sdk-lock-check/.github/scripts/git_auth.py run -- python3 .sdk-lock-check/.github/scripts/check_uv_lock.py

      - name: Remove the fetched SDK script
        run: rm -rf .sdk-lock-check

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

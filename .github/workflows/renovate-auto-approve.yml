# Automatically post an atlan-ci code-owner approval on Renovate
# dependency-only PRs once all required CI checks are green on the current HEAD.
#
# All approval logic lives in the reusable renovate-auto-approve-reusable.yml.
# This caller is responsible only for:
#   - Wiring the trigger (workflow_run on this repo's required-check workflows)
#   - Filtering out failed/cancelled upstream runs before spending a runner
#   - Forwarding event context as inputs to the reusable
#
# See renovate-auto-approve-reusable.yml for the full rationale on approval
# conditions and relationship to @sdk-review.

name: Renovate — auto-approve dependency-only PRs

on:
  workflow_run:
    # SDK Gate is the composing required check (SDK tests + conformance +
    # contract toolkit). PR Checks provides the orthogonal required contexts
    # (Trivy, commits, docstring). Conformance is retained for the push-to-main
    # baseline run (it no longer fires on PRs). Capability Manifest Check is
    # informational (see its own header) but included so we re-evaluate promptly
    # if it is later added to the ruleset. CodeQL Advanced hosts the
    # Pre-commit Checks job (a required status check) — without it, the
    # auto-approve workflow never re-fires after Pre-commit Checks completes,
    # leaving the PR permanently waiting for approval.
    workflows: [SDK Gate, PR Checks, Conformance, Capability Manifest Check, CodeQL Advanced]
    types: [completed]
    # Limit to Renovate branches at trigger level — avoids spending a runner on
    # every workflow completion across the repo.
    branches: ['renovate/**']
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to evaluate (for manual testing / re-approval). The fan-in
          follow-up passes several, comma-separated, together with head_sha.
        required: true
        type: string
      head_sha:
        description: >-
          Commit to evaluate. Set by the fan-in follow-up so it shares the
          anchor run's per-SHA lock; leave empty to evaluate the PR's HEAD.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    # Skip failed/cancelled upstream runs — the reusable's gh pr checks guard
    # would no-op them anyway, but filtering here avoids consuming a runner
    # at all. workflow_dispatch always runs (used for manual testing).
    #
    # Fan-in to one billed run per SHA (FND-3317), on event-payload fields only
    # so a skipped trigger never gets a runner: SDK Gate is the anchor (it
    # composes the SDK tests, so it is the one that usually finishes last) and
    # the reusable waits out any required check still pending when it fires
    # (checks_wait_minutes). A check that finishes after that wait (CodeQL
    # Advanced) is skipped here as a non-anchor first attempt, so
    # follow_up_when_pending makes the reusable dispatch this workflow once with
    # pr_number to re-evaluate the PR. Any re-run (run_attempt > 1) also passes, so
    # re-running a flaked workflow still re-evaluates the PR.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.name == 'SDK Gate'
              || github.event.workflow_run.run_attempt > 1))
    uses: ./.github/workflows/renovate-auto-approve-reusable.yml
    with:
      event_name: ${{ github.event_name }}
      head_sha: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
      pr_number: ${{ inputs.pr_number }}
      checks_wait_minutes: 15
      # A late first-attempt finish (e.g. CodeQL Advanced after the SDK Gate
      # anchor's wait ran out) is re-evaluated by one dispatched follow-up.
      follow_up_when_pending: true
      # application-sdk tracks the SHA-pinned actions in its shipped conformance
      # bootstrap templates (Renovate config in renovate.json). Those live under
      # packages/conformance/ source, outside the built-in allowlist, so declare
      # them here as auto-approvable dependency files. Kept in this repo's caller
      # rather than the shared reusable workflow — the path is SDK-specific.
      extra_dep_file_pattern: 'packages/conformance/conformance/bootstrap/templates/.+\.ya?ml'
    secrets: inherit

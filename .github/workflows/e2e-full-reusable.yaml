name: e2e-full-reusable

# Reusable workflow for the connector full-DAG e2e suite. Each connector
# repo's per-app `e2e-full.yaml` collapses to a 5-line `uses:` call:
#
#     name: e2e-full
#     on:
#       workflow_dispatch:
#         inputs:
#           agent_name_override:
#             required: false
#             type: string
#             default: ""
#     jobs:
#       e2e-full:
#         uses: atlanhq/application-sdk/.github/workflows/e2e-full-reusable.yaml@main
#         with:
#           app-name: mysql
#           app-image-name: atlan-mysql-app
#           agent-name-override: ${{ inputs.agent_name_override }}
#         secrets: inherit
#
# Boilerplate that lives here so apps don't copy-paste it:
#   - 120-min job timeout (must be > ae_poll + atlas_poll + build/setup
#     overhead — see :data:`ae_poll_timeout_seconds` defaults on the
#     :class:`BaseFullDAGE2ETest`).
#   - Concurrency group keyed on workflow + ref so re-running on the
#     same branch queues rather than racing.
#   - Permissions minimum set the SDR composite action needs (PR
#     comments, GHCR push, statuses).
#   - Tenant + OAuth + API-key env wiring.
#   - The `Resolve agent-name` step that handles the run-id default.
#   - The SDR composite action invocation with full-DAG defaults
#     (test-path, secrets-script, components-dir, compose-overlay).
#
# `components-dir` + `compose-overlay` are explicit here because the
# full-DAG pipeline lives alongside the SDR (testcontainer) pipeline
# in connector repos — both share `$SDR_CONFIG_DIR` but need
# different component sets + compose overlays (full-DAG uses an S3
# OAuth objectstore + a worker container that registers under a
# dynamic agent-name, SDR uses localstorage + a hermetic sibling DB).
# Passing the per-pipeline paths through bypasses the convention
# fallback that would otherwise pick up the SDR files.
#
# Caller overrides any of the input defaults when their layout differs.

on:
  workflow_call:
    inputs:
      app-name:
        description: Connector short name (e.g. "mysql", "mssql", "postgres").
        required: true
        type: string
      app-image-name:
        description: GHCR image name (e.g. "atlan-mysql-app").
        required: true
        type: string
      test-path:
        description: Pytest target directory.
        required: false
        type: string
        default: tests/full_dag/
      secrets-script:
        description: |
          Path to the script that writes the local-secret-store bundle
          (typically just SDR_{CONNECTOR}_USERNAME/PASSWORD).
        required: false
        type: string
        default: .github/e2e/make-secrets-e2e-full.py
      components-dir:
        description: |
          App-level Dapr component overrides for the full-DAG stack
          (e.g. S3 binding via the tenant's blobstorage proxy).
          Default matches the convention this repo's apps follow —
          a sibling directory in `.github/e2e/` so SDR and full-DAG
          don't share the same overrides set.
        required: false
        type: string
        default: .github/e2e/e2e-full-components
      compose-overlay:
        description: |
          docker-compose overlay for the full-DAG stack. Propagates
          AWS_* env vars to the worker for the S3 binding and sets a
          unique agent-name so the worker registers on the harness's
          dynamic Temporal queue.
        required: false
        type: string
        default: .github/e2e/e2e-full-docker-compose.yaml
      timeout-minutes:
        description: |
          GH job timeout. Must always be > ae_poll_timeout_seconds +
          atlas_poll_timeout_seconds + ~10 min build/setup overhead.
          Default 120 fits the SDK's 90 + 30 minute poll budgets.
        required: false
        type: number
        default: 120
      agent-name-override:
        description: |
          Override agent-name (default ci-<run_id>). Useful when re-
          running against a worker that's already up.
        required: false
        type: string
        default: ""
      application-sdk-ref:
        description: |
          Branch / tag / SHA of application-sdk to pin during the
          composite-action invocation, applied to BOTH the container
          runtime and the host pytest harness unless overridden by the
          side-specific refs below. Empty = repo's pyproject pin.
        required: false
        type: string
        default: ""
      runtime-sdk-ref:
        description: |
          application-sdk ref for the CONNECTOR RUNTIME (the built image).
          Empty falls back to application-sdk-ref, then the connector's own
          pin. Usually left empty so the app is tested as shipped.
        required: false
        type: string
        default: ""
      harness-sdk-ref:
        description: |
          application-sdk ref for the TEST HARNESS (host pytest / testing.e2e).
          Empty falls back to application-sdk-ref, then the connector's own
          pin. Set this to run the latest e2e harness against the connector's
          own runtime without bumping its SDK.
        required: false
        type: string
        default: ""
      base-image-ref:
        description: |
          Optional runtime base image to build the connector FROM, passed
          as the BASE_IMAGE build-arg to the connector Docker build. Set by
          the apps-sdk PR dispatch to a freshly-built PR base image so
          Dockerfile / base-image / daprd changes in the SDK PR are
          exercised end-to-end. Empty = connector Dockerfile's default base.
        required: false
        type: string
        default: ""
      distinct-id:
        description: |
          Identifier passed through from the caller's
          ``workflow_dispatch.inputs.distinct_id`` — the SHA of the apps-sdk
          commit that dispatched this run. Echoed in the "distinct-id" step
          name as a correlation breadcrumb; never read by test code, and no
          longer used to locate the run (``codex-/return-dispatch`` v4 gets
          the run id from the dispatch response instead of trawling step
          names). The apps-sdk side must pass it explicitly since v4.
        required: false
        type: string
        default: ""
      two-store:
        description: |
          Opt-in ADR-0014 two-store SDR posture (docs/adr/0014-two-store-
          storage-architecture.md). When true, the connector's deployment
          `objectstore` is forced to the SDK-default CI-local binding
          (never the tenant-blobstorage override some connectors ship),
          `atlan-objectstore` stays the configurator-emitted tenant
          binding, and ENABLE_ATLAN_UPLOAD=true is set on the worker.
          This makes the two stores physically distinct so a connector
          that forgets to bridge an artifact via `App.upload()` shows up
          as zero downstream assets/lineage in Atlas instead of being
          silently masked by a single shared bucket.

          Only meaningful when the test class runs in RunMode.AGENT —
          in RunMode.DIRECT the connector's extract activity runs on the
          tenant's own pod, whose storage config this harness does not
          control, so the gap is not observable there.

          Default false: existing full-DAG adopters are unaffected until
          they opt in per docs/standards/connector-ci-e2e.md.
        required: false
        type: boolean
        default: false
      source-available:
        description: |
          Whether an extraction source is provisioned for this connector in
          CI — forwarded to the sdr-e2e action's `source-available` input.
          Sourcing is the app owner's responsibility. Default true: the
          full-DAG e2e runs unchanged. Set false for apps with no free
          container / no wired credentials — the e2e then degrades to a
          worker-up-only check (assert the worker deploys + serves
          /server/health) and skips extraction/publish/Atlas assertions.
        required: false
        type: boolean
        default: true
      clouds:
        description: |
          Cross-CSP fan-out (FND-6). Comma-separated cloud keys; this workflow
          runs once per cloud, against that cloud's tenant from the
          E2E_TENANT_MATRIX_JSON secret. Unlike tests-reusable.yaml this
          workflow targets a whole directory rather than fanning out per suite,
          so the cloud is the only matrix dimension.

          Empty (the default) means the SDK's current cloud list, which lives in
          discover_e2e_suites.py's DEFAULT_CLOUDS, intersected with the clouds
          E2E_TENANT_MATRIX_JSON actually carries — so dropping a cloud from the
          secret takes it out of the rotation fleet-wide (FND-354). A cloud
          named here explicitly is never narrowed away: it fails its leg, since
          naming it asserts it should run. Pass "none" to collapse back to the
          single legacy tenant. Forced to "none" when E2E_TENANT_MATRIX_JSON is
          not available to the calling repo, which keeps un-onboarded repos on
          today's behaviour.
        required: false
        type: string
        default: ""
    secrets:
      # Resolved per leg by .github/scripts/resolve_e2e_tenant.py — see the
      # equivalent comment in tests-reusable.yaml for why the pointer is here
      # rather than in the description.
      E2E_TENANT_MATRIX_JSON:
        description: |
          Cross-CSP tenant map (FND-6): a JSON object keyed by cloud, each entry
          carrying tenant / client_id / client_secret / api_key (plus an optional
          deployment_name). See tests-reusable.yaml's secrets block for the full
          rationale and shape.

          Unset = the four single-tenant secrets below are used and the cloud
          fan-out is skipped, which is exactly the pre-FND-6 behaviour.
        required: false
      # The four below were `required: true` before FND-6, when they were the
      # only way to name a tenant. They are now the fallback for a caller that
      # has not been granted the tenant map, so they cannot be mandatory —
      # `required: true` would fail a matrix-configured caller at workflow-call
      # validation, before any leg runs.
      SDR_TEST_TENANT:
        description: |
          Single-tenant fallback FQDN (e.g. devex.atlan.com — no https:// prefix),
          used when E2E_TENANT_MATRIX_JSON is unset. ATLAN_BASE_URL is derived
          from whichever tenant resolves.
        required: false
      SDR_CLIENT_ID:
        description: OAuth client id — used by the configurator and for runtime auth (Temporal, objectstore). Fallback path.
        required: false
      SDR_CLIENT_SECRET:
        description: OAuth client secret matching SDR_CLIENT_ID. Fallback path.
        required: false
      ATLAN_API_KEY:
        description: |
          API key for AE-management calls (/automation/api/v1/*) and
          pyatlan asset queries. Needed because the API-key service
          account carries realm-admin which the OAuth client does not.
          Fallback path.
        required: false

jobs:
  # ── Plan the cloud fan-out ───────────────────────────────────────────────
  # A strategy.matrix cannot read the `secrets` context, so whether the tenant
  # map is available has to be decided in a job and handed down as an output.
  # `--clouds-only` gives the cloud dimension without the per-suite one this
  # workflow does not use.
  plan-clouds:
    name: Plan cloud matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      HAS_TENANT_MATRIX: ${{ secrets.E2E_TENANT_MATRIX_JSON != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Which clouds the secret actually carries (FND-354) ─────────────────
      # See tests-reusable.yaml's equivalent pair for why this is a sparse
      # checkout at `job.workflow_sha` rather than another @main action, and why
      # only the KEY LIST crosses into discovery. No `token:` here: this
      # workflow declares no ORG_PAT_GITHUB, and application-sdk is public, so
      # the caller's default token reads it.
      - name: Fetch SDK CI scripts (tenant-matrix cloud keys)
        if: env.HAS_TENANT_MATRIX != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          persist-credentials: false

      - name: Read the tenant matrix's cloud keys
        id: matrix-clouds
        if: env.HAS_TENANT_MATRIX != ''
        env:
          E2E_TENANT_MATRIX_JSON: ${{ secrets.E2E_TENANT_MATRIX_JSON }}
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/e2e_tenant_matrix_clouds.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" >> "$GITHUB_OUTPUT"

      - name: Plan clouds
        id: plan
        uses: atlanhq/application-sdk/.github/actions/discover-e2e-suites@main
        with:
          clouds-only: "true"
          # Narrows the DEFAULTED cloud list to what the secret carries, so a
          # cloud removed from E2E_TENANT_MATRIX_JSON drops out of the rotation
          # instead of reding its leg. An explicitly named cloud still fails.
          available-clouds: ${{ steps.matrix-clouds.outputs.clouds }}
          # Without the tenant map every leg would resolve the same fallback
          # tenant, so N legs would masquerade as N clouds of coverage. Written
          # negated for the same reason as in tests-reusable.yaml: "" is falsy in
          # GitHub expressions, and it is the default here.
          clouds: ${{ secrets.E2E_TENANT_MATRIX_JSON == '' && 'none' || inputs.clouds }}

      - name: Warn that the cross-CSP matrix is unavailable
        if: inputs.clouds != 'none' && env.HAS_TENANT_MATRIX == ''
        shell: bash
        run: |
          echo "::warning::This run asked for the cross-CSP e2e matrix (clouds='${{ inputs.clouds }}'; empty means the SDK default list) but E2E_TENANT_MATRIX_JSON is not available to this repository, so it falls back to a single run against SDR_TEST_TENANT. Cross-CSP coverage for this run is NOT what the workflow asked for."

  e2e-full:
    name: End-to-end${{ matrix.cloud && format(' ({0})', matrix.cloud) || '' }}
    needs: plan-clouds
    strategy:
      # One cloud's tenant being down must not cancel the others; "Re-run failed
      # jobs" then re-runs only that cloud.
      fail-fast: false
      # No clouds (no tenant map, or clouds: "none") still has to produce exactly
      # one leg — the legacy single-tenant run — so the include-list falls back
      # to a single entry with an empty `cloud`, which is precisely what makes
      # the resolver take its fallback path. The key is spelled out rather than
      # left as `{}` so the entry defines a matrix variable: `matrix.cloud` is
      # then a defined-but-empty string in the job name and env below.
      matrix: ${{ fromJson(needs.plan-clouds.outputs.count != '0' && needs.plan-clouds.outputs.matrix || '{"include":[{"cloud":""}]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # This workflow deliberately does NOT take the (app, cloud) tenant lease that
    # tests-reusable.yaml's install path takes (FND-250). It never installs, so it
    # cannot lose a version race: nothing it does changes what is deployed on the
    # tenant, and no leg here asserts a version. Taking the lease would serialise
    # it against installing runs for no safety gain, at the cost of holding a
    # tenant for a whole full-DAG run. The residual gap — an installing run
    # swapping the version underneath a full-DAG run in flight — predates this
    # change and is tracked on FND-250 rather than papered over here.
    concurrency:
      # Per-cloud (a shared group would serialise the legs) and run-unique. It
      # used to be keyed on github.ref, which on the dispatch path is this repo's
      # refs/heads/main for EVERY run — so all concurrent dispatches collapsed
      # into one group, and a group holds only one pending run: a third dispatch
      # cancelled the queued one before it got a runner, with no log to say so
      # (FND-218).
      #
      # cancel-in-progress stays false for the same reason as the e2e legs in
      # tests-reusable.yaml: cancelling mid-run abandons a live Automation Engine
      # run and leaves tenant state with no cleanup path (FND-252).
      group: e2e-full-${{ github.workflow }}-${{ github.run_id }}-${{ matrix.cloud || 'default' }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
    env:
      # Written per-leg by the resolver step below rather than pinned here — see
      # the equivalent block in tests-reusable.yaml for why there is exactly one
      # writer of the tenant env.
      E2E_TENANT_MATRIX_JSON: ${{ secrets.E2E_TENANT_MATRIX_JSON }}
      E2E_CLOUD: ${{ matrix.cloud }}
      FALLBACK_SDR_TEST_TENANT: ${{ secrets.SDR_TEST_TENANT }}
      FALLBACK_SDR_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
      FALLBACK_SDR_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
      FALLBACK_ATLAN_API_KEY: ${{ secrets.ATLAN_API_KEY }}
    steps:
      # No-op step whose name correlates this dispatched run back to the SDK PR
      # that fired it. Nothing reads the step name: codex-/return-dispatch v3
      # used to trawl step names to locate the run, but v4 gets the run id from
      # the dispatch response instead.
      - name: distinct-id ${{ inputs.distinct-id }}
        if: inputs.distinct-id != ''
        shell: bash
        run: echo "Dispatched with distinct-id=${{ inputs.distinct-id }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tenant resolver is an SDK script, and this workflow runs in the
      # caller's repo, so it has to be fetched. Sparse, so only .github/scripts
      # lands. Pinned to job.workflow_sha for the same reason as the equivalent
      # checkout in tests-reusable.yaml: a PR editing this workflow must run its
      # own version of the script, not main's.
      - name: Fetch SDK CI scripts (tenant resolution)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          persist-credentials: false

      # This leg's tenant — see the equivalent step in tests-reusable.yaml for
      # why it is two invocations and why the mask pass has to come first.
      - name: Resolve e2e tenant for this leg
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/resolve_e2e_tenant.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" \
            --cloud "$E2E_CLOUD" \
            --fallback-tenant "$FALLBACK_SDR_TEST_TENANT" \
            --fallback-client-id "$FALLBACK_SDR_CLIENT_ID" \
            --fallback-client-secret "$FALLBACK_SDR_CLIENT_SECRET" \
            --fallback-api-key "$FALLBACK_ATLAN_API_KEY" \
            --mask-only
          python3 application-sdk-scripts/.github/scripts/resolve_e2e_tenant.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" \
            --cloud "$E2E_CLOUD" \
            --fallback-tenant "$FALLBACK_SDR_TEST_TENANT" \
            --fallback-client-id "$FALLBACK_SDR_CLIENT_ID" \
            --fallback-client-secret "$FALLBACK_SDR_CLIENT_SECRET" \
            --fallback-api-key "$FALLBACK_ATLAN_API_KEY" \
            >> "$GITHUB_ENV"

      - name: Resolve agent-name
        id: agent
        run: |
          if [ -n "${{ inputs.agent-name-override }}" ]; then
            echo "name=${{ inputs.agent-name-override }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Using agent-name=$(grep '^name=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - uses: atlanhq/application-sdk/.github/actions/sdr-e2e@main
        with:
          app-name: ${{ inputs.app-name }}
          app-image-name: ${{ inputs.app-image-name }}
          test-path: ${{ inputs.test-path }}
          secrets-script: ${{ inputs.secrets-script }}
          components-dir: ${{ inputs.components-dir }}
          compose-overlay: ${{ inputs.compose-overlay }}
          # Force the full-DAG config dir even when the repo also has a
          # .github/sdr-e2e/ (testcontainer) setup, which the action would
          # otherwise prefer — see the action's `config-dir` input.
          config-dir: .github/e2e
          # Bump the container-health wait because the worker has to
          # establish the Temporal connection with TLS + auth before
          # /server/health turns green.
          container-health-timeout-seconds: "120"
          # `-s` streams the harness's poll-loop output in real time so
          # operators can watch the colour-emoji DAG progression
          # instead of waiting for a final dump.
          pytest-extra-args: "-s"
          # Unique per-leg artifact name so parallel cloud legs don't collide on
          # upload-artifact (which rejects duplicate names within a run). Empty
          # on the single-tenant fallback, which keeps the pre-FND-6 artifact
          # name and the bare `e2e-full-ci-<run_id>` deployment name.
          artifact-suffix: ${{ matrix.cloud }}
          application-sdk-ref: ${{ inputs.application-sdk-ref }}
          runtime-sdk-ref: ${{ inputs.runtime-sdk-ref }}
          harness-sdk-ref: ${{ inputs.harness-sdk-ref }}
          base-image-ref: ${{ inputs.base-image-ref }}
          enable-two-store: ${{ inputs.two-store }}
          source-available: ${{ inputs.source-available }}

# Safety net for the code-owner approvals that sdk-review and lens post as
# `atlan-ci`: post approvals that were computed but never landed. One sweep for
# both, because both spend the same `atlan-ci` quota whose exhaustion loses them
# (FND-2977). Do not add a second cron for another review source; add an adapter
# to the script instead.
#
# Why this exists:
#   `sdk-review-approve-on-verdict.yml` computes the verdict and then posts the
#   formal approval as `atlan-ci` — the CODEOWNER whose approval satisfies
#   branch protection on `main`. When that one POST fails (the trigger has been
#   `atlan-ci` exhausting its 5,000 req/hr primary REST quota) the run dies and
#   nothing retries it. The PR is left with a review summary, the
#   `sdk-review-approved` label, and no approving review — and recovery was a
#   human noticing and running `gh run rerun --failed` by hand.
#
#   PR #3162 shrank that window (one `atlan-ci` request per fire instead of ~15,
#   plus rate-limit-aware retry) but could not close it: primary quota can reset
#   up to an hour out and the stamper deliberately fails fast rather than hold a
#   runner that long. This sweep is the durable answer because it does not care
#   why the stamp was lost.
#
#   lens (`lens.yml`) has the same shape: its last step posts the APPROVE and
#   only warns when that fails, so the summary says ready to merge while the PR
#   stays blocked, and the only recovery was `/lens force`.
#
# Guards live in .github/scripts/review_approval_reconcile.py, tested in
# .github/scripts/tests/. In short, for sdk-review: the `sdk-review-approved`
# label must still be on the PR (every invalidator clears it), the newest
# mothership-ai[bot] verdict must be READY_TO_MERGE at the PR's live head, there
# must be no existing bot approval, and the verdict must be old enough that no
# fast-path run could still be in flight for it. For lens: lens's own `lens`
# status on the live head must be green, its state must show nothing open at
# that head, the status must be old enough, and no lens approval on that head
# may exist or have been withdrawn.
#
# 10-minute cadence. Per tick that is one paginated PR listing, one GraphQL
# query for lens statuses, plus a few reads per PR that either source says may
# be owed — negligible against the fleet App token's own
# quota, which is the point: a reconciler polling every PR on the `atlan-ci` PAT
# would become a new source of the exhaustion it exists to recover from. The PAT
# is spent only on the APPROVE call, once per PR actually approved.
#
# Quota-aware: before the first approval of a run it reads `GET /rate_limit` on
# the approver (free — it does not count against the quota it reports) and
# attempts nothing if the quota is spent. Taking a 403 to discover that spends a
# doomed request, and hammering an exhausted primary limit is how it escalates
# into a secondary/abuse block.
#
# A quota-blocked approval is a DEFERRAL: annotated and summarised, but the run
# stays green, because the next tick after the hourly reset posts it. Going red
# every ten minutes for an hour would bury the annotation that matters when the
# problem does not clear on its own. A verdict still unapproved past
# --stale-after-minutes (90) has outlived a full reset without recovering, and
# that does red the run.
#
# Manual dispatch (optionally with `pr`) skips the min-age grace: the grace is
# for the unattended cron, and a person dispatching has already seen the
# approval run finish. Every other guard still applies.

name: Review approvals — reconcile lost atlan-ci approvals

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report which PRs would be reconciled without approving any"
        type: boolean
        default: false
      pr:
        description: "Only this PR number (empty = every open PR). A manual run skips the min-age grace."
        type: string
        default: ""

# github.token only needs contents:read for the checkout; every API call the
# sweep makes runs under the fleet App token minted below, and the one APPROVE
# runs under the atlan-ci PAT.
permissions:
  contents: read

concurrency:
  group: review-approval-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Re-drive missing atlan-ci approvals
    runs-on: ubuntu-latest
    # Without an explicit ceiling this inherits GitHub's 6h default. Paired with
    # cancel-in-progress: false, a hung run would queue every subsequent tick
    # behind it instead of just skipping a cycle.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Mint fleet App token
        # Carries its own rate-limit quota, independent of the `atlan-ci` user
        # quota that ORG_PAT_GITHUB draws on. Same App the stamper uses.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      - name: Reconcile lost approvals
        env:
          # Every call the sweep makes, and every call the stamper makes except
          # APPROVE.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The APPROVE call only — atlan-ci is the CODEOWNER whose approval
          # satisfies branch protection.
          APPROVER_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
          # The one identity whose lens summary and `lens` status are trusted
          # as lens's own; the same value lens.yml runs with.
          LENS_BOT_LOGIN: atlan-app-fleet[bot]
          # Through env, not interpolated into the script: it is free text.
          PR_INPUT: ${{ inputs.pr }}
        run: |
          python3 .github/scripts/review_approval_reconcile.py \
            --repo "${{ github.repository }}" \
            --event-name "${{ github.event_name }}" \
            --pr "$PR_INPUT" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

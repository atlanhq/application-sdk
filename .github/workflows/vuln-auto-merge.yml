# Auto-approve + auto-merge for vuln-triage PRs.
#
# Once required CI is green on a vuln-triage PR, post an atlan-ci code-owner
# approval and put it on GitHub auto-merge — but ONLY for the two safe shapes
# the rover produces (an allowlist-only PR, or a dependency-bump-only PR),
# carrying the `vuln-auto-merge` label, from a trusted rover identity.
#
# ALL of the gating logic — author check, label check, race guard, and the
# strict changed-files path-allowlist that is the real safety boundary — lives
# in .github/scripts/vuln_auto_merge_gate.py (unit-tested), per
# docs/standards/ci.md. This workflow only wires the trigger and runs it.
#
# Why atlan-ci: atlan-ci is a CODEOWNER (via the `*` rule in .github/CODEOWNERS,
# which already covers .security/) AND is listed in .security/approvers.json, so a
# single atlan-ci approval satisfies both require_code_owner_review and the
# Authorized Approver Check. `--auto` then queues the PR once checks pass.
#
# Why the PRs it approves are NOT authored by atlan-ci: GitHub forbids approving
# your own PR. The reconcile removal PR used to be opened as atlan-ci on the theory
# that its `main`-ruleset bypass made an approval unnecessary — untrue. Bypass lets
# atlan-ci merge directly; it does not satisfy required_approving_review_count for
# auto-merge or merge-queue entry, so those PRs stalled at REVIEW_REQUIRED until a
# human clicked approve. vuln-reconcile-on-release.yml now authors them as
# atlan-app-fleet[bot], which keeps atlan-ci free to be the approver.
#
# GitHub auto-merge enforces "merge only when required checks pass", so a red
# PR is never merged here.

name: Vuln triage — auto-merge allowlist/bump PRs

on:
  workflow_run:
    # The workflows that produce this repo's required status checks (kept in
    # sync with renovate-auto-approve.yml). We re-evaluate when any completes.
    workflows: [SDK Gate, PR Checks, Conformance, Capability Manifest Check, CodeQL Advanced]
    types: [completed]
    # Only the rover's branch prefixes — avoids spending a runner on every
    # workflow completion across the repo. Branch naming that drifts simply
    # fails closed (no auto-merge), which is the safe direction.
    branches:
      - 'chore/allowlist-**'
      - 'fix/bump-**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate (manual testing / re-approval)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    # Skip failed/cancelled upstream runs; workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize runs for the same SHA so the idempotency guard is reliable.
    concurrency:
      group: vuln-auto-merge-${{ github.event.workflow_run.head_sha || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout (for the gate script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Enabling auto-merge takes contents: write. The fleet App already holds it,
      # so the approver PAT is left needing only PR write + contents read.
      - name: Mint fleet App token (auto-merge only)
        id: fleet-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      - name: Evaluate + approve + auto-merge
        env:
          # The code-owner approver: its approval satisfies code-owner review — it
          # is a CODEOWNER and is listed in .security/approvers.json (see the
          # header). It does not rely on any main-ruleset bypass. A dedicated
          # application-sdk-only credential once provisioned, atlan-ci's
          # ORG_PAT_GITHUB until then (.github/scripts/approver_identity.py).
          GH_TOKEN: ${{ secrets.SDK_APPROVER_TOKEN || secrets.ORG_PAT_GITHUB }}
          APPROVER_LOGIN: ${{ vars.SDK_APPROVER_LOGIN || 'atlan-ci' }}
          MERGE_TOKEN: ${{ steps.fleet-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: python3 .github/scripts/vuln_auto_merge_gate.py

# Build & Scan — reusable security scanning template.
#
# Builds a Docker image and runs Trivy.
# Checks results against .security/allowlist.json in the caller repo.
# Fails if any CRITICAL/HIGH CVE is not in the allowlist.
#
# Used in two places:
#   1. Directly by app repos on PR (blocks merge on new vulnerabilities)
#   2. By build-and-publish-app.yaml on merge (reconfirms before publish)
#
# Usage (PR check):
#   jobs:
#     scan:
#       uses: atlanhq/application-sdk/.github/workflows/build-and-scan.yaml@main
#       secrets: inherit
#
name: Build & Scan

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or SHA to checkout and build (default: caller's ref)"
        required: false
        type: string
      image:
        description: "Pre-built image to scan (skip build if provided)"
        required: false
        type: string
      fail_on_findings:
        description: "Exit 1 if new non-allowlisted vulnerabilities found (true for PR gate, false for merge path)"
        required: false
        type: boolean
        default: true
      endor_os_reachability:
        description: >-
          Run the Endor container scan with OS reachability (--os-reachability).
          Default false, and that default is measured rather than cautious: basic
          reachability profiles by actually RUNNING the image, and app images
          that need their Dapr components and a Temporal endpoint to start will
          not run unattended on a CI runner. Endor's qualification check then
          reports "image is not suitable for dynamic profiling", skips profiling
          and completes the scan without reachability -- roughly a minute of
          extra runtime for no data. Turn it on per-repo for images that do run
          standalone. Reachability for service images needs INSTRUMENTED
          reachability against a real deployment, which is separate work.
        required: false
        type: boolean
        default: false
      lfs:
        description: "Check out git-LFS objects before building the image (default false). Set true for apps that vendor LFS-tracked assets (e.g. large parser jars) into the Docker build context — without it the build copies the LFS pointer, not the real file. Mirrors the same input on build-and-publish-app.yaml; only applied to the image-build checkout."
        required: false
        type: boolean
        default: false
    secrets:
      ORG_PAT_GITHUB:
        required: true
        description: "Org PAT for GHCR auth, the git_token BuildKit secret, and Install Trivy's release lookup -- the build/trivy-scan jobs already need it for GHCR (App tokens only have repo-level Packages permission; these packages are org-level), so everything else in those jobs uses it uniformly too rather than minting a redundant App token."
      FLEET_APP_ID:
        required: false
        description: "atlan-app-fleet App ID (org secret), used only by security-gate's cross-repo SDK checkout (that job never touches GHCR). Not passed explicitly by any current caller — auto-available via 'secrets: inherit'. Declared here so the contract is self-documenting."
      FLEET_APP_PRIVATE_KEY:
        required: false
        description: "atlan-app-fleet App private key (org secret). Same availability as FLEET_APP_ID above."
      ENDOR_API_CREDENTIALS_KEY:
        required: false
        description: >-
          Endor Labs API key (org secret). Optional: when unset the endor-scan job
          no-ops, so repos and forks without Endor access are unaffected. API-key
          auth is used rather than Endor's preferred keyless OIDC because keyless
          needs `id-token: write`, and a reusable workflow's permissions are capped
          by the CALLER's token -- every app repo would have to add a permissions
          block, which is exactly the per-repo configuration this workflow exists to
          avoid. Auto-available here via the callers' `secrets: inherit`.
      ENDOR_API_CREDENTIALS_SECRET:
        required: false
        description: "Endor Labs API secret (org secret). Same availability as ENDOR_API_CREDENTIALS_KEY above."

permissions:
  contents: read
  packages: read
  # Needed for the Security Gate's "Comment on PR" step to post the gate
  # result summary using GITHUB_TOKEN. Adds capability only — no other
  # behaviour changes.
  pull-requests: write

jobs:
  # ── Build Docker image (single-arch, no push) ──────────────────────────────
  build:
    name: Build Image
    if: inputs.image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scan_image: ${{ steps.meta.outputs.scan_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: ${{ inputs.lfs }}

      - name: Read Dockerfile path
        id: meta
        run: |
          if [ -f atlan.yaml ]; then
            DOCKERFILE=$(python3 -c "import yaml; d=yaml.safe_load(open('atlan.yaml')); print(d.get('dockerfile', './Dockerfile'))")
          else
            DOCKERFILE="./Dockerfile"
          fi
          SHA=$(git rev-parse --short HEAD)
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "scan_image=scan-target:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.scan_image }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha,scope=scan
          cache-to: type=gha,mode=max,scope=scan
          provenance: false
          # The org PAT reaches the build ONLY as a BuildKit secret, never as a
          # build arg. Build args are recorded in image config and are readable
          # via `docker history` by anyone who can pull the image, so the
          # `ACCESS_TOKEN_USR`/`ACCESS_TOKEN_PWD` args this step used to pass
          # published the credential rather than merely using it (FND-697). A
          # `--mount=type=secret` is never written to a layer or to history.
          #
          # Dockerfiles that clone a private git dependency (e.g. apps pulling
          # atlan-query-redaction) read it via `--mount=type=secret,id=git_token`.
          # Ignored by Dockerfiles that don't mount it, so it's a no-op for every
          # other app. Mirrors the token the deploy/publish workflow provides.
          # This job already logs into GHCR with the PAT above, so there's no
          # benefit to minting a separate App token just for this -- the PAT is
          # already in play.
          secrets: |
            git_token=${{ secrets.ORG_PAT_GITHUB }}

      # `upload-artifact` classifies the artifact service's finalize 403 as
      # non-retryable and fails on the first occurrence, even though the bytes
      # already landed and the next attempt normally succeeds. That failed the
      # job, which failed the aggregate gate, which ejected the merge-queue
      # entry. So: retry once, and keep it fatal if both attempts fail —
      # the trivy-scan job downloads this with no continue-on-error, so
      # losing it fails that job anyway; failing here says why.
      - name: Upload image artifact
        id: upload-image
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 7

      - name: Upload image artifact (retry)
        if: steps.upload-image.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 7
          overwrite: true

  # ── Trivy scan ──────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Scan
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.image != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image artifact
        if: inputs.image == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
          path: /tmp

      - name: Load local image
        if: inputs.image == ''
        run: docker load -i /tmp/image.tar

      - name: Log in to GHCR
        if: inputs.image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}

      - name: Install Trivy
        # Install via the official setup-trivy action with a PINNED version —
        # the same recipe already used by the sdk-trivy-scan composite (same
        # action SHA, same v0.70.0 pin). This
        # replaces a hand-rolled install that resolved the version from
        # api.github.com/.../trivy/releases/latest at scan time: when that call
        # returned anything but the expected JSON (a transient GitHub API 5xx,
        # a rate limit, an outage), the version came back empty, the download
        # URL degraded to .../download/v/trivy__Linux-64bit.tar.gz, curl saved
        # the error page, and `tar` failed with "gzip: stdin: not in gzip
        # format". Because the security gate `needs` this job and publish
        # `needs` the gate, a momentary GitHub blip silently failed the
        # marketplace publish for every app on the fleet — no vulnerability
        # involved (this job also runs with fail_on_findings=false).
        #
        # Note this is the install-only setup-trivy action, NOT the all-in-one
        # aquasecurity/trivy-action (#1130): the latter's pinned release bundles
        # an older Trivy that under-reports on Chainguard/Wolfi base images.
        #
        # The version is pinned deliberately (scan results drift with Trivy's
        # vuln-DB schema) and kept in lockstep with the fleet's other scans;
        # the aquasecurity/trivy packageRule in renovate-config/default.json
        # disables auto-bumps so a change here is always a conscious decision.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Run Trivy scan
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        run: |
          IMAGE="${{ inputs.image || needs.build.outputs.scan_image }}"
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --quiet \
            --output /tmp/trivy_results.json \
            "$IMAGE"

      # `upload-artifact` classifies the artifact service's finalize 403 as
      # non-retryable and fails on the first occurrence, even though the bytes
      # already landed and the next attempt normally succeeds. That failed the
      # job, which failed the aggregate gate, which ejected the merge-queue
      # entry. So: retry once, and never fail the gate on it:
      # the consumer already downloads this with continue-on-error.
      - name: Upload Trivy results
        id: upload-trivy
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-results
          path: /tmp/trivy_results.json
          retention-days: 7

      - name: Upload Trivy results (retry)
        if: steps.upload-trivy.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-results
          path: /tmp/trivy_results.json
          retention-days: 7
          overwrite: true

  # ── Endor Labs container scan (report-only) ─────────────────────────────────
  #
  # Runs ALONGSIDE Trivy, not instead of it. The two enumerate packages
  # differently -- Endor reads package-manager manifests per layer, Trivy/Syft
  # fingerprint the filesystem -- so each sees things the other misses,
  # measurably so on our images. What Endor adds is OVAL-based distro severity
  # (fewer false highs on Wolfi), base-image attribution, and OS reachability.
  # So: collect both, compare, and decide later what gates.
  #
  # Deliberately NOT in security-gate's `needs`, and `continue-on-error: true`:
  # during the rollout an Endor outage, licence issue, or false positive must not
  # be able to wedge the merge queue for the whole fleet. Promoting this to a gate
  # is a separate, conscious PR — flip continue-on-error off and add `endor-scan`
  # to security-gate.needs.
  endor-scan:
    name: Endor Container Scan
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.image != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      # Endor is opt-in per org secret. Without this guard every fork PR and
      # every repo not yet licensed would show a red (if ignored) job.
      - name: Check Endor credentials
        id: creds
        env:
          ENDOR_KEY: ${{ secrets.ENDOR_API_CREDENTIALS_KEY }}
        run: |
          if [ -z "$ENDOR_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Endor scan skipped::ENDOR_API_CREDENTIALS_KEY is not available to this repo."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Same artifact the Trivy job consumes, so both scanners see byte-identical
      # image content and a disagreement is always the scanner, never the input.
      - name: Download image artifact
        if: steps.creds.outputs.configured == 'true' && inputs.image == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-image
          path: /tmp

      - name: Log in to GHCR
        if: steps.creds.outputs.configured == 'true' && inputs.image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}

      # Normalise both paths onto /tmp/image.tar. The tarball is the primary
      # interface because on the PR path the image is built locally and never
      # pushed -- there is nothing for endorctl to pull -- and the build job's
      # buildx `outputs: type=docker,dest=/tmp/image.tar` hands us one for free.
      #
      # It is also the more durable choice: endorctl shells out to `docker save`,
      # which on Docker 29 rejects a multi-arch reference without an explicit
      # platform ("both OS and Architecture must be provided"). Runners are on
      # ubuntu-24.04 / Docker API 1.48 today and unaffected, but they will move.
      - name: Materialise image tarball
        id: image
        if: steps.creds.outputs.configured == 'true'
        env:
          PREBUILT: ${{ inputs.image }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -n "$PREBUILT" ]; then
            docker pull --platform linux/amd64 "$PREBUILT"
            docker save --platform linux/amd64 -o /tmp/image.tar "$PREBUILT"
            echo "ref=$PREBUILT" >> "$GITHUB_OUTPUT"
          else
            # The build job tags the local image `scan-target:<sha>`, which is
            # meaningless in the Endor UI. Report it under the name it will be
            # published as, so PR scans and published images line up on one
            # container in the Containers view.
            echo "ref=ghcr.io/atlanhq/${REPO}:$(echo "${{ inputs.ref || github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # Reachability has to RUN the image, so the daemon must hold it -- a
      # tarball alone is not enough. Gated on the input because `docker load` of
      # a 0.5-2.5 GB image is dead weight for a metadata-only scan.
      - name: Load image into the daemon (reachability only)
        if: steps.creds.outputs.configured == 'true' && inputs.endor_os_reachability
        run: docker load -i /tmp/image.tar

      # `pr: true` keeps PR scans out of the monitored-version history; the merge
      # path (build-and-publish-app.yaml, fail_on_findings=false) records a
      # monitored version instead. Without this Endor fragments the project and
      # the dashboards stop meaning anything.
      - name: Endor Labs container scan
        if: steps.creds.outputs.configured == 'true'
        uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        with:
          namespace: atlan
          api_key: ${{ secrets.ENDOR_API_CREDENTIALS_KEY }}
          api_secret: ${{ secrets.ENDOR_API_CREDENTIALS_SECRET }}
          enable_github_action_token: false
          scan_dependencies: false
          scan_container: true
          image: ${{ steps.image.outputs.ref }}
          image_tar: /tmp/image.tar
          os_reachability: ${{ inputs.endor_os_reachability }}
          project_name: ${{ github.event.repository.name }}
          as_ref: ${{ github.event_name != 'pull_request' }}
          pr: ${{ github.event_name == 'pull_request' }}
          scan_summary_output_type: table
          additional_args: --image-type=app --finding-tags=${{ steps.image.outputs.ref }}

  # ── Security Gate — check Trivy results against allowlist ───────────────────
  security-gate:
    name: Security Gate
    needs: [trivy-scan]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint fleet App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      - name: Checkout base allowlist from SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: main
          sparse-checkout: |
            .security
            .github/scripts
          path: _sdk
          token: ${{ steps.app-token.outputs.token || secrets.ORG_PAT_GITHUB }}

      - name: Download Trivy results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: trivy-results
          path: /tmp

      - name: Check against allowlist
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        run: python3 _sdk/.github/scripts/check_allowlist.py --trivy-results /tmp/trivy_results.json --write-comment

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          # Same-repo PR comment — use the workflow's built-in token instead
          # of the fine-grained PAT (which has to be manually granted to each
          # repo and 404s on any repo not on its allowlist).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/scan_comment.md', 'utf8');
            } catch {
              return;
            }
            if (!body || !body.trim()) return;
            const time = new Date().toUTCString();
            body += `\n\n<sub>Run: ${context.runId} | ${time}</sub>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

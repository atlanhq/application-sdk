name: Sync Dapr Version from Base Image

# Drives the ``__dapr_version`` pin in ``application_sdk/version.py`` from the
# daprd that actually ships in the SDK's published runtime base image — NOT from
# Dapr's upstream GitHub releases.
#
# The previous version of this workflow ran on a weekly schedule and watched
# dapr/dapr's ``releases/latest``. That upstream version could drift from the
# daprd that actually ships inside the container (which is set by Chainguard
# Custom Assembly on the ``app-framework-golden`` base the runtime image is
# built FROM), so the pin and the runtime could disagree. This workflow flips
# the source of truth: the daprd in the shipped runtime image now drives the
# pin (BLDX-1467).
#
# Source of truth: ``registry.atlan.com/public/app-runtime-base:3`` — the SDK's
# own runtime base image (built FROM the Chainguard golden base, so its daprd is
# identical). It is a **public** repo, so we pull it anonymously — no Chainguard
# or Harbor credentials needed. This is the same image the Hourly Security Scan
# (``daily-security-scan.yml``) reads.
#
# Trigger: ``harbor-release.yaml`` finishes rebuilding the runtime image for a
# published SDK release (``workflow_run`` on its completion), plus manual
# dispatch. This must NOT listen to ``release: published`` itself: that is the
# same event the image rebuild starts on, so both ran side by side and the sync
# pulled ``:3`` ~10s in, minutes before the rebuild pushed the new image. Every
# run therefore compared the pin against the PREVIOUS release's daprd, and a
# daprd bump in the image went unnoticed until the release after it. Only a
# successful, release-triggered rebuild counts — a manual rebuild publishes
# under a branch tag prefix, not ``:3``. On each run it:
#   1. Pulls the runtime base image and reads daprd's reported version (raw-logged).
#   2. Compares it to the pinned ``__dapr_version``.
#   3. Opens a PR bumping the pin when they differ.
#
# Caveat: ``:3`` is a mutable major tag, so the baked daprd can change between
# SDK releases; the release-triggered sync lags until the next release. Use
# ``workflow_dispatch`` to reconcile the pin on demand in the meantime.

on:
  workflow_run:
    # Must match ``name:`` in harbor-release.yaml.
    workflows: ["Publish Harbor Image (Release)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-dapr-version
  cancel-in-progress: false

env:
  # The SDK's own published runtime base image — built FROM the Chainguard
  # golden base, so its daprd is identical. Public repo: pulled anonymously,
  # no Chainguard/Harbor creds. ``:3`` is the current major tag, matching the
  # Hourly Security Scan (daily-security-scan.yml).
  TARGET_IMAGE: registry.atlan.com/public/app-runtime-base:3

jobs:
  sync:
    name: Sync daprd pin from runtime base image
    # Run only after the image rebuild for a release actually pushed a new ``:3``.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Author the sync PR as the atlan-app-fleet App, NOT as atlan-ci. The PR
      # needs an approving code-owner review to satisfy the `main` ruleset
      # (required_approving_review_count: 1 + require_code_owner_review), and
      # GitHub forbids a PR author approving their own PR — so if atlan-ci opens
      # it, atlan-ci can never approve it and the PR sits at REVIEW_REQUIRED
      # forever. Splitting the identities (fleet App authors, atlan-ci approves
      # below) is the same pattern that already works for Renovate PRs.
      - name: Mint atlan-app-fleet App token (PR author identity)
        id: fleet-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out with the App token so the bump branch we push triggers CI on
          # the opened PR (a push made with the default GITHUB_TOKEN would not;
          # App installation tokens DO trigger workflows).
          token: ${{ steps.fleet-token.outputs.token }}

      # The logic for every step below lives in a tested script
      # (.github/scripts/sync_dapr_version.py), per docs/standards/ci.md.
      - name: Read pinned daprd version
        id: pinned
        run: python3 .github/scripts/sync_dapr_version.py pinned

      # Public image: anonymous pull, no registry login needed (same as the
      # Hourly Security Scan). The raw ``daprd --version`` output is logged.
      - name: Extract daprd version from runtime base image
        id: baked
        env:
          IMAGE: ${{ env.TARGET_IMAGE }}
        run: python3 .github/scripts/sync_dapr_version.py baked --image "$IMAGE"

      - name: Compare
        id: compare
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          BAKED: ${{ steps.baked.outputs.version }}
        run: python3 .github/scripts/sync_dapr_version.py compare --pinned "$PINNED" --baked "$BAKED"

      - name: Bump version.py
        if: steps.compare.outputs.match == 'false'
        env:
          PINNED: ${{ steps.compare.outputs.pinned }}
          BAKED: ${{ steps.compare.outputs.baked }}
        run: python3 .github/scripts/sync_dapr_version.py bump --pinned "$PINNED" --baked "$BAKED"

      - name: Sign bot commits
        if: steps.compare.outputs.match == 'false'
        uses: atlanhq/application-sdk/.github/actions/sign-bot-commits@main
        with:
          signing-key: ${{ secrets.BOT_SIGNING_KEY }}

      # PR always targets main: both ``workflow_run`` and a dispatch from main
      # check out main's tip, so the pin read above is main's current one. The
      # branch is per-version, so a re-run lands back on the existing PR.
      - name: Open PR if drift detected
        id: open-pr
        if: steps.compare.outputs.match == 'false'
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          BAKED: ${{ steps.compare.outputs.baked }}
          IMAGE: ${{ env.TARGET_IMAGE }}
        run: >-
          python3 .github/scripts/sync_dapr_version.py open-pr
          --pinned "$PINNED" --baked "$BAKED" --image "$IMAGE"

      # Hands-off merge, in two parts that must use DIFFERENT identities:
      #
      #   1. Approve as atlan-ci. atlan-ci is a CODEOWNER via the `*` rule in
      #      .github/CODEOWNERS, so its review satisfies the `main` ruleset's
      #      required_approving_review_count: 1 + require_code_owner_review.
      #      This is why the PR above is authored by the fleet App and not by
      #      atlan-ci — GitHub rejects self-approval, so same-identity author +
      #      approver leaves the PR permanently at REVIEW_REQUIRED.
      #   2. Enable GitHub native auto-merge, which — because `main` has a merge
      #      queue — adds the PR to the queue once the review + required checks
      #      are satisfied. NOTE: no `--squash`/method flag. The merge queue owns
      #      the merge strategy, and passing one makes gh refuse with
      #      "The merge strategy for main is set by the merge queue", which is
      #      exactly how this silently stopped queueing before (BLDX-1595).
      #
      # Nothing is merged early: the queue still enforces every required check.
      # Scoped by construction to the chore/sync-daprd-* PR this run produced.
      - name: Approve as atlan-ci and add to merge queue
        if: steps.open-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "**Dapr sync:** approved automatically as \`atlan-ci\`. This PR is a single-line \`__dapr_version\` bump generated and verified by [\`check-dapr-version.yaml\`](.github/workflows/check-dapr-version.yaml) against the daprd shipped in the runtime base image. Required checks and the merge queue still gate the merge."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto

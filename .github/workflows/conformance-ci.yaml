# .github/workflows/conformance-ci.yaml
#
# Reusable workflow: CI/workflow supply-chain checks (C-series) via
# `suite.runner --series C`.  Currently enforces:
#   C001  UnpinnedActionReference — every external action must use a digest pin
#
# New C-series checks added to suite/checks/ are picked up automatically.
#
# Usage from a connector app:
#   uses: atlanhq/application-sdk/.github/workflows/conformance-ci.yaml@main
#   # No inputs needed — published PyPI package is used by default.
#   # To test an unreleased version: with: { conformance-ref: '<branch-or-sha>' }

name: "Conformance — CI series (C)"

on:
  workflow_call:
    inputs:
      conformance-ref:
        description: "Git ref for unreleased suite testing (empty = use published PyPI package)"
        required: false
        default: ""
        type: string
      scan-path:
        description: "Path to watch for workflow/action change detection (default: .github)"
        required: false
        default: .github
        type: string
      upload-sarif:
        description: "Upload SARIF report to GitHub Security tab (requires security-events: write)"
        required: false
        default: true
        type: boolean
      event_name:
        description: "Caller's github.event_name (push / pull_request / merge_group); reusable workflows always see 'workflow_call' internally"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: "CI"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout caller repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Detect changed files"
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant:
              - '${{ inputs.scan-path }}/**'


      - name: "Set up uv"
        if: steps.changes.outputs.relevant == 'true' || inputs.event_name == 'push'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"

      - name: "Run C-series checks (published package)"
        if: (steps.changes.outputs.relevant == 'true' || inputs.event_name == 'push') && inputs.conformance-ref == ''
        run: |
          uvx atlan-application-sdk-conformance detect \
            --repo . \
            --series C \
            --output ci.sarif

      - name: "Run C-series checks (from git ref)"
        if: (steps.changes.outputs.relevant == 'true' || inputs.event_name == 'push') && inputs.conformance-ref != ''
        run: |
          uv run \
            --with "atlan-application-sdk-conformance @ git+https://github.com/atlanhq/application-sdk@${{ inputs.conformance-ref }}#subdirectory=packages/conformance" \
            -- atlan-application-sdk-conformance detect \
            --repo . \
            --series C \
            --output ci.sarif

      # `upload-artifact` classifies the artifact service's finalize 403 as
      # non-retryable and fails on the first occurrence, even though the bytes
      # already landed and the next attempt normally succeeds. That failed the
      # job, which failed the aggregate gate, which ejected the merge-queue
      # entry. So: retry once, and never fail the gate on it:
      # the series verdict is the gate; this artifact only feeds the
      # Security tab, whose consumer already tolerates absence.
      - name: "Upload SARIF artifact"
        id: upload-sarif
        if: (steps.changes.outputs.relevant == 'true' || inputs.event_name == 'push') && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-ci-sarif
          path: ci.sarif
          # Overwrite on the FIRST attempt too. Artifacts survive across attempts of
          # a run, so re-running a failed job would otherwise 409 here and burn the
          # retry on a conflict that has nothing to do with a finalize failure. It is
          # also what holds the invariant every consumer of this upload globs on:
          # at most ONE live artifact ever matches `<name>*`.
          overwrite: true

      # A finalize 403 comes from an intermediary having a moment, and the
      # retry runs about a second later — well inside the same window. Wait
      # it out, so the two attempts fail independently or not at all.
      - name: Wait before the upload retry
        if: steps.upload-sarif.outcome == 'failure'
        run: sleep 20

      - name: "Upload SARIF artifact (retry)"
        if: steps.upload-sarif.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # A DISTINCT name, never the first attempt's: a FinalizeArtifact
          # failure leaves an unfinalized record holding that name for the whole
          # run. The list API cannot see it, so `overwrite` cannot clear it and
          # CreateArtifact 409s — a same-named retry could never have worked.
          # Consumers resolve this artifact by `<name>*` glob, not exact name.
          name: conformance-ci-sarif-retry
          path: ci.sarif
          overwrite: true

      - name: "Strip suppressed results for Security tab"
        if: ${{ inputs.upload-sarif && inputs.event_name == 'push' }}
        run: |
          jq '.runs[] |= (.results |= map(select(.suppressions == null or (.suppressions | length == 0))))' \
            ci.sarif > ci-upload.sarif

      - name: "Upload SARIF to Security tab"
        if: ${{ inputs.upload-sarif && inputs.event_name == 'push' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ci-upload.sarif

name: API package checks (reusable)

# Reusable workflow: checks that atlan-application-sdk-api — a listed subset of
# application_sdk/ published as its own wheel for the consolidated API host —
# still installs and serves on its own.
#
#   * gen_api_files.py --check: api-files.txt is the import closure of the seed
#     modules in packages/api/pyproject.toml, as committed.
#   * check_api_surface.py reads every listed file's imports: nothing reaches an
#     unlisted module or an undeclared package, and lazy worker-only imports have
#     a stated fallback.
#   * probe_api_wheels.py installs the BUILT wheels (never an editable tree):
#     each file under application_sdk/ ships in exactly one wheel, a uv upgrade
#     from the last release keeps every listed file, the documented
#     `pip install --force-reinstall` recovery works after a pip upgrade, an
#     api-only venv imports the listed modules within the RSS budget and serves
#     its routes, and each listed module imports alone in a fresh process.
#
# The logic lives in tested scripts (docs/standards/ci.md). SDK-private: no
# consumer app references this workflow.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  api-package:
    name: API package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade probe starts from the last release tag.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Check the api file list is generated from the seeds
        run: python3 .github/scripts/gen_api_files.py --check

      - name: Check the api file set's imports
        run: python3 .github/scripts/check_api_surface.py

      # Plain `uv build`, as tag-and-publish.yaml publishes: an sdist, then the
      # wheel built from it. `--wheel` would build from the tree and miss a
      # file the sdist drops. The probe requires each wheel's sdist beside it.
      - name: Build both distributions (sdist, then wheel from it)
        run: |
          set -euo pipefail
          uv build --out-dir dist .
          uv build --out-dir dist packages/api

      - name: Probe the built wheels
        run: python3 .github/scripts/probe_api_wheels.py --dist dist --from-release latest-tag --max-rss-mb 120

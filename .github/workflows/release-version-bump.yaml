# Reusable workflow: bump semver version based on conventional commits since last tag.
#
# Opens a bump-version PR against target_branch with:
#   - pyproject.toml version updated (MAJOR.MINOR.PATCH via conventional commits)
#   - uv.lock regenerated
#   - CHANGELOG.md prepended with a new section
#
# The opened PR gets release_label applied; tag-and-release.yaml fires when it merges.
#
# Usage in each app repo (.github/workflows/release.yaml):
#
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#   jobs:
#     bump:
#       if: |
#         github.event.pull_request.merged == true &&
#         !startsWith(github.event.pull_request.head.ref, 'bump-version')
#       uses: atlanhq/application-sdk/.github/workflows/release-version-bump.yaml@main
#       secrets: inherit
#
name: Release Version Bump

on:
  workflow_call:
    inputs:
      target_branch:
        description: "Branch to open the bump PR against"
        required: false
        type: string
        default: "main"
      release_label:
        description: "Label applied to the bump PR (triggers tag-and-release.yaml on merge)"
        required: false
        type: string
        default: "release"
      sdk_scripts_ref:
        description: "Deprecated and ignored (FND-4905): SDK scripts are always checked out at job.workflow_sha, the commit this reusable was resolved at, so a caller cannot choose the code that runs with this job's secrets. Still declared so callers that pass it keep validating."
        required: false
        type: string
        default: "main"
      first_release_version:
        description: "Minimum version for an app's *first* release (a repo with no v* tag yet). Apps are scaffolded at 0.1.0, so without this their first ever release would be 0.2.0; a first release is a 1.0.0 event. Applied as a floor, not an assignment — an app already at or past it keeps bumping normally. Set to an empty string to disable and use the plain conventional-commit bump."
        required: false
        type: string
        default: "1.0.0"
      private_git_auth:
        description: "Set true if the app has a private-org (atlanhq) git dependency that `uv lock` must resolve during the version bump. When true, a read-only fleet App token scoped to the app's private atlanhq repos is used by git_auth.py to mirror-clone them, and `uv lock` resolves from the local mirrors with no token in its env (FND-4740), so resolution of the private git source succeeds. Default false — apps with only PyPI deps are unaffected. Mirrors the `private_git_auth` input in build-and-publish-app.yaml."
        required: false
        type: boolean
        default: false
    secrets:
      ORG_PAT_GITHUB:
        required: false
        description: "Formerly the fallback token for git push and gh pr create. Unused since FND-4652, when the fleet App token stopped falling back to it: the mint fails the job instead. Declared optional so a caller that still passes it explicitly keeps parsing."
      FLEET_APP_ID:
        required: false
        description: "atlan-app-fleet App ID (org secret). Not passed explicitly by any current caller — auto-available via 'secrets: inherit'. Declared here so the contract is self-documenting. Effectively required: the 'Mint fleet App token' step fails the job without it (FND-4652); declared optional only so an omitting caller gets a red step rather than a startup_failure."
      FLEET_APP_PRIVATE_KEY:
        required: false
        description: "atlan-app-fleet App private key (org secret). Same availability as FLEET_APP_ID above."
      BOT_SIGNING_KEY:
        required: false
        description: "SSH signing key of the atlan-ci machine user (org secret), so the bump commit is Verified. Auto-available via 'secrets: inherit'; without it the commit is unsigned."

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Update version and changelog
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # One bump per repo and target at a time. Without it, a burst of merges ran
    # concurrent bumps that each force-pushed the branch (or lost the
    # --force-with-lease race and went red). Queued, not cancelled: a run is
    # never killed between its push and its PR sync. A burst coalesces because
    # the group holds one pending run and a newer arrival replaces it — the
    # replacement checks out a later merge commit, so it builds everything the
    # evicted one would have. The evicted run shows `cancelled` on its merged
    # PR, which gates nothing.
    concurrency:
      group: release-version-bump-${{ github.repository }}-${{ inputs.target_branch }}
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      push: ${{ steps.bump.outputs.skip != 'true' && steps.debounce.outputs.push != 'false' }}
      current: ${{ steps.versions.outputs.current }}
      new: ${{ steps.bump.outputs.new }}
      base_sha: ${{ steps.base.outputs.sha }}
      lease: ${{ steps.base.outputs.lease }}

    steps:
      - name: Mint fleet App token
        # No workflow auto-merges the bump PR this opens (GitHub blocks
        # self-approval regardless of author identity), so only the re-fire
        # property matters here, not a specific bypass-actor identity.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Recorded before anything else runs: the publish job rebuilds the bump on
      # exactly this commit, and leases its push on the bump branch's tip as
      # seen here (empty when the branch does not exist yet).
      - name: Record the base and the bump branch tip
        id: base
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "lease=$(git rev-parse --verify --quiet "refs/remotes/origin/bump-version-${TARGET_BRANCH}" || true)" >> "$GITHUB_OUTPUT"

      - name: Checkout SDK helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          path: .sdk-scripts
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Get current version
        id: versions
        run: |
          CURRENT=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

      # `uv lock` (in the re-lock steps below) re-resolves the dependency
      # graph, which for a private atlanhq git source clones that repo. A
      # second token, not the one minted above: that one is scoped to this
      # repo and can write; this one can only read the dependency repos.
      # Private atlanhq git deps: a read-only fleet App token scoped to the
      # private repos the app names (none named: no mint). It only reaches
      # git_auth.py's mirror clones: uv, and every build backend it runs,
      # install from local mirrors with no token in their env (FND-4740,
      # lens round 5). A failed mint gets the named error below.
      # Scoped to the private atlanhq repos the app names (git_auth.py
      # repos: its pyproject.toml / uv.lock files, public repos dropped).
      # No mint when it names none: create-github-app-token with no
      # `repositories` would grant the whole installation. The script comes
      # from this workflow's own commit (job.workflow_sha), so it is the
      # version that matches the workflow running it.
      - name: Checkout SDK git_auth.py (private git deps)
        if: inputs.private_git_auth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts/git_auth.py
          sparse-checkout-cone-mode: false
          path: .sdk-git-auth
          persist-credentials: false

      - name: List the private atlanhq repos the app names (refuses any not allowlisted)
        id: git-deps-repos
        if: inputs.private_git_auth
        run: |
          set -euo pipefail
          python3 .sdk-git-auth/.github/scripts/git_auth.py repos --project-dir .
          # Out of the workspace: it is the image build context and the tree
          # conformance and pre-commit look at.
          rm -rf .sdk-git-auth

      - name: Mint read-only token for private git dependencies
        id: git-deps-token
        if: inputs.private_git_auth && steps.git-deps-repos.outputs.repositories != ''
        # A failed mint leaves the token empty; see the guard below.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          # Capped by ALLOWED_PRIVATE_DEPS in git_auth.py, read from this
          # workflow's own commit, never the PR's tree: the repos step above
          # fails the job for any private repo not on it, so a PR's
          # pyproject.toml / uv.lock cannot widen this scope.
          repositories: ${{ steps.git-deps-repos.outputs.repositories }}
          permission-contents: read

      # Condition stays in `if:`, never in the shell (docs/standards/ci.md).
      - name: Require the token when private_git_auth is set
        if: inputs.private_git_auth && steps.git-deps-repos.outputs.repositories != '' && steps.git-deps-token.outputs.token == ''
        run: |
          echo "::error title=No token for private git dependencies::private_git_auth is true but the fleet App token did not mint. Pass FLEET_APP_ID and FLEET_APP_PRIVATE_KEY (secrets: inherit, or name both in an explicit secrets: mapping)."
          exit 1

      - name: Bump version
        id: bump
        env:
          # The commit the caller's closed PR produced. release_guard sets
          # skip=true when it is not on origin/<target_branch>: GitHub fires the
          # caller for a stacked PR merging into its *parent feature branch*
          # exactly as if it had merged into the target, and only ancestry tells
          # the two apart (application-sdk#3794).
          PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python3 -m venv /tmp/bump-venv
          /tmp/bump-venv/bin/pip install semver packaging -q
          # --first-release-version is always passed; an empty value disables the
          # floor in the script, so the caller opts out via the input rather than
          # via a shell conditional here (docs/standards/ci.md).
          /tmp/bump-venv/bin/python .sdk-scripts/.github/scripts/release.py \
            "${{ inputs.target_branch }}" \
            "${{ steps.versions.outputs.current }}" \
            --first-release-version "${{ inputs.first_release_version }}"
          NEW=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

      # The re-lock is a no-op when the version did not change. Two steps, so
      # an app without private git deps runs plain `uv lock` exactly as before
      # and never needs git_auth.py.
      - name: Re-lock after the version bump
        if: ${{ !inputs.private_git_auth }}
        run: uv lock

      # The only step that holds the token: it mirror-clones the app's private
      # atlanhq deps into $RUNNER_TEMP/git-mirrors and exits, so neither uv nor
      # any ancestor of it has the token when a build backend runs (lens
      # rounds 5-6).
      - name: Mirror private git dependencies
        if: inputs.private_git_auth
        env:
          GIT_TOKEN: ${{ steps.git-deps-token.outputs.token }}
          PRIVATE_GIT_DEPS: "true"
        run: python3 .sdk-scripts/.github/scripts/git_auth.py mirror

      # No token here: `uv lock` resolves the private deps from the mirrors.
      - name: Re-lock after the version bump (private git deps)
        if: inputs.private_git_auth
        run: python3 .sdk-scripts/.github/scripts/git_auth.py run -- uv lock

      # release.py sets skip=true when the target branch already carries the
      # version it computed — this run is looking at a frozen merge ref that
      # predates a release which has already merged and published, so bumping
      # again would open a duplicate release PR (application-sdk#3570).
      # Guarding the two mutating steps is enough: the re-lock above is a no-op
      # when the version did not change, and the job then ends green having
      # done nothing.
      - name: Generate changelog
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # `auto` (FND-3748): full notes — every type but `ci` — only once this
        # repo's shims gate bump-PR CI on `gate-check`; until its resync lands,
        # the old Features/Bug Fixes notes, so Renovate merges keep not moving
        # the bump PR and its still-ungated CI does not re-run on each one.
        run: python3 .sdk-scripts/.github/scripts/update_changelog.py "${{ steps.versions.outputs.current }}" "${{ steps.bump.outputs.new }}" --sections auto

      # Every force-push of the bump branch is a `synchronize` that re-runs all
      # PR CI on the open bump PR. Most merges — every Renovate one, since its
      # commits are forced to `chore` — change neither the version nor the
      # rendered notes, so the push would re-test an identical release (FND-3322).
      # The script sets push=false only when the open branch already carries
      # this version and these notes and still merges cleanly; anything it
      # cannot establish resolves to push=true. Skipped when the script is
      # absent, so the output is empty and the push step below runs. Scripts
      # come from job.workflow_sha since FND-4905, which always carries it.
      - name: Decide whether the bump branch needs a push
        id: debounce
        if: steps.bump.outputs.skip != 'true' && hashFiles('.sdk-scripts/.github/scripts/release_bump_debounce.py') != ''
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: |
          python3 .sdk-scripts/.github/scripts/release_bump_debounce.py \
            --branch "bump-version-${TARGET_BRANCH}" \
            --version-file pyproject.toml \
            --changelog CHANGELOG.md \
            --new-version "${NEW_VERSION}"

      # Legacy, for app repos whose shims predate FND-3839 and still read the
      # `gate-check` LABEL as the bump-PR opt-in (FND-3748): clear it BEFORE the
      # push, because the `synchronize` the push fires carries the PR's labels
      # at that instant. A resynced repo opts in with a `/gate-check` comment
      # instead — a commit status, which a push leaves behind by construction —
      # so this is a no-op there. Remove once the fleet has resynced. Fails open.
      - name: Reset the bump PR's CI opt-in
        if: steps.bump.outputs.skip != 'true' && steps.debounce.outputs.push != 'false' && hashFiles('.sdk-scripts/.github/scripts/bump_pr_opt_in.py') != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          python3 .sdk-scripts/.github/scripts/bump_pr_opt_in.py clear \
            --base "${TARGET_BRANCH}" \
            --head "bump-version-${TARGET_BRANCH}"

      - name: Hand over the bump
        if: steps.bump.outputs.skip != 'true' && steps.debounce.outputs.push != 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bump"
          cp pyproject.toml uv.lock CHANGELOG.md "$RUNNER_TEMP/bump/"

      - name: Upload the bump
        id: upload-bump
        if: steps.bump.outputs.skip != 'true' && steps.debounce.outputs.push != 'false'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bump-commit-files
          path: |
            ${{ runner.temp }}/bump/pyproject.toml
            ${{ runner.temp }}/bump/uv.lock
            ${{ runner.temp }}/bump/CHANGELOG.md
          overwrite: true
          retention-days: 1

      - name: Wait before the the bump retry
        if: steps.bump.outputs.skip != 'true' && steps.debounce.outputs.push != 'false' && steps.upload-bump.outcome == 'failure'
        run: sleep 20

      - name: Upload the bump (retry)
        if: steps.bump.outputs.skip != 'true' && steps.debounce.outputs.push != 'false' && steps.upload-bump.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bump-commit-files-retry
          path: |
            ${{ runner.temp }}/bump/pyproject.toml
            ${{ runner.temp }}/bump/uv.lock
            ${{ runner.temp }}/bump/CHANGELOG.md
          overwrite: true
          retention-days: 1

  # The job above runs third-party code (`uvx toml-cli`, pip, and `uv lock` over
  # the app's dependencies), any of which could leave a git hook, git config or
  # process behind. This job runs none of it: a fresh checkout of the same base,
  # the three files the bump produced, then signing, the commit and the push.
  publish:
    name: Publish version bump
    needs: bump-version
    if: needs.bump-version.outputs.skip != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    concurrency:
      group: release-version-bump-${{ github.repository }}-${{ inputs.target_branch }}
      cancel-in-progress: false
    steps:
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: ${{ github.event.repository.name }}

      - name: Checkout the base the bump was built on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.base_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout SDK helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          path: .sdk-scripts
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # Glob, not the bare name: the upload's retry lands under `bump-commit-files-retry`.
      # Both upload attempts overwrite, so the glob resolves to one artifact.
      - name: Download the bump
        id: download-bump
        if: needs.bump-version.outputs.push == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bump-commit-files*
          merge-multiple: true
          path: ${{ runner.temp }}/bump

      - name: Wait before the the bump download retry
        if: needs.bump-version.outputs.push == 'true' && steps.download-bump.outcome == 'failure'
        run: sleep 20

      - name: Download the bump (retry)
        if: needs.bump-version.outputs.push == 'true' && steps.download-bump.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bump-commit-files*
          merge-multiple: true
          path: ${{ runner.temp }}/bump

      # Signs the bump commit so the PR isn't blocked by the signed-commits
      # ruleset; the push below still uses the same token.
      - name: Sign bot commits
        if: needs.bump-version.outputs.push == 'true'
        uses: atlanhq/application-sdk/.github/actions/sign-bot-commits@main
        with:
          signing-key: ${{ secrets.BOT_SIGNING_KEY }}

      - name: Commit and push bump branch
        if: needs.bump-version.outputs.push == 'true'
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          NEW_VERSION: ${{ needs.bump-version.outputs.new }}
          LEASE: ${{ needs.bump-version.outputs.lease }}
        run: |
          set -euo pipefail
          git config --global user.name 'atlan-ci'
          git config --global user.email 'it@atlan.com'

          BRANCH="bump-version-${TARGET_BRANCH}"
          git checkout -b "$BRANCH"
          cp "$RUNNER_TEMP/bump/pyproject.toml" "$RUNNER_TEMP/bump/uv.lock" "$RUNNER_TEMP/bump/CHANGELOG.md" .
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore: bump version to ${NEW_VERSION}"
          # Leased on the tip the bump job saw (empty: the branch must not exist),
          # so a concurrent run that already moved this bot-owned branch fails
          # this push rather than being overwritten.
          git push origin "HEAD:refs/heads/${BRANCH}" --force-with-lease="refs/heads/${BRANCH}:${LEASE}"

      # Runs whether or not the branch was pushed: it re-attaches the release
      # label and creates the PR if a human closed it, and is a no-op when the
      # title/body/label already match — which they do on a debounced run,
      # because the version they are built from is the one the branch carries.
      - name: Open or sync bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          CURRENT_VERSION: ${{ needs.bump-version.outputs.current }}
          NEW_VERSION: ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          BRANCH="bump-version-${TARGET_BRANCH}"

          cat > "${RUNNER_TEMP}/bump-pr-body.md" <<EOF
          Automated version bump after merge to ${TARGET_BRANCH}.

          This PR updates:
          - pyproject.toml
          - uv.lock
          - CHANGELOG.md

          Version: ${CURRENT_VERSION} → ${NEW_VERSION}
          EOF

          # Upsert rather than create-or-skip. This branch is fixed and gets
          # force-pushed on every re-fire, so while the bump PR stays open the
          # *content* keeps moving — an app that merges a `feat:` after a patch
          # bump was computed ends up shipping a minor. The old `else` branch
          # only created the PR, leaving the title and body frozen at the first
          # run's version while the diff said something else
          # (atlanhq/atlan-oracle-app#258). The script re-syncs title, body and
          # the release label, and no-ops when they already match.
          python3 .sdk-scripts/.github/scripts/upsert_release_pr.py \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${TARGET_BRANCH}" \
            --head "${BRANCH}" \
            --title "Bump version to ${NEW_VERSION}" \
            --body-file "${RUNNER_TEMP}/bump-pr-body.md" \
            --label "${RELEASE_LABEL}"

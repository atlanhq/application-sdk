# Regenerate Capability Manifest — slash-command workflow
#
# Triggered when a PR participant comments "/regen-manifest".
# Regenerates docs/agents/sdk-capabilities.md via `uv run poe regen-capabilities`
# and pushes the result as github-actions[bot].
#
# Key design choices:
#   - A minted atlan-app-fleet App checkout token so the resulting push re-fires
#     PR check workflows (same pattern as release-version-bump.yaml). Confirmed
#     empirically that App-token pushes re-trigger downstream workflows the same
#     way a real PAT identity does.
#   - github-actions[bot] identity, NOT atlan-ci (nor the App), so the bot commit
#     does not auto-satisfy the wildcard CODEOWNERS rule that includes @atlan-ci.
#   - Fork PRs are rejected immediately with an explanatory comment.
#   - fetch-depth: 0 for the same reason as the drift-check workflow (source-sha).
#   - Regenerating runs the PR's own `poe` task, so that job never holds the
#     commit-signing key: the task could leave a git hook or config behind that
#     reads it. It hands over only the regenerated manifest, and a fresh `commit`
#     job (which runs no PR code) signs, commits and pushes it.

name: Regenerate Capability Manifest

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  # The reactions endpoint is `/issues/comments/{id}/reactions` — a PR comment
  # is an issue comment, so `pull-requests: write` does not cover it. Without
  # this the ack 403s on every run; the helper now warns and exits 0 rather
  # than failing the job, which would make a permanently missing ack the
  # silent steady state.
  issues: write

jobs:
  regen:
    name: Regenerate Capability Manifest
    # Only fire for PR comments containing the command, from repo members or above.
    # CONTRIBUTOR/NONE/FIRST_TIME_CONTRIBUTOR are excluded to prevent outside commenters
    # from triggering a write to the repo (even though the write is deterministic and
    # low-risk, the permission gate follows the same pattern as sdk-review).
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/regen-manifest') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      number: ${{ steps.pr.outputs.number }}
      skipped: ${{ steps.pr.outputs.is_fork == 'true' || steps.pr.outputs.is_bump_version == 'true' }}
      changed: ${{ steps.handover.outputs.changed }}
      head_sha: ${{ steps.head.outputs.sha }}

    steps:
      - name: Get PR metadata
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('branch', pr.data.head.ref);
            core.setOutput('number', String(context.issue.number));
            core.setOutput('is_fork', String(pr.data.head.repo.fork));
            core.setOutput('is_bump_version', String(pr.data.head.ref.startsWith('bump-version')));

      - name: Reject on fork
        if: steps.pr.outputs.is_fork == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🚫 `/regen-manifest` cannot push to fork branches. Please run `uv run poe regen-capabilities` locally and push.',
            });
            core.setFailed('fork PR — cannot push');

      - name: Skip on bump-version branch
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'ℹ️ `/regen-manifest` is skipped on version-bump branches.',
            });

      # Sparse, and ahead of the full checkout below, so the ack stays the
      # first thing the requester sees.
      #
      # `path:` is load-bearing — this MUST NOT share a git dir with the full
      # checkout below. actions/checkout writes `core.sparseCheckout=true` into
      # `.git/config` (local scope), then the next checkout runs
      # `git sparse-checkout disable` (which parks `false` in the *worktree*
      # config) followed by `git config --local --unset-all
      # extensions.worktreeConfig` — that unset makes the worktree config inert,
      # so `core.sparseCheckout` reverts to true from local config and the
      # narrow pattern is re-applied by the subsequent `git checkout --force`.
      # Net effect: the workspace stays sparse, `pyproject.toml` is absent, and
      # `uv run poe` fails with "Failed to spawn: poe" (FND-637).
      - name: Checkout reaction helper
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ack
          sparse-checkout: .github/scripts/react_to_comment.py
          sparse-checkout-cone-mode: false

      # Best-effort: the reaction is cosmetic, so a transient reactions-API
      # failure must not take the regen run down with it. The script exits 0
      # whatever happens.
      - name: React to comment
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: rocket
        run: python3 .ack/.github/scripts/react_to_comment.py

      - name: Mint fleet App token
        id: app-token
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Recorded before any PR code runs, so the commit job can refuse a branch
      # that moved (or a HEAD the regen task itself moved).
      - name: Record the PR head
        id: head
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        with:
          version: "0.13.6"

      - name: Regenerate capability manifest
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        run: uv run poe regen-capabilities

      - name: Hand over the regenerated manifest
        id: handover
        if: steps.pr.outputs.is_fork != 'true' && steps.pr.outputs.is_bump_version != 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/agents/sdk-capabilities.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/manifest"
            cp docs/agents/sdk-capabilities.md "$RUNNER_TEMP/manifest/sdk-capabilities.md"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated manifest
        id: upload-manifest
        if: steps.handover.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regenerated-capability-manifest
          path: ${{ runner.temp }}/manifest/sdk-capabilities.md
          overwrite: true
          retention-days: 1

      - name: Wait before the regenerated manifest retry
        if: steps.handover.outputs.changed == 'true' && steps.upload-manifest.outcome == 'failure'
        run: sleep 20

      - name: Upload the regenerated manifest (retry)
        if: steps.handover.outputs.changed == 'true' && steps.upload-manifest.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regenerated-capability-manifest-retry
          path: ${{ runner.temp }}/manifest/sdk-capabilities.md
          overwrite: true
          retention-days: 1

  # A fresh job: it runs no PR code, so the signing key is never on disk beside
  # anything the PR controls. It writes only the one file the regen job produced.
  commit:
    name: Commit regenerated manifest
    needs: regen
    if: needs.regen.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout and push use the App token, and the artifact comes from this same
    # run, so the job's GITHUB_TOKEN needs no write grant.
    permissions:
      contents: read
    steps:
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk
          # Only the branch push, not the installation's full grant.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.regen.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Refuse a branch that moved since regeneration
        env:
          EXPECTED: ${{ needs.regen.outputs.head_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::The PR branch moved from $EXPECTED to $actual during regeneration; run /regen-manifest again."
            exit 1
          fi

      # Glob, not the bare name: the upload's retry lands under
      # `regenerated-capability-manifest-retry`. Both upload attempts overwrite,
      # so the glob resolves to one artifact.
      - name: Download the regenerated manifest
        id: download-manifest
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: regenerated-capability-manifest*
          merge-multiple: true
          path: ${{ runner.temp }}/manifest

      - name: Wait before the regenerated manifest download retry
        if: steps.download-manifest.outcome == 'failure'
        run: sleep 20

      - name: Download the regenerated manifest (retry)
        if: steps.download-manifest.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: regenerated-capability-manifest*
          merge-multiple: true
          path: ${{ runner.temp }}/manifest

      - name: Sign bot commits
        uses: atlanhq/application-sdk/.github/actions/sign-bot-commits@main
        with:
          signing-key: ${{ secrets.BOT_SIGNING_KEY }}

      - name: Commit and push
        env:
          PR_NUMBER: ${{ needs.regen.outputs.number }}
          BRANCH: ${{ needs.regen.outputs.branch }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/manifest/sdk-capabilities.md" docs/agents/sdk-capabilities.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/agents/sdk-capabilities.md
          git commit -m "chore(docs): regenerate capability manifest" \
            -m "Triggered by /regen-manifest on PR #${PR_NUMBER}." \
            -m "Generated by .claude/skills/capability-manifest."
          git push origin "HEAD:refs/heads/${BRANCH}"

  reply:
    name: Reply on PR
    needs: [regen, commit]
    if: always() && needs.regen.result != 'skipped' && needs.regen.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reply on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REGEN_RESULT: ${{ needs.regen.result }}
          CHANGED: ${{ needs.regen.outputs.changed }}
          COMMIT_RESULT: ${{ needs.commit.result }}
        with:
          script: |
            const { REGEN_RESULT, CHANGED, COMMIT_RESULT } = process.env;
            let body;
            if (REGEN_RESULT === 'success' && CHANGED === 'true' && COMMIT_RESULT === 'success') {
              body = '✅ Capability manifest regenerated and pushed. The updated SDK-surface diff is now visible in **Files changed**.';
            } else if (REGEN_RESULT === 'success' && CHANGED === 'false') {
              body = 'ℹ️ Capability manifest is already current — nothing to commit.';
            } else {
              body = '⚠️ Regeneration failed or was skipped. Check the [workflow logs](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

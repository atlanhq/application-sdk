name: Scheduled Checks

on:
  schedule:
    - cron: 0 0 * * * # daily at 00:00

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      - name: Close Stale PRs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          stale-issue-message: 'Stale Issue'
          stale-pr-message: 'Stale Pull Request'
          stale-issue-label: 'Stale'
          stale-pr-label: 'Stale'
          days-before-stale: 60
          debug-only: 'true'

  # Nightly: every rule's canonical_reference still names a path and symbol
  # that exist on the three reference apps' main (FND-4665).
  canonical-references:
    permissions:
      contents: read
    uses: ./.github/workflows/canonical-reference-check.yaml

  # Nightly smoke of the opt-in storage load suite (tests/load). Same
  # scenarios as `poe load-test-storage`, at 64 MiB instead of 1 GiB: the
  # smallest size that still exercises the multi-chunk resume path, so the
  # suite cannot silently rot between manual volume runs (FND-4291).
  load-smoke:
    name: Storage Load Tests — nightly smoke (64 MiB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup-deps"
        with:
          checkout: "false"
      - name: Run storage load tests at smoke size
        env:
          ATLAN_LOAD_TEST_SIZE_MIB: "64"
        run: uv run pytest tests/load -m load -v --timeout=600

  # Nightly real-cloud storage integration tests against main (no PR context,
  # so no change gate). Same job body as the PR run in pull_request.yaml:
  # storage-integration-reusable.yaml (FND-4928).
  storage-integration:
    name: Storage Integration Tests — nightly
    # Keyless OIDC: the reusable's job needs id-token, and a called workflow can
    # only narrow what its caller grants. Overrides the workflow-level grant.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/storage-integration-reusable.yaml

  # Nightly TemporalAuthManager token-refresh tests against a real Temporal
  # frontend that enforces RS256 JWT auth (local/temporal-auth/). They include
  # the reproducer of the production worker crash on token expiry. Too slow for
  # a PR (~4 min of real token expiry and grace periods) and need Docker, so
  # they only skip in the PR integration job.
  temporal-docker-auth:
    name: Temporal Docker JWT-auth tests — nightly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup-deps"
        with:
          checkout: "false"
      # Fresh key pair per run (gitignored; never stored as a secret).
      - name: Generate the JWT signing key and JWKS
        run: bash local/temporal-auth/scripts/gen_keys.sh
      # --wait returns once Temporal's healthcheck sees the `default` namespace,
      # and fails the step if any container never becomes healthy.
      - name: Start the JWT-auth Temporal stack
        run: docker compose -f local/temporal-auth/docker-compose.yml up -d --wait --wait-timeout 300
      # TEMPORAL_DOCKER_AUTH_REQUIRED=1: a missing key or unreachable stack fails
      # the tests instead of skipping them, so this job cannot pass on skips.
      - name: Run Temporal Docker-auth tests
        env:
          TEMPORAL_DOCKER_AUTH_REQUIRED: "1"
        run: uv run pytest tests/integration/test_temporal_docker_auth.py -m integration -v --timeout=180
      - name: Temporal stack logs
        if: failure()
        run: docker compose -f local/temporal-auth/docker-compose.yml logs --no-color --tail=300

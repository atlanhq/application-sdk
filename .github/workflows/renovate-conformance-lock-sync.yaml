name: Sync the conformance lock to a Renovate dependency bump

# FND-4439, FND-5018. packages/conformance/uv.lock path-sources the SDK and api
# packages from this checkout (FND-4256), so it records the dependencies they
# declare. Renovate bumps those declarations and Mend relocks the ROOT project
# only: it cannot run postUpgradeTasks here, so the conformance lock is left
# behind and check_conformance_lock.py fails the PR. This relocks it, pinning
# every drifted package to the version Renovate locked at the root (so the
# root's release-age cooldown carries over), and on a pyatlan move also
# regenerates relationship_directions.json, which is built from that lock. The
# bump lands as one self-contained PR.
#
# Same shape as renovate-lock-cooldown.yaml, for the same reasons:
#   - Mend stays the PR author, so renovate-auto-approve-reusable.yml's author
#     condition holds unchanged; the table path is added to this repo's
#     extra_dep_file_pattern in renovate-auto-approve.yml.
#   - Two jobs: `sync` resolves and imports the new pyatlan with a read-only
#     GITHUB_TOKEN; `publish`, the only job that sees the App token, copies the
#     declared outputs out of the artifact, commits and pushes.
#   - An App-token push, because a GITHUB_TOKEN push triggers no CI.
#   - carry_artifact_status.py carries `renovate/artifacts` onto our commit.
#
# Scope: every Renovate branch, majors included: the conformance lock takes the
# SDK's declarations from this checkout, so a major the SDK declares is a major
# that lock must take in the same PR. Except renovate/lock-file-maintenance,
# which renovate-lock-cooldown.yaml owns: it already rewrites this lock there,
# and two lanes pushing to one branch would race. On a branch whose bump the
# SDK does not declare the script finds no drift and commits nothing.
#
# All branching logic lives in the tested .github/scripts/renovate_conformance_lock_sync.py.

on:
  push:
    branches:
      - "renovate/**"
      - "!renovate/lock-file-maintenance"
    # The manifests too: a floor raised to the version the root lock already
    # pins changes no uv.lock, but the conformance lock and table may still lag.
    # Our own push touches only packages/conformance/**, so it never matches.
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "packages/api/pyproject.toml"

permissions:
  contents: read

concurrency:
  group: conformance-lock-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync the conformance lock and table to the root lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ACTOR: the same Renovate identities the approval gate accepts as PR
    # authors (renovate_approval_conditions.RENOVATE_AUTHORS, pinned by a drift
    # test). Defence in depth, not a control — see renovate-lock-cooldown.yaml.
    # RE-ENTRANCY: our own push arrives as atlan-app-fleet[bot]; it changes no
    # root uv.lock so the paths filter already skips it, and the subject check
    # is the belt to that brace.
    if: >-
      ${{ contains(fromJSON('["atlan-app-fleet[bot]", "renovate[bot]"]'), github.actor)
      && !startsWith(github.event.head_commit.message, 'chore(deps): sync the conformance lock') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch the base branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      # Same uv as renovate-lock-cooldown.yaml, so both lanes write the same
      # lock format.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"

      # `--with packaging`, pinned: the up-only comparisons need PEP 440
      # parsing. `--no-project` keeps this off the repo's own environment.
      - name: Sync the conformance lock
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          uv run --no-project --with 'packaging==26.3' \
            python .github/scripts/renovate_conformance_lock_sync.py \
            --baseline-ref "origin/$BASE_BRANCH" \
            --no-commit

      # One folder holding exactly the script's OUTPUT_PATHS at their repo
      # paths. Not the files themselves: given several paths, upload-artifact
      # roots the artifact at their common parent and drops that prefix, and
      # publish then finds none of them (FND-5015). A test replays this handoff.
      - name: Stage the synced outputs
        run: python3 .github/scripts/renovate_conformance_lock_sync.py --stage-to "$RUNNER_TEMP/conformance-lock-sync-out"

      - name: Upload the synced outputs
        uses: atlanhq/application-sdk/.github/actions/upload-artifact-retry@main
        with:
          name: conformance-lock-sync
          path: ${{ runner.temp }}/conformance-lock-sync-out
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Commit and push the synced outputs
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # For the renovate/artifacts carry-forward, written with GITHUB_TOKEN.
      statuses: write
    steps:
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk
          # Contents only, as in renovate-lock-cooldown.yaml (FND-395).
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}

      - name: Download the synced outputs
        uses: atlanhq/application-sdk/.github/actions/download-artifact-retry@main
        with:
          pattern: conformance-lock-sync*
          path: ${{ runner.temp }}/conformance-lock-sync

      # Stdlib only: nothing from the new dependency set runs beside the token.
      - name: Sign bot commits
        uses: atlanhq/application-sdk/.github/actions/sign-bot-commits@main
        with:
          signing-key: ${{ secrets.BOT_SIGNING_KEY }}

      - name: Commit the synced outputs
        run: python3 .github/scripts/renovate_conformance_lock_sync.py --apply-from "$RUNNER_TEMP/conformance-lock-sync"

      # Unchanged outputs commit nothing, so this is a no-op push.
      - name: Push
        run: git push origin "HEAD:$GITHUB_REF"

      - name: Carry renovate/artifacts forward
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/carry_artifact_status.py \
            --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

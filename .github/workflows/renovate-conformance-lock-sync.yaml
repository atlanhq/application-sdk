name: Sync the conformance lock to a Renovate dependency bump

# FND-4439, FND-5018. packages/conformance/uv.lock path-sources the SDK and api
# packages from this checkout (FND-4256), so it records the dependencies they
# declare. Renovate bumps those declarations and Mend relocks the ROOT project
# only: it cannot run postUpgradeTasks here, so the conformance lock is left
# behind and check_conformance_lock.py fails the PR. This relocks it, pinning
# every drifted package to the version Renovate locked at the root (so the
# root's release-age cooldown carries over), and on a pyatlan move also
# regenerates relationship_directions.json, which is built from that lock. The
# bump lands as one self-contained PR.
#
# The two jobs (read-only generate, App-token publish) are
# renovate-branch-fixup.yaml, shared with renovate-lock-cooldown.yaml
# (FND-4928); that file says why the lane has that shape. Mend stays the PR
# author, and the table path is in this repo's extra_dep_file_pattern in
# renovate-auto-approve.yml, so the approval gate accepts the synced outputs.
#
# Scope: every Renovate branch, majors included: the conformance lock takes the
# SDK's declarations from this checkout, so a major the SDK declares is a major
# that lock must take in the same PR. Except renovate/lock-file-maintenance,
# which renovate-lock-cooldown.yaml owns: it already rewrites this lock there,
# and two lanes pushing to one branch would race. On a branch whose bump the
# SDK does not declare the script finds no drift and commits nothing.
#
# All branching logic lives in the tested .github/scripts/renovate_conformance_lock_sync.py.

on:
  push:
    branches:
      - "renovate/**"
      - "!renovate/lock-file-maintenance"
    # The manifests too: a floor raised to the version the root lock already
    # pins changes no uv.lock, but the conformance lock and table may still lag.
    # Our own push touches only packages/conformance/**, so it never matches.
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "packages/api/pyproject.toml"

permissions:
  contents: read

concurrency:
  group: conformance-lock-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync the conformance lock and table to the root lock
    # The actor allowlist and the re-entrancy guard live on the reusable's
    # `generate` job. Our own push arrives as atlan-app-fleet[bot]; it changes
    # no root uv.lock so the paths filter already skips it, and the subject
    # check is the belt to that brace.
    permissions:
      contents: read
      # The reusable's `publish` job writes the renovate/artifacts carry-forward.
      statuses: write
    uses: ./.github/workflows/renovate-branch-fixup.yaml
    with:
      script: .github/scripts/renovate_conformance_lock_sync.py
      artifact-name: conformance-lock-sync
      own-commit-subject: "chore(deps): sync the conformance lock"
    secrets:
      FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
      FLEET_APP_PRIVATE_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
      BOT_SIGNING_KEY: ${{ secrets.BOT_SIGNING_KEY }}

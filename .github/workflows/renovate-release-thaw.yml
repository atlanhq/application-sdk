name: Renovate — thaw after a release train

# Lifts the release freeze (FND-4175). From a bump-version* PR's first
# /gate-check until it closes, renovate_approval_conditions.py withholds the atlan-ci
# approval from Renovate PRs (condition i), so none of them can merge and move
# main under the release. A held PR keeps auto-merge armed but nothing re-fires
# the gate for it, so when the bump PR closes (the release merging, or a train
# abandoned by closing it) this dispatches renovate-auto-approve.yml once per
# open renovate/ PR. Every condition is re-checked there, the freeze included.
#
# A dispatch that fails twice reds the run; re-running it is safe.
#
# All logic lives in the tested .github/scripts/renovate_release_thaw.py.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  thaw:
    name: Re-evaluate held Renovate PRs
    if: startsWith(github.event.pull_request.head.ref, 'bump-version')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # dispatch renovate-auto-approve.yml
      contents: read
      pull-requests: read
      statuses: read # gate-check on any other open bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Dispatch an approval re-evaluation per open Renovate PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_FREEZE: ${{ vars.RENOVATE_RELEASE_FREEZE }}
        run: python3 .github/scripts/renovate_release_thaw.py

name: Release Version Bump

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths-ignore:
      - "contract-toolkit/**"
      - "packages/conformance/**"

jobs:
  bump-version:
    # Only run when PR is merged (not when closed without merging)
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'bump-version')
    name: Update version and changelog
    runs-on: ubuntu-latest
    # Serialise bumps; a burst of merges coalesces into the newest pending run.
    # See release-version-bump.yaml for why this queues instead of cancelling.
    concurrency:
      group: release-version-bump-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --all-extras --all-groups
          pip install semver packaging

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Update version
        id: version_update
        env:
          # The commit the closed PR produced. release_guard sets skip=true when
          # it is not on origin/main: GitHub fires this workflow for a stacked
          # PR merging into its *parent feature branch* exactly as if it had
          # merged into main, and only ancestry tells the two apart (#3794).
          PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # Update the version
          python .github/scripts/release.py main ${{ env.CURRENT_VERSION }}
          uv lock

          # Get the new version
          NEW_VERSION=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update version.py
        # release.py sets skip=true when main already carries the version it
        # computed — this run is looking at a frozen merge ref that predates a
        # release which has already merged and published, so bumping again
        # would open a duplicate release PR (application-sdk#3570). Guarding
        # the mutating steps leaves the job green having done nothing.
        if: steps.version_update.outputs.skip != 'true'
        # In-place edit the ``__version__`` line only. The previous block
        # truncated the file and re-emitted a fixed 5-line template, which
        # wiped out anything else living alongside ``__version__`` (the
        # ``__dapr_version`` pin, its docstring, and any future SDK-internal
        # constants). A targeted ``sed`` keeps the bump working while
        # preserving everything around it.
        run: |
          set -euo pipefail
          sed -i 's/^__version__ = .*/__version__ = "${{ env.NEW_VERSION }}"/' application_sdk/version.py
          # Confirm exactly one line changed; bail if the constant moved or
          # was renamed, so a silent miss doesn't ship a broken bump.
          new=$(grep '^__version__' application_sdk/version.py | cut -d'"' -f2)
          if [[ "$new" != "${{ env.NEW_VERSION }}" ]]; then
            echo "::error::sed did not rewrite __version__ as expected (got '$new', want '${{ env.NEW_VERSION }}')"
            exit 1
          fi

      - name: Mint fleet App token
        # A real (non-github-actions[bot]) identity is required so the push
        # below re-fires the bump PR's required checks. This PR always needs
        # human/codeowner review regardless of author identity (GitHub blocks
        # self-approval, and no workflow auto-merges bump-version-* PRs), so
        # there's no bypass-actor dependency here to preserve.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      - name: Generate changelog
        id: changelog
        if: steps.version_update.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python .github/scripts/update_changelog.py "${{ env.CURRENT_VERSION }}" "${{ env.NEW_VERSION }}"

      # Same debounce as release-version-bump.yaml (FND-3322): a force-push is a
      # `synchronize` that re-runs all PR CI on the bump PR, so skip it when the
      # open branch already carries this version and these notes and still
      # merges cleanly. Fails open to push=true.
      - name: Decide whether the bump branch needs a push
        id: debounce
        if: steps.version_update.outputs.skip != 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python .github/scripts/release_bump_debounce.py \
            --branch "bump-version-${TARGET_BRANCH}" \
            --version-file pyproject.toml \
            --version-file application_sdk/version.py \
            --changelog CHANGELOG.md \
            --new-version "${NEW_VERSION}"

      - name: Commit and push bump branch
        if: steps.version_update.outputs.skip != 'true' && steps.debounce.outputs.push != 'false'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global user.name 'atlan-ci'
          git config --global user.email 'it@atlan.com'

          branch_name="bump-version-${TARGET_BRANCH}"
          git checkout -b "$branch_name"

          git add pyproject.toml uv.lock CHANGELOG.md application_sdk/version.py
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin "$branch_name" --force

      - name: Open or sync bump PR
        if: steps.version_update.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch_name="bump-version-${TARGET_BRANCH}"

          cat > "${RUNNER_TEMP}/bump-pr-body.md" <<EOF
          Automated version bump after merge to ${TARGET_BRANCH}.

          This PR updates:
          - pyproject.toml
          - uv.lock
          - application_sdk/version.py
          - CHANGELOG.md

          Version: ${CURRENT_VERSION} → ${NEW_VERSION}
          EOF

          # Upsert rather than create-or-skip. The bump branch is fixed and
          # force-pushed on each merge to main, so a bump PR that stays open
          # keeps accumulating commits — and the old `|| echo "already exists"`
          # left its title and body pinned to the first run's version while the
          # diff moved on. See upsert_release_pr.py; it also re-attaches the
          # `release` label, which tag-and-release.yaml gates on.
          python3 .github/scripts/upsert_release_pr.py \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${TARGET_BRANCH}" \
            --head "$branch_name" \
            --title "Bump version to ${NEW_VERSION}" \
            --body-file "${RUNNER_TEMP}/bump-pr-body.md" \
            --label "release"

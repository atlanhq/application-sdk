name: "Conformance SARIF Upload"
# application-sdk's own caller of conformance-upload-sarif-reusable.yaml — the
# same shape `bootstrap` writes into every consumer repo, differing only in the
# `slugs` list (the SDK runs six series a connector app does not) and in calling
# the reusable by its local path so a PR tests its own version of it.
#
# Uploads SARIF results from the Conformance workflow to the GitHub Security
# tab.  Runs as a separate workflow triggered by workflow_run so that it always
# exits 0 — GitHub Code Scanning marks a tool as "reporting errors" whenever
# the workflow that uploads SARIF fails, so the upload must be decoupled from
# the gate (which intentionally exits 1 on blocking violations).

on:
  workflow_run:
    workflows: ["Conformance"]
    types: [completed]
    branches: [main]

# A `permissions:` block is exhaustive, not additive: every scope it omits
# is `none`, whatever the repository default is. `contents: read` is
# therefore load-bearing — without it `actions/checkout` cannot read a
# private repo, the probe script is absent, and the job this workflow
# exists to keep green fails on exactly the 77 repos FND-1149 is about.
permissions:
  contents: read  # required to check out the availability probe script
  security-events: write
  actions: read  # required to download artifacts from the triggering run

jobs:
  upload:
    if: github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/conformance-upload-sarif-reusable.yaml
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      # Read the availability probe out of the same commit that produced these
      # results, not out of `main`: on this repo the two can differ, and the
      # script is this repo's own.
      sdk_ref: ${{ github.event.workflow_run.head_sha }}
      slugs: >-
        [{"slug": "ci", "name": "Upload CI SARIF"},
         {"slug": "error-handling", "name": "Upload Error-handling SARIF"},
         {"slug": "prescriptions", "name": "Upload Prescriptions SARIF"},
         {"slug": "preflight", "name": "Upload Preflight SARIF"},
         {"slug": "optimizations", "name": "Upload Optimizations SARIF"},
         {"slug": "dependency", "name": "Upload Dependency SARIF"},
         {"slug": "logging", "name": "Upload Logging SARIF"},
         {"slug": "tests", "name": "Upload Tests SARIF"},
         {"slug": "container-image", "name": "Upload Container-image SARIF"},
         {"slug": "deprecation", "name": "Upload Deprecation SARIF"},
         {"slug": "contract-toolkit", "name": "Upload Contract-toolkit SARIF"}]

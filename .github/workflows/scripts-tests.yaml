name: CI script tests

# Runs the pytest suite for the CI driver scripts in .github/scripts/, plus the
# shell tests for the PR-review scripts in .mothership/pr-review/scripts/.
# These scripts carry the conditional logic for our automations (release
# bumps, allowlist validation, renovate sync, …); per docs/standards/ci.md
# that logic must live in tested external scripts rather than inlined shell.
# Until this workflow existed, .github/scripts/tests/ ran nowhere in CI.
#
# Deliberately NOT path-filtered, even though most of the suite only covers
# .github/scripts/. Some of these tests are cross-file guards that read YAML
# living outside that directory and assert a property of it:
#
#   * test_every_env_write_call_site_masks_first / test_call_sites_are_the_expected_files
#     read every .github/**/*.y*ml that invokes export_extra_env.py and fail if
#     one writes $GITHUB_ENV without masking the values first (a credential leak
#     — see docs/standards/ci.md).
#   * test_composite_action_invokes_this_script_at_a_real_path resolves the
#     script paths inside .github/actions/*/action.yaml.
#
# A filter would have to enumerate every file those guards inspect and stay in
# sync with every call site added later — which is precisely the bookkeeping the
# guards exist to remove. Any list we could write would silently stop firing on
# the change it was written to catch. The suite is a sub-minute pytest run, so
# running it unconditionally is cheaper than getting that list wrong.
#
# The .mothership/pr-review/scripts/ tests are here for the same reason the
# pytest suite is: they existed and ran nowhere. A redaction rule that rewrote
# the machine-readable REVIEWED_HEAD marker shipped unnoticed and silently cost
# every toolkit review its atlan-ci approval, because the test that would have
# caught it was only ever run by hand.
#
# Both jobs conclude on every PR (no path filter), so both can be required
# checks on the `main` ruleset without the always-concluding-gate wrapper that
# path-filtered ones need (see sdk-gate.yaml). Required contexts (FND-4245):
#   * "pytest .github/scripts/tests"
#   * "pyright .github/scripts"
#
# The pyright job exists because [tool.pyright] excludes .github/**, so the
# pre-commit pyright hook never sees these scripts. It holds pyright's findings
# to .github/scripts/pyright_baseline.json, per file and per rule, and fails if
# a count rises (a new finding) or falls without the baseline being lowered
# (unlocked slack). See docs/standards/ci.md.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest .github/scripts/tests
    # A bump-version PR only moves version strings, the lock and CHANGELOG —
    # never .github/scripts — and its CI is opt-in (FND-3748), so this never
    # runs there. Skipped reports as a pass; SDK Gate is what blocks the merge.
    if: ${{ !startsWith(github.head_ref, 'bump-version') }}
    runs-on: ubuntu-latest
    # The job runs ~3-4 minutes; without a cap a hung test holds a runner for
    # the 360-minute default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # pytest comes from the locked `test` group (a default group, as is
      # `dev`, which carries the conformance workspace package several of these
      # tests import). `--with pytest` resolved the newest pytest from PyPI on
      # every run: unpinned, and outside the release-age cooldown the lock is
      # held to.
      - name: Run script tests
        run: uv run --frozen --extra workflows python -m pytest .github/scripts/tests -q

      # Plain bash, no uv — the script under test is bash + perl and the harness
      # asserts on its output, so keeping it dependency-free keeps it runnable
      # by hand in the review sandbox exactly as it runs here.
      - name: Run PR-review redaction tests
        run: .mothership/pr-review/scripts/test-redact-toolkit-public-review.sh

  pyright:
    name: pyright .github/scripts
    # Same reasoning as the pytest job: a bump-version PR never touches
    # .github/scripts, and a skip reports as a pass.
    if: ${{ !startsWith(github.head_ref, 'bump-version') }}
    runs-on: ubuntu-latest
    # pyright over .github/scripts takes well under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # pyright is the exact pin in the locked `dev` group, equal to the
      # pre-commit hook's rev. `--extra workflows` installs what the scripts
      # import, so pyright resolves them instead of reporting missing imports.
      # --base-sha also holds the PR's baseline to the base revision's, so a PR
      # cannot add a finding and raise the baseline to match in one change.
      - name: Check pyright findings against the baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen --extra workflows python .github/scripts/check_pyright_baseline.py --base-sha "$BASE_SHA"

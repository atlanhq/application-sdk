name: CI script tests

# Runs the pytest suite for the CI driver scripts in .github/scripts/.
# These scripts carry the conditional logic for our automations (release
# bumps, allowlist validation, renovate sync, …); per docs/standards/ci.md
# that logic must live in tested external scripts rather than inlined shell.
# Until this workflow existed, .github/scripts/tests/ ran nowhere in CI.
#
# Deliberately NOT path-filtered, even though most of the suite only covers
# .github/scripts/. Some of these tests are cross-file guards that read YAML
# living outside that directory and assert a property of it:
#
#   * test_every_env_write_call_site_masks_first / test_call_sites_are_the_expected_files
#     read every .github/**/*.y*ml that invokes export_extra_env.py and fail if
#     one writes $GITHUB_ENV without masking the values first (a credential leak
#     — see docs/standards/ci.md).
#   * test_composite_action_invokes_this_script_at_a_real_path resolves the
#     script paths inside .github/actions/*/action.yaml.
#
# A filter would have to enumerate every file those guards inspect and stay in
# sync with every call site added later — which is precisely the bookkeeping the
# guards exist to remove. Any list we could write would silently stop firing on
# the change it was written to catch. The suite is a sub-minute pytest run, so
# running it unconditionally is cheaper than getting that list wrong.
#
# Not a *required* check yet. Now that it is unfiltered it can safely become one:
# add it to branch protection (it concludes on every PR, so it will not sit
# pending). The always-concluding-gate pattern in sdk-gate.yaml is no longer
# needed for this workflow, but is still the right shape for path-filtered ones.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest .github/scripts/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"

      - name: Run script tests
        run: uv run --extra workflows --with pytest python -m pytest .github/scripts/tests -q

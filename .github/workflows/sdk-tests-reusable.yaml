name: SDK tests (reusable)

# Reusable workflow: the SDK's own unit + integration + storage-emulator tests.
#
# Invoked only by sdk-gate.yaml, which gates the *whole call* on
# "SDK area changed OR force-all (release / version-bump / v* tag)".  Because
# the call is gated upstream, the jobs here carry no per-job change-detection
# `if:` guards — when the SDK area is untouched the orchestrator skips this
# entire reusable and the composing gate counts a skipped area as a pass.
#
# The integration tier (Integration Tests, Storage Emulator Tests) runs in the
# merge queue, on v* tags, and on a PR commit someone asked for with `/e2e` or
# `/gate-check`; `integration-request` below decides. That is the split
# connectors use (tests-reusable.yaml, docs/standards/ci.md). The queue runs
# the full suite on the exact merged state before anything lands, so a PR-side
# run on every push only repeated it (FND-4306).
#
# Deliberately NOT built on tests-reusable.yaml: that workflow is
# connector-shaped (app-name required, e2e scaffold, no OS matrix).  The SDK's
# own tests need the OS x Python matrix + object-store emulators, so they live
# here as a dedicated SDK reusable.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    # 15, matching the integration jobs below. Measured over 92 Windows unit
    # legs, they run p50 447s / p90 527s against what was a 600s cap — a p90 at
    # 88% of the ceiling, so an ordinarily-slow runner crosses it. Two legs were
    # killed mid-suite that way; the job reports `cancelled`, not `failure`,
    # which reads as CI noise rather than as a timeout. In the merge queue that
    # ejects the PR. Linux and macOS sit near 350s and have never been close.
    # This is headroom, not a fix — why Windows is slower is FND-346.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-22.04, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint fleet App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          # This workflow is only ever called locally by sdk-gate.yaml (same
          # repo), so a literal name matches build-and-scan.yaml's identical
          # security-gate mint rather than a context expression that could
          # silently widen scope for a future empty-context caller.
          repositories: application-sdk
      - uses: "./.github/actions/unit-tests"
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.ORG_PAT_GITHUB }}
          fail-under: "85"
          python-version: ${{ matrix.python-version }}
          # One leg measures coverage; it posts the PR comment and enforces
          # fail-under. Tracing under xdist cost every other leg ~20-30% of its
          # wall time for a report nobody read (FND-4238).
          coverage: ${{ matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12' }}

  unit-perf:
    name: Unit Perf Tests
    # Tests marked `perf` (excluded from the matrix by addopts): throughput
    # comparisons and 100k-key scale probes. They took ~2 minutes of every
    # matrix leg's critical path, and a timing comparison next to three xdist
    # neighbours is a flake by construction. Here they run once, in one
    # process, on a quiet box (FND-4238).
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container's Python, for the same reason as the integration job:
      # the concurrent-decode regression in this set (CNCT-85) is most
      # meaningful on the interpreter the image ships.
      - name: Resolve container Python version
        id: pyver
        run: echo "version=$(python3 .github/scripts/container_python_version.py print-version)" >> "$GITHUB_OUTPUT"
      - uses: "./.github/actions/setup-deps"
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - name: Run perf tests
        env:
          ATLAN_ENABLE_OBSERVABILITY_DAPR_SINK: "false"
        run: uv run --frozen pytest --import-mode=importlib tests/unit -m perf --disable-socket --allow-unix-socket --timeout=300 --durations=0

  python-version-guard:
    name: Container Python is in the unit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fail loudly if the container's Python (the Dockerfile golden tag) ever
      # drifts outside the versions the unit matrix above exercises — otherwise
      # the shipped interpreter could go untested. The matrix list is repeated
      # here because GitHub Actions cannot share a `strategy.matrix` literal
      # across jobs; keep it in sync with the `unit` job above.
      - name: Assert container Python is covered by the unit matrix
        run: |
          VERSION=$(python3 .github/scripts/container_python_version.py print-version)
          python3 .github/scripts/container_python_version.py check-matrix --expected "$VERSION" --matrix "3.11,3.12,3.13,3.14"

  script-tests:
    name: Script Tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"
      # A pinned bats-core checkout instead of `apt-get update && apt-get
      # install` on every run. After setup-deps, whose checkout would clean an
      # untracked directory away.
      - name: Check out bats-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bats-core/bats-core
          ref: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
          path: .bats-core
          persist-credentials: false
      - name: Put bats on PATH
        run: echo "${GITHUB_WORKSPACE}/.bats-core/bin" >> "$GITHUB_PATH"
      - name: Run shell script tests
        run: uv run poe test-scripts

  # Decides whether the integration tier runs (FND-4306). Only the two tier
  # jobs need it, so `/e2e` re-runs this job alone (pr_test_command.py,
  # SDK_E2E_RERUN_JOBS) and the tier and SDK Gate's verdict re-run with it,
  # while the unit legs keep their result. It reads the `/e2e` and
  # `/gate-check` markers live because a re-run replays the original payload.
  integration-request:
    name: Decide integration request
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      requested: ${{ steps.decide.outputs.requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/bump_pr_opt_in.py integration-requested --event "$EVENT_NAME" --sha "$HEAD_SHA"

  integration:
    name: Integration Tests
    # Queue, tags and on-demand PR runs only; see the header (FND-4306).
    needs: integration-request
    if: needs.integration-request.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Integration exercises real worker/decode code paths, so it must run on
      # the SAME interpreter the runtime container ships — the golden base tag
      # in the Dockerfile — not the setup-deps default (3.11). A concurrent-
      # decode segfault (CNCT-85) reproduces only on the container's Python;
      # running integration on a different minor would silently miss that class
      # of bug. Read from the one place the version is declared (the Dockerfile).
      - name: Resolve container Python version
        id: pyver
        run: echo "version=$(python3 .github/scripts/container_python_version.py print-version)" >> "$GITHUB_OUTPUT"
      - uses: "./.github/actions/setup-deps"
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      # Temporal and Dapr are provisioned in-process by the SDK's own embedded
      # dev helpers (application_sdk.dev.embedded_runtime / embedded_dapr) — the
      # same code path local development uses — so this job no longer installs
      # or starts a standalone Temporal CLI or daprd. The Temporal dev-server
      # version now follows the `temporalio` dep in uv.lock and the daprd
      # version follows `__dapr_version` (application_sdk/version.py), so there
      # is no separate CLI version pin to keep in sync.
      #
      # Both helpers fetch their binary to ~/.cache on first use; cache those
      # paths across runs so we don't re-download every time.
      - name: Cache embedded runtime binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/atlan-sdk/temporal
            ~/.cache/atlan-sdk/dapr
          key: embedded-runtimes-${{ runner.os }}-${{ hashFiles('uv.lock', 'application_sdk/version.py') }}
          restore-keys: |
            embedded-runtimes-${{ runner.os }}-

      - name: Run integration tests
        run: uv run pytest tests/integration/ -m integration -v --timeout=120 --reruns 2 --reruns-delay 5 --only-rerun "ConnectError|ConnectionError|ClientConnectorError|TimeoutError|ReadTimeout"

  storage-emulator:
    name: Storage Emulator Tests
    # Queue, tags and on-demand PR runs only; see the header (FND-4306).
    needs: integration-request
    if: needs.integration-request.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # Our own GHCR copy of Chainguard's MinIO, pinned by tag AND digest (the
      # digest wins). Never point this at a vendor registry: MinIO's images
      # vanished from Docker Hub and then quay.io within one month, digest and
      # all, and Chainguard may withdraw theirs too. To adopt a newer MinIO,
      # dispatch "Refresh MinIO CI mirror" (mirror-minio-image.yaml) and paste
      # the reference it prints here and in the test_emulator_*.py docstrings.
      # The package is private (we do not redistribute the image), readable by
      # this repo's GITHUB_TOKEN via the package's "Manage Actions access".
      MINIO_IMAGE: ghcr.io/atlanhq/ci-mirror/minio:RELEASE.2026-09-22T19-25-18Z@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
      # The other three are public images, pinned by tag AND digest so a
      # re-pushed tag cannot change what CI runs (nginx:1.27-alpine is a
      # floating tag). Update tag and digest together.
      AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:3.31.0@sha256:d449d953a1c5bd1e26c800744a65c451e88f3387b696e02e3e2e79a995c3105b
      GCS_TESTBENCH_IMAGE: gcr.io/cloud-devrel-public-resources/storage-testbench:v0.62.0@sha256:4d7713db9282234cb64a65e54f872bd7059f9793a94232dd9bd51b2be56b223f
      NGINX_IMAGE: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"

      - name: Log in to GHCR (private MinIO mirror)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start object-store emulators
        run: |
          set -euo pipefail
          # Pull images first with retry — image pulls are the main 504 surface.
          # with-retry.sh retries a failed pull but cannot see a stalled one, so
          # each attempt is bounded by `timeout 120`.
          # Use ${GITHUB_WORKSPACE} (not a bare relative path) to match the style
          # used in composite actions and stay correct if CWD ever changes.
          # MinIO comes from our private GHCR mirror (see MINIO_IMAGE above).
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" timeout 120 docker pull "${MINIO_IMAGE}"
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" timeout 120 docker pull "${AZURITE_IMAGE}"
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" timeout 120 docker pull "${GCS_TESTBENCH_IMAGE}"
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" timeout 120 docker pull "${NGINX_IMAGE}"
          # S3 → MinIO
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            "${MINIO_IMAGE}" server /data
          # Azure → Azurite
          docker run -d --name azurite -p 10000:10000 \
            "${AZURITE_IMAGE}" \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          # GCS → storage-testbench behind an nginx proxy that re-injects the
          # ETag / Last-Modified headers testbench omits (obstore requires them).
          docker network create gcs-net
          docker run -d --name gcs-testbench --network gcs-net -e PORT=9000 \
            "${GCS_TESTBENCH_IMAGE}"
          docker run -d --name gcs-proxy --network gcs-net -p 9095:9000 \
            -v "$PWD/tests/integration/storage/gcs_emulator_proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            "${NGINX_IMAGE}"

      # Fails the job when an emulator never answers or a bucket cannot be
      # created, instead of handing the tests a half-started harness.
      - name: Wait for emulators + provision buckets/container
        run: python3 .github/scripts/wait_for_emulators.py

      - name: Run storage emulator tests
        env:
          AWS_ENDPOINT_URL: http://localhost:9000
          AZURE_STORAGE_ENDPOINT: http://localhost:10000
          GCS_EMULATOR_ENDPOINT: http://localhost:9095
          # The emulators were started above: an unreachable one fails its
          # tests instead of skipping them (tests/integration/storage/conftest.py).
          STORAGE_EMULATOR_REQUIRED: "1"
        run: uv run pytest tests/integration/storage -m storage_emulator -v --timeout=300 --reruns 2 --reruns-delay 5 --only-rerun "ConnectError|ConnectionError|ClientConnectorError|TimeoutError|ReadTimeout"

      - name: Teardown emulators
        if: always()
        run: docker rm -f minio azurite gcs-testbench gcs-proxy 2>/dev/null || true

name: SDK tests (reusable)

# Reusable workflow: the SDK's own unit + integration + storage tests, both
# against emulators (every SDK PR) and against real S3 / Azure / GCS (merge
# queue only — see the storage-integration job at the foot of this file).
#
# Invoked only by sdk-gate.yaml, which gates the *whole call* on
# "SDK area changed OR force-all (release / version-bump / v* tag)".  Because
# the call is gated upstream, the jobs here carry no per-job change-detection
# `if:` guards — when the SDK area is untouched the orchestrator skips this
# entire reusable and the composing gate counts a skipped area as a pass.
#
# Deliberately NOT built on tests-reusable.yaml: that workflow is
# connector-shaped (app-name required, e2e scaffold, no OS matrix).  The SDK's
# own tests need the OS x Python matrix + object-store emulators, so they live
# here as a dedicated SDK reusable.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    # 15, matching the integration jobs below. Measured over 92 Windows unit
    # legs, they run p50 447s / p90 527s against what was a 600s cap — a p90 at
    # 88% of the ceiling, so an ordinarily-slow runner crosses it. Two legs were
    # killed mid-suite that way; the job reports `cancelled`, not `failure`,
    # which reads as CI noise rather than as a timeout. In the merge queue that
    # ejects the PR. Linux and macOS sit near 350s and have never been close.
    # This is headroom, not a fix — why Windows is slower is FND-346.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-22.04, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint fleet App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          # This workflow is only ever called locally by sdk-gate.yaml (same
          # repo), so a literal name matches build-and-scan.yaml's identical
          # security-gate mint rather than a context expression that could
          # silently widen scope for a future empty-context caller.
          repositories: application-sdk
      - uses: "./.github/actions/unit-tests"
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.ORG_PAT_GITHUB }}
          fail-under: "85"
          python-version: ${{ matrix.python-version }}

  python-version-guard:
    name: Container Python is in the unit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fail loudly if the container's Python (the Dockerfile golden tag) ever
      # drifts outside the versions the unit matrix above exercises — otherwise
      # the shipped interpreter could go untested. The matrix list is repeated
      # here because GitHub Actions cannot share a `strategy.matrix` literal
      # across jobs; keep it in sync with the `unit` job above.
      - name: Assert container Python is covered by the unit matrix
        run: |
          VERSION=$(python3 .github/scripts/container_python_version.py print-version)
          python3 .github/scripts/container_python_version.py check-matrix --expected "$VERSION" --matrix "3.11,3.12,3.13,3.14"

  script-tests:
    name: Script Tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - uses: "./.github/actions/setup-deps"
      - name: Run shell script tests
        run: uv run poe test-scripts

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Integration exercises real worker/decode code paths, so it must run on
      # the SAME interpreter the runtime container ships — the golden base tag
      # in the Dockerfile — not the setup-deps default (3.11). A concurrent-
      # decode segfault (CNCT-85) reproduces only on the container's Python;
      # running integration on a different minor would silently miss that class
      # of bug. Read from the one place the version is declared (the Dockerfile).
      - name: Resolve container Python version
        id: pyver
        run: echo "version=$(python3 .github/scripts/container_python_version.py print-version)" >> "$GITHUB_OUTPUT"
      - uses: "./.github/actions/setup-deps"
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      # Temporal and Dapr are provisioned in-process by the SDK's own embedded
      # dev helpers (application_sdk.dev.embedded_runtime / embedded_dapr) — the
      # same code path local development uses — so this job no longer installs
      # or starts a standalone Temporal CLI or daprd. The Temporal dev-server
      # version now follows the `temporalio` dep in uv.lock and the daprd
      # version follows `__dapr_version` (application_sdk/version.py), so there
      # is no separate CLI version pin to keep in sync.
      #
      # Both helpers fetch their binary to ~/.cache on first use; cache those
      # paths across runs so we don't re-download every time.
      - name: Cache embedded runtime binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/atlan-sdk/temporal
            ~/.cache/atlan-sdk/dapr
          key: embedded-runtimes-${{ runner.os }}-${{ hashFiles('uv.lock', 'application_sdk/version.py') }}
          restore-keys: |
            embedded-runtimes-${{ runner.os }}-

      - name: Run integration tests
        run: uv run pytest tests/integration/ -m integration -v --timeout=120 --reruns 2 --reruns-delay 5 --only-rerun "ConnectError|ConnectionError|ClientConnectorError|TimeoutError|ReadTimeout"

  storage-emulator:
    name: Storage Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"

      - name: Start object-store emulators
        run: |
          set -euo pipefail
          # Pull images first with retry — image pulls are the main 504 surface.
          # Use ${GITHUB_WORKSPACE} (not a bare relative path) to match the style
          # used in composite actions and stay correct if CWD ever changes.
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" docker pull minio/minio:RELEASE.2025-09-07T16-13-09Z
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" docker pull mcr.microsoft.com/azure-storage/azurite:3.31.0
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" docker pull gcr.io/cloud-devrel-public-resources/storage-testbench:v0.62.0
          "${GITHUB_WORKSPACE}/.github/scripts/with-retry.sh" docker pull nginx:1.27-alpine
          # S3 → MinIO
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          # Azure → Azurite
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.31.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          # GCS → storage-testbench behind an nginx proxy that re-injects the
          # ETag / Last-Modified headers testbench omits (obstore requires them).
          docker network create gcs-net || true
          docker run -d --name gcs-testbench --network gcs-net -e PORT=9000 \
            gcr.io/cloud-devrel-public-resources/storage-testbench:v0.62.0
          docker run -d --name gcs-proxy --network gcs-net -p 9095:9000 \
            -v "$PWD/tests/integration/storage/gcs_emulator_proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for emulators + provision buckets/container
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 30); do curl -s --max-time 2 http://localhost:10000/devstoreaccount1 >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 40); do curl -sf "http://localhost:9095/storage/v1/b?project=test" >/dev/null 2>&1 && break; sleep 2; done
          export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_DEFAULT_REGION=us-east-1
          # Provisioning is idempotent (|| true) so a step re-run on a still-warm
          # runner doesn't abort on "bucket already exists" under set -e.
          aws --endpoint-url http://localhost:9000 s3 mb s3://sdk-emulator-test || true
          # SDR ENABLE_ATLAN_UPLOAD handoff: customer-managed + internal Atlan buckets.
          aws --endpoint-url http://localhost:9000 s3 mb s3://sdk-customer-objectstore || true
          aws --endpoint-url http://localhost:9000 s3 mb s3://sdk-atlan-objectstore || true
          az storage container create --name sdk-emulator-test \
            --connection-string "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;" || true
          curl -sf -X POST "http://localhost:9095/storage/v1/b?project=test" \
            -H "Content-Type: application/json" -d '{"name":"sdk-emulator-test"}' || true

      - name: Run storage emulator tests
        env:
          AWS_ENDPOINT_URL: http://localhost:9000
          AZURE_STORAGE_ENDPOINT: http://localhost:10000
          GCS_EMULATOR_ENDPOINT: http://localhost:9095
        run: uv run pytest tests/integration/storage -m storage_emulator -v --timeout=300 --reruns 2 --reruns-delay 5 --only-rerun "ConnectError|ConnectionError|ClientConnectorError|TimeoutError|ReadTimeout"

      - name: Teardown emulators
        if: always()
        run: docker rm -f minio azurite gcs-testbench gcs-proxy 2>/dev/null || true

  # Real-cloud storage integration tests (S3 / Azure / GCS) — exercise
  # create_store_from_binding + CloudStore against real buckets/vaults using the
  # *_integration markers (excluded from default addopts; conftest skips when a
  # cloud's creds are absent). The emulator job above is the same code against
  # fakes; this one is the only thing that exercises real IAM, real federation
  # and real multipart behaviour. Nightly counterpart lives in schedule.yaml.
  #
  # Lives here, in the SDK Tests area, so it rolls up into the `SDK Gate`
  # required check like every other SDK test — rather than as a standalone
  # context nothing requires. It was previously a job in pull_request.yaml gated
  # on a `storage-integration` label: opt-in, therefore ~never run, so a change
  # that rewrote both download paths could reach main without one real-cloud
  # request.
  #
  # merge_group only, and that `if:` is load-bearing in two directions:
  #   - A fork PR's token cannot obtain OIDC federation into any of the three
  #     clouds, so running this on `pull_request` would red the SDK Gate for
  #     every external contributor.
  #   - Even for internal PRs it would put shared buckets on the hot path of
  #     every push. ~3 minutes once per merge-queue entry is the whole cost.
  # A skipped job does not fail the reusable, so the PR-side gate stays green.
  storage-integration:
    name: Storage Integration Tests (S3 / Azure / GCS)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keyless: all three clouds authenticate via GitHub OIDC (no static secrets).
    # Resource identifiers are non-secret repo variables (vars.*_INTEG_*).
    #
    # A job-level block REPLACES the workflow-level one rather than extending it,
    # so contents:read is restated here for the checkout. id-token is never
    # granted by a repo default at any setting — sdk-gate.yaml's `sdk-tests`
    # calling job must also declare it, or these three logins fail with an
    # opaque OIDC error rather than a permissions one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"
      - name: AWS — assume the integration role (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INTEG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_INTEG_REGION }}
      - name: Azure — login (OIDC federated, no secret)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.AZURE_INTEG_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_INTEG_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_INTEG_SUBSCRIPTION_ID }}
      - name: GCS — Workload Identity Federation (sets ADC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_INTEG_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INTEG_SA }}
      - name: Azure — write the federated token file for obstore WI auth
        run: |
          set -euo pipefail
          # Mint into a throwaway file and only publish it on success, so a failed
          # mint/parse can't leave a zero-byte token that yields an opaque AAD
          # error downstream instead of a clear "OIDC mint failed". --fail-with-body
          # makes curl exit non-zero on a non-2xx (still printing the body to debug).
          tmp="$(mktemp)"
          curl --fail-with-body -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | python3 -c 'import sys,json;sys.stdout.write(json.load(sys.stdin)["value"])' \
            > "$tmp"
          mv "$tmp" "${RUNNER_TEMP}/azure-federated-token"
      - name: Run storage integration tests (keyless)
        env:
          # AWS: ambient creds (AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN) set by the OIDC step.
          S3_BUCKET: ${{ vars.S3_INTEG_BUCKET }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_INTEG_REGION }}
          # Azure: federated workload identity (shared-key is disabled on the account).
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_INTEG_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_INTEG_CONTAINER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_INTEG_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_INTEG_TENANT_ID }}
          AZURE_FEDERATED_TOKEN_FILE: ${{ runner.temp }}/azure-federated-token
          # GCS: ADC (GOOGLE_APPLICATION_CREDENTIALS) set by the WIF step.
          GCS_BUCKET: ${{ vars.GCS_INTEG_BUCKET }}
          GCS_PROJECT_ID: ${{ vars.GCS_INTEG_PROJECT_ID }}
        run: |
          uv run pytest tests/integration/storage/ \
            -m "s3_integration or azure_integration or gcs_integration" \
            -v --timeout=60

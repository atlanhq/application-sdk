# Update Security Dashboard — reusable workflow. RETIRED, kept for transition.
#
# Superseded by update-fleet-dashboards.yaml (FND-3337), which pulls all three
# dashboards below for the whole fleet on a schedule. Bootstrap no longer
# installs the per-repo `update-dashboard.yml` shim that calls this, and
# `bootstrap --resync` deletes existing copies (RETIRED_FILES). This file stays
# only so a repo that has not resynced yet keeps working rather than failing
# at startup. Delete it once no fleet repo still carries the shim. Do not add
# callers.
#
# While both run, they write the same S3 keys. That is harmless: the docs have
# the same shape, and both history paths keep one line per date.
#
# The security (Trivy) and conformance jobs are gone (FND-3462). Nothing reads
# k.atlan.dev/security-dashboard any more, and Connector Pulse reads the
# agent-sdk fleet conformance ledger instead of k.atlan.dev/conformance-dashboard.
# The central collector stopped publishing both, so a shim that has not resynced
# must not keep refreshing them; only test-readiness remains. `dashboard_path`
# and `scan_workflow` are now unused but stay declared, because a shim that
# still passes them would otherwise fail at startup.
#
name: Update Security Dashboard

on:
  workflow_call:
    inputs:
      dashboard_path:
        description: "S3 path for dashboard deployment"
        required: false
        type: string
        default: "security-dashboard"
      scan_workflow:
        description: "Name of the scan workflow file to download artifacts from"
        required: false
        type: string
        default: "vulnerability-scan.yml"
    secrets:
      ORG_PAT_GITHUB:
        required: false
      FLEET_APP_ID:
        required: false
        description: "atlan-app-fleet App ID (org secret). Not passed explicitly by any current caller — auto-available via 'secrets: inherit'. Declared here so the contract is self-documenting."
      FLEET_APP_PRIVATE_KEY:
        required: false
        description: "atlan-app-fleet App private key (org secret). Same availability as FLEET_APP_ID above."

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  test-readiness:
    name: Update Test-Readiness Dashboard
    # Runs for all triggers on the default branch (same gate as conformance).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # Serialize so the history download→merge→upload sequence never races itself.
    concurrency:
      group: test-readiness-dashboard-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout SDK scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          path: _sdk
          sparse-checkout: .github/scripts
          token: ${{ secrets.ORG_PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Discover latest Tests run
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The scorecard is produced per-run by the Tests workflow's `scorecard`
          # aggregation job (it combines the unit + integration tiers' evidence
          # and uploads results/test-readiness.json as the test-readiness-scorecard
          # artifact).
          #
          # Pick the newest run that STILL HAS the scorecard, not simply the
          # newest run. Taking `.[0]` blindly meant that whenever the most recent
          # Tests run had no scorecard (it died before the aggregation job, or the
          # artifact expired), the download below found nothing, every later step
          # no-opped on its hashFiles() gate, and the JOB STILL REPORTED SUCCESS —
          # so the repo never reached the dashboard and nothing anywhere said so.
          # Confirmed against atlan-athena-app: its publish job succeeded on
          # 2026-08-05 while `test-readiness-dashboard/repos/atlanhq_atlan-athena-app.json`
          # was absent from the mirror.
          CANDIDATES=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=tests.yaml \
            --status=completed \
            --branch="${{ github.event.repository.default_branch || 'main' }}" \
            --limit=20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success" or .conclusion=="failure")] | .[].databaseId')

          # Matches the retry name too. When the scorecard upload's first
          # attempt hits the artifact service's finalize 403, the retry has to
          # upload under `test-readiness-scorecard-retry` (a same-named retry
          # 409s — see that step), so a run whose scorecard landed on the
          # second attempt is only discoverable under that name. The name that
          # actually matched is carried forward, so the download stays a
          # single-artifact one and keeps its flat directory layout.
          RUN_ID=""
          ARTIFACT_NAME=""
          for candidate in ${CANDIDATES}; do
            FOUND_NAME=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${candidate}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name == "test-readiness-scorecard" or .name == "test-readiness-scorecard-retry")] | sort_by(.created_at) | last | .name // ""' \
              2>/dev/null || echo "")
            if [ -n "${FOUND_NAME}" ]; then
              RUN_ID="${candidate}"
              ARTIFACT_NAME="${FOUND_NAME}"
              echo "Run ${candidate} has a live ${FOUND_NAME} — using it"
              break
            fi
            echo "Run ${candidate} has no live scorecard — trying older"
          done

          if [ -z "${RUN_ID}" ]; then
            echo "::warning::No Tests run with a live test-readiness-scorecard in the last 20 completed runs — skipping test-readiness dashboard update"
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download test-readiness artifact
        if: steps.discover.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.discover.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p scorecard-dl
          # No `|| true` here any more. discover only emits a run_id once it has
          # CONFIRMED that run carries a live scorecard, so a failure to download
          # it is a real error (token scope, network, artifact deleted mid-run) —
          # not the routine "nothing to publish" case discover already handles by
          # emitting an empty run_id. Swallowing it here is what turned a broken
          # upload into a green no-op.
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" \
            --dir scorecard-dl

      - name: Build history entry
        if: hashFiles('scorecard-dl/test-readiness.json') != ''
        run: |
          set -euo pipefail
          python3 _sdk/.github/scripts/scorecard_history_entry.py \
            --scorecard scorecard-dl/test-readiness.json \
            --date "$(date -u +%Y-%m-%d)" \
            --out /tmp/tr_history_entry.jsonl

      - name: Setup AWS Credentials
        if: hashFiles('scorecard-dl/test-readiness.json') != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::733936409301:role/kryptonite-store_FullAccess

      - name: Deploy to Kryptonite (test-readiness)
        if: hashFiles('scorecard-dl/test-readiness.json') != ''
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          SLUG=$(echo "$REPO_SLUG" | tr '/' '_')
          PREFIX="test-readiness-dashboard"

          # Per-repo scorecard — uploaded verbatim; it is already the per-repo doc
          # (the CLI emits exactly the shape connector-pulse ingests).
          aws s3 cp "scorecard-dl/test-readiness.json" \
            "s3://kryptonite-store/${PREFIX}/repos/${SLUG}.json"

          # Regenerate the manifest of all repo files present in S3.
          aws s3 ls "s3://kryptonite-store/${PREFIX}/repos/" \
            | grep '\.json$' | awk '{print $4}' \
            | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" \
            > /tmp/tr_repos.json
          aws s3 cp /tmp/tr_repos.json \
            "s3://kryptonite-store/${PREFIX}/repos.json"

          # Append history (download existing → merge → re-upload; sort -u dedups
          # same-day reruns — identical to the conformance/Trivy history path).
          HISTORY_FILE="history/${SLUG}.jsonl"
          aws s3 cp "s3://kryptonite-store/${PREFIX}/${HISTORY_FILE}" \
            /tmp/tr_existing_history.jsonl 2>/dev/null || true
          # First run for this repo has no history object yet, so the cp above
          # no-ops without creating the file. Ensure it exists (empty) so the
          # cat below does not exit 1 under `set -euo pipefail` and abort the
          # step before the merged history is uploaded.
          touch /tmp/tr_existing_history.jsonl
          cat /tmp/tr_existing_history.jsonl /tmp/tr_history_entry.jsonl 2>/dev/null \
            | sort -u > /tmp/tr_merged_history.jsonl
          aws s3 cp /tmp/tr_merged_history.jsonl \
            "s3://kryptonite-store/${PREFIX}/${HISTORY_FILE}"

          echo "Test-readiness dashboard updated: https://k.atlan.dev/${PREFIX}/"

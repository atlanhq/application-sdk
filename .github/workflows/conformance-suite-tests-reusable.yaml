name: Conformance suite tests (reusable)

# Reusable workflow: the conformance PACKAGE's own pytest unit tests
# (packages/conformance/tests/).
#
# This is distinct from conformance-reusable.yaml, which runs the conformance
# RULE detection (`detect --series …`) against a repo. This workflow runs the
# suite package's *own* unit tests.
#
# Invoked only by sdk-gate.yaml, gated on packages/conformance/** — so a change
# to the package's source or its own pyproject.toml re-runs these tests.
# Previously they were only exercised on merge/publish (conformance-publish.yml),
# never on PRs.
#
# Runs against THIS tree's SDK, not a release: packages/conformance is a member
# of the root uv workspace (FND-4671), so its `test` extra's
# atlan-application-sdk is the workspace root, installed editable, and the root
# uv.lock is the only lock. tests/test_app_name_alignment.py fails if
# application_sdk is imported from anywhere else (FND-4256). Its parity tests
# compare conformance's copies of SDK helpers against that import, so a PyPI pin
# would check an old release.
#
# SDK-private: no consumer app references this workflow.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  suite-tests:
    name: Suite unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Run conformance package unit tests
        working-directory: packages/conformance
        run: |
          set -euo pipefail
          # Run from the package directory, uv selects this workspace member:
          # its own dependencies, its `test` extra (pytest, pytest-asyncio and
          # the SDK editable) and its default `dev` group (ruff), from the root
          # uv.lock. Not --all-groups: in a workspace that also installs every
          # root group (docs, pyright, ...), which these tests do not use.
          # --locked fails on a lock that no longer matches the workspace.
          uv sync --locked --extra test
          uv run --locked --extra test pytest -v

      # pytest above already fails on a count above or below
      # ruff_complexity_baseline.json; this adds the check pytest cannot make:
      # that the baseline itself was not raised over the PR's base (FND-4668).
      # BASE_SHA is empty outside pull_request / merge_group, and the script
      # then skips the base comparison.
      - name: Complexity baseline not raised over base
        working-directory: packages/conformance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: uv run --frozen --extra test python tests/test_complexity_baseline.py --base-sha "$BASE_SHA"

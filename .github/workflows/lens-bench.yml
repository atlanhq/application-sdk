name: lens bench
run-name: "lens bench (${{ inputs.label || 'manual' }})"

# Reviews every case in .github/lens/bench/cases fresh with the lens on this branch,
# scores each against its answer key, and shows the table on this job's summary page.
# Nothing is posted to any PR. Run it before and after a change to lens to see whether
# recall, precision and severity calibration moved.
#
# Security: runs only on manual dispatch, checks out this repository's code (no PR code),
# reads commits through the API, and holds the model key only for the bench step.

on:
  workflow_dispatch:
    inputs:
      label:
        description: A name for this run (shown in the run title), e.g. "baseline" or "context-v2"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bench:
    name: lens bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the bench
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LENS_LITELLM_KEY: ${{ secrets.LITELLM_API_KEY }}
          REPO: ${{ github.repository }}
          ROOT: ${{ github.workspace }}
          OUT: ${{ runner.temp }}/lens-bench.json
          PYTHONUNBUFFERED: "1"
        run: python -m lens bench --repo "$REPO" --root "$ROOT" --out "$OUT"

      # The repo's upload pattern (see conformance-reusable.yaml).
      - name: Upload the scores
        id: upload-scores
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lens-bench
          path: ${{ runner.temp }}/lens-bench.json
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

      - name: Wait before the upload retry
        if: always() && steps.upload-scores.outcome == 'failure'
        run: sleep 20

      - name: Upload the scores (retry)
        if: always() && steps.upload-scores.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lens-bench-retry
          path: ${{ runner.temp }}/lens-bench.json
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

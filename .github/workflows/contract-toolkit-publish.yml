name: Publish Contract Toolkit

# Phase B of the contract-toolkit release. Fires when a release PR opened by
# the Release Contract Toolkit workflow (contract-toolkit-release.yml) is
# merged into main with the `release:contract-toolkit` label. Builds the PKL
# package from merged main, publishes it under contracts/ on the gh-pages
# branch, and creates the contract-toolkit-v<version> annotated tag.
# No GitHub Release is created — that would interleave contract-toolkit
# versions with SDK v* releases on the repo releases page.
#
# Also runnable manually (workflow_dispatch) to retry a publish that failed
# or timed out without a new release PR — every step is idempotent (gh-pages
# commit/push, Pages build trigger, and tag creation all no-op if the target
# is already up to date), so re-running against an unchanged
# contract-toolkit/src/PklProject version is always safe. Dispatch from
# `main` to run this workflow's current logic — as with any workflow_dispatch,
# the ref you dispatch from determines which version of *this file* executes.
# What's always pinned to `main` regardless of dispatch ref is the *published
# content*: the actions/checkout step below explicitly checks out `ref: main`.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  pull-requests: read

env:
  PKG_NAME: app-contract-toolkit
  PUBLISH_DIR: contracts

jobs:
  publish:
    name: Publish contract toolkit package
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release:contract-toolkit'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # No version: — install-pkl resolves the SDK pin from
      # application_sdk/pkl_version.py, the one place it is declared.
      - uses: ./.github/actions/install-pkl

      - name: Read release version
        id: meta
        run: |
          set -euo pipefail
          file="contract-toolkit/src/PklProject"
          version="$(grep -oP 'version\s*=\s*"\K[^"]+' "$file")"
          if [ -z "$version" ]; then
            echo "::error::could not parse version from ${file}"
            exit 1
          fi
          tag="contract-toolkit-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing contract toolkit ${tag} from $(git rev-parse HEAD)"

      - name: Build package
        run: pkl project package contract-toolkit/src/ --output-path .out/ --skip-publish-check

      - name: Stash built artifacts
        run: cp -R .out /tmp/contract-toolkit-pkl-out

      - name: Publish package to GitHub Pages branch
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git checkout origin/gh-pages -- . 2>/dev/null || true

          mkdir -p "${PUBLISH_DIR}"
          cp "/tmp/contract-toolkit-pkl-out/${PKG_NAME}@${version}" "${PUBLISH_DIR}/"
          cp "/tmp/contract-toolkit-pkl-out/${PKG_NAME}@${version}.zip" "${PUBLISH_DIR}/"
          cp "/tmp/contract-toolkit-pkl-out/${PKG_NAME}@${version}.zip.sha256" "${PUBLISH_DIR}/"
          if [ -f "/tmp/contract-toolkit-pkl-out/${PKG_NAME}@${version}.sha256" ]; then
            cp "/tmp/contract-toolkit-pkl-out/${PKG_NAME}@${version}.sha256" "${PUBLISH_DIR}/"
          fi
          touch .nojekyll

          git add -A "${PUBLISH_DIR}" .nojekyll
          git diff --cached --quiet || git commit -m "publish ${PKG_NAME}@${version}"
          git push origin gh-pages

      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The previous step leaves the working tree checked out on gh-pages
          # (which has no .github/scripts/), so restore just this one file
          # from main rather than switching branches back.
          git checkout main -- .github/scripts/wait_for_pages_publish.py
          owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY##*/}"
          url="https://${owner}.github.io/${repo_name}/${PUBLISH_DIR}/${PKG_NAME}@${{ steps.meta.outputs.version }}.zip"
          python3 .github/scripts/wait_for_pages_publish.py \
            --repo "${GITHUB_REPOSITORY}" \
            --url "$url"

      - name: Create source tag
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          merge_sha="${{ steps.meta.outputs.merge_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists on origin; skipping tag push"
            exit 0
          fi

          git tag -a "$tag" "$merge_sha" -m "Release contract toolkit $tag"
          git push origin "$tag"

      # No GitHub Release is created: contract-toolkit releases would
      # interleave with SDK v* releases on the repo's releases page, which
      # is confusing. The annotated tag, gh-pages publish, and
      # contract-toolkit/CHANGELOG.md are the authoritative record.

  fan-out:
    # After a contract-toolkit release, trigger the self-hosted Renovate runner
    # so consumers pick up the new app-contract-toolkit version within minutes,
    # then re-dispatch the fleet repos that sweep missed. Skipped automatically
    # when `publish` is skipped or fails.
    #
    # KEEP IN STEP with tag-and-publish.yaml's fan-out (FND-4330). This job
    # joins the same concurrency group and runs the same steps, though it
    # publishes nothing to PyPI: renovate.yaml coalesces live sweeps, so a
    # bare dispatch from here would cancel a release sweep whose follow-up then
    # stands down, leaving nobody to verify the fleet. Running the same wait
    # and follow-up makes this job the successor instead. The PyPI wait returns
    # after its first clean rounds when nothing on main is pending.
    name: Fan out Renovate to consumers
    needs: [publish]
    runs-on: ubuntu-latest
    # Visibility wait (<=15 min) + full sweep + up to two scoped re-runs.
    timeout-minutes: 120
    concurrency:
      group: renovate-release-fanout
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Wait for the release to be visible on PyPI
        id: pypi
        continue-on-error: true
        run: |
          python3 .github/scripts/wait_for_pypi_release.py \
            --pyproject pyproject.toml \
            --pyproject packages/api/pyproject.toml \
            --pyproject packages/conformance/pyproject.toml

      - name: Mint fleet App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq

      - name: Trigger Renovate and re-dispatch repos it missed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.ORG_PAT_GITHUB }}
          PACKAGES: ${{ steps.pypi.outputs.packages }}
        run: python3 .github/scripts/renovate_release_followup.py --packages "$PACKAGES"

name: tests-reusable

# Reusable workflow for the standard connector tests + e2e scaffold.
# Each connector's per-app tests.yaml collapses to a thin caller — a single
# job invoking this reusable; the tiered unit/integration jobs, the e2e
# scaffold and the aggregator Tests Gate all live in here:
#
#     name: Tests
#     jobs:
#       tests:
#         uses: atlanhq/application-sdk/.github/workflows/tests-reusable.yaml@main
#         with:
#           app-name: mysql
#           ...
#         secrets: inherit
#
# Standard boilerplate baked in this reusable so apps don't copy-paste it:
#   - 60-min job timeout (override via timeout-minutes input)
#   - Concurrency group on github.ref — queues rather than races same branch
#   - pull-requests:write + contents:read permissions
#   - distinct-id echo for cross-repo dispatch tracking
#   - connector-integration-tests composite with services-script hook (no-op
#     by default; used when source systems need CI-level startup rather than
#     pytest fixtures — see openapi's .github/test/setup-services.sh)
#   - Optional pre-sync token rewrite for private atlanhq git dependencies
#     (`private-git-deps`), plus `git-token` forwarded to the e2e image build
#   - Label/dispatch-gated full-DAG e2e job (inlined here — see the `e2e` job;
#     it was previously delegated to e2e-full-reusable.yaml, now folded in so
#     the whole suite is one reusable + one Tests Gate)
#
# Test tiering (two separate jobs → two separate checks):
#   unit         → tests/unit/ via the lightweight connector-unit-tests action
#                  (setup-deps + pytest + coverage; NO app server / daprd /
#                  Temporal / services-script). Runs on EVERY event — the fast
#                  per-commit PR signal, greens in seconds of test time.
#   integration  → tests/integration/ via connector-integration-tests (boots
#                  the app + testcontainers / services-script, exercising the
#                  real extraction workflow). Skipped when the connector ships
#                  no integration suite. WHERE it runs depends on whether the
#                  base branch is behind a merge queue (`detect-merge-queue`):
#                    • queue present → merge_group / push, the exact batched
#                      state that will land, the one point a regression could
#                      actually ship — re-run in place if the base moves under
#                      the queue. (Skipped on pull_request; unit is the PR
#                      signal.)
#                    • queue absent  → pull_request, per commit. Without a
#                      queue there is no batched pre-merge state to test in, so
#                      gating on the PR is the only way the tier blocks a bad
#                      merge; `push`-only would just redden main after the fact.
#                  Gated by the `detect-integration` job either way.
#   e2e (label/dispatch) → full-DAG against a real tenant (the `e2e` job).
#   A caller-supplied `test-paths` scopes the INTEGRATION job only; the unit job
#   always runs tests/unit/.
#
# GitHub check name hierarchy as the UI displays it (caller → tests-reusable):
#   Tests / tests / Unit         (every event)
#   Tests / tests / Integration  (merge queue if the base branch has one, else
#                                 on the PR; skipped when there is no suite)
#   Tests / tests / End-to-end   (label / dispatch)
#   Tests / tests / Tests Gate   (aggregator — the required check)
#
# Branch protection does NOT use those display strings. A ruleset's
# required_status_checks `context` is the check-run name, which omits the
# workflow name: require `tests / Tests Gate` — the caller's job id, then this
# job's name. (Verified against atlan-mysql-app's live `main` ruleset, which
# also carries `suite / Conformance Gate`; an inline job is a single segment.)
#
# Nested reusable depth: caller → tests-reusable = 2 (GitHub max is 4).
# secrets: inherit chains from the caller; the inlined e2e job reads secrets.*.
#
# Connectors that need OS-level native build deps (ODBC, SAP JCo, etc.) before
# uv sync cannot use this reusable — they need a bespoke tests.yaml with the
# native-deps pre-step before invoking connector-integration-tests directly.

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
        description: Connector app name (ATLAN_APPLICATION_NAME, e.g. mysql, openapi).
      app-image-name:
        required: false
        type: string
        default: ""
        description: GHCR image name for the e2e job (e.g. atlan-mysql-app). Empty disables image build.
      test-paths:
        required: false
        type: string
        default: ""
        description: |
          Space-separated pytest target paths for the INTEGRATION job.  Empty =
          tests/integration/ (the default).  The unit job always runs tests/unit/
          via the connector-unit-tests action and is NOT affected by this input.
          Set this only to scope integration to a subset (e.g. a single file).
      unit-coverage-fail-under:
        required: false
        type: string
        default: "0"
        description: |
          Minimum unit-test coverage percent enforced by the unit job (the
          connector-unit-tests `fail-under`).  Default "0" preserves the
          historical no-coverage-gate behaviour; raise it per-app to enforce a
          coverage floor on the fast PR signal.
      pytest-args:
        required: false
        type: string
        default: >-
          -n auto --dist=loadfile --tb=short
          --cov=app --cov-report=xml --cov-report=json --cov-report=html --cov-report=term
          --cov-fail-under=0
        description: |
          Extra arguments passed to pytest after test-paths.  ``--cov-report=json``
          emits ``coverage.json`` for the test-readiness scorecard (the machine-
          readable form; xml/html/term are for humans and other consumers).
      services-script:
        required: false
        type: string
        default: ""
        description: |
          Optional path (relative to the caller's repo root) of a shell script
          that starts runtime source services before tests run.  No-op when
          empty.  Prefer session-scoped pytest fixtures (mysql/metabase pattern)
          unless the service cannot be managed from inside pytest.  See
          openapi's .github/test/setup-services.sh for a reference demonstration
          of the pattern (used intentionally to exercise this hook end-to-end).
      e2e-test-path:
        required: false
        type: string
        default: "tests/e2e/"
        description: Pytest target path for the e2e job.
      enable-e2e:
        required: false
        type: boolean
        default: true
        description: Set to false to skip the e2e job entirely (e.g. hello-world).
      install-app-to-tenant:
        required: false
        type: boolean
        default: true
        description: |
          Install the app under test onto each cloud's e2e tenant before the
          legs run, and fail a leg whose tenant is not on that version (FND-31).

          Why this matters more than it sounds: at AE submit, Heracles re-fetches
          the manifest from the TENANT-DEPLOYED POD and that DAG is what executes
          (`processAutomationEngineWorkflow`). The harness's local seed DAG
          establishes the workflow record, not the graph. So with this off, a
          full-DAG e2e exercises whatever version was last deployed to that
          tenant — which is nobody's PR — and a manifest/DAG/entrypoint change
          can go green against an older contract, or red for an unrelated reason.

          ON by default since FND-128. It shipped opt-in (FND-31) for one
          reason: `E2E_TENANT_MATRIX_JSON` was shared with a handful of repos,
          and without it the install cannot resolve a tenant at all. That secret
          is now org-wide, so the prerequisite that justified per-repo adoption
          is gone — and leaving it opt-in meant every un-adopted repo ran the
          cross-CSP matrix against whatever version each tenant already served,
          which is three legs of wrong-version green instead of one.

          Set it to false to opt OUT, for the case this default cannot serve: an
          app that genuinely cannot be installed onto the e2e tenants (not
          published to GM, or a tenant carrying an orphan that fails every
          install — FND-131). That is a real escape hatch and it stays; what
          changed is which way round the default points. Opting out restores the
          pre-FND-31 behaviour, wrong-version risk included, so prefer fixing
          the tenant.
      e2e-clouds:
        required: false
        type: string
        default: ""
        description: |
          Cross-CSP e2e fan-out (FND-6). Comma-separated cloud keys; every
          discovered e2e suite runs once per cloud, against that cloud's tenant
          from the E2E_TENANT_MATRIX_JSON secret. Each cloud is a required leg:
          the matrix is fail-fast:false and Tests Gate reads the aggregate, so
          any cloud failing reds the gate.

          Empty (the default) means the SDK's current cloud list, which lives in
          discover_e2e_suites.py's DEFAULT_CLOUDS — deliberately NOT restated
          here, so adding a fourth CSP is one edit rather than one per repo, and
          so an app forwarding an untouched dispatch input doesn't opt out of
          the matrix by accident — intersected with the clouds the tenant secret
          actually carries (FND-354). Removing a cloud's entry from
          E2E_TENANT_MATRIX_JSON is therefore the fleet-wide way to take it out
          of the rotation while its tenant is down: one secret edit, no PR,
          effective next run, and warned about in the log of every run it
          narrows. A cloud named HERE is never narrowed away — it reaches the
          per-leg resolver and fails there, because naming it asserts it should
          run.

          Narrow it to re-run one cloud ("aws"), or pass "none" to collapse back
          to the single legacy tenant. Forced to "none" when
          E2E_TENANT_MATRIX_JSON is not shared with the calling repo, which is
          what keeps un-onboarded repos on their existing behaviour.
      timeout-minutes:
        required: false
        type: number
        default: 60
        description: Timeout for the tests job in minutes.
      application-sdk-ref:
        required: false
        type: string
        default: ""
        description: Branch/SHA to pin atlanhq/application-sdk to for cross-repo dispatch, applied to BOTH runtime and harness unless overridden below. Empty = lockfile version.
      runtime-sdk-ref:
        required: false
        type: string
        default: ""
        description: application-sdk ref for the connector RUNTIME (built image). Empty falls back to application-sdk-ref, then the lockfile pin.
      harness-sdk-ref:
        required: false
        type: string
        default: ""
        description: application-sdk ref for the TEST HARNESS (host pytest / testing.e2e). Empty falls back to application-sdk-ref, then the lockfile pin. Set to run the latest harness against the connector's own runtime without bumping its SDK.
      base-image-ref:
        required: false
        type: string
        default: ""
        description: Runtime base image override for the connector Docker build.
      agent-name-override:
        required: false
        type: string
        default: ""
        description: Override agent-name for the e2e job (default ci-<run_id>).
      distinct-id:
        required: false
        type: string
        default: ""
        description: Identifier echoed in step names for cross-repo dispatch tracking.
      run-e2e:
        required: false
        type: string
        default: ""
        description: Set to 'true' to trigger the e2e job from workflow_dispatch.
      two-store:
        required: false
        type: boolean
        default: false
        description: |
          Opt-in ADR-0014 two-store SDR posture for the e2e job — forwarded to
          the sdr-e2e action's `enable-two-store` input. When true, objectstore
          is forced to the CI-local binding while atlan-objectstore stays the
          tenant blobstorage, so a connector that forgets to bridge an artifact
          shows up as zero downstream assets instead of being masked by a shared
          bucket. Default false: existing callers are unaffected.
      source-available:
        required: false
        type: boolean
        default: true
        description: |
          Whether an extraction source is provisioned for this connector in
          CI — forwarded to the sdr-e2e action's `source-available` input.
          Sourcing is the app owner's responsibility. Default true: the
          full-DAG e2e runs unchanged. Set false for apps with no free
          container / no wired credentials — the e2e then degrades to a
          worker-up-only check (assert the worker deploys + serves
          /server/health) and skips extraction/publish/Atlas assertions,
          until the owner provisions a source.
      dataforge-datasource:
        required: false
        type: string
        default: ""
        description: |
          Dataforge datasource name (postgres, snowflake, powerbi, …). When
          set, the e2e job fetches this connector's SOURCE credentials from
          dataforge at run time (per-run GitHub OIDC exchange — no stored
          dataforge secret; needs a dataforge workload binding) — instead
          of, or in addition to, the static E2E_SOURCE_ENV_JSON secret — and
          exports every raw field VERBATIM as E2E_<DATASOURCE>_<FIELD> env
          before the secrets bundle is written (no canonical shape imposed:
          the connector's own secrets script maps fields onto its config,
          whatever its auth variant). REPO-CREDS-FIRST: the fetch runs ONLY when
          no E2E_SOURCE_ENV_JSON was provided (every dataforge step gates on it),
          so a connector with repo creds never dials the VPN — dataforge is the
          fallback for connectors that have no repo creds, not the primary. The
          whole dataforge chain (VPN, fetch) is continue-on-error, so when
          dataforge is unavailable the connector's hermetic source carries the
          run.
          READ-ONLY against the source: the job only fetches credentials —
          it never seeds, curates, or mutates the instance. Curating the
          dataset is the instance owner's one-time setup (see the
          connector's e2e README). Empty (the default) disables the fetch
          entirely; existing callers are unaffected.
      dataforge-mode:
        required: false
        type: string
        default: "resource"
        description: |
          How the source is looked up in dataforge. "resource": a provisioned
          instance's artifacts, keyed by the DATAFORGE_RESOURCE_ID secret
          (provision once, human-approved, category "ci" so the lifecycle
          reaper skips it). "managed": a vault-managed credential — the only
          home for SaaS sources that cannot be provisioned (powerbi, snowflake,
          …); looked up by datasource (+ dataforge-env-tier), newest active
          entry, unless DATAFORGE_RESOURCE_ID pins a credential UUID.
      dataforge-env-tier:
        required: false
        type: string
        default: ""
        description: Managed-credential tier filter (dev/stg/prd). Managed mode only.
      dataforge-output-prefix:
        required: false
        type: string
        default: ""
        description: |
          Prefix for the aliased env set (E2E_<PREFIX>_HOST, …). Empty = the
          uppercased datasource name.
      dataforge-hermetic-fallback:
        required: false
        type: string
        default: "true"
        description: |
          Whether this connector can run its suite against a local
          hermetic source (a seeded sibling container) when neither the
          dataforge fetch nor E2E_SOURCE_ENV_JSON produced credentials.
          Set "false" for SaaS-style connectors with no hermetic option:
          the source-resolution step then FAILS FAST with an explicit
          "no e2e source available" error instead of letting the leg limp
          to the extract node and die minutes later on a cryptic
          empty-credential auth failure. Only consulted when neither
          credential path resolved (a dataforge fetch or E2E_SOURCE_ENV_JSON
          short-circuits ahead of it).
          ONE input, BOTH tiers — e2e and integration read this same value, so
          a connector cannot be fatal in one tier and forgiving in the other.
          Note the consequence of the "true" default on the INTEGRATION tier,
          which is the merge gate: a connector with no hermetic source that
          leaves this at the default turns an unresolved source into a green
          job rather than a failure. Connectors that cannot seed a local
          source — every SaaS-style one — should set "false" when they opt into
          dataforge-datasource. The default stays "true" because the majority
          of callers are containerizable and must not be reddened by a
          dataforge/VPN outage; opting out is the control for the rest.
      private-git-deps:
        required: false
        type: boolean
        default: false
        description: |
          Set true when the connector's lockfile pins a PRIVATE atlanhq git
          dependency (e.g. query-redaction, pinned via `ssh://` or `https://`
          in [tool.uv.sources]).  Every tier of this reusable runs `uv sync` on
          the runner, and an unauthenticated clone of a private atlanhq repo
          fails there — so with this flag each job rewrites atlanhq remotes to
          a token URL (ORG_PAT_GITHUB, available via the caller's
          `secrets: inherit`) BEFORE the deps action syncs.  The Docker build
          is covered separately: `git-token` is always forwarded to sdr-e2e.
          Leave false for connectors with only public dependencies.
      git-lfs-skip-smudge:
        required: false
        type: boolean
        default: false
        description: |
          Set true to export GIT_LFS_SKIP_SMUDGE=1 in every job, so clones do
          not download LFS objects.  Use when a private git dependency
          LFS-tracks large artifacts the tests never need — the smudge filter
          otherwise fails (or wastes minutes) during `uv sync`.  Leave false
          for connectors that genuinely need their LFS content at test time
          (the same reason build-and-publish takes an explicit `lfs` input).
      apt-packages:
        required: false
        type: string
        default: ""
        description: |
          Space-separated Ubuntu packages apt-installed in the Unit,
          Integration and e2e jobs BEFORE dependency sync.  For connectors
          whose Python dependencies build a native extension the runner image
          lacks headers for — hive's pykerberos ships only an sdist and needs
          libkrb5-dev for gssapi/gssapi.h, so its `uv sync` fails on a cold
          cache in every tier (FND-110).  The retired bespoke workflows ran
          their own apt-get step for this; a reusable-workflow caller cannot
          inject steps, hence this input.  The e2e IMAGE build is not covered:
          the connector's Dockerfile owns its own system deps.  Empty (the
          default) skips the step entirely.

          Accepted form is deliberately narrow — plain package NAMES only,
          separated by whitespace, each matching Debian's own
          `[a-z0-9][a-z0-9+.-]*` (so `g++`, `libstdc++6`, `python3.11-dev` are
          fine).  Anything else fails the job before apt runs, including
          arch-qualified (`libkrb5-dev:amd64`) and version-pinned
          (`libkrb5-dev=1.2.3`) forms, apt flags, local `.deb` paths, and
          globs.  If a connector genuinely needs one of those, widen the
          allowlist in this workflow deliberately rather than working around it
          from the caller.
      container-health-timeout-seconds:
        required: false
        type: string
        default: "120"
        description: |
          Forwarded to the sdr-e2e action: how long to wait for the e2e worker
          container's /server/health before failing. Raise for connectors whose
          image boots slowly (heavy native / analytics deps). Must stay strictly
          greater than the SDK's ATLAN_DAPR_SIDECAR_WAIT_TIMEOUT, or the gate is
          a coin-flip — see the action's own note (CNCT-66).
      force-external-runtime:
        required: false
        type: boolean
        default: false
        description: |
          Forwarded to the connector-integration-tests action: force the
          external daprd + Temporal steps even when the installed SDK reports
          embedded-runtime support.  Set only while the connector's main.py
          still expects external daprd at :3500 / Temporal at :7233; the
          embedded runtime is the preferred end state.
      health-check-timeout-seconds:
        required: false
        type: string
        default: "60"
        description: |
          Forwarded to the connector-integration-tests action: how long to wait
          for the app server to become healthy in the INTEGRATION tier.  Raise
          for connectors with slow imports (heavy native/analytics deps).

    secrets:
      # Declared so a caller that maps secrets EXPLICITLY (instead of
      # `secrets: inherit`) gets parse-time validation. Everything here is
      # optional, so `secrets: inherit` callers are unaffected — inherited
      # secrets arrive under their own names either way.
      E2E_SOURCE_ENV_JSON:
        required: false
        description: |
          JSON object of the connector's SOURCE credentials, exported as
          environment variables in the e2e job before the secrets bundle is
          written — so both the app's secrets-script and the test class see
          them. This exists because the source credential NAMES are
          per-connector and unknowable here (SNOWFLAKE_E2E_ACCOUNT,
          E2E_SAPHANA_HOST, AWS keys, …) while the tenant-side secrets below
          are fixed; and because a reusable-workflow `with:` input cannot carry
          a secret at all (the `secrets` context is not available in that
          block).

          Build it in the caller's `secrets:` mapping, wrapping each value in
          toJSON(...) — that mapping is where the `secrets` context IS available.
          One JSON object, one line per credential, values written as
          toJSON(secrets.NAME) expressions.

          JSON rather than KEY=VALUE lines because a key-pair PEM or
          service-account key is multi-line. Connectors with a hermetic
          container source (the mysql shape) need none of this.
      DATAFORGE_RESOURCE_ID:
        required: false
        description: |
          Resource UUID (dataforge-mode "resource") or managed-credential UUID
          ("managed"; optional there — empty means newest active entry for the
          datasource). A UUID, not a secret in the credential sense, but kept
          in secrets so rotating the pinned instance never needs a code change.
      GLOBALPROTECT_USERNAME:
        required: false
        description: |
          GlobalProtect CI account for the dataforge fetch — dataforge's api
          host and the provisioned sources admit only the VPN egress IPs.
          Org-level at atlanhq; `secrets: inherit` callers need nothing.
      GLOBALPROTECT_PASSWORD:
        required: false
        description: Paired with GLOBALPROTECT_USERNAME.
      # Resolved per leg by .github/scripts/resolve_e2e_tenant.py. The pointer
      # lives in a YAML comment rather than in the description below because
      # test_resolve_e2e_tenant.py's call-site guard treats any non-comment
      # mention of that script as an invocation it must be able to parse and
      # check for mask-before-write ordering — deliberately, so a real caller can
      # never hide behind prose.
      E2E_TENANT_MATRIX_JSON:
        required: false
        description: |
          Cross-CSP tenant map for the e2e matrix (FND-6): a JSON object keyed
          by cloud, each entry carrying tenant / client_id / client_secret /
          api_key (plus an optional deployment_name when the tenant's system
          apps are not deployed under "production").

              {"aws": {"tenant": "…", "client_id": "…", "client_secret": "…",
                       "api_key": "…"}, "azure": {…}, "gcp": {…}}

          One secret rather than four per cloud because a strategy.matrix value
          cannot index the `secrets` context and this workflow declares its
          workflow_call secrets explicitly — so per-cloud names would have to be
          re-declared here for every cloud ever added. Same shape and same
          masking protocol as E2E_SOURCE_ENV_JSON above; the resolver named in
          the comment above extracts only the leg's own cloud, so a leg never
          holds the other tenants' credentials.

          Unset = the four single-tenant secrets below are used and the cloud
          fan-out is skipped, which is exactly the pre-FND-6 behaviour.
      SDR_TEST_TENANT:
        required: false
        description: |
          Single-tenant fallback host for the e2e job, used when
          E2E_TENANT_MATRIX_JSON is unset (also derives ATLAN_BASE_URL).
      SDR_CLIENT_ID:
        required: false
        description: OAuth client id the e2e worker authenticates to the tenant with (fallback path).
      SDR_CLIENT_SECRET:
        required: false
        description: OAuth client secret paired with SDR_CLIENT_ID (fallback path).
      ATLAN_API_KEY:
        required: false
        description: Tenant API key the e2e harness drives Automation Engine + Atlas with (fallback path).
      ORG_PAT_GITHUB:
        required: false
        description: |
          Org PAT used for the GHCR push, the connector image build's private
          git dependency, and the private-git-deps token rewrite.
      FLEET_APP_ID:
        required: false
        description: |
          GitHub App id used by the cross-repo callback job to mint a token for
          the dispatching application-sdk repo. Only the SDK-dispatch path uses
          it; connector-triggered runs leave it unset.
      FLEET_APP_PRIVATE_KEY:
        required: false
        description: Private key paired with FLEET_APP_ID.

jobs:

  # ── Unit (lightweight: no app server / daprd / Temporal / services) ──────
  # Runs on EVERY event as the fast per-commit signal. connector-unit-tests is
  # setup-deps + pytest tests/unit + coverage — none of the runtime infra the
  # integration job spins up, so a PR greens in seconds of test time.
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # See the integration job below for why the group is run-unique off the
      # PR path. Same hazard, same fix — this job was cancelled alongside it.
      group: tests-unit-${{ startsWith(github.ref, 'refs/pull/') && github.ref || github.run_id }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    permissions:
      pull-requests: write  # connector-unit-tests comments the coverage delta
      contents: read
    outputs:
      summary: ${{ steps.unit.outputs.summary }}
    env:
      # Empty (the default) leaves the smudge filter enabled, exactly as
      # before; git-lfs only skips on an explicit "1".
      GIT_LFS_SKIP_SMUDGE: ${{ inputs.git-lfs-skip-smudge && '1' || '' }}
      # Surfaced as env, like E2E_SOURCE_ENV_JSON below, because a step-level
      # `if:` cannot read the secrets context — and the rewrite step must gate
      # on the credential actually being present, not just on the flag.
      GIT_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
    steps:
      - name: echo distinct-id ${{ inputs.distinct-id }}
        if: inputs.distinct-id != ''
        run: echo "Dispatched; SDK ref=${{ inputs.application-sdk-ref }}"

      # Must precede the deps action's `uv sync`: a native sdist build (hive's
      # pykerberos → gssapi/gssapi.h) fails during sync, not at test time.
      #
      # Routed through env, never interpolated into the script
      # (docs/standards/ci.md). That routing is the control that matters: a
      # `${{ }}` in the script text would splice a caller-supplied value into
      # the shell, which is why a test pins the env form.
      #
      # The value is then matched WHOLE against a strict Debian package-name
      # allowlist before it is used. It has to reach apt-get unquoted — that is
      # how a list of packages is passed — and while word splitting does not
      # re-parse `;`/`|`/`$(…)` as operators (they arrive as literal argv
      # words), it does still glob-expand, and a leading `-o …` or `./x.deb`
      # would reach apt-get as a flag or a local package path instead of a name.
      # The allowlist closes both, and fails closed: a straight-line `grep`
      # rather than an `if`, so the check stays inside the
      # no-inline-conditionals rule, with `set -e` explicit so a later
      # `defaults: run: shell:` cannot silently turn it into a fail-open.
      - name: Install system packages (apt-packages)
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          echo "Validating and installing apt packages: $APT_PACKAGES"
          printf '%s' "$APT_PACKAGES" | tr '\n' ' ' \
            | grep -xE '[a-z0-9][a-z0-9+.-]*([[:space:]]+[a-z0-9][a-z0-9+.-]*)*' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # The flag promises a token. With ORG_PAT_GITHUB absent, GIT_TOKEN expands
      # empty and the rewrite below would still install a global redirect of
      # every atlanhq URL to an unauthenticated token URL — which then also
      # applies to the connector's own repo checkout, so the job fails far from
      # the cause. Fail here instead, naming the missing secret. The condition
      # stays in `if:`, never in the shell (docs/standards/ci.md).
      - name: Require ORG_PAT_GITHUB when private-git-deps is set
        if: inputs.private-git-deps && env.GIT_TOKEN == ''
        run: |
          echo "::error::private-git-deps is true but ORG_PAT_GITHUB is unset"
          exit 1

      # Private atlanhq git deps must be reachable before the deps action's
      # `uv sync`. --global writes ~/.gitconfig, so it applies to the clone uv
      # performs later in this job and needs no checkout of its own.
      - name: Authenticate private atlanhq git dependencies
        if: inputs.private-git-deps && env.GIT_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "https://github.com/atlanhq/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "ssh://git@github.com/atlanhq/"

      - name: Run unit tests
        id: unit
        uses: atlanhq/application-sdk/.github/actions/connector-unit-tests@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # "0" by default (no coverage gate); apps opt up via the input.
          fail-under: ${{ inputs.unit-coverage-fail-under }}
          # Repin so a cross-repo SDK-PR dispatch exercises the SDK branch in the
          # unit tier too (parity with integration); empty = lockfile version.
          application-sdk-ref: ${{ inputs.application-sdk-ref }}

  # ── Detect whether the PR's base branch is behind a merge queue ──────────
  # Decides WHERE the integration tier gates. The tier must run before a merge
  # lands, and the queue is the ideal place for it (the exact batched state) —
  # but only a repo that HAS a queue gets that. On a consumer without one, the
  # old `!= 'pull_request'` gating left integration running solely on `push`,
  # i.e. after the merge, where a failure reddens main and blocks nobody. A
  # fleet sweep found most atlan-*-app consumers in exactly that state.
  #
  # So: queue present ⇒ integration runs in the queue (cadence unchanged);
  # queue absent ⇒ integration runs on the pull_request instead. Either way the
  # tier gates before code lands.
  #
  # Only needed for the pull_request case — on merge_group the queue is
  # self-evidently enabled, and on push/dispatch integration always runs — so
  # this job is skipped on every other event and costs nothing there.
  #
  # Fails open to "no queue" (⇒ the PR tier runs): see the script's docstring
  # for why that direction is the safe one.
  detect-merge-queue:
    name: Detect merge queue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      # Sparse-checkout of the SDK's scripts only: this reusable is called at
      # @main by consumers whose own checkout has no such script, so the driver
      # must come from the workflow's own repo, matching the ref the caller
      # pinned (`job.workflow_sha`), exactly as the integration job does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Detect merge queue on base branch
        id: detect
        # Reading /repos/{repo}/rulesets is NOT administration-gated: the
        # endpoint is readable by anyone who can read the repo (an
        # unauthenticated GET against a public repo returns the full ruleset
        # list, 200). So `contents: read` above is expected to be sufficient on a
        # private consumer repo, and ORG_PAT_GITHUB is preferred only as the
        # token least likely to be scope-limited.
        #
        # If that expectation is ever wrong, the failure is safe and loud rather
        # than silent: detection fails open (⇒ integration also runs on the PR,
        # ~1-2 min of redundant work, never a wrong gate) and the script emits a
        # ::warning:: naming the cause. The first real PR run in a queued
        # consumer confirms it either way — look for the ::notice:: line.
        #
        # Event-derived values are routed through `env` and referenced as shell
        # variables rather than interpolated into the `run:` body — the same
        # pattern as the verify-test-gate action ("Route job results through env,
        # not inline ${{ }}"). `${{ }}` is substituted textually *before* bash
        # parses the script, so a ref containing `$(...)`, a backtick or `;`
        # would execute as code, and wrapping it in double quotes does not stop
        # command substitution. A `"$BASE_REF"` expansion cannot.
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT_GITHUB || github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 .github/scripts/detect_merge_queue.py \
            --repo "$REPO" \
            --base-ref "$BASE_REF" \
            --default-branch "$DEFAULT_BRANCH" \
            >> "$GITHUB_OUTPUT"

  # ── Detect whether an integration suite exists ───────────────────────────
  # The integration job runs tests/integration/ explicitly; a connector may
  # legitimately ship no integration tier (e.g. hello-world), where pytest would
  # otherwise error on a missing path. A checkout + a tested glob (discover-e2e-
  # suites is a generic test_*.py counter, reused here) lets the integration job
  # be a clean skip via a job-level `if` — no inlined conditional shell. Runs on
  # the same events the integration job does, so the two `if`s move together.
  detect-integration:
    name: Detect integration suite
    needs: detect-merge-queue
    # `always()` because detect-merge-queue is *skipped* on every non-PR event
    # and a skipped `need` would otherwise block this job. On a PR it runs only
    # when no queue was detected — the same condition as the integration job
    # below, so detection never runs for a tier that won't.
    if: >-
      always() &&
      ( github.event_name != 'pull_request' ||
        needs.detect-merge-queue.outputs.enabled == 'false' )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Count integration suites
        id: detect
        uses: atlanhq/application-sdk/.github/actions/discover-e2e-suites@main
        with:
          test-dir: tests/integration

  # ── Integration (boots the app + testcontainers / services-script) ───────
  # Runs on merge_group / push / dispatch, and on pull_request only when the base
  # branch has no merge queue to run it in (see detect-merge-queue). Skipped when
  # the connector ships no integration suite (detect-integration count == 0).
  integration:
    name: Integration
    needs: [detect-merge-queue, detect-integration]
    # Specifying `if` drops the implied success() on `needs`, so require the
    # detection to have actually succeeded (else count is empty and would read
    # as "present"). `always()` is needed because detect-merge-queue is skipped
    # on non-PR events; the queue check then keeps this tier off PRs whose merge
    # will be batched through a queue that already runs it.
    if: >-
      always() &&
      needs.detect-integration.result == 'success' &&
      needs.detect-integration.outputs.count != '0' &&
      ( github.event_name != 'pull_request' ||
        needs.detect-merge-queue.outputs.enabled == 'false' )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # On a PR ref the group is deliberately SHARED across the PR's commits —
      # that is what makes cancel-in-progress supersede the previous run.
      #
      # Off the PR path there is nothing to serialise: this job is self-contained
      # (testcontainers / services-script on its own runner, no tenant, no shared
      # external resource). A shared group there is not merely useless, it is
      # actively harmful, because GitHub keeps only ONE pending run per group —
      # a third arrival evicts the queued one with conclusion `cancelled`.
      #
      # That is precisely what a cross-repo dispatch delivers: on the
      # workflow_dispatch path github.ref is the CONNECTOR's ref (always
      # refs/heads/main), never the application-sdk commit under test, so N
      # concurrent SDK runs all landed in one group. application-sdk's merge queue
      # builds several entries speculatively at once and each dispatches into every
      # connector, so a batch of queued PRs reliably evicted each other's runs —
      # Tests Gate then failed, report-to-sdk reported failure on the SDK SHA, and
      # the merge-queue entry was ejected with no test having actually run.
      #
      # Keying on run_id off the PR path gives every run its own group.
      group: tests-integration-${{ startsWith(github.ref, 'refs/pull/') && github.ref || github.run_id }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    permissions:
      pull-requests: write
      contents: read
      # For the dataforge fetch's OIDC path (no stored dataforge secret): the
      # runner mints a per-run identity token the fetch script exchanges for a
      # 1h credentials:read token. Harmless when the dataforge inputs are unset.
      # Mirrors the e2e job — both tiers resolve the SAME pinned instance.
      id-token: write
    outputs:
      summary: ${{ steps.integration.outputs.summary }}
    env:
      GIT_LFS_SKIP_SMUDGE: ${{ inputs.git-lfs-skip-smudge && '1' || '' }}
      # Surfaced as env because a step-level `if:` cannot read the secrets
      # context, and the export steps below are gated on it being set.
      E2E_SOURCE_ENV_JSON: ${{ secrets.E2E_SOURCE_ENV_JSON }}
      # Pinned dataforge instance UUID (dataforge-mode "resource"). The e2e job
      # reads the same secret, so pinning it makes both tiers fetch byte-identical
      # source credentials from one locked instance, never two. Empty when the
      # caller does not use dataforge; the fetch chain below then self-skips.
      DATAFORGE_RESOURCE_ID: ${{ secrets.DATAFORGE_RESOURCE_ID }}
      # Same reason: the rewrite step gates on the credential, not the flag.
      GIT_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
    steps:
      - name: echo distinct-id ${{ inputs.distinct-id }}
        if: inputs.distinct-id != ''
        run: echo "Dispatched; SDK ref=${{ inputs.application-sdk-ref }}"

      # See the unit job: must precede the deps action's `uv sync`.
      - name: Install system packages (apt-packages)
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          echo "Validating and installing apt packages: $APT_PACKAGES"
          printf '%s' "$APT_PACKAGES" | tr '\n' ' ' \
            | grep -xE '[a-z0-9][a-z0-9+.-]*([[:space:]]+[a-z0-9][a-z0-9+.-]*)*' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # See the unit job for why this gates on the token, not just the flag.
      - name: Require ORG_PAT_GITHUB when private-git-deps is set
        if: inputs.private-git-deps && env.GIT_TOKEN == ''
        run: |
          echo "::error::private-git-deps is true but ORG_PAT_GITHUB is unset"
          exit 1

      - name: Authenticate private atlanhq git dependencies
        if: inputs.private-git-deps && env.GIT_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "https://github.com/atlanhq/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "ssh://git@github.com/atlanhq/"

      # Connector SOURCE credentials (E2E_SOURCE_ENV_JSON) and, when the caller
      # sets dataforge-datasource, the dataforge fetch scripts + the VPN action.
      # Exported/run here rather than passed to the composite action below,
      # because every action this workflow calls is pinned @main: an input added
      # on a feature branch is silently ignored until it lands. Sparse-checks-out
      # .github/scripts and globalprotect-connect (the latter needed only on the
      # dataforge path — a couple of extra files otherwise).
      - name: Fetch SDK CI scripts (source-credential export + dataforge fetch)
        if: env.E2E_SOURCE_ENV_JSON != '' || inputs.dataforge-datasource != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          # `job.workflow_sha` is "the commit SHA of the workflow file that
          # defines the current job" — i.e. THIS reusable, at whatever ref the
          # caller pinned — so the script always matches the workflow running
          # it, and no caller-supplied ref reaches a checkout whose payload is
          # then executed. `repository:` stays hardcoded rather than paired with
          # `job.workflow_repository` to keep that payload provenance-pinned.
          # Caveat: the `job.workflow_*` properties do not exist on GitHub
          # Enterprise Server (no effect on github.com callers), and actionlint
          # <=1.7.7 predates them, so it reports a false "property not defined".
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/actions/globalprotect-connect
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          # No `token:` here: application-sdk is public, so the run's own
          # github.token reads it regardless of whether the caller supplies
          # ORG_PAT_GITHUB — preferring the org-wide PAT for a same-repo,
          # public checkout would only burn its shared rate limit for no
          # benefit. Matches the e2e job's equivalent checkout.
          persist-credentials: false

      # Two invocations, and the order is the security property. `E2E_SOURCE_ENV_JSON`
      # is a registered secret, but the runner's masker matches registered
      # strings, not substrings of one — so the values extracted out of the blob
      # are NOT redacted until each is registered in its own right. `--mask-only`
      # writes `::add-mask::` to stdout (the log), which is where the runner
      # reads workflow commands from; it must run BEFORE the second invocation
      # redirects stdout into $GITHUB_ENV, because from that point on every step
      # that renders its `env:` group would print them in cleartext. `set -e`
      # makes a failure in the mask pass abort before anything is written — it is
      # set explicitly rather than inherited from the default shell, so that the
      # security property survives a `defaults: run: shell:` added to this
      # workflow later (which would silently drop the runner's implicit `-e`).
      - name: Export connector source credentials
        if: env.E2E_SOURCE_ENV_JSON != ''
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$E2E_SOURCE_ENV_JSON" --mask-only
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$E2E_SOURCE_ENV_JSON" >> "$GITHUB_ENV"

      # ── source resolution (FND-205), integration tier ───────────────────
      # Precedence is REPO-CREDS-FIRST, to keep the VPN off the hot path: when
      # the caller provides E2E_SOURCE_ENV_JSON (repo creds, exported above), the
      # whole dataforge chain below self-skips — every fetch step gates on
      # `E2E_SOURCE_ENV_JSON == ''` — so no VPN is dialled. Only when there are
      # NO repo creds does an opted-in connector (dataforge-datasource set) fetch
      # from dataforge over the VPN. Mirrors the e2e job step-for-step and reads
      # the SAME dataforge-datasource + DATAFORGE_RESOURCE_ID, so the two tiers
      # resolve the identical pinned instance whenever they do reach dataforge.
      #
      # The fetch steps are continue-on-error so a transient dataforge/VPN blip
      # (the VPN connect already retries 3x) doesn't redden the job by itself.
      # The "Resolve source" step below is the compensating control: it FAILS the
      # job when a source was expected but NONE resolved — no repo creds, no
      # dataforge creds, and the connector declared no hermetic container
      # (dataforge-hermetic-fallback: false). A connector that CAN seed one and
      # left the input at its "true" default degrades to that seeded source
      # instead — the fetch was still attempted, so the VPN was dialled, but a
      # blip there no longer decides the job. Apps that set neither
      # dataforge-datasource nor E2E_SOURCE_ENV_JSON self-skip the whole chain,
      # fail-fast included.
      # READ-ONLY: the job only fetches credentials; it never seeds or mutates
      # the instance (curation is the instance owner's one-time setup).
      #
      # Atlan's internal ELBs share Docker's default 172.17/16 bridge subnet;
      # re-subnet Docker BEFORE the tunnel so containers keep working while
      # 172.17/16 routes via tun0.
      - name: Move docker networks off Atlan's 172.17/16 (dataforge path)
        if: inputs.dataforge-datasource != '' && env.E2E_SOURCE_ENV_JSON == ''
        continue-on-error: true
        run: |
          set -e
          sudo mkdir -p /etc/docker
          echo '{"bip": "192.168.49.1/24", "default-address-pools": [{"base": "192.168.128.0/17", "size": 24}]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # dataforge's api host and the provisioned sources admit only the VPN
      # egress IPs. This repo's own globalprotect-connect action (unmodified),
      # from the job.workflow_sha sparse checkout — same provenance pinning as
      # the scripts above.
      - name: Connect to GlobalProtect VPN (dataforge path)
        if: inputs.dataforge-datasource != '' && env.E2E_SOURCE_ENV_JSON == ''
        continue-on-error: true
        uses: ./application-sdk-scripts/.github/actions/globalprotect-connect
        with:
          portal-url: ${{ vars.GLOBALPROTECT_PORTAL_URL }}
          username: ${{ secrets.GLOBALPROTECT_USERNAME }}
          password: ${{ secrets.GLOBALPROTECT_PASSWORD }}
          mothership-url: https://api.dataforge.atlan.dev

      # Dataforge-sourced connector credentials. The fetch's stdout is captured
      # into a shell variable — values never reach the log — and handed to
      # export_extra_env.py, whose mask-first two-pass protocol is the audited
      # path into $GITHUB_ENV. One fetch feeds both passes, so the masked strings
      # and the written strings can never diverge. Auth is the run's GitHub OIDC
      # token exchanged at dataforge — no stored dataforge secret (needs the
      # job's id-token permission, added above, and a dataforge workload binding
      # for the repo).
      - name: Fetch connector source credentials from dataforge
        if: inputs.dataforge-datasource != '' && env.E2E_SOURCE_ENV_JSON == ''
        continue-on-error: true
        env:
          DF_DATASOURCE: ${{ inputs.dataforge-datasource }}
          DF_MODE: ${{ inputs.dataforge-mode }}
          DF_ENV_TIER: ${{ inputs.dataforge-env-tier }}
          DF_OUTPUT_PREFIX: ${{ inputs.dataforge-output-prefix }}
        run: |
          set -euo pipefail
          DF_ENV_JSON="$(python3 application-sdk-scripts/.github/scripts/fetch_dataforge_source.py \
            --datasource "$DF_DATASOURCE" \
            --mode "$DF_MODE" \
            --resource-id "$DATAFORGE_RESOURCE_ID" \
            --env-tier "$DF_ENV_TIER" \
            --output-prefix "$DF_OUTPUT_PREFIX")"
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$DF_ENV_JSON" --mask-only
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$DF_ENV_JSON" >> "$GITHUB_ENV"

      # The compensating control for the continue-on-error fetch above: this step
      # has no continue-on-error, so it reports the resolved source and — when
      # nothing resolved (E2E_SOURCE_DATASOURCE breadcrumb absent AND no
      # E2E_SOURCE_ENV_JSON) — fails the job one minute in, with the fix in the
      # message, instead of letting the leg limp on empty credentials.
      #
      # Whether "nothing resolved" is fatal is the CALLER's declaration, exactly
      # as in the e2e job: hermetic-fallback is wired to
      # dataforge-hermetic-fallback (default "true"), so a connector that can run
      # its suite against a locally seeded source degrades to it, and a connector
      # that cannot MUST set "false" to get the hard error. That default is
      # deliberate — the two tiers read one input, so a connector cannot be fatal
      # in one and forgiving in the other — but it does mean a source-less
      # connector left on the default greens this merge-gating job on code it
      # never exercised against a real source. The opt-out is the control; see the
      # dataforge-hermetic-fallback input description. Reuses the e2e job's
      # script verbatim.
      - name: Resolve integration source
        if: inputs.dataforge-datasource != '' || env.E2E_SOURCE_ENV_JSON != ''
        env:
          DF_HERMETIC_FALLBACK: ${{ inputs.dataforge-hermetic-fallback }}
        run: python3 application-sdk-scripts/.github/scripts/resolve_e2e_source.py

      # Unit runs in its own job; integration defaults to tests/integration/.
      # A caller test-paths override scopes THIS job only. The ternary is a
      # workflow expression in a `with:` value — not inlined conditional shell —
      # so it stays within the CI authoring rule.
      - name: Run integration tests
        id: integration
        uses: atlanhq/application-sdk/.github/actions/connector-integration-tests@main
        with:
          app-name: ${{ inputs.app-name }}
          test-paths: ${{ inputs.test-paths != '' && inputs.test-paths || 'tests/integration/' }}
          pytest-args: ${{ inputs.pytest-args }}
          services-script: ${{ inputs.services-script }}
          application-sdk-ref: ${{ inputs.application-sdk-ref }}
          force-external-runtime: ${{ inputs.force-external-runtime }}
          health-check-timeout-seconds: ${{ inputs.health-check-timeout-seconds }}

  # ── Discover e2e suites × clouds → matrix ────────────────────────────────
  # Globs the connector's tests/e2e/test_*.py into a strategy.matrix so the
  # e2e job fans out one leg per suite (parallel, live per-job logs, per-suite
  # re-run, isolation). Connector-agnostic: the SDK never hard-codes a
  # connector's suites — the discovery script scans the checked-out tree.
  # Same label/dispatch gate the e2e job used to carry.
  #
  # Each suite is then crossed with `e2e-clouds` (FND-6), so every scenario runs
  # against one tenant per CSP and cloud-specific behaviour — the objectstore
  # binding atlan-configurator emits, blobstorage proxy behaviour, Temporal host
  # resolution — is exercised before release rather than after.
  discover-e2e:
    name: Discover e2e suites
    runs-on: ubuntu-latest
    # Just a checkout + a seconds-long glob; cap it so a wedged runner can't
    # hold the required check pending for GitHub's 6-hour default.
    timeout-minutes: 10
    # The `contains(...labels...)` term asks "does the PR carry `e2e` right now",
    # which is the right question for `opened`/`synchronize`/`reopened` but the
    # wrong one for `labeled`: on a PR that already carries `e2e`, adding ANY
    # other label (size/, area/, dependency, review-state — bots add and remove
    # these constantly) satisfies it and re-runs the whole suite. Crossed with
    # the cross-CSP matrix that is suites × clouds live tenants per spurious
    # add, and `cancel-in-progress: false` below means each one queues behind
    # the last rather than replacing it. The added term makes a `labeled` event
    # count only when `e2e` is the label that was just added; every other event
    # type is unaffected, so a real push still re-triggers. GitHub has no
    # trigger-level label filter, so the workflow RUN is still created — it now
    # skips in seconds instead of holding tenants for 20–40 minutes. FND-48.
    if: |
      inputs.enable-e2e && (
        (github.event_name == 'workflow_dispatch' && inputs.run-e2e == 'true') ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'e2e') &&
          (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
          github.event.pull_request.head.repo.fork != true &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      leg-count: ${{ steps.discover.outputs.leg-count }}
      # The cloud dimension alone, for prepare-tenant (one install per cloud, not
      # per suite × cloud). Derived from the same `clouds` expression as the full
      # matrix below, so the two can never disagree about which clouds are in play
      # — a prepare-tenant that missed a cloud the legs then ran against would be
      # a silent coverage hole, not a visible failure.
      cloud-matrix: ${{ steps.discover-clouds.outputs.matrix }}
      # Exposed alongside the matrix because the CONSUMER has to distinguish "no
      # cloud dimension" (count 0, and one fallback leg is wanted) from "these
      # clouds". The matrix string cannot carry that distinction: `{"include":[]}`
      # is a perfectly non-empty string, so a `matrix || fallback` expression
      # never takes the fallback and the job expands to zero legs instead of one.
      # e2e-full-reusable.yaml's plan-clouds has always guarded on the count for
      # exactly this reason.
      cloud-count: ${{ steps.discover-clouds.outputs.count }}
      # The same cloud dimension as a flat list, for lease-tenant — which is ONE
      # job that takes every cloud's lease in order rather than a matrix leg per
      # cloud (FND-646), so it needs the list and not a matrix.
      #
      # Emitted from the SAME action call as `cloud-matrix` above, not from the
      # suite fan-out's `clouds` below. The two calls resolve identically today
      # and a test pins that, but a lease set that missed a cloud the install
      # then ran against would be an unserialised install rather than a visible
      # failure — so this takes the distinction out of play entirely.
      cloud-list: ${{ steps.discover-clouds.outputs.clouds }}
      # The resolved cloud list as a flat string, for the scorecard's descriptive
      # `observed` field (FND-34). Taken from the SAME action call that emitted
      # the matrix, so "what we recorded as covered" and "what actually ran"
      # cannot disagree — the failure mode that makes a coverage metric worse
      # than no metric. Empty means no cloud dimension: the legs ran against the
      # single legacy tenant. The scorecard records that as `observed: []`, which
      # is distinct from omitting the field when e2e never ran at all.
      clouds: ${{ steps.discover.outputs.clouds }}
    env:
      # Job-level so the step-level `if:` below can read it — a step condition
      # cannot reference the `secrets` context directly.
      HAS_TENANT_MATRIX: ${{ secrets.E2E_TENANT_MATRIX_JSON != '' && 'true' || '' }}
    steps:
      # Human breadcrumb correlating this dispatched run back to the SDK PR that
      # fired it. Emitted here (the first job in the e2e path) so it is visible
      # regardless of how the downstream matrix fans out. Nothing reads the step
      # name: codex-/return-dispatch v3 used to trawl step names to locate the
      # run, but v4 gets the run id from the dispatch response instead.
      - name: distinct-id ${{ inputs.distinct-id }}
        if: inputs.distinct-id != ''
        shell: bash
        run: echo "Dispatched with distinct-id=${{ inputs.distinct-id }}"

      # ── The install path's precondition, checked before it costs anything ───
      # A caller on `install-app-to-tenant: true` without the tenant matrix shared
      # with its repo can NEVER install. The fallback works exactly as designed —
      # it is just not a fallback for installing: no matrix secret resolves
      # `clouds` to `none`, prepare-tenant takes its single-tenant leg, and that
      # leg supplies SDR_TEST_TENANT plus creds and an API key and no `tenant_id`.
      # Installing needs one, because GM scopes a release via `allowed_tenants`
      # matched exactly against the tenant's vcluster instance name. So the
      # fallback is sufficient to RUN legs against a tenant and structurally
      # insufficient to INSTALL onto one.
      #
      # Without this step the run learns that in prepare-tenant — after two
      # per-arch image builds and a manifest merge have already run, ~4 minutes of
      # GitHub-hosted ARM and x64 runner time, every time. The precondition is
      # knowable here, in the first job on the e2e path, in seconds. FND-203.
      #
      # An ADDITION, not a move: `HAS_TENANT_MATRIX` proves the secret EXISTS, not
      # that the relevant cloud's entry carries a `tenant_id`. This catches "no
      # secret at all"; prepare-tenant's "Require a tenant ID before publishing
      # anything" remains the backstop for "secret present, `tenant_id` missing for
      # this cloud", which nothing here can see. Deleting either would look
      # redundant to a future reader, so both are pinned by
      # test_prepare_tenant_wiring.py.
      #
      # Failing rather than degrading, for the reason the late check already
      # argues: Heracles re-fetches the manifest from the tenant-deployed pod at AE
      # submit, so skipping the install and running the legs anyway would test the
      # version already on the tenant while reporting on the PR's — the exact bug
      # `install-app-to-tenant` exists to remove.
      - name: Require the tenant matrix on the install path
        if: inputs.install-app-to-tenant && env.HAS_TENANT_MATRIX == ''
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::the tenant-install path is on (the default since FND-128) but E2E_TENANT_MATRIX_JSON is not available to this repository, so no tenant ID can be resolved and a release cannot be scoped to any tenant. GM matches allowed_tenants EXACTLY against the tenant's vcluster instance name (e.g. 'markeznp37') — not its hostname — and the legacy single-tenant fallback (SDR_TEST_TENANT) has no matrix entry to carry that value, so there is nothing to fall back to. Either share E2E_TENANT_MATRIX_JSON with this repository, with a 'tenant_id' field on each cloud's entry (see docs/standards/connector-ci-e2e.md), or set 'install-app-to-tenant: false' in this repo's tests.yaml and use the E2E Tenant Install workflow, whose tenant_id input covers the one-off case. Failing at discovery rather than at prepare-tenant so this costs seconds instead of two image builds."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Which clouds the secret actually carries (FND-354) ─────────────────
      # Sparse-checked-out rather than folded into the discover action, and
      # `ref: job.workflow_sha` rather than @main, for the reason the source-
      # credential export gives at length: an action pinned @main cannot see a
      # change until it lands, whereas a script pulled at the workflow's own SHA
      # is testable on the branch that changes it. `repository:` stays hardcoded
      # so the executed payload's provenance is pinned; application-sdk is
      # public, so the caller's default token reads it when ORG_PAT_GITHUB is
      # not shared.
      - name: Fetch SDK CI scripts (tenant-matrix cloud keys)
        if: env.HAS_TENANT_MATRIX != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          persist-credentials: false

      # The KEY LIST, never the blob: the credentials stay with the per-leg
      # resolver, which is the only thing that needs them. Skipped without the
      # secret, and a skipped step's output is "" — which discovery reads as
      # "not known" and narrows nothing, the same as before FND-354.
      - name: Read the tenant matrix's cloud keys
        id: matrix-clouds
        if: env.HAS_TENANT_MATRIX != ''
        env:
          E2E_TENANT_MATRIX_JSON: ${{ secrets.E2E_TENANT_MATRIX_JSON }}
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/e2e_tenant_matrix_clouds.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" >> "$GITHUB_OUTPUT"

      - name: Discover suites
        id: discover
        uses: atlanhq/application-sdk/.github/actions/discover-e2e-suites@main
        with:
          test-dir: ${{ inputs.e2e-test-path }}
          # Narrows the DEFAULTED cloud list to what the secret carries, so
          # dropping a cloud from E2E_TENANT_MATRIX_JSON takes it out of the
          # rotation fleet-wide instead of reding one leg in every repo that
          # runs e2e. A cloud named explicitly in e2e-clouds is NOT narrowed —
          # it reaches the resolver and still fails there. FND-354.
          available-clouds: ${{ steps.matrix-clouds.outputs.clouds }}
          # The cloud dimension is only meaningful when the tenant map exists;
          # without it every leg would resolve the same fallback tenant, so N
          # identical runs would masquerade as N clouds of coverage. Collapsing
          # to the legacy single leg is the honest degradation — and it is the
          # warning below, not silence, that says so.
          #
          # Written `<no secret> && 'none' || <input>` rather than the more
          # natural `<secret> && <input> || 'none'`: GitHub treats "" as falsy,
          # so the natural form collapses the default (empty = SDK cloud list)
          # into "none" and quietly disables the matrix on every un-customised
          # caller. The negated form never evaluates the input for truthiness.
          clouds: ${{ secrets.E2E_TENANT_MATRIX_JSON == '' && 'none' || inputs.e2e-clouds }}

      # The same fan-out, cloud dimension only, for prepare-tenant. A second
      # invocation rather than deriving the unique clouds out of the matrix above:
      # the `clouds` expression is duplicated verbatim, so the two calls cannot
      # drift, whereas a hand-rolled uniq over the full matrix would be new
      # untested logic doing what --clouds-only already does.
      #
      # Runs unconditionally (not gated on install-app-to-tenant) so the output
      # exists whenever discovery ran. It is seconds of work, and gating it would
      # mean prepare-tenant's matrix expression had to cope with an empty output
      # on a path where it is skipped anyway.
      - name: Discover clouds
        id: discover-clouds
        uses: atlanhq/application-sdk/.github/actions/discover-e2e-suites@main
        with:
          clouds-only: "true"
          clouds: ${{ secrets.E2E_TENANT_MATRIX_JSON == '' && 'none' || inputs.e2e-clouds }}
          # Same narrowing as the full matrix above, from the same step output:
          # prepare-tenant must install onto exactly the clouds the legs then
          # run against, and a cloud it prepared but no leg used (or vice versa)
          # is the drift the duplicated `clouds` expression already guards.
          available-clouds: ${{ steps.matrix-clouds.outputs.clouds }}

      # A repo that has not been granted the tenant-matrix secret silently gets
      # one cloud's worth of coverage from a workflow that asked for three.
      # Nothing downstream can tell the difference — the gate goes green either
      # way — so say it out loud at the point the fan-out is decided.
      - name: Warn that the cross-CSP matrix is unavailable
        if: inputs.e2e-clouds != 'none' && env.HAS_TENANT_MATRIX == ''
        shell: bash
        run: |
          echo "::warning::This run asked for the cross-CSP e2e matrix (e2e-clouds='${{ inputs.e2e-clouds }}'; empty means the SDK default list) but E2E_TENANT_MATRIX_JSON is not available to this repository, so it falls back to a single run against SDR_TEST_TENANT. Cross-CSP coverage for this run is NOT what the workflow asked for. Share the org secret with this repo to enable it."

      # This job only runs when e2e was explicitly requested (label / run-e2e),
      # so zero discovered suites means "requested but nothing found" — a
      # misconfiguration a plain `pytest ${{ inputs.e2e-test-path }}` would fail
      # on (exit 5). Fail here rather than skip the e2e job and green the gate.
      - name: Require at least one discovered suite
        if: steps.discover.outputs.count == '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::e2e was requested but no suites were discovered under '${{ inputs.e2e-test-path }}' (expected test_*.py). Failing so this is not a silent pass."
          exit 1

  # ── Full-DAG e2e (system apps — extract→qi→publish→lineage) ─────────────
  # One matrix leg per discovered suite × cloud. fail-fast:false so one leg's
  # failure doesn't cancel the others, and "Re-run failed jobs" re-runs only the
  # failed leg. Each leg spins its own worker container on its OWN Temporal
  # queue: the sdr-e2e action derives a per-leg ATLAN_DEPLOYMENT_NAME (base +
  # artifact-suffix) so legs don't co-serve one queue — under the two-store
  # posture a shared queue lets Temporal split a workflow's activities across
  # leg-workers with per-container localstorage, hiding artifacts cross-worker.
  # 120-min timeout (> ae_poll + atlas_poll + build/setup overhead).
  #
  # The cloud rides in `matrix.name`, which is already the artifact suffix, the
  # concurrency key and the job name — so adding the CSP dimension needed no new
  # isolation machinery: deployment names, queues and artifact names all pick it
  # up. Legs on different clouds hit different tenants (and therefore different
  # Temporal servers) besides.
  # ── Build the image ONCE, ahead of the matrix ────────────────────────────
  # The test-image tag is deterministic (`sdr-test-<short-sha>`), so every cloud
  # leg used to rebuild the identical image. It has to exist before prepare-tenant
  # can install it, so the build is hoisted here and every leg reuses the
  # reference via sdr-e2e's `prebuilt-image` input.
  #
  # Only runs on the install path, which is now the default: a repo that has set
  # install-app-to-tenant: false keeps building its own image per leg exactly as
  # before, so opting out restores the previous behaviour down to the build
  # ordering.
  # Two machines pull this image and they are not the same architecture: this
  # runner, which runs the per-leg worker under docker compose, and the TENANT'S
  # cluster node, which serves the app Heracles fetches the DAG from at submit.
  # The e2e tenants where the app is not yet installed are ARM. A single-arch
  # image satisfies one and fails the other ~2 minutes after a successful
  # install, as ImagePullBackOff with `no matching manifest` — exactly how
  # FND-31's first live install ended. It must therefore be genuinely multi-arch,
  # not retargeted: dropping amd64 would break the local worker instead.
  #
  # ONE ARCHITECTURE PER JOB, EACH ON A RUNNER NATIVE TO IT. The alternative —
  # one job with `--platform linux/amd64,linux/arm64` — emulates the non-native
  # half under QEMU, which the org has already measured at 5-10x native and
  # documented against (atlanhq/mothership's infrastructure notes; its build.yml
  # and lh-compute-duckdb both use `ubuntu-24.04-arm` for precisely this). Two
  # native jobs in parallel cost about one build; one job emulating costs
  # several. On a path that runs on every install-path e2e forever, that
  # difference is the whole design.
  #
  # arm64 runners are also ~20% cheaper per minute than x64, so this is not a
  # speed-for-money trade.
  build-e2e-image:
    name: Build e2e image (${{ matrix.arch }})
    needs: discover-e2e
    if: |
      inputs.install-app-to-tenant &&
      needs.discover-e2e.result == 'success' &&
      needs.discover-e2e.outputs.count != '0'
    strategy:
      # No fail-fast: knowing whether ONE arch or BOTH failed is the whole
      # diagnosis when a build breaks on an architecture rather than in general.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # NOT ubuntu-latest. On an x64 runner this platform would build under
            # QEMU and still succeed, just several times slower — a regression
            # that looks like nothing at all in review. test_build_app_image_action
            # guards the pairing.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Native, so the arm64 leg needs no more headroom than the amd64 one.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      # The tag WITHOUT the per-arch suffix — what the merge job below combines
      # into. Matrix job outputs are last-writer-wins, which is normally a trap;
      # it is safe here precisely because every leg writes the same string. The
      # per-arch references are NOT surfaced for that reason: those do differ per
      # leg, so a reader would get whichever finished last.
      image-base: ${{ steps.build.outputs.image-base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: build
        uses: atlanhq/application-sdk/.github/actions/build-app-image@main
        with:
          app-name: ${{ inputs.app-name }}
          app-image-name: ${{ inputs.app-image-name }}
          application-sdk-ref: ${{ inputs.application-sdk-ref }}
          base-image-ref: ${{ inputs.base-image-ref }}
          git-token: ${{ secrets.ORG_PAT_GITHUB }}
          ghcr-token: ${{ secrets.ORG_PAT_GITHUB }}
          platforms: ${{ matrix.platform }}
          # Suffixes the tag AND the buildx cache scope. The cache half is the
          # one that fails silently: two concurrent builds sharing one type=gha
          # scope overwrite each other's cache manifest, so every later run finds
          # the other architecture's and misses. Nothing breaks; both legs just
          # go cold forever.
          tag-suffix: -${{ matrix.arch }}

  # Combine the two per-arch images into the manifest list the tenant pulls.
  # `imagetools create` is a registry-side operation on digests — no build
  # context, no pull, a handful of seconds — which is what makes the native-split
  # shape nearly free compared with emulating one half.
  merge-e2e-image:
    name: Merge e2e image manifest
    needs: build-e2e-image
    if: needs.build-e2e-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ needs.build-e2e-image.outputs.image-base }}
      # The GM version string == the image tag. Emitted here rather than from
      # prepare-tenant, which is a matrix job over clouds whose outputs are
      # last-writer-wins with genuinely different values.
      version: ${{ steps.version.outputs.tag }}
    steps:
      # This workflow runs in the caller's repo, so the platform-assert script
      # has to be fetched. Sparse + pinned to job.workflow_sha for the same
      # reason as prepare-tenant's copy: a PR editing the script must run its own
      # version, not main's.
      - name: Fetch SDK CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB || github.token }}

      # Buildx for `imagetools`, which is a buildx subcommand.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Create the multi-arch manifest
        env:
          IMAGE: ${{ needs.build-e2e-image.outputs.image-base }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE" \
            "${IMAGE}-amd64" "${IMAGE}-arm64"

      # The assert that matters: this is the reference prepare-tenant publishes
      # and the tenant pulls. A leg that quietly built the wrong architecture
      # shows up here as a missing one — nothing downstream would catch it, since
      # GM accepts the version and LM accepts the install regardless.
      #
      # Retried, and this is the one place that genuinely needs it. The build legs
      # avoid the read-after-write race entirely by loading their image locally
      # (build-app-image's `--load`), but `imagetools create` is purely
      # registry-side: the manifest list it writes exists ONLY in the registry, so
      # there is no local copy to inspect and reading it back one step later is
      # exactly the pattern that failed a build leg with `manifest unknown` 0.7s
      # after its own push reported success.
      #
      # The retry wraps the inspect, not the assertion over its output, so a
      # genuinely single-arch manifest still fails once rather than three times.
      - name: Assert the manifest serves both architectures
        env:
          IMAGE: ${{ needs.build-e2e-image.outputs.image-base }}
        run: |
          set -euo pipefail
          RAW=$(application-sdk-scripts/.github/scripts/with-retry.sh \
            docker buildx imagetools inspect --raw "$IMAGE")
          printf '%s' "$RAW" \
            | python3 application-sdk-scripts/.github/scripts/assert_image_platforms.py \
                --expected linux/amd64,linux/arm64

      # Straight-line parameter expansion, no branching — ci.md-compliant.
      - name: Derive the GM version from the image tag
        id: version
        env:
          IMAGE: ${{ needs.build-e2e-image.outputs.image-base }}
        run: echo "tag=${IMAGE##*:}" >> "$GITHUB_OUTPUT"

  # ── Queue for the (app, cloud) tenant ────────────────────────────────────
  # A tenant is a shared MUTABLE resource: prepare-tenant installs a version onto
  # it and every leg below then asserts it is testing that version (FND-31). So
  # exclusive access has to span from the install to the last leg — and that is
  # something `concurrency:` structurally cannot do, for two separate reasons:
  #
  #   * It is per-JOB. A group on prepare-tenant is released when that job ends,
  #     which is before any leg has started. The old comment on that job admitted
  #     as much ("another run can still install between this job and the legs").
  #   * It holds exactly ONE pending run per group. A third arrival does not
  #     queue — it cancels the run that was waiting, before that run is ever
  #     given a runner, with no log output at all. That is FND-218: a merge-queue
  #     batch whose "connector test failures" were all evictions.
  #
  # So the lease is a single fixed-name ref per tenant, taken by an atomic
  # compare-and-swap (GitHub's 422 on creating a ref that already exists IS the
  # lock), held for the whole run, with dead holders reaped by whoever notices
  # (FND-250). It runs AFTER the image is built and merged so the tenant is not
  # held hostage to a build, and it is released by release-tenant below.
  #
  # An earlier version ordered per-run ticket refs by run_id instead, and both
  # contenders acquired on its first concurrent run: run_id is creation order, not
  # the order runs reach this job, and a total order gives fairness rather than
  # exclusion. Exclusion needs an atomic primitive — see the module docstring.
  #
  # ONE job for every cloud, not a matrix leg per cloud — and that is the fix for
  # a deadlock, not a tidy-up (FND-646). The matrix acquired each cloud's lease in
  # PARALLEL and held it for the whole run while blocking on the rest, which is
  # hold-and-wait. It deadlocked the first time two runs queued behind one holder:
  # the holder released all three leases at once, the two waiters raced for the
  # freed set and SPLIT it (one took aws + azure, the other gcp), and each then
  # blocked on what the other held for the full 90-minute budget. Any time two or
  # more runs are queued behind a holder, a parallel matrix makes that split the
  # EXPECTED outcome.
  #
  # So this job takes them one at a time, in an order that is a pure function of
  # the cloud names, and gives back everything it took if it cannot get the whole
  # set (see acquire_ordered). Resource ordering makes a cycle impossible, so the
  # worst case degrades from mutual blocking to plain serialisation. Nothing is
  # ever cancelled: a queued run waits and then proceeds. That matters because
  # cancelling is not a safe alternative here — prepare-tenant carries
  # `if: always()`, so a cancelled run finishes installing onto the tenants it
  # had already leased on its way out.
  #
  # Same gate as prepare-tenant: no install, no contention worth serialising —
  # the legs of a non-installing run cannot lose a version race because nothing
  # changes the version under them.
  # ── Is the SDK commit under test still the one under review? ─────────────
  # The SDK-side dispatch guard drops a fan-out whose SHA has already been
  # superseded (e2e_dispatch_guard.py, FND-696), but it can only see the window
  # UP TO the dispatch. A push landing after it leaves this run already in
  # flight for a commit nobody will merge, and the tenant lease below then does
  # exactly what it promises — it QUEUES, so the live commit waits out this
  # run's entire install-plus-legs cycle. On application-sdk PR #3322 that was
  # 3m38s, 10m12s and 12m of pure lease wait across three connectors.
  #
  # This job is the second half of that fix (FND-701), and it is worth being
  # precise about which half. A dispatched run that has ALREADY leased cannot be
  # helped: cancelling it is unsafe, because prepare-tenant carries
  # `if: always()` and finishes installing onto the tenants it holds on its way
  # out — so for that run the queue is the right answer. A run that has
  # dispatched but NOT yet leased is a different thing entirely. It is still
  # building the image and running unit and integration tests — 2m30s on the
  # openapi leg of #3322, dispatched 21:07:38 and leased 21:10:10 — and it holds
  # nothing at all, so it can stand down for free.
  #
  # Placed here rather than earlier on purpose: the answer is only worth as much
  # as its freshness, so it is asked as close to the lease as the DAG allows.
  #
  # It cannot fail this run. The script exits 0 on every path and answers
  # "false" to every doubt, and the gates below read the OUTPUT rather than the
  # job result, so even an outright job failure leaves the lease happening —
  # which is the pre-existing behaviour.
  sdk-head-recheck:
    name: Recheck the dispatched SDK ref
    needs: [merge-e2e-image]
    if: inputs.install-app-to-tenant && needs.merge-e2e-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Nothing beyond the default. Every read is of public data in
      # application-sdk — a ref, the blob it points at, and a pull request — and
      # a connector's own github.token can already do that.
      contents: read
    outputs:
      superseded: ${{ steps.recheck.outputs.superseded }}
    steps:
      - name: Recheck the dispatched SDK ref
        id: recheck
        uses: atlanhq/application-sdk/.github/actions/e2e-dispatch-recheck@main
        with:
          sdk-ref: ${{ inputs.application-sdk-ref }}
          # The claim ref the SDK wrote is keyed on the connector REPOSITORY
          # name, which is what its dispatch matrix iterates over — not the
          # short app-name. Derived from github.repository so the two cannot
          # disagree, and so a connector whose app-name and repo differ (every
          # one of them: "openapi" vs "atlan-openapi-app") still finds its claim.
          app: ${{ github.event.repository.name }}

  lease-tenant:
    name: Tenant lease
    needs: [discover-e2e, merge-e2e-image, sdk-head-recheck]
    # `always()` here is load-bearing and is what makes the recheck fail-open. A
    # job's `needs` gate is evaluated separately from its `if:`, and without a
    # status-check function GitHub applies an implicit success() over every need
    # — so a recheck job that died on infrastructure would SKIP the lease, and a
    # skipped lease skips the install and greens the run vacuously. Lifting the
    # implicit check and reading the OUTPUT instead means an absent answer (job
    # failed, job skipped, output never written) leases exactly as before.
    #
    # Because always() lifts that implicit check, discover-e2e and
    # merge-e2e-image have to be named explicitly; they were previously carried
    # by it. Same shape and same reason as prepare-tenant and the e2e legs below.
    if: |
      always() &&
      inputs.install-app-to-tenant &&
      needs.discover-e2e.result == 'success' &&
      needs.merge-e2e-image.result == 'success' &&
      needs.sdk-head-recheck.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    # Above the action's own 90-minute wait budget, which is now a budget for the
    # WHOLE ordered set rather than per cloud — so this still bounds the job, and
    # a run that queues for the full budget still reaches the script's own error
    # (which names the holding run) instead of a bare "job cancelled after Nm".
    timeout-minutes: 100
    permissions:
      # Ref writes create and delete the lease ticket. Scoped to THIS job on
      # purpose: the long-running e2e legs below keep read-only contents, so the
      # write capability lives only in a job that runs no test code.
      #
      # A called workflow's permissions can only EQUAL or NARROW the caller's, so
      # this declaration is a ceiling and not a grant: if the calling repo's
      # `tests:` job has no `contents: write` — because it declares a narrower
      # `permissions:` block, or because the repo default is read-only — the
      # acquire below fails, by design and with an error naming the grant
      # (FND-702). The canonical scaffolded tests.yaml declares the whole set for
      # exactly this reason.
      contents: write
      # Tell a live holder from a dead one, which is what makes a cancelled run's
      # abandoned ticket self-healing.
      actions: read
    steps:
      - name: Acquire the tenant leases
        uses: atlanhq/application-sdk/.github/actions/e2e-tenant-lease@main
        with:
          mode: acquire
          app: ${{ inputs.app-name }}
          # The clouds prepare-tenant will install onto, from the same discovery
          # call that built its matrix. Empty is the single-tenant fallback path
          # and the action leases "default" for it, which is what prepare-tenant's
          # own fallback leg (`cloud: ""`) verifies.
          clouds: ${{ needs.discover-e2e.outputs.cloud-list }}

  # ── Install the app under test onto each cloud's tenant ──────────────────
  # One leg per CLOUD, not per suite × cloud: the installation is tenant-scoped
  # (one per app per tenant), so installing once per cloud is both sufficient and
  # the only thing that makes sense — every suite in a run wants the same image.
  #
  # `--clouds-only` gives the cloud dimension without the file dimension, and the
  # `clouds` expression is the same one discover-e2e uses, so this job and the
  # legs can never disagree about which clouds are in play.
  prepare-tenant:
    name: Prepare tenant (${{ matrix.cloud || 'default' }})
    needs: [discover-e2e, merge-e2e-image, lease-tenant]
    # Gated on lease-tenant having RUN, not on it having succeeded, and then each
    # leg confirms its OWN cloud's lease in its first step.
    #
    # Since lease-tenant became a single ordered job (FND-646) its `.result` is
    # exact rather than a matrix aggregate — but `!= 'skipped'` still has to
    # stay, and now for a sharper reason than the one it was written for.
    # Acquisition is all-or-nothing, so a FAILED lease means this run holds
    # nothing; tightening this to `== 'success'` would SKIP the install, and the
    # e2e legs deliberately tolerate a skipped prepare-tenant (see
    # test_e2e_tolerates_skipped_but_not_failed_prepare). They would then run
    # against whatever version the tenant happens to serve — the exact FND-31
    # failure. Letting the install run and FAIL on its own lease check is what
    # stops the legs.
    #
    # It was originally widened because `.result` was the matrix aggregate:
    # `== 'success'` meant "some cloud's lease succeeded", never "this leg's
    # did". Observed live — one cloud's acquire failed on a transient TLS error
    # and the aggregate then skipped the install for the two clouds whose leases
    # HAD been taken, a run holding two tenants that installed onto neither.
    # Ordered acquisition removes that failure mode at source; the per-cloud
    # verify step below stays anyway, because it is the only thing that makes the
    # install's precondition true per TENANT rather than per job.
    #
    # `always()` is what makes the widening actually do anything, and it is easy
    # to omit: without a status-check function GitHub applies an implicit
    # success() over every `needs` entry and skips the job BEFORE this `if:` is
    # consulted, so a failed lease would still skip the install and the per-cloud
    # verify step below would never run. Same shape and same reason as the e2e
    # legs' gate.
    #
    # Because always() lifts that implicit success(), discover-e2e and
    # merge-e2e-image have to be named explicitly here; they were previously
    # carried by the implicit check.
    if: |
      always() &&
      inputs.install-app-to-tenant &&
      needs.discover-e2e.result == 'success' &&
      needs.merge-e2e-image.result == 'success' &&
      needs.lease-tenant.result != 'skipped'
    strategy:
      # One cloud's tenant being uninstallable must not cancel the others; the
      # legs for that cloud fail on their own version check.
      fail-fast: false
      # Guarded on the COUNT, not on the matrix string. `--clouds none` — which is
      # what a repo without the tenant-matrix secret resolves to — emits
      # `{"include":[]}`, a non-empty string, so `matrix || fallback` keeps the
      # empty include and this job expands to ZERO legs. A matrix job with no legs
      # is not a skipped job: it does not exist, `needs.prepare-tenant.result` is
      # never success-or-skipped, and every job gated on it disappears. That
      # deleted the whole e2e matrix on the first live install run — Tests Gate
      # caught it ("discovery succeeded but the matrix was skipped"), nothing else
      # would have.
      #
      # Same expression e2e-full-reusable.yaml's e2e-full has always used. The
      # single fallback leg spells out `cloud: ""` rather than `{}` so
      # `matrix.cloud` is a defined-but-empty string, which is what makes the
      # tenant resolver take its single-tenant path.
      matrix: ${{ fromJson(needs.discover-e2e.outputs.cloud-count != '0' && needs.discover-e2e.outputs.cloud-matrix || '{"include":[{"cloud":""}]}') }}
    runs-on: ubuntu-latest
    # Twice the script's own waits, not a shade over them: the publish retries for
    # up to ~240s while the marketplace service is not answering, the install
    # retries for up to ~600s while LM's catalog snapshot catches up, the
    # deployment is polled for up to ~600s, and a FAILED verdict that names only
    # benign pod churn then settles for ~90s. Set too tight, the runner's timeout
    # fires first on a slow sync and a bare "job cancelled after Nm" replaces the
    # actionable error the script was about to print — the diagnosis-hostile
    # failure this job exists to avoid. This is a ceiling, not a spend: the job
    # finishes in a handful of minutes whenever the tenants are healthy.
    # test_job_timeout_stays_above_the_scripts_own_waits derives the floor from
    # the script's constants, so this cannot drift below them unnoticed.
    #
    # 48 → 50 for the FND-831 settle. The lease TTL still clears the hold this
    # is half of (1.5 × (50 + 120) min < 16200s), so it needs no change; at 60
    # it would.
    timeout-minutes: 50
    concurrency:
      # Run-unique, i.e. deliberately NOT a serialising group. Tenant exclusion
      # is the lease's job now (lease-tenant above), and the lease is strictly
      # better at it: it spans this job AND the legs, and it queues rather than
      # evicting all but one waiter.
      #
      # Keying this on the tenant as well would actively hurt. Two runs that both
      # hold no lease yet would still stack up here one-deep, and a third would
      # be evicted with no log — reintroducing the FND-218 failure inside the fix
      # for it. Left run-unique so this job never waits on anything except the
      # lease it already holds.
      group: e2e-prepare-tenant-${{ github.run_id }}-${{ matrix.cloud || 'default' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      E2E_TENANT_MATRIX_JSON: ${{ secrets.E2E_TENANT_MATRIX_JSON }}
      E2E_CLOUD: ${{ matrix.cloud }}
      FALLBACK_SDR_TEST_TENANT: ${{ secrets.SDR_TEST_TENANT }}
      FALLBACK_SDR_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
      FALLBACK_SDR_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
      FALLBACK_ATLAN_API_KEY: ${{ secrets.ATLAN_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow runs in the caller's repo, so the SDK drivers have to be
      # fetched. Sparse + pinned to job.workflow_sha for the same reason as the
      # equivalent checkout in the e2e job: a PR editing these scripts must run
      # its own version, not main's.
      #
      # The lease driver is fetched here too, and the lease check below invokes it
      # directly rather than through the composite action. `uses:` cannot take an
      # expression, so an action reference can only ever be @main — which means a
      # PR that adds a mode to the driver would call a main that does not have it
      # yet and die at argument parsing, and a PR that changes the driver would
      # silently exercise main's copy instead of its own. Both directions of that
      # stale window are closed by running the checked-out driver.
      - name: Fetch SDK CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/actions/e2e-tenant-lease
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          persist-credentials: false

      # Before anything touches the tenant: confirm THIS leg holds THIS cloud's
      # lease. The job's `if:` can only see the lease matrix aggregate, so it
      # cannot tell "my cloud's lease succeeded" from "some cloud's did" — this is
      # what makes the install's precondition true per cloud. Fails the leg rather
      # than installing into a race.
      #
      # It follows the two checkouts because neither touches the tenant; nothing
      # between here and the install may be reordered above it.
      - name: Confirm this run holds the tenant lease
        env:
          APP: ${{ inputs.app-name }}
          CLOUD: ${{ matrix.cloud }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/actions/e2e-tenant-lease/e2e_tenant_lease.py \
            --mode verify \
            --repo "$GITHUB_REPOSITORY" \
            --app "$APP" \
            --cloud "$CLOUD" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      # Two invocations, mask pass first — see the equivalent step in the e2e job
      # for why registering the matrix blob as a secret does not redact the values
      # inside it.
      - name: Resolve e2e tenant for this cloud
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/resolve_e2e_tenant.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" \
            --cloud "$E2E_CLOUD" \
            --fallback-tenant "$FALLBACK_SDR_TEST_TENANT" \
            --fallback-client-id "$FALLBACK_SDR_CLIENT_ID" \
            --fallback-client-secret "$FALLBACK_SDR_CLIENT_SECRET" \
            --fallback-api-key "$FALLBACK_ATLAN_API_KEY" \
            --mask-only
          python3 application-sdk-scripts/.github/scripts/resolve_e2e_tenant.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" \
            --cloud "$E2E_CLOUD" \
            --fallback-tenant "$FALLBACK_SDR_TEST_TENANT" \
            --fallback-client-id "$FALLBACK_SDR_CLIENT_ID" \
            --fallback-client-secret "$FALLBACK_SDR_CLIENT_SECRET" \
            --fallback-api-key "$FALLBACK_ATLAN_API_KEY" \
            >> "$GITHUB_ENV"

      # Reject a tenant we cannot scope a release to, HERE — before atlan.yaml is
      # parsed and before anything is published. The resolver only exports
      # E2E_TENANT_ID from a matrix entry carrying `tenant_id`; the legacy
      # single-tenant fallback path has no entry to carry one, so without this
      # step the run got as far as the publish and then failed inside the script
      # on an empty `--tenant`, several steps deeper than the actual cause.
      #
      # Failing rather than skipping the install, deliberately. Skipping would
      # leave prepare-tenant green having done nothing, the tenant on whatever
      # version it happened to be running, and every leg reding on its version
      # check instead — one confusing failure per leg in place of one clear
      # failure here. A caller without the tenant matrix cannot install at all,
      # so this is a misconfiguration to surface, not a path to degrade into.
      #
      # Reachable only via `--clouds none` now that the install path is the
      # default and the matrix secret is org-wide: FND-203 (#3142) fails the
      # install path at discovery when no matrix is shared, so the un-onboarded
      # case no longer arrives here. What still can is an operator dispatching
      # with e2e_clouds: none, which resolves the single legacy tenant — and that
      # tenant has no matrix entry to carry a tenant_id.
      #
      # A step-level `if:` on the env context rather than a shell `test`, so the
      # branch lives in the expression layer and the `run:` stays straight-line
      # (docs/standards/ci.md). The env context sees values earlier steps wrote to
      # $GITHUB_ENV.
      - name: Require a tenant ID before publishing anything
        if: env.E2E_TENANT_ID == ''
        env:
          CLOUD: ${{ matrix.cloud || 'default' }}
        run: |
          echo "::error::no tenant ID resolved for cloud '${CLOUD}', so a release cannot be scoped to this tenant. GM matches allowed_tenants EXACTLY against the tenant's vcluster instance name (e.g. 'markeznp37') — not its hostname — so there is nothing to fall back to. Add a 'tenant_id' field to this cloud's entry in E2E_TENANT_MATRIX_JSON, alongside 'tenant', 'client_id', 'client_secret' and 'api_key' (see docs/standards/connector-ci-e2e.md). On the legacy single-tenant fallback path there is no matrix entry to add it to: either share the tenant-matrix secret with this repo, or leave install-app-to-tenant off and use the E2E Tenant Install workflow, whose tenant_id input covers the one-off case."
          exit 1

      # app_id / deploy_config / entrypoints / sdk_version all come from
      # atlan.yaml, which parse_atlan_yaml.py already reads for the release path.
      # Reused rather than re-parsed so the e2e registration and the release
      # registration cannot disagree about what the app declares.
      - name: Read atlan.yaml
        id: atlan_yaml
        run: python3 application-sdk-scripts/.github/scripts/parse_atlan_yaml.py

      # Everything reaches the shell through env:, nothing through `${{ }}` inside
      # run:. Three reasons, in descending order of severity:
      #
      #   * `github.head_ref` is the PR's branch name — attacker-controlled on a
      #     fork PR. Interpolated into run:, a crafted branch name is spliced into
      #     the script before bash sees a quote and executes.
      #   * `deploy_config` is multi-line YAML read out of atlan.yaml.
      #     Interpolating multi-line content into a backslash-continued command is
      #     not merely unsafe, it is broken — the newline ends the command.
      #   * `entrypoints` is JSON, so it carries the quotes that would terminate
      #     whichever quoting style wrapped it.
      #
      # Same finding sdk-review raised against e2e-tenant-install.yaml; applied
      # here at the point of writing rather than waiting to be told twice.
      #
      # --app-id is deliberately omitted: the script reads app_id from atlan.yaml
      # in the working directory (and validates the result either way), so the id
      # has one source rather than being threaded through a step output.
      - name: Install the app under test
        id: install
        env:
          IMAGE: ${{ needs.merge-e2e-image.outputs.image }}
          VERSION: ${{ needs.merge-e2e-image.outputs.version }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          DEPLOY_CONFIG: ${{ steps.atlan_yaml.outputs.deploy_config }}
          SDK_VERSION: ${{ steps.atlan_yaml.outputs.sdk_version }}
          ENTRYPOINTS: ${{ steps.atlan_yaml.outputs.entrypoints }}
          RELEASE_MODEL: ${{ steps.atlan_yaml.outputs.release_model }}
          CREATED_BY: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/e2e_tenant_app.py install \
            --base-url "$ATLAN_BASE_URL" \
            --image "$IMAGE" \
            --version "$VERSION" \
            --branch "$BRANCH" \
            --tenant "${E2E_TENANT_ID:-}" \
            --repo-url "$REPO_URL" \
            --deploy-config "$DEPLOY_CONFIG" \
            --sdk-version "$SDK_VERSION" \
            --entrypoints "$ENTRYPOINTS" \
            --release-model "$RELEASE_MODEL" \
            --created-by "$CREATED_BY"
        # --install-retry-seconds is left at its default (600). A freshly
        # published release is not immediately installable: LM resolves the
        # install against its tenant-catalog snapshot, which excludes a release
        # while it is scan_pending and picks it up on the next scheduled sync
        # (~5 min). Worst case here is therefore ~10 min of install retry plus
        # ~10 min of deployment polling — keep this job's timeout-minutes above
        # the sum of the two, or a slow sync reads as a job timeout instead of
        # the actionable error the script would otherwise raise.

      - name: Summarise
        if: always()
        env:
          IMAGE: ${{ needs.merge-e2e-image.outputs.image }}
          SKIPPED: ${{ steps.install.outputs.skipped }}
          RELEASE_STATUS: ${{ steps.install.outputs.release_status }}
          INSTALLED: ${{ steps.install.outputs.installed_version }}
          CLOUD: ${{ matrix.cloud || 'default' }}
        run: |
          {
            echo "### Tenant prepared — ${CLOUD}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Already current (no-op) | \`${SKIPPED:-unknown}\` |"
            echo "| Release status at install | \`${RELEASE_STATUS:-unreadable}\` |"
            echo "| Tenant reports installed | \`${INSTALLED:-unreported}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end (${{ matrix.name }})
    # The image jobs and prepare-tenant are in `needs` so the legs cannot start
    # before them, but all are SKIPPED for a caller that has set
    # install-app-to-tenant: false. That combination needs `always() &&`, and
    # still does after FND-128 flipped the default — an opt-out is now the
    # skipped-needs path this reasoning is about:
    #
    # A job's `needs` gate is evaluated SEPARATELY from its `if:`. Without a
    # status-check function, GitHub applies an implicit success() over every
    # `needs` entry, a skipped need does not satisfy it, and the job is skipped
    # before the `if:` is even consulted — so the explicit `== 'skipped'` clauses
    # below would be dead code and the e2e legs would vanish on the off path.
    #
    # `always()` does NOT reintroduce run-on-failure: the explicit gates still
    # require each need to be success-or-skipped, so a FAILED prepare-tenant stops
    # the legs, which is essential — continuing would test whatever version the
    # tenant happens to run, the exact failure FND-31 removes.
    #
    # Same shape as `connector-tests` in pull_request.yaml, which pairs
    # `always() &&` with `success' || 'skipped'` gates over a skippable
    # build-sdk-base-image need. Found by @sdk-review on #3023.
    #
    # build-e2e-image is gated HERE as well as merge-e2e-image, and it has to be.
    # A failed arch leg leaves merge-e2e-image SKIPPED rather than failed (its own
    # `if:` is not satisfied), and 'skipped' is the benign value in the clause
    # below — so gating on merge alone would let the legs run after a failed
    # build, each building its own single-arch image, against a tenant
    # prepare-tenant never updated, with `expected-app-version` empty so the
    # version check self-skips. A silently passing wrong-version run: precisely
    # what FND-31 exists to make impossible. Adding the intermediate merge job
    # introduced that; naming both needs closes it.
    #
    # lease-tenant is gated here for exactly the reason build-e2e-image is. A
    # failed lease leaves prepare-tenant SKIPPED (its own `if` is not satisfied),
    # and 'skipped' is the benign value below — so omitting it would let every leg
    # run against a tenant nobody installed onto, with expected-app-version empty
    # so the version check self-skips. A silently passing wrong-version run, from
    # the job added to make wrong-version runs impossible.
    needs:
      [
        discover-e2e,
        build-e2e-image,
        merge-e2e-image,
        sdk-head-recheck,
        lease-tenant,
        prepare-tenant,
      ]
    # The superseded clause is gated on the OUTPUT, never on the job result, and
    # it has to be: a skipped lease-tenant is the benign value in the clauses
    # below (it is the install-app-to-tenant:false path), so without this the
    # legs would run against a tenant nobody installed onto with
    # expected-app-version empty — a silently passing wrong-version run, the
    # exact FND-31 failure. Reading the output also keeps a failed recheck
    # fail-open: no answer means carry on (FND-701).
    if: |
      always() &&
      needs.sdk-head-recheck.outputs.superseded != 'true' &&
      needs.discover-e2e.result == 'success' &&
      needs.discover-e2e.outputs.count != '0' &&
      (needs.lease-tenant.result == 'success' || needs.lease-tenant.result == 'skipped') &&
      (needs.prepare-tenant.result == 'success' || needs.prepare-tenant.result == 'skipped') &&
      (needs.build-e2e-image.result == 'success' || needs.build-e2e-image.result == 'skipped') &&
      (needs.merge-e2e-image.result == 'success' || needs.merge-e2e-image.result == 'skipped')
    strategy:
      fail-fast: false
      # Fallback to an empty matrix when discovery was skipped (no label / not
      # dispatched) so fromJson('') doesn't error at job-setup; the `if` above
      # also skips the job in that case.
      matrix: ${{ fromJson(needs.discover-e2e.outputs.matrix || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # Run-unique, so no e2e leg ever queues behind or cancels another. It used
      # to be keyed on github.ref, which on the cross-repo dispatch path is this
      # repo's refs/heads/main for EVERY run — so all concurrent dispatches
      # collapsed into one group, and a group holds only one pending run: a third
      # dispatch cancelled the queued one before it was ever given a runner, with
      # no log to say so (FND-218).
      #
      # Serialising tenant access is the lease's job now (lease-tenant), and the
      # lease does it properly — across the install and the legs, with a queue
      # instead of a single slot. That leaves this group with nothing to
      # serialise, so it identifies the run and nothing else.
      #
      # cancel-in-progress stays false, and deliberately so: cancelling a leg
      # mid-flight abandons a live Automation Engine run, and there is no cleanup
      # path for the tenant state it leaves behind. Turning it on needs that
      # cleanup path first (FND-252) — test_label_trigger_gates.py pins this so
      # the decision cannot be taken by accident, and it has already caught one
      # attempt. The cost of leaving it false is a superseded commit's leg running
      # to the 120-minute ceiling while holding the tenant lease.
      group: tests-e2e-${{ github.run_id }}-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
      # For the dataforge fetch's OIDC path (no stored dataforge secret): the
      # runner mints a per-run identity token the script exchanges for a 1h
      # credentials:read token. Harmless when the dataforge inputs are unset.
      id-token: write
    env:
      # SDR_TEST_TENANT / SDR_CLIENT_ID / SDR_CLIENT_SECRET / ATLAN_API_KEY /
      # ATLAN_BASE_URL are deliberately NOT set here any more. They are written
      # per-leg by the resolver step below, from whichever source applies to this
      # leg. Setting them here as well would leave the runner's job-env-versus-
      # $GITHUB_ENV precedence load-bearing for whether a leg hits the right
      # tenant — a silent wrong-tenant run is indistinguishable from a right one
      # in the logs, since the host is masked. One writer, no precedence.
      E2E_TENANT_MATRIX_JSON: ${{ secrets.E2E_TENANT_MATRIX_JSON }}
      E2E_CLOUD: ${{ matrix.cloud }}
      FALLBACK_SDR_TEST_TENANT: ${{ secrets.SDR_TEST_TENANT }}
      FALLBACK_SDR_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
      FALLBACK_SDR_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
      FALLBACK_ATLAN_API_KEY: ${{ secrets.ATLAN_API_KEY }}
      GIT_LFS_SKIP_SMUDGE: ${{ inputs.git-lfs-skip-smudge && '1' || '' }}
      # See the integration job: needed as env for the step-level `if:` gates.
      E2E_SOURCE_ENV_JSON: ${{ secrets.E2E_SOURCE_ENV_JSON }}
      DATAFORGE_RESOURCE_ID: ${{ secrets.DATAFORGE_RESOURCE_ID }}
      GIT_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
    steps:
      - name: distinct-id ${{ inputs.distinct-id }}
        if: inputs.distinct-id != ''
        shell: bash
        run: echo "Dispatched with distinct-id=${{ inputs.distinct-id }}"

      # See the unit job: the sdr-e2e action runs `uv sync` on the RUNNER as
      # well as in the image, so a native sdist build needs its headers here
      # too. The IMAGE build is not covered — the Dockerfile owns its own
      # system deps.
      - name: Install system packages (apt-packages)
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          echo "Validating and installing apt packages: $APT_PACKAGES"
          printf '%s' "$APT_PACKAGES" | tr '\n' ' ' \
            | grep -xE '[a-z0-9][a-z0-9+.-]*([[:space:]]+[a-z0-9][a-z0-9+.-]*)*' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SDK CI scripts. Used here rather than passing the payloads to the
      # composite action below, because every action this workflow calls is
      # pinned @main: an input added on a feature branch is silently ignored
      # until it lands. Sparse-checks-out only .github/scripts.
      #
      # Unconditional since FND-6: resolve_e2e_tenant.py lives in the same sparse
      # path and every leg needs it, whereas export_extra_env.py is only needed
      # when the connector declares source credentials.
      - name: Fetch SDK CI scripts (tenant resolution, source-credential export)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          # See the integration job above for why this is job.workflow_sha.
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/actions/globalprotect-connect
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          # Falls back to the run's own token because this step became
          # unconditional. It used to run only when the caller declared
          # E2E_SOURCE_ENV_JSON — a repo that already had ORG_PAT_GITHUB — so an
          # empty PAT was unreachable; now every e2e leg hits it, and passing
          # `token: ''` explicitly overrides checkout's own default and 403s on
          # the clone. application-sdk is public, so github.token is sufficient
          # and this is a strictly wider set of callers that can fetch, not a
          # privilege escalation.
          token: ${{ secrets.ORG_PAT_GITHUB || github.token }}
          persist-credentials: false

      # This leg's tenant. Takes E2E_TENANT_MATRIX_JSON[E2E_CLOUD] when both are
      # set and the FALLBACK_* values otherwise, then writes SDR_TEST_TENANT,
      # SDR_CLIENT_ID, SDR_CLIENT_SECRET, ATLAN_API_KEY and the derived
      # ATLAN_BASE_URL — the env the sdr-e2e action and the pytest harness read.
      # Must precede every step that touches the tenant, so it sits ahead of the
      # source-credential export as well as the action itself.
      #
      # Two invocations for the same reason as the export below: `--mask-only`
      # writes ::add-mask:: to the log, and the second call's stdout is the env
      # file. Masks first, so nothing reaches $GITHUB_ENV before it is redactable.
      - name: Resolve e2e tenant for this leg
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/resolve_e2e_tenant.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" \
            --cloud "$E2E_CLOUD" \
            --fallback-tenant "$FALLBACK_SDR_TEST_TENANT" \
            --fallback-client-id "$FALLBACK_SDR_CLIENT_ID" \
            --fallback-client-secret "$FALLBACK_SDR_CLIENT_SECRET" \
            --fallback-api-key "$FALLBACK_ATLAN_API_KEY" \
            --mask-only
          python3 application-sdk-scripts/.github/scripts/resolve_e2e_tenant.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" \
            --cloud "$E2E_CLOUD" \
            --fallback-tenant "$FALLBACK_SDR_TEST_TENANT" \
            --fallback-client-id "$FALLBACK_SDR_CLIENT_ID" \
            --fallback-client-secret "$FALLBACK_SDR_CLIENT_SECRET" \
            --fallback-api-key "$FALLBACK_ATLAN_API_KEY" \
            >> "$GITHUB_ENV"

      # See the integration job above for why this is two invocations, why the
      # `--mask-only` pass has to come first, and why `set -e` is explicit.
      - name: Export connector source credentials
        if: env.E2E_SOURCE_ENV_JSON != ''
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$E2E_SOURCE_ENV_JSON" --mask-only
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$E2E_SOURCE_ENV_JSON" >> "$GITHUB_ENV"

      # ── source resolution (FND-205) ───────────────────────────────────────
      # Precedence is REPO-CREDS-FIRST, to keep the VPN off the hot path: when
      # the caller provides E2E_SOURCE_ENV_JSON (repo creds, exported above),
      # the whole dataforge chain self-skips — every step gates on
      # `E2E_SOURCE_ENV_JSON == ''` — so no VPN is dialled. Only with NO repo
      # creds does an opted-in leg (dataforge-datasource set) fetch from
      # dataforge over the VPN. Every dataforge step is continue-on-error — when
      # the fetch cannot complete (VPN, binding, dataforge down), the connector's
      # hermetic source carries the run instead of failing it.
      #
      # Atlan's internal ELBs share Docker's default 172.17/16 bridge subnet;
      # re-subnet Docker BEFORE the tunnel so containers keep working while
      # 172.17/16 routes via tun0 (deleting the docker0 route instead breaks
      # buildx — atlan-postgres-app run 31571886125).
      - name: Move docker networks off Atlan's 172.17/16 (dataforge path)
        if: inputs.dataforge-datasource != '' && env.E2E_SOURCE_ENV_JSON == ''
        continue-on-error: true
        run: |
          set -e
          sudo mkdir -p /etc/docker
          echo '{"bip": "192.168.49.1/24", "default-address-pools": [{"base": "192.168.128.0/17", "size": 24}]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # dataforge's api host and the provisioned sources admit only the VPN
      # egress IPs. This repo's own globalprotect-connect action (unmodified),
      # from the job.workflow_sha sparse checkout — same provenance pinning
      # as the scripts. The health probe targets the dataforge api host —
      # the thing this tunnel actually has to reach. KNOWN LIMIT: the
      # action derives its GP client identity from run/job/attempt, and
      # GITHUB_JOB is identical across matrix legs, so concurrent legs can
      # displace each other's sessions — the fetch then falls back to repo
      # creds by design. A better run strategy is tracked on FND-279.
      - name: Connect to GlobalProtect VPN (dataforge path)
        if: inputs.dataforge-datasource != '' && env.E2E_SOURCE_ENV_JSON == ''
        continue-on-error: true
        uses: ./application-sdk-scripts/.github/actions/globalprotect-connect
        with:
          portal-url: ${{ vars.GLOBALPROTECT_PORTAL_URL }}
          username: ${{ secrets.GLOBALPROTECT_USERNAME }}
          password: ${{ secrets.GLOBALPROTECT_PASSWORD }}
          mothership-url: https://api.dataforge.atlan.dev
          # This is a MATRIX job, so the action's default identity (run id +
          # GITHUB_JOB + attempt) is the same string for every leg and the legs
          # evict each other's VPN sessions — last connect wins, the rest fail
          # the crawl on an unreachable source. matrix.name is the per-leg
          # discriminator (suite x cloud), so each leg is its own "computer".
          client-suffix: ${{ matrix.name }}

      # Dataforge-sourced connector credentials. The fetch's stdout is
      # captured into a shell variable — values never reach the log — and
      # handed to export_extra_env.py, whose mask-first two-pass protocol is
      # the audited path into $GITHUB_ENV. One fetch feeds both passes, so
      # the masked strings and the written strings can never diverge. Auth is
      # the run's GitHub OIDC token exchanged at dataforge — no stored
      # dataforge secret (needs the job's id-token permission and a
      # dataforge workload binding for the repo).
      - name: Fetch connector source credentials from dataforge
        if: inputs.dataforge-datasource != '' && env.E2E_SOURCE_ENV_JSON == ''
        continue-on-error: true
        env:
          DF_DATASOURCE: ${{ inputs.dataforge-datasource }}
          DF_MODE: ${{ inputs.dataforge-mode }}
          DF_ENV_TIER: ${{ inputs.dataforge-env-tier }}
          DF_OUTPUT_PREFIX: ${{ inputs.dataforge-output-prefix }}
        run: |
          set -euo pipefail
          DF_ENV_JSON="$(python3 application-sdk-scripts/.github/scripts/fetch_dataforge_source.py \
            --datasource "$DF_DATASOURCE" \
            --mode "$DF_MODE" \
            --resource-id "$DATAFORGE_RESOURCE_ID" \
            --env-tier "$DF_ENV_TIER" \
            --output-prefix "$DF_OUTPUT_PREFIX")"
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$DF_ENV_JSON" --mask-only
          python3 application-sdk-scripts/.github/scripts/export_extra_env.py \
            --json "$DF_ENV_JSON" >> "$GITHUB_ENV"

      # E2E_SOURCE_DATASOURCE is a non-secret breadcrumb the fetch exports on
      # success — its presence is the source-selection signal. When nothing
      # resolved AND the connector declared no hermetic option, fail HERE —
      # one minute in, with the actual fix in the message — rather than
      # letting the leg limp to the extract node and die on a cryptic
      # empty-credential auth failure.
      - name: Resolve e2e source (fail fast when none)
        if: inputs.dataforge-datasource != ''
        env:
          DF_HERMETIC_FALLBACK: ${{ inputs.dataforge-hermetic-fallback }}
        run: python3 application-sdk-scripts/.github/scripts/resolve_e2e_source.py

      # See the unit job for why this gates on the token, not just the flag.
      - name: Require ORG_PAT_GITHUB when private-git-deps is set
        if: inputs.private-git-deps && env.GIT_TOKEN == ''
        run: |
          echo "::error::private-git-deps is true but ORG_PAT_GITHUB is unset"
          exit 1

      # The sdr-e2e action runs `uv sync` on the RUNNER as well as in the image
      # build, so the token rewrite is needed here too — `git-token` below only
      # reaches the Docker build.
      - name: Authenticate private atlanhq git dependencies
        if: inputs.private-git-deps && env.GIT_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "https://github.com/atlanhq/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "ssh://git@github.com/atlanhq/"

      # uv on the host for the sdr-e2e action's `uv run pytest` + summary steps.
      # The action self-installs uv only when application-sdk-ref is set
      # (SDK-PR dispatch); the plain-label path (empty ref) otherwise has no uv
      # and fails with `uv: command not found`. Install it unconditionally here.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - uses: atlanhq/application-sdk/.github/actions/sdr-e2e@main
        with:
          app-name: ${{ inputs.app-name }}
          app-image-name: ${{ inputs.app-image-name }}
          # Reuse the merged manifest the build legs pushed and prepare-tenant
          # installed, instead of rebuilding the identical deterministic tag per
          # leg. The merged reference, not a per-arch one: compose pulls this on
          # the runner and resolves it to amd64 itself. Empty on the non-install
          # path, which keeps each leg building its own image exactly as before.
          prebuilt-image: ${{ needs.merge-e2e-image.outputs.image }}
          # Re-assert the tenant version immediately before pytest. prepare-tenant
          # already verified it, but the installation is tenant-scoped and there is
          # no cross-job lease — another run can replace it in between. Empty
          # disables the check, so an unadopted repo is untouched.
          expected-app-version: ${{ needs.merge-e2e-image.outputs.version }}
          # One suite per leg (the matrix file), not the whole e2e directory.
          test-path: ${{ matrix.file }}
          # Full-DAG defaults carried over from e2e-full-reusable.yaml. The
          # full-DAG pipeline lives alongside the SDR (testcontainer) pipeline
          # in connector repos, so these must be explicit — otherwise the action
          # falls back to the SDR component/compose set (wrong stack).
          secrets-script: .github/e2e/make-secrets-e2e-full.py
          components-dir: .github/e2e/e2e-full-components
          compose-overlay: .github/e2e/e2e-full-docker-compose.yaml
          # Force the full-DAG config dir even when the repo also has a
          # .github/sdr-e2e/ (testcontainer) setup, which the action would
          # otherwise prefer — see the action's `config-dir` input.
          config-dir: .github/e2e
          # Bump the container-health wait because the worker has to establish
          # the Temporal connection with TLS + auth before /server/health greens.
          container-health-timeout-seconds: ${{ inputs.container-health-timeout-seconds }}
          # This job IS the full-DAG pipeline, so layer the SDK-owned
          # queue-alignment overlay (docker-compose.full-dag.yml): it passes the
          # per-leg ATLAN_DEPLOYMENT_NAME through to the worker so it registers
          # on the queue the harness dispatches the extract node to. Without it,
          # alignment depends entirely on the app carrying a byte-identical
          # per-app overlay — and a connector with no `.github/e2e/
          # e2e-full-docker-compose.yaml` (the chain builder skips a missing
          # overlay silently) gets no alignment at all, surfacing 90 minutes
          # later as "No Workers Running". App overlays layer ABOVE this one, so
          # connectors that already carry theirs are unaffected.
          full-dag: "true"
          # `-s` streams the harness poll-loop output in real time — each leg is
          # a single sequential pytest process, so this is live per-job again.
          pytest-extra-args: "-s"
          # Unique per-leg artifact name so parallel legs don't collide on
          # upload-artifact (which rejects duplicate names within a run).
          artifact-suffix: ${{ matrix.name }}
          # One slim summary is posted by the Tests Gate; suppress the per-leg
          # connector-PR comment so N legs don't post N comments.
          post-pr-comment: "false"
          application-sdk-ref: ${{ inputs.application-sdk-ref }}
          runtime-sdk-ref: ${{ inputs.runtime-sdk-ref }}
          harness-sdk-ref: ${{ inputs.harness-sdk-ref }}
          base-image-ref: ${{ inputs.base-image-ref }}
          enable-two-store: ${{ inputs.two-store }}
          source-available: ${{ inputs.source-available }}
          # Push the test image with the org PAT (same identity build-and-publish
          # uses) so it can write PAT-published connector packages — a plain
          # GITHUB_TOKEN 403s on those (e.g. atlan-redshift-app). Available here
          # because callers invoke this reusable with `secrets: inherit`.
          ghcr-token: ${{ secrets.ORG_PAT_GITHUB }}
          # Forwarded to the image build as the `git_token` build secret so a
          # Dockerfile whose `uv sync` clones a private atlanhq dependency can
          # authenticate. Same identity/availability rationale as ghcr-token; a
          # Dockerfile that declares no such secret mount simply ignores it.
          git-token: ${{ secrets.ORG_PAT_GITHUB }}

  # ── Hand the tenant to whoever is next in the queue ──────────────────────
  # Prompt release, not the mechanism that makes the lease safe. GitHub cancels
  # queued jobs rather than running them, so on a cancelled run this job never
  # starts at all and `if: always()` does not help — which is why liveness is
  # derived from the holder's run status instead, and any later contender reaps a
  # ticket whose run is over. This job just means the next run waits seconds
  # rather than one poll interval.
  #
  # It never fails the workflow: the driver returns 0 whether or not a ticket was
  # there to delete, so a release hiccup cannot redden a run whose tests passed.
  release-tenant:
    name: Release tenant lease (${{ matrix.cloud || 'default' }})
    needs: [discover-e2e, lease-tenant, prepare-tenant, e2e]
    # Still a per-cloud MATRIX while the acquire is one ordered job (FND-646), and
    # deliberately so: release cannot block, is ownership-checked, and is
    # idempotent, so there is no hold-and-wait to remove here — and one leg per
    # cloud keeps a single wedged DELETE from holding the others' tenants.
    #
    # Gated on lease-tenant having RUN, not on it having succeeded. When acquire
    # was a matrix, `== 'success'` meant one cloud's acquire timing out skipped
    # the release for EVERY cloud, including those that had acquired — their
    # leases then waited for the next contender's reaper instead of being handed
    # back. The ordered acquire hands its own leases back on the way out of a
    # failure, so this is now a backstop rather than the primary path, but it must
    # stay one: a lease job that dies outright releases nothing.
    #
    # Safe to widen because the release driver checks ownership before deleting:
    # a leg for a cloud this run never held reads a lease that is not its own (or
    # none at all) and no-ops. Not gated on the legs' outcome either — a failed
    # leg must still give the tenant back.
    if: always() && needs.lease-tenant.result != 'skipped'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-e2e.outputs.cloud-count != '0' && needs.discover-e2e.outputs.cloud-matrix || '{"include":[{"cloud":""}]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Release the tenant lease
        uses: atlanhq/application-sdk/.github/actions/e2e-tenant-lease@main
        with:
          mode: release
          app: ${{ inputs.app-name }}
          cloud: ${{ matrix.cloud }}

  # ── Callback: report the result back to the application-sdk PR/commit ────
  # that dispatched this run. application-sdk's e2e-apps composite
  # (wait-mode: callback) creates an in_progress check run on its own SHA
  # before dispatching, then exits without polling; this job is the push
  # that completes it the instant this run finishes — no polling on either
  # side. Only fires on the cross-repo dispatch path: application-sdk-ref is
  # empty on the connector's own same-repo pull_request/push runs.
  report-to-sdk:
    name: Report to application-sdk
    # The SAME set the Tests Gate aggregates, because this job now reports the
    # SAME verdict: the mirrored `Connector E2E run / <app>` check on the
    # dispatching SDK PR must say what this run's gate says. It previously
    # needed a strict subset (no detect-merge-queue, no discover-e2e, none of
    # the install path) and re-derived its own conclusion from it, which is
    # exactly how a connector run with a red Tests Gate reported green on the
    # SDK side.
    needs:
      [
        unit,
        detect-merge-queue,
        detect-integration,
        integration,
        discover-e2e,
        build-e2e-image,
        merge-e2e-image,
        sdk-head-recheck,
        lease-tenant,
        prepare-tenant,
        e2e,
      ]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.application-sdk-ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The Checks API's write endpoints (create/update a check run) reject
      # PATs outright — "You must authenticate via a GitHub App" — only a
      # real GitHub App installation token works. ORG_PAT_GITHUB can't do
      # the "Complete the check run" step below at all; mint a scoped
      # atlan-app-fleet token instead (same one used for the checkout, so
      # this job touches application-sdk with a single credential).
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      # Pinned to the exact SHA that dispatched this run (not `main`): that
      # SHA is what created the check run we're about to complete, so a PR
      # that *modifies* the callback scripts self-tests its own version (the
      # scripts don't exist on `main` until such a PR lands — the fallback
      # below is skipped whenever the pinned ref already carries them).
      - name: Checkout application-sdk callback script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ inputs.application-sdk-ref }}
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts

      # A dispatching SDK PR branch that forked *before* the callback scripts
      # merged (and never picked up main since) checks out a ref that lacks
      # build_callback_summary.py — the callback then hard-fails on a missing
      # file even though the connector tests passed, leaving the check stuck
      # in_progress until the 130-min watchdog flips it to timed_out (a red
      # result for a green run). Fall back to main's scripts for those stale
      # refs. Only the *script source* falls back — the check run still
      # completes on the dispatching SHA via `--sha`, so nothing about which
      # commit gets the result changes. `hashFiles() == ''` is a step-level
      # expression, not inlined conditional shell, so it stays within the CI
      # authoring rule (no branching logic in `run:` blocks).
      # Clear the incomplete pinned-ref checkout before re-checking out from
      # main into the same path. `actions/checkout` already defaults to
      # `clean: true`, so this is belt-and-suspenders — it makes the "one
      # path, two checkouts" pattern self-evidently clean for future readers.
      # Gated on the SAME condition as the fallback: on the happy path (pinned
      # ref carries the scripts) it is skipped, so the good checkout is never
      # deleted and the fallback stays skipped — the PR-self-test property is
      # preserved. Straight-line `rm`, no branching in the shell, per the CI
      # authoring rule.
      - name: Clear the stale sparse checkout before falling back
        if: hashFiles('application-sdk-scripts/.github/scripts/build_callback_summary.py') == ''
        run: rm -rf application-sdk-scripts

      - name: Fall back to main callback scripts if pinned SHA predates them
        id: scripts-fallback
        if: hashFiles('application-sdk-scripts/.github/scripts/build_callback_summary.py') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts

      # `outcome == 'success'` is true only when the fallback step actually
      # ran (skipped when the pinned ref already had the scripts), so the
      # warning fires exactly on the stale-ref path.
      - name: Warn that the dispatching SDK ref was stale
        if: steps.scripts-fallback.outcome == 'success'
        env:
          SDK_REF: ${{ inputs.application-sdk-ref }}
        run: echo "::warning::Dispatching application-sdk ref ${SDK_REF} predates the callback scripts; used main's copy instead. Merge main into that SDK branch to silence this."

      # `pattern` + merge-multiple, not the bare `name`. Since FND-6 the e2e
      # matrix suffixes each leg's artifact with the leg name, so the exact
      # un-suffixed name matched nothing and this download quietly no-opped
      # under continue-on-error — build_callback_summary.py then fell back to
      # its plain body on every cross-CSP run.
      #
      # merge-multiple is right HERE and wrong in the scorecard job, for the
      # same reason in both places: it flattens every leg into one directory, so
      # same-named files overwrite. What this step wants is exactly one rendered
      # pr-comment-body.md; what the scorecard wants is every leg's junit kept
      # apart. The body is one arbitrary leg's, which is why the authoritative
      # verdict is the gate line appended below rather than anything in it.
      - name: Download connector e2e results
        if: needs.e2e.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: sdr-integration-tests-${{ inputs.app-name }}*-results
          merge-multiple: true
          path: connector-results

      # THE verdict. Same action, same inputs as the Tests Gate job below, so
      # the mirrored check on the dispatching SDK PR and this run's required
      # check are one decision evaluated twice rather than two decisions that
      # can disagree. Pinned at @main (not the dispatching SDK ref) on purpose:
      # the action and its driver are checked out together, so unlike the
      # callback scripts below there is no ref-skew to guard against.
      - name: Evaluate Tests Gate (the conclusion this callback reports)
        id: gate
        uses: atlanhq/application-sdk/.github/actions/verify-test-gate@main
        with:
          unit-result: ${{ needs.unit.result }}
          integration-result: ${{ needs.integration.result }}
          detect-integration-result: ${{ needs.detect-integration.result }}
          detect-merge-queue-result: ${{ needs.detect-merge-queue.result }}
          discover-e2e-result: ${{ needs.discover-e2e.result }}
          build-e2e-image-result: ${{ needs.build-e2e-image.result }}
          merge-e2e-image-result: ${{ needs.merge-e2e-image.result }}
          lease-tenant-result: ${{ needs.lease-tenant.result }}
          prepare-tenant-result: ${{ needs.prepare-tenant.result }}
          e2e-result: ${{ needs.e2e.result }}
          # Explains a skipped matrix as a deliberate stand-down rather than the
          # misconfiguration the matrix-skipped anomaly exists to catch. Empty
          # (the recheck job skipped, or it failed and wrote no answer) reads as
          # "not explained", which is the correct default: the anomaly is what
          # stops a future re-wiring of the e2e `if` from greening the gate by
          # skipping it (FND-701).
          superseded: ${{ needs.sdk-head-recheck.outputs.superseded }}

      # Body only — this step emits no verdict; the completion step below takes
      # the gate's. Its CLI stays frozen: this script is checked out from the
      # DISPATCHING SDK ref, which can be older than the workflow (always
      # @main), so a new flag here would make every in-flight SDK PR's callback
      # die on `unrecognized arguments`.
      - name: Build summary
        id: report
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DETECT_INTEGRATION_RESULT: ${{ needs.detect-integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          UNIT_SUMMARY: ${{ needs.unit.outputs.summary }}
          INTEGRATION_SUMMARY: ${{ needs.integration.outputs.summary }}
        run: |
          python3 application-sdk-scripts/.github/scripts/build_callback_summary.py \
            --unit-result "$UNIT_RESULT" \
            --integration-result "$INTEGRATION_RESULT" \
            --detect-integration-result "$DETECT_INTEGRATION_RESULT" \
            --e2e-result "$E2E_RESULT" \
            --unit-summary "$UNIT_SUMMARY" \
            --integration-summary "$INTEGRATION_SUMMARY"

      # The body above is built from the four results that script has always
      # taken, so on the paths it cannot see (a failed image build, a skipped
      # matrix) it would render a benign "**e2e:** skipped" under a failure
      # conclusion. Append the gate's own rendered verdict so the check run a
      # reviewer opens on the SDK PR states the cause. Straight-line appends —
      # no branching in the shell, per docs/standards/ci.md — and it works for
      # both the artifact-rendered report and the fallback body.
      - name: Append the gate verdict to the check-run body
        env:
          SUMMARY_FILE: ${{ steps.report.outputs.summary_file }}
          OVERALL_STATUS: ${{ steps.gate.outputs.overall-status }}
          E2E_STATUS: ${{ steps.gate.outputs.e2e-status }}
        run: |
          set -euo pipefail
          {
            printf '\n---\n\n'
            printf '**Tests Gate:** %s\n' "$OVERALL_STATUS"
            printf '**e2e:** %s\n' "$E2E_STATUS"
          } >> "$SUMMARY_FILE"

      - name: Complete the check run on application-sdk
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ inputs.application-sdk-ref }}
          REPO_SHORT: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 application-sdk-scripts/.github/scripts/complete_check_run.py \
            --repo atlanhq/application-sdk \
            --sha "$SHA" \
            --name "Connector E2E run / ${REPO_SHORT}" \
            --conclusion "${{ steps.gate.outputs.conclusion }}" \
            --summary-file "${{ steps.report.outputs.summary_file }}" \
            --details-url "$RUN_URL"

  # ── Test-readiness scorecard (per-tier aggregation) ──────────────────────
  # Combines the unit + integration + e2e jobs' evidence (junit + coverage.json)
  # into one quantified scorecard artifact. Non-PR only (push / merge_group),
  # where unit and integration actually ran — on a PR integration is skipped, so
  # a scorecard would misreport it. Best-effort and NOT part of the Tests Gate: a
  # failure here (or an older published conformance predating the per-tier CLI)
  # only warns.
  #
  # ── Why e2e evidence is sparse, and why that is the design (FND-33) ──────
  # This job runs on push/merge_group; discover-e2e/e2e run on
  # `workflow_dispatch + run_e2e=true` or an `e2e`-labelled PR. The two barely
  # intersect: only a dispatched run on the default branch carries both. Three
  # ways out were considered and this is the one that survives contact with how
  # the artifact is consumed:
  #
  #   * Also run on the e2e-labelled PR path — DEAD. update-dashboard.yaml picks
  #     the newest DEFAULT-BRANCH Tests run carrying a live scorecard artifact,
  #     so a PR-run scorecard is never ingested. Worse, on a PR the integration
  #     job is skipped, so such a scorecard would publish a zeroed integration
  #     tier: a fabricated regression, which is exactly what this job's `if:`
  #     already exists to prevent.
  #   * A separate durable e2e record connector-pulse reads independently —
  #     a larger build, and premature: nothing yet needs e2e evidence at a
  #     cadence the scorecard cannot supply.
  #   * Accept sparsity, and make ABSENCE HONEST — this. When e2e did not run,
  #     the tier stays `applicable: false` and the `e2e-present` gate stays
  #     `na`: excluded from the aggregate, no grade cap, not scored zero.
  #
  # The consequence to hold onto: a routine push emits a scorecard that says
  # "e2e not measured", never "e2e failing". connector-pulse must render the
  # e2e tier's absence as unknown, not as a zero.
  #
  # The cross-CSP fields are what carry rollout visibility between those sparse
  # runs (FND-34): `configured` is derivable from the tenant-matrix secret alone
  # and so lands on EVERY emission, while `observed` rides along only when e2e
  # ran. Both are descriptive — no Check reads them and no Gate caps on them, so
  # recording them cannot move any app's grade.
  scorecard:
    name: Test-readiness scorecard
    # discover-e2e and e2e join `needs` so their evidence and their resolved
    # cloud list are reachable. `always()` is already in the `if:` below, which
    # is what keeps a SKIPPED e2e (the routine case) from skipping this job —
    # a job's `needs` gate is evaluated separately from its `if:`, and without a
    # status-check function GitHub applies an implicit success() that a skipped
    # need does not satisfy.
    needs: [unit, detect-integration, integration, discover-e2e, e2e]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Job-level so the step-level `if:` below can read it — a step condition
      # cannot reference the `secrets` context directly. Same shape as
      # discover-e2e, deliberately: both answer "is this repo wired for the
      # cross-CSP matrix", and two different answers would be a bug.
      HAS_TENANT_MATRIX: ${{ secrets.E2E_TENANT_MATRIX_JSON != '' && 'true' || '' }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      # The SDK's arg builder and the discovery driver. `ref: job.workflow_sha`
      # rather than @main for the reason discover-e2e gives at length: a script
      # pulled at the workflow's own SHA is testable on the branch that changes
      # it, whereas an action pinned @main cannot see a change until it lands.
      # `repository:` stays hardcoded so the executed payload's provenance is
      # pinned; application-sdk is public, so the caller's default token reads it
      # when ORG_PAT_GITHUB is not shared.
      - name: Fetch SDK CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/actions/discover-e2e-suites
          sparse-checkout-cone-mode: false
          path: application-sdk-scripts
          token: ${{ secrets.ORG_PAT_GITHUB || github.token }}
          persist-credentials: false

      # Both downloads are best-effort: unit always uploads its artifact, but
      # integration is absent when it had no suite / was skipped — the CLI then
      # scores an empty (zero) integration tier, which correctly counts against.
      - name: Download unit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: unit-test-coverage
          path: unit-evidence

      - name: Download integration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: integration-test-results
          path: integration-evidence

      # `pattern:` with merge-multiple LEFT OFF, and that is the whole point:
      # the e2e matrix emits one artifact per suite × cloud leg (FND-6) and each
      # carries a junit at the SAME inner path, so merging would have the legs
      # overwrite each other and the scorecard would silently score one leg as
      # if it were the run. Unmerged, each lands under its own artifact-named
      # directory and the CLI's glob picks up all of them.
      #
      # The pattern also matches the legacy un-suffixed name, so a caller still
      # emitting a single e2e artifact is covered by the same expression.
      #
      # Best-effort: no e2e run means no artifacts, `download-artifact` fails,
      # and the glob below resolves to nothing — which the CLI reads as "e2e not
      # applicable", never as "e2e scored zero".
      - name: Download e2e evidence (one artifact per leg)
        if: needs.e2e.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: sdr-integration-tests-${{ inputs.app-name }}*-results
          path: e2e-evidence

      # ── What this repo is WIRED for, whether or not e2e ran (FND-34) ───────
      # The rollout signal. It needs no e2e run — only the tenant matrix's key
      # list and the requested fan-out — so it lands on every scorecard emission,
      # which is what makes an un-onboarded repo distinguishable from a covered
      # one at the point of central visibility. The `::warning::` in
      # discover-e2e is the only other signal, and it is per-run, ephemeral, and
      # buried in one app repo's Actions log.
      - name: Read the tenant matrix's cloud keys
        id: matrix-clouds
        if: inputs.enable-e2e && env.HAS_TENANT_MATRIX != ''
        env:
          E2E_TENANT_MATRIX_JSON: ${{ secrets.E2E_TENANT_MATRIX_JSON }}
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/scripts/e2e_tenant_matrix_clouds.py \
            --matrix-json "$E2E_TENANT_MATRIX_JSON" >> "$GITHUB_OUTPUT"

      # The same driver, the same `clouds` expression and the same narrowing as
      # discover-e2e — so `configured` is the list discovery WOULD resolve, not
      # an independent re-derivation that could drift from it. Duplicated
      # verbatim for the reason the second discover call in discover-e2e gives:
      # a hand-rolled equivalent is new untested logic doing what the driver
      # already does.
      #
      # continue-on-error because this must never redden a reporting job:
      # `--clouds-only` exits non-zero when narrowing would leave no clouds at
      # all, and the step's `outcome` is then the "not known" signal that omits
      # the field entirely.
      - name: Resolve the clouds this repo is configured for
        id: configured-clouds
        if: inputs.enable-e2e
        continue-on-error: true
        env:
          CLOUDS: ${{ secrets.E2E_TENANT_MATRIX_JSON == '' && 'none' || inputs.e2e-clouds }}
          AVAILABLE_CLOUDS: ${{ steps.matrix-clouds.outputs.clouds }}
        run: |
          set -euo pipefail
          python3 application-sdk-scripts/.github/actions/discover-e2e-suites/discover_e2e_suites.py \
            --clouds-only \
            --clouds "$CLOUDS" \
            --available-clouds "$AVAILABLE_CLOUDS" >> "$GITHUB_OUTPUT"

      - name: Generate test-readiness scorecard
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OUT: results/test-readiness.json
          UNIT_JUNIT: unit-evidence/results/test-results.xml
          UNIT_COVERAGE: unit-evidence/coverage.json
          INTEGRATION_JUNIT: integration-evidence/results/test-results.xml
          INTEGRATION_COVERAGE: integration-evidence/coverage.json
          # Quoted through to the CLI, which expands it: the legs' artifact
          # directories are only known at download time, and expanding it in the
          # shell would need a loop this file is not allowed to contain
          # (docs/standards/ci.md).
          E2E_JUNIT_GLOB: e2e-evidence/*/results/sdr-test-results.xml
          E2E_RESULT: ${{ needs.e2e.result }}
          CONFIGURED_CLOUDS: ${{ steps.configured-clouds.outputs.clouds }}
          CONFIGURED_KNOWN: ${{ steps.configured-clouds.outcome == 'success' }}
          OBSERVED_CLOUDS: ${{ needs.discover-e2e.outputs.clouds }}
        run: |
          [ -f unit-evidence/results/test-results.xml ] || { echo "no unit junit; skipping scorecard"; exit 0; }
          mkdir -p results
          # All conditional argument-building lives in the tested script, so this
          # block stays straight-line (docs/standards/ci.md).
          mapfile -t sc_args < <(python3 application-sdk-scripts/.github/scripts/build_scorecard_args.py)
          # Trailing `|| echo` keeps this non-blocking: an older published
          # conformance without the per-tier/e2e CLI must never redden the run.
          #
          # There IS a window. `uvx` resolves the newest PUBLISHED conformance,
          # and --cross-cloud-configured / a repeatable --e2e-junit only exist
          # from 0.21.0; until that publishes, argparse rejects them, this step
          # warns, and no scorecard artifact is produced for that run. The
          # dashboard already tolerates that — update-dashboard.yaml walks back
          # through the last 20 completed runs for one that still carries a live
          # scorecard — and the same gap was accepted when the per-tier flags
          # landed ahead of 0.17.0. It closes on the next conformance release.
          uvx atlan-application-sdk-conformance scorecard "${sc_args[@]}" \
            || echo "::warning::test-readiness scorecard generation failed (skipped)"

      # `upload-artifact` classifies the artifact service's finalize 403 as
      # non-retryable and fails on the first occurrence, even though the bytes
      # already landed and the next attempt normally succeeds. That failed the
      # job, which failed the aggregate gate, which ejected the merge-queue
      # entry. So: retry once, and never fail the gate on it:
      # the scorecard is reporting, not a gate.
      - name: Upload scorecard
        id: upload-scorecard
        if: hashFiles('results/test-readiness.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-readiness-scorecard
          path: results/test-readiness.json
          retention-days: 14

      - name: Upload scorecard (retry)
        if: steps.upload-scorecard.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-readiness-scorecard
          path: results/test-readiness.json
          retention-days: 14
          overwrite: true

  # ── Aggregator gate (single required check for branch protection) ────────
  tests-passed:
    name: Tests Gate
    needs:
      [
        unit,
        detect-merge-queue,
        detect-integration,
        integration,
        discover-e2e,
        build-e2e-image,
        merge-e2e-image,
        sdk-head-recheck,
        lease-tenant,
        prepare-tenant,
        e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    # Comment + gate-eval only; cap so a wedged runner can't hold the required
    # check pending for GitHub's 6-hour default.
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    steps:
      # Single source of truth: the tested driver computes both the pass/fail
      # decision and the human-readable status strings the summary table below
      # renders, so displayed status can't drift from the enforced result.
      # Discovery skipped = e2e not requested (OK); discovery failed = requested
      # but empty (fail); the e2e matrix aggregate is success iff every leg
      # passed. Integration skipped (PR / no suite) is a pass; unit must succeed.
      # detect-integration is gated too: a *failed* detection (not a PR skip)
      # fails the gate, so a checkout/glob flake can't silently skip integration
      # and green the required check. The four install-path jobs (image build,
      # manifest merge, tenant lease, tenant install) are gated for the same
      # reason — they are exactly what the e2e matrix's own `if` requires, so a
      # failure in any of them drops e2e to a skip. Passing them in names the
      # cause instead of leaving the driver to infer it from the skip, which
      # matters most for the lease: "the tenant was busy" and "your change is
      # broken" call for opposite responses.
      - name: Evaluate Tests Gate
        id: gate
        if: always()
        uses: atlanhq/application-sdk/.github/actions/verify-test-gate@main
        with:
          unit-result: ${{ needs.unit.result }}
          integration-result: ${{ needs.integration.result }}
          detect-integration-result: ${{ needs.detect-integration.result }}
          detect-merge-queue-result: ${{ needs.detect-merge-queue.result }}
          discover-e2e-result: ${{ needs.discover-e2e.result }}
          build-e2e-image-result: ${{ needs.build-e2e-image.result }}
          merge-e2e-image-result: ${{ needs.merge-e2e-image.result }}
          lease-tenant-result: ${{ needs.lease-tenant.result }}
          prepare-tenant-result: ${{ needs.prepare-tenant.result }}
          e2e-result: ${{ needs.e2e.result }}
          # Explains a skipped matrix as a deliberate stand-down rather than the
          # misconfiguration the matrix-skipped anomaly exists to catch. Empty
          # (the recheck job skipped, or it failed and wrote no answer) reads as
          # "not explained", which is the correct default: the anomaly is what
          # stops a future re-wiring of the e2e `if` from greening the gate by
          # skipping it (FND-701).
          superseded: ${{ needs.sdk-head-recheck.outputs.superseded }}

      - name: Post unified test-summary comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: tests-summary
          message: |
            ## Tests Summary

            | Job | Status | Result |
            |---|---|---|
            | unit | ${{ steps.gate.outputs.unit-status }} | `${{ needs.unit.outputs.summary || 'no summary' }}` |
            | integration | ${{ steps.gate.outputs.integration-status }} | `${{ needs.integration.outputs.summary || 'no summary' }}` |
            | e2e | ${{ steps.gate.outputs.e2e-status }} | per-suite results + live logs in the run |

            **Overall:** ${{ steps.gate.outputs.overall-status }} — [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      # Branch-free enforcement: the decision lives in the driver's `passed`
      # output; this step just fails the required check when it isn't "true".
      - name: Enforce gate
        if: always() && steps.gate.outputs.passed != 'true'
        shell: bash
        run: exit 1

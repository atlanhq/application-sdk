name: Sync requirements.txt for Dependabot

on:
  push:
    branches:
      - 'dependabot/**'
      - 'renovate/**'
    paths:
      - 'uv.lock'

permissions:
  contents: write

jobs:
  sync-requirements:
    name: Sync requirements.txt
    runs-on: ubuntu-latest
    # One writer per branch. renovate-lock-cooldown.yaml triggers on the same
    # push to renovate/lock-file-maintenance and pushes to the same branch, so
    # both running would leave the loser with a non-fast-forward rejection —
    # and whichever won would have exported requirements.txt from a lock the
    # other was about to change. That workflow re-exports this file itself,
    # from the bound lock, in the same commit (FND-376).
    if: ${{ github.ref != 'refs/heads/renovate/lock-file-maintenance' }}
    steps:
      - name: Mint fleet App token
        # A real (non-github-actions[bot]) identity is required here: the
        # push below must re-trigger the PR's required checks, which a push
        # made with the default GITHUB_TOKEN would not. Confirmed empirically
        # that App-token pushes do re-trigger (see the PR that added this).
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk
          # Same reasoning as renovate-lock-cooldown.yaml (FND-395): this job
          # runs from the pushed branch, so the token it mints should carry only
          # the permission the job uses. Checkout plus one push is contents.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Regenerate requirements.txt
        run: uv export --no-hashes --frozen > requirements.txt

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet requirements.txt; then
            git add requirements.txt
            git commit -m "chore: sync requirements.txt with updated uv.lock"
            git push
          fi

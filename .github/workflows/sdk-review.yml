# SDK Review — mothership Rover-based reviewer.
#
# Triggered by the @sdk-review mention on a PR.
#
# All SDK-specific review behavior (orchestration, agents, rules, severity
# rubric, guardrails, modes) lives in application-sdk/.mothership/pr-review/
# and is read at runtime by the sandbox after the repo is cloned.
#
# Mothership provides: Cloudflare sandbox runtime, Claude Code CLI, repo
# clone, GitHub token injection.
# This repo provides: every detail of how to review SDK PRs.
#
# Trigger surface:
#   @sdk-review                       → Standard review. There is a single
#                                            mode. The orchestration scopes
#                                            the review to the files changed
#                                            and tracks deltas vs any prior
#                                            review on the PR.
#   @sdk-review <any trailing text>   → Same standard review. Trailing text
#                                            is IGNORED — there are no
#                                            commands (no auto-fix, stop,
#                                            challenge, override, or focus
#                                            modes). The review is read-only
#                                            and never pushes to the branch.
#
# Side-effects:
#   commit-status context  = sdk-review
#   labels                 = sdk-review-approved, sdk-review-needs-human,
#                            sdk-review-needs-rebase (applied here based on
#                            the extracted verdict; the legacy
#                            `test-sdk-review-*` labels are stripped on the
#                            way in)
#   comment marker         = <!-- SDK_REVIEW --> (the legacy
#                            <!-- TEST_SDK_REVIEW --> marker is also
#                            accepted for in-flight PRs that pre-date the
#                            promotion)
#   comment marker         = <!-- SDK_REVIEW_NO_VERDICT --> (posted only when
#                            a completed run delivered no summary at all; see
#                            the `verdict` step)
#
# Required configuration:
#   secrets.HARNESS_TOKEN              Bearer token for /api/sandbox/execute.
#                                      Must be a valid entry in mothership's
#                                      SANDBOX_API_KEYS map under caller_id
#                                      "application-sdk".
#   secrets.TWINGATE_SERVICE_KEY       Twingate service-account key. Primary
#                                      path to mothership.atlan.dev, which is
#                                      on the private network.
#   secrets.GLOBALPROTECT_USERNAME     Fallback VPN auth, used only if the
#   secrets.GLOBALPROTECT_PASSWORD     Twingate step fails. Remove both once
#   vars.GLOBALPROTECT_PORTAL_URL      Twingate is proven here.
#   vars.MOTHERSHIP_URL                e.g. https://mothership.atlan.dev

name: SDK Review (mothership)

on:
  issue_comment:
    types: [created]
  # Manual trigger for pre-merge testing on feature branches.
  # GitHub only runs `issue_comment`-triggered workflows from the default
  # branch, so we expose a workflow_dispatch path that takes a PR number
  # and an optional commenter_intent string. Useful for verifying the
  # workflow on `sdk-mothership-migration` before #1485 lands.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review with the experimental mothership Rover path'
        required: true
        type: string
      commenter_intent:
        description: 'Free-form intent (empty = standard review)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  checks: write

jobs:
  # Cheap pre-flight: decide whether this trigger deserves a review at all,
  # before spending a VPN connect and a sandbox on it. The only trigger this
  # turns away is an automated re-request (`mothership-ai[bot]` / `atlan-ci`)
  # for a HEAD that already carries an SDK review — the resolver does this a
  # couple of minutes after a review lands, and the result is two summaries
  # for one sha that read like a bug. A human tagging `@sdk-review` always
  # reviews, unchanged HEAD or not.
  #
  # NOTE — this job is an OPTIMIZATION, not the authority. It runs outside
  # the per-PR concurrency group (sdk-review-$PR), so two concurrent bot
  # triggers can both pass it ("no review yet") and both reach the dispatch
  # job. The authority is the `Dedupe check` step at the top of
  # `sdk-review-dispatch`: it runs under the concurrency lock, so no sibling
  # run in the group can be executing while it reads comment state, and it
  # re-resolves HEAD rather than trusting this job's answer.
  #
  # It used to be the sandbox (ORCHESTRATION.md Phase 0 §6b), which meant the
  # dedupe was only as reliable as the model: the sandbox had to boot and
  # reason before it could decline — so five duplicate triggers on #3285 cost
  # five runs — and a degraded model skipped the check outright (FND-636).
  gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@sdk-review')
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
          || github.event.comment.user.login == 'atlan-ci'
          || github.event.comment.user.login == 'mothership-ai[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout repo (for the gate script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Head resolution (3 attempts, 5 s / 10 s backoff) happens inside the
      # script, not in a shell loop here: docs/standards/ci.md keeps branching
      # logic out of YAML, and the locked phase below needs the identical
      # resolution — one implementation, two callers.
      - name: Decide whether to review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          GATE_PHASE: preflight
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
        run: python3 .github/scripts/sdk_review_gate.py

      # If the gate job itself fails (e.g. checkout failure, unexpected error in
      # the gate script), post a comment on the PR so the author knows to re-tag.
      # Head-resolution exhaustion is handled inside the gate script (fail-open),
      # so this step fires only for unexpected failures.
      - name: Post gate-failure comment on PR
        if: always() && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (!prNumber) return;
            const runUrl = process.env.GHA_RUN_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                `⚠️ **SDK Review gate encountered an unexpected error** and could not decide whether to dispatch.`,
                ``,
                `[View the failing workflow run](${runUrl}) for details.`,
                ``,
                `Please retry by commenting \`@sdk-review\` again. If it keeps failing, reach out to the platform team.`,
              ].join('\n'),
            });

  # When the gate skips a bot-trigger, react to the original comment so the
  # PR shows the trigger was seen and consciously declined. Without this, a
  # skipped trigger is invisible: the `@sdk-review` comment gets no reaction
  # and no starting comment — indistinguishable to the resolver from the
  # reviewer being dead.
  #
  # `::notice::` is already emitted by the gate script for all decisions
  # (including skip), so the run log has a record. This reaction surfaces it
  # on the PR timeline without adding a new comment that the resolver may
  # re-read as pending work.
  react-on-skip:
    needs: gate
    # Only on issue_comment triggers — workflow_dispatch has no comment to react to.
    # Humans are never skipped (the gate always proceeds on human triggers).
    if: >-
      needs.gate.outputs.decision == 'skip'
      && github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Sparse: this job exists only to leave a reaction, so it pulls the one
      # file it needs rather than the tree.
      - name: Checkout reaction helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/react_to_comment.py
          sparse-checkout-cone-mode: false

      # React with 'confused' (😕) to signal "seen, consciously declined".
      # The dispatch job uses 'eyes' (👀) for proceed — keeping distinct
      # reactions means a user can tell "seen and running" (👀) from "seen
      # and skipped" (😕) without reading the workflow log.
      # No new PR comment — that would be noise the resolver may re-read.
      - name: React to skipped trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: confused
        run: python3 .github/scripts/react_to_comment.py

  sdk-review-dispatch:
    needs: gate
    if: needs.gate.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    # Total budget: 5 min for orient + retries + dispatch.
    # The sandbox itself runs for up to 2h (max_timeout_seconds: 7200),
    # but `curl --max-time 7200` blocks this job for that duration.
    timeout-minutes: 130
    concurrency:
      group: sdk-review-${{ github.event.issue.number || inputs.pr_number }}
      # NEVER cancel a review that is already running. `cancel-in-progress: true`
      # meant a second `@sdk-review` killed the first one mid-flight — on #2989 a
      # human tag at 16:42 destroyed a run that was 28m23s in and had not yet
      # posted. Worse, the replacement dispatched the SAME session id the
      # terminator was tearing down, so it died 63s later with zero SSE events;
      # the same collision produced "No conversation found with session" on #2987.
      #
      # With this false, GitHub keeps at most one run in progress and one
      # pending per PR, and a newer trigger replaces the pending one — an
      # effective cap of two, which is the behaviour we want: the in-flight
      # review finishes and posts, the newest re-tag runs after it.
      cancel-in-progress: false
    steps:
      - name: Checkout repo (for local globalprotect-connect action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse comment intent
        id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            let intent = '';
            let commenter = '';
            let commentId = '';
            let prNumber = '';

            if (isDispatch) {
              prNumber = context.payload.inputs.pr_number;
              intent = context.payload.inputs.commenter_intent || '';
              commenter = context.actor;
              commentId = '';
            } else {
              const raw = context.payload.comment.body || '';
              intent = raw
                .replace(/@sdk-review/gi, '')
                .replace(/^\s+|\s+$/g, '');
              commenter = context.payload.comment.user.login;
              commentId = String(context.payload.comment.id);
              prNumber = String(context.payload.issue.number);
            }

            core.setOutput('commenter', commenter);
            core.setOutput('comment_id', commentId);
            core.setOutput('pr_number', prNumber);
            core.setOutput('commenter_intent', intent);

      # THE authoritative dedupe check. Everything below it is guarded on its
      # decision (`steps.lock_gate.outputs.decision != 'skip'`), so a skip
      # costs one runner minute and leaves no trace on the PR beyond a 😕
      # reaction — no starter comment, no pending commit status, no sandbox.
      #
      # It has to be HERE, not in the `gate` job: this job holds
      # `sdk-review-$PR`, so while this step runs no sibling run in the group
      # can be executing, and the comment state it reads is post-lock and
      # final. The `gate` job cannot make that claim, which is how five
      # `@sdk-review` comments 11–16 s apart on #3285 became five review runs
      # (FND-636) — every one of them passed a gate that had read pre-lock
      # state.
      #
      # Same script as the gate, one phase apart. `locked` adds the
      # sibling-in-flight check for the one case the lock does not cover: a
      # sandbox that outlived its cancelled job and is still going to post.
      #
      # Human triggers are never skipped here — see the carve-out in
      # sdk_review_gate.py. Tagging `@sdk-review` yourself always reviews.
      #
      # continue-on-error: a crash here leaves `decision` empty, every guard
      # below reads that as "not skip", and the review runs. Dropping a review
      # is the harmful outcome; an extra one is not — same fail-open doctrine
      # the script applies when it cannot resolve HEAD.
      - name: Dedupe check (authoritative — inside the concurrency lock)
        id: lock_gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          GATE_PHASE: locked
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/sdk_review_gate.py

      # Same 😕 the `react-on-skip` job leaves for a gate-level skip, for the
      # same reason: without it a declined trigger is indistinguishable from a
      # dead reviewer, and the resolver re-tags. No comment — that would be
      # noise the resolver may re-read as pending work.
      - name: React to skipped re-trigger
        if: steps.lock_gate.outputs.decision == 'skip' && steps.parse.outputs.comment_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ steps.parse.outputs.comment_id }}
          REACTION: confused
        run: python3 .github/scripts/react_to_comment.py

      # Best-effort, never fatal. This used to be the opening lines of the
      # step below, unguarded — and a transient HTTP 503 from the reactions
      # API killed the whole dispatch job before it reached the mothership
      # call, losing the review request entirely. The script always exits 0.
      # `COMMENT_ID` is blank on workflow_dispatch, which the script no-ops on.
      - name: React to comment
        if: steps.lock_gate.outputs.decision != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ steps.parse.outputs.comment_id }}
          REACTION: eyes
        run: python3 .github/scripts/react_to_comment.py

      - name: Ensure labels exist
        if: steps.lock_gate.outputs.decision != 'skip'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = [
              { name: 'sdk-review-approved', color: '0e8a16', description: 'SDK review (mothership) approved' },
              { name: 'sdk-review-needs-human', color: 'd93f0b', description: 'SDK review (mothership) needs human decision' },
              { name: 'sdk-review-needs-rebase', color: 'e4e669', description: 'SDK review (mothership) blocked on rebase conflicts' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, ...l,
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

      - name: Fetch PR head metadata
        id: pr
        if: steps.lock_gate.outputs.decision != 'skip'
        env:
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER, 10),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_sha_short', pr.head.sha.slice(0, 8));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('html_url', pr.html_url);

      # Single source of truth for the mothership session id.
      #
      # Two steps need it: the dispatch below, and the `if: cancelled()`
      # terminator at the end of the job. Deriving it in both places would
      # let the two copies drift — and a terminator that computes a *stale*
      # session id silently fails to stop anything, which is exactly the
      # bug it exists to prevent. Compute once, read twice.
      #
      # Unique per attempt, not just per run. It used to end at HEAD_SHA_SHORT,
      # so two triggers on an unchanged HEAD sent the same session id — and
      # mothership reads a supplied session_id as a follow-up (`is_follow_up =
      # request.session_id is not None`), so the second dispatch tried to RESUME
      # a conversation that had been cancelled or had already finished. That is
      # the "No conversation found with session" failure on #2987 and the
      # zero-SSE death on #2989. GITHUB_RUN_ID makes every NEW dispatch a fresh
      # session; the HEAD stays in the id purely so the sandbox is legible in
      # Cloudflare logs.
      #
      # GITHUB_RUN_ID is stable across re-runs of the same workflow run (docs:
      # "does not change if you re-run the workflow run"). GITHUB_RUN_ATTEMPT
      # increments with every re-run (1 on the first run, 2 on the first re-run,
      # etc.). Without the attempt suffix, clicking "Re-run failed jobs" on a
      # failed SDK Review would dispatch the same session id into a sandbox that
      # mothership may still have in its DB — causing the same resume-of-a-dead-
      # session failure the RUN_ID addition fixed for multi-trigger cases.
      #
      # Kept SHORT on purpose. Mothership names the sandbox after this id, and
      # that name is a DNS label — `/sandbox/create` rejects anything over 63
      # chars. This used to carry `${REPO_FULL_NAME//\//-}`, which put the base
      # at 62 and every `-retry1` id at 69: attempt 1 booted, and every
      # re-dispatch the lane authorised died on sandbox create instead of
      # reviewing (FND-677, seen on #3326). The repo name bought nothing the
      # dispatch payload does not already carry — it sends
      # `repositories: ["atlanhq/application-sdk"]` and a `source_id` of
      # `<repo>#<pr>` — so it is gone, leaving ~18 chars of headroom for the
      # retry suffix. `attempt_session_id()` enforces the 63-char cap as an
      # invariant, and a test asserts this format still fits without it having
      # to truncate. Do not lengthen this without re-reading that test.
      - name: Compute mothership session id
        id: session
        if: steps.lock_gate.outputs.decision != 'skip'
        env:
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          HEAD_SHA_SHORT: ${{ steps.pr.outputs.head_sha_short }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "session_id=sdk-review-${PR_NUMBER}-${HEAD_SHA_SHORT}-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Post 'review starting' notice to PR
        id: starter
        if: steps.lock_gate.outputs.decision != 'skip'
        env:
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          COMMENTER: ${{ steps.parse.outputs.commenter }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Post a fresh "starting" notice per @sdk-review trigger so the
            // PR shows a "just now" comment the user can scroll to. We used
            // to update a single comment in place — that kept the PR tidy
            // but GitHub's UI showed the original createdAt timestamp on
            // every re-trigger, making the latest run look stale.
            //
            // To balance re-trigger spam against visibility, previous
            // starter comments on this PR are FOLDED into <details>
            // blocks at trigger time. Only the new starter stays
            // expanded. History is preserved, but the PR scroll only
            // shows the latest run's link prominently.
            //
            // The starter's comment ID is exposed as `comment_id` so
            // downstream steps (cost stamp, heartbeat on idle, final
            // verdict edit) can update this same comment instead of
            // posting yet more.
            const marker = '<!-- SDK_REVIEW_STARTED -->';
            const foldedMarker = '<!-- SDK_REVIEW_STARTED_FOLDED -->';
            const commenter = process.env.COMMENTER || 'unknown';
            const runUrl = process.env.GHA_RUN_URL;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const startedAt = new Date().toISOString();
            // The starter doubles as this run's claim on a sha: `locked`-phase
            // sdk_review_gate.py reads these two stamps, plus the absence of
            // the '— status `' footer the cost stamper appends, to recognise a
            // sibling run that is still mid-review. Without the sha it could
            // not tell a claim on THIS head from one on a previous head, and
            // without the run id it would read its own claim as a sibling's.
            const headStamp = `<!-- SDK_REVIEW_STARTED_HEAD: ${process.env.HEAD_SHA} -->`;
            const runStamp = `<!-- SDK_REVIEW_STARTED_RUN: ${process.env.RUN_ID} -->`;

            // Fold any previous (unfolded) starter comments on this PR.
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            for (const c of existing.data) {
              if (!c.body || !c.body.startsWith(marker)) continue;
              if (c.body.includes(foldedMarker)) continue;  // already folded
              const rest = c.body.split('\n').slice(1).join('\n');
              const folded = [
                marker,
                foldedMarker,
                '<details><summary>Earlier @sdk-review trigger (click to expand)</summary>',
                '',
                rest,
                '</details>',
              ].join('\n');
              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                  body: folded,
                });
              } catch (e) {
                console.log(`Could not fold previous starter ${c.id}: ${e.message}`);
              }
            }

            const body = [
              marker,
              headStamp,
              runStamp,
              `🔍 **SDK Review (mothership)** triggered by @${commenter} at ${startedAt}.`,
              ``,
              `[Watch the workflow run live](${runUrl}) — the review summary will appear as a separate comment when complete (typical: 5–30 min, hard cap 2h).`,
            ].join('\n');

            const result = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.setOutput('comment_id', String(result.data.id));
            core.setOutput('started_at', startedAt);
            console.log(`Posted new 'starting' comment id=${result.data.id}`);

      - name: Set sdk-review status to pending
        if: steps.lock_gate.outputs.decision != 'skip'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'sdk-review',
              description: 'SDK Review (mothership) in progress (up to ~2h)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # Twingate first. A service account is a machine identity with no shared
      # IP pool, so it neither consumes nor is starved by the GlobalProtect
      # pool whose exhaustion causes most of this workflow's failures.
      #
      # GlobalProtect stays below as an automatic fallback: if this step fails
      # for any reason, vpn1-vpn3 run exactly as they do today and behaviour is
      # unchanged. Once Twingate has proven itself here, delete vpn1-vpn3, the
      # notify/fail pair keyed off vpn3, and the GLOBALPROTECT_* secrets.
      - name: Connect to Twingate
        id: twingate
        if: steps.lock_gate.outputs.decision != 'skip'
        uses: ./.github/actions/twingate-connect
        continue-on-error: true
        timeout-minutes: 5
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}
          mothership-url: ${{ vars.MOTHERSHIP_URL }}

      # max-attempts: '1' overrides the action's internal default of 3 so
      # each outer step is one real attempt, not three. Three outer steps
      # cap total VPN time at ~15 min in the worst case.
      #
      # timeout-minutes: 5 is a runner-enforced hard cap on each step. The
      # inner nick-fields/retry timeout_minutes is best-effort — it SIGTERMs
      # the bash subshell, but sudo/openconnect children survive parent
      # signals, so a wedged attempt can hang indefinitely. The outer
      # timeout-minutes is enforced by the runner itself and is the only
      # guarantee the step terminates and the next attempt fires.
      - name: Connect to VPN (attempt 1/3)
        id: vpn1
        if: steps.lock_gate.outputs.decision != 'skip' && steps.twingate.outcome == 'failure'
        uses: ./.github/actions/globalprotect-connect
        continue-on-error: true
        timeout-minutes: 5
        with:
          portal-url: ${{ vars.GLOBALPROTECT_PORTAL_URL }}
          username: ${{ secrets.GLOBALPROTECT_USERNAME }}
          password: ${{ secrets.GLOBALPROTECT_PASSWORD }}
          # Probe the actual dispatch target so the VPN step verifies the tunnel
          # reaches mothership, not an unrelated host.
          mothership-url: ${{ vars.MOTHERSHIP_URL }}
          max-attempts: '1'

      - name: Connect to VPN (attempt 2/3)
        id: vpn2
        if: steps.vpn1.outcome == 'failure'
        uses: ./.github/actions/globalprotect-connect
        continue-on-error: true
        timeout-minutes: 5
        with:
          portal-url: ${{ vars.GLOBALPROTECT_PORTAL_URL }}
          username: ${{ secrets.GLOBALPROTECT_USERNAME }}
          password: ${{ secrets.GLOBALPROTECT_PASSWORD }}
          # Probe the actual dispatch target so the VPN step verifies the tunnel
          # reaches mothership, not an unrelated host.
          mothership-url: ${{ vars.MOTHERSHIP_URL }}
          max-attempts: '1'

      - name: Connect to VPN (attempt 3/3)
        id: vpn3
        if: steps.vpn2.outcome == 'failure'
        uses: ./.github/actions/globalprotect-connect
        continue-on-error: true
        timeout-minutes: 5
        with:
          portal-url: ${{ vars.GLOBALPROTECT_PORTAL_URL }}
          username: ${{ secrets.GLOBALPROTECT_USERNAME }}
          password: ${{ secrets.GLOBALPROTECT_PASSWORD }}
          # Probe the actual dispatch target so the VPN step verifies the tunnel
          # reaches mothership, not an unrelated host.
          mothership-url: ${{ vars.MOTHERSHIP_URL }}
          max-attempts: '1'

      # If all three VPN attempts failed, post a comment on the PR so the
      # author knows the workflow died for an infra reason (not a real review
      # failure) and can retry with another @sdk-review mention. Without
      # this, the only signal is a red commit status — and most authors don't
      # check the GHA logs to discover it was a VPN issue.
      - name: Notify PR if VPN failed after 3 attempts
        if: steps.vpn3.outcome == 'failure'
        env:
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const runUrl = process.env.GHA_RUN_URL;
            const body = [
              `⚠️ **SDK Review couldn't start due to a transient infrastructure issue.**`,
              ``,
              `The review environment was temporarily unreachable. This is usually transient.`,
              ``,
              `[View workflow logs](${runUrl})`,
              ``,
              `Please retry by commenting \`@sdk-review\` again. If it keeps failing, reach out to the platform team.`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      # Explicit fail so the existing failure()-gated 'Set status to failure'
      # step (below) fires and the commit status flips to red. Without this,
      # vpn3.continue-on-error: true would let the workflow proceed past a
      # broken VPN into the mothership dispatch, which would itself hang or
      # fail confusingly.
      - name: Fail workflow after VPN failure notification
        if: steps.vpn3.outcome == 'failure'
        run: |
          echo "::error::All 3 VPN connection attempts failed. PR has been notified — see comment posted above."
          exit 1

      # The SSE state machine, the idle watchdog, the verdict-posted
      # soft-success rule and the exit decision all live in
      # .github/scripts/sdk_review_dispatch.py, under pytest — they used to be
      # ~460 lines of inlined `while`/`case` shell here, which docs/standards/ci.md
      # forbids and which no test could reach (FND-643).
      #
      # Why SSE and not sync: mothership.atlan.dev is fronted by an nginx
      # reverse proxy with a stock ~60s upstream-read timeout. A real sandbox
      # run takes 10-30 minutes — long enough that sync mode always 504s.
      # Streaming keeps the connection alive via periodic events
      # (thought / response / heartbeat) so nginx sees the upstream as
      # responsive throughout.
      #
      # The step's outputs (`final_status`, `final_cost`, `final_err_code`,
      # `final_err_msg`) are a contract: `sdk_review_verdict_gate.py`, the
      # starter-comment stamper and `sdk_review_approve.py` all read them.
      #
      # The step can boot TWO sandboxes. It re-dispatches once, on one of
      # three classes: a hard error a model swap could survive (FND-641, ported
      # in FND-643) goes to a DIFFERENT main model; a clean `status=completed`
      # that delivered no verdict (FND-645) and a dropped RPC to the sandbox
      # (FND-647) re-run the SAME one, because neither is a model fault. All
      # three fire only on a confirmed-empty verdict read. `final_cost` is then
      # the sum, and the step summary carries the per-attempt trail.
      - name: Dispatch to mothership Rover Direct API
        id: dispatch
        if: steps.lock_gate.outputs.decision != 'skip'
        env:
          MOTHERSHIP_URL: ${{ vars.MOTHERSHIP_URL }}
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          COMMENTER: ${{ steps.parse.outputs.commenter }}
          COMMENTER_INTENT: ${{ steps.parse.outputs.commenter_intent }}
          COMMENT_ID: ${{ steps.parse.outputs.comment_id }}
          STARTER_COMMENT_ID: ${{ steps.starter.outputs.comment_id }}
          STARTER_STARTED_AT: ${{ steps.starter.outputs.started_at }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_SHA_SHORT: ${{ steps.pr.outputs.head_sha_short }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_URL: ${{ steps.pr.outputs.html_url }}
          REPO_FULL_NAME: ${{ github.repository }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/sdk_review_dispatch.py

      # A run that reaches `status=completed`, bills a real cost and posts
      # nothing to the PR is a defect, not a no-op. `sdk_review_approve.py`
      # treats "no summary comment" as SKIPPED (a legitimate no-op for its
      # other decline reasons), so without this step the workflow exits 0 on
      # a review that delivered nothing — green check, silent bot, warning
      # annotation nobody reads.
      #
      # Additive on purpose: the soft-success rule inside `dispatch` covers
      # the disjoint case (verdict posted, stream broke afterwards), so this
      # is a separate check rather than an edit to `fail_or_warn`. The gate
      # fails open whenever it cannot establish the count — a false red on a
      # delivered review is the failure mode the run-29001242204 RCA was
      # written about.
      # Guarded like the other post-review steps: a re-trigger the locked
      # dedupe check declined never dispatched a sandbox, so there is no
      # verdict for it to be missing. (`final_status` would be empty and the
      # gate would bow out on its own, but a check that reds a run must not
      # depend on that indirection.)
      - name: Verify the review delivered a verdict
        id: verdict
        if: success() && steps.parse.outputs.pr_number != '' && steps.lock_gate.outputs.decision != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          FINAL_STATUS: ${{ steps.dispatch.outputs.final_status }}
          FINAL_COST: ${{ steps.dispatch.outputs.final_cost }}
          STARTER_STARTED_AT: ${{ steps.starter.outputs.started_at }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          GHA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/sdk_review_verdict_gate.py

      # Cancelling this job does NOT stop the sandbox.
      #
      # mothership runs the sandbox on a thread-pool executor with a
      # DETACHED asyncio finalize task (harness/api/routers/sandbox_api.py
      # `_sse_execution_wrapper`), and its SSE queue drops on overflow
      # rather than applying backpressure. Killing `curl` therefore only
      # closes our end of the stream: the run keeps going, keeps billing
      # against max_timeout_seconds (7200), and still posts its review and
      # commit status to the PR using the sandbox's own `gh` token —
      # minutes after the workflow says "cancelled". That is why a cancel
      # looked like it "triggered" a review: it never stopped anything.
      #
      # The documented way to actually stop it is the explicit cancel
      # endpoint, so call it on the way out.
      #
      # `if: cancelled()` only — a failed dispatch has already lost the
      # stream and mothership finalises it on its own; on success there is
      # nothing left to stop. Never fail the job from here: this is
      # best-effort cleanup running inside the cancellation grace period,
      # and masking the real outcome with a teardown error helps nobody.
      #
      # SESSION_ID is the BASE id. A run can boot more than one sandbox (the
      # dispatcher re-dispatches once when the first delivers nothing — on the
      # same model or a different one, depending on the fault), and each attempt
      # gets its own derived id, so the script walks the same ladder rather than
      # trusting an id this step cannot know.
      - name: Terminate mothership sandbox on cancel
        if: cancelled() && steps.session.outputs.session_id != ''
        env:
          MOTHERSHIP_URL: ${{ vars.MOTHERSHIP_URL }}
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: python3 .github/scripts/mothership_terminate_session.py

      # Stamp the run cost + duration + verdict status onto the starter
      # comment we posted at the start of this job. The PR scroll then
      # shows a single comment that opens with "🔍 triggered" and ends
      # with "✅ completed — cost $X, duration Ym". No extra comment is
      # posted (E: re-trigger spam), and the cost is visible without
      # clicking through to the workflow logs.
      #
      # Uses github-script (Octokit) instead of `gh api -X PATCH -f body=`
      # because the latter has shaky multi-line handling.
      - name: Stamp cost + status onto starter comment
        if: always() && steps.starter.outputs.comment_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          STARTER_COMMENT_ID: ${{ steps.starter.outputs.comment_id }}
          STARTER_STARTED_AT: ${{ steps.starter.outputs.started_at }}
          FINAL_STATUS: ${{ steps.dispatch.outputs.final_status }}
          FINAL_COST: ${{ steps.dispatch.outputs.final_cost }}
          FINAL_ERR_CODE: ${{ steps.dispatch.outputs.final_err_code }}
          FINAL_ERR_MSG: ${{ steps.dispatch.outputs.final_err_msg }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          # 'false' only when the verdict gate positively established that a
          # completed run posted nothing. 'unknown'/'' means it fell open or
          # never ran, and the stamp keeps its usual wording.
          VERDICT_DELIVERED: ${{ steps.verdict.outputs.verdict_delivered }}
        with:
          script: |
            const commentId = parseInt(process.env.STARTER_COMMENT_ID, 10);
            if (!commentId) return;

            const startedAt = process.env.STARTER_STARTED_AT;
            const finalStatus = process.env.FINAL_STATUS || process.env.DISPATCH_OUTCOME || 'unknown';
            const finalCost = process.env.FINAL_COST || 'unknown';
            const errCode = (process.env.FINAL_ERR_CODE || '').trim();
            const errMsg = (process.env.FINAL_ERR_MSG || '').trim();

            let durationTxt = 'unknown';
            if (startedAt) {
              const ms = Date.now() - Date.parse(startedAt);
              if (!isNaN(ms) && ms > 0) {
                const s = Math.floor(ms / 1000);
                durationTxt = `${Math.floor(s / 60)}m ${s % 60}s`;
              }
            }

            // A cancel is not a failure, and rendering it as 🟥 "ended
            // without a clean completion" was actively misleading: this
            // step is `always()`, so it rewrote the comment ~2s after the
            // cancel while the sandbox was still running — and the real
            // review then landed a minute later, making the 🟥 look like a
            // lie. Give cancels their own verb and say what we did about
            // the sandbox.
            const cancelled = process.env.DISPATCH_OUTCOME === 'cancelled';
            // A completed run that posted no verdict must not read as
            // "✅ Completed" here — that stamp is exactly the reassurance
            // that made this failure mode invisible.
            const noVerdict = process.env.VERDICT_DELIVERED === 'false';
            const verb = noVerdict ? '🟥 **Completed but posted no verdict**' :
                         finalStatus === 'completed' ? '✅ **Completed**' :
                         process.env.DISPATCH_OUTCOME === 'success' ? '✅ **Completed**' :
                         cancelled ? '🟡 **Cancelled**' :
                         '🟥 **Run ended without a clean completion**';
            let footer = `\n\n---\n${verb} — status \`${finalStatus}\`, cost \`$${finalCost}\`, duration ${durationTxt}.`;
            if (noVerdict) {
              footer += `\nThe run finished and billed, but no review summary reached this PR. Re-tag \`@sdk-review\` to retry.`;
            }
            if (cancelled) {
              footer += `\nThe sandbox was asked to stop (\`DELETE /api/sandbox/session\`). If that request did not land, a review comment may still arrive from the in-flight run — check the workflow log for a termination warning.`;
            }

            // Surface the mothership-side error on the PR comment whenever
            // we have either a code or a message. This is the field most
            // PR authors care about when a run dies at startup — without it
            // they only see "status failure" and have to dig into the GHA log.
            // Truncate the message to keep the comment scannable; the GHA
            // log retains the full text.
            if (errCode || errMsg) {
              // Replace backticks in both code and message so the inline-code
              // formatting in the rendered comment can't be broken by a
              // backtick inside a mothership error string.
              const safeCode = (errCode || 'unknown').replace(/`/g, "'");
              const truncated = errMsg && errMsg.length > 400 ? errMsg.slice(0, 397) + '…' : errMsg;
              const safeMsg = (truncated || '').replace(/`/g, "'");
              footer += safeMsg
                ? `\n**Error:** \`${safeCode}\` — ${safeMsg}`
                : `\n**Error:** \`${safeCode}\``;
            }

            const { data: existing } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
            });
            if (existing.body && existing.body.includes('— status `')) {
              console.log(`Starter comment ${commentId} already stamped — skipping.`);
              return;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: `${existing.body || ''}${footer}`,
            });
            console.log(`Stamped starter comment ${commentId}: status=${finalStatus} cost=${finalCost} duration=${durationTxt} err=${errCode || '(none)'}`);

      # Minted HERE rather than at the top of the job on purpose: App
      # installation tokens expire after an hour, and this job blocks on the
      # sandbox for up to 2h. A token minted before the review would be dead by
      # the time we need it.
      - name: Mint fleet App token
        # Carries its own rate-limit quota, independent of the `atlan-ci` user
        # quota ORG_PAT_GITHUB draws on. Needs `issues: write` as well as
        # `pull_requests: write` — labels are an Issues-scope resource.
        id: app-token
        if: success() && steps.parse.outputs.pr_number != '' && steps.lock_gate.outputs.decision != 'skip'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk

      # The mothership sandbox cannot approve PRs in a way that satisfies
      # the `require_code_owner_review` rule on `main`:
      # `mothership-ai[bot]` is a GitHub App, and Apps cannot be listed in
      # CODEOWNERS. So we post the formal approval from the GHA runner so
      # it is recorded as `atlan-ci` (a regular User account that IS in
      # CODEOWNERS). Branch-protection then accepts the approval.
      #
      # Solo-approval guard: the companion workflow
      # `sdk-review-dismiss-on-human.yml` listens for any human
      # comment or review on the PR and dismisses the atlan-ci approval
      # posted below. Net effect: bot can green-light a PR by itself only
      # until a human engages — the moment any human touches the PR
      # (comments OR reviews), the bot's approval drops and merge gates
      # require a fresh human approval. Identifying "the bot's approval"
      # uses a body-text signature so we never touch other atlan-ci
      # reviews.
      #
      # This is the SLOW path: it runs once the sandbox's SSE stream closes,
      # 30–60s after `sdk-review-approve-on-verdict.yml` has usually already
      # stamped. Both paths share
      # .github/scripts/sdk_review_approve.py and both check for an existing
      # bot-signature approval, so whichever gets there first wins and the
      # other no-ops.
      - name: Approve PR as atlan-ci (counts as code-owner)
        if: success() && steps.parse.outputs.pr_number != '' && steps.lock_gate.outputs.decision != 'skip'
        env:
          # Everything except the APPROVE call. Keeping the reads, label writes
          # and dismissals off the `atlan-ci` PAT is what stops the one call
          # that genuinely needs that identity from being starved of quota.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The APPROVE call only.
          APPROVER_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          # Empty: read the newest summary comment off the PR rather than an
          # event payload. The sandbox posted it minutes ago.
          COMMENT_BODY: ""
          # Staleness guard: bail unless the PR's live head is still the sha this
          # review was dispatched for.
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
          # The `Set sdk-review status to failure` step below owns this
          # workflow's status writes; the fast path owns the success case.
          WRITE_STATUS: "false"
          # Solo-approval guard: refuse to approve if `sdk-review-approved` was
          # already gone when this step started — dismiss-on-human,
          # downgrade-on-ci-failure and reset-on-push all clear it, and any of
          # them running means this verdict no longer stands.
          REQUIRE_APPROVED_LABEL: "true"
        run: python3 .github/scripts/sdk_review_approve.py

      - name: Set sdk-review status to failure (only on workflow failure)
        if: failure() && steps.pr.outputs.head_sha != ''
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Only fires when an earlier step failed AND the orchestration
            // never got to post its own terminal state. The orchestration
            // (Phase 3) sets success/failure based on the actual verdict;
            // this is a safety net for "workflow died before mothership
            // returned" cases (VPN failure, 401 on the API key, network
            // dropped during the 2h block). Without this, the status would
            // stay pending forever.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'sdk-review',
              description: 'SDK Review (mothership) workflow failed — see logs',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

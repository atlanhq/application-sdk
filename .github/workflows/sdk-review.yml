# SDK Review (mothership) — RETIRED.
#
# `@sdk-review` no longer starts a review from any trigger: not a human comment, not
# a bot comment (atlan-ci, mothership-ai[bot]), not workflow_dispatch. PR
# reviews are asked for with `/lens` (lens.yml). The mothership reviewer jobs
# that used to live here were removed; see git history for them. The helper
# scripts under .github/scripts/ are left in place.
#
# The only job left is `redirect-to-lens`, which answers a human `@sdk-review`
# comment with a 😕 reaction and a pointer to `/lens`.

name: SDK Review (mothership)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  # A human tag is answered with a 😕 — the reaction sdk_resolve_push_guard.py
  # reads as "seen and declined" — and a pointer to `/lens`. Posted with
  # GITHUB_TOKEN, which starts no workflow. The comment must not start with
  # `@sdk-review`, `@sdk-resolve` or `/lens`, or it would read as a trigger.
  redirect-to-lens:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '@sdk-review')
      && github.event.comment.user.login != 'atlan-ci'
      && github.event.comment.user.login != 'mothership-ai[bot]'
      && (
        github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout reaction helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/react_to_comment.py
          sparse-checkout-cone-mode: false

      - name: React to disabled trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: confused
        run: python3 .github/scripts/react_to_comment.py

      - name: Point to /lens
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Hi @${context.payload.comment.user.login} — \`@sdk-review\` can no longer be triggered from a PR comment. Pls use \`/lens\` instead.`,
            });

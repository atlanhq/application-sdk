# Update Fleet Dashboards — standalone scheduled workflow.
#
# Publishes the security, conformance and test-readiness dashboards on
# Kryptonite (k.atlan.dev/{security,conformance,test-readiness}-dashboard/)
# for the whole connector fleet from one central job. connector-pulse mirrors
# all three.
#
# CENTRAL PULL, NOT PER-REPO PUSH (FND-3337). These dashboards used to be
# written by update-dashboard.yaml, called from a shim bootstrap installed in
# every connector. The shim fired on workflow_run completion of Vulnerability
# Scan, Build & Publish and Conformance, so every merge to main triggered it up
# to three times, with up to three jobs each: eight billed jobs per merge per
# repo for a view nobody reads per-merge. This job reads each repo's newest
# live artifacts on its default branch instead. That is one job per interval
# for the whole fleet, and freshness is the interval. The shim is retired
# through bootstrap's RETIRED_FILES, so a resync deletes it from each repo.
#
# Every 3 hours, not hourly. The reads run against the atlan-app-fleet
# installation's hourly REST budget, which the Renovate sweep and dashboard
# also spend. Collecting one repo costs roughly 20-30 calls (three artifact
# lookups, one download per Conformance series, a few file reads), so ~80
# repos is ~2,000 calls a run. Every 3 hours keeps that well under the budget.
# Dispatch by hand when you need fresher data. :40 past keeps clear of the
# 0 */4 Renovate sweep and the :20 Renovate dashboard.
#
# A repo with no live artifact keeps its last published row (artifacts expire
# after 7 days). The row's own scanned_at / collectedAt is the age of the data,
# not the time of collection, so a stale row shows its age. See
# fleet_dashboards_collect.py.
#
# Two modes, same publish path:
#   Full-fleet (schedule / workflow_dispatch without repo input)
#   Single-repo (workflow_dispatch with repo=<owner/name>)
# Neither retires repos from the manifest (--partial-scan): a repo absent from
# this run's output was quiet, not removed. Departed repos are cleared with
# prune-dashboard-repo.yaml.
name: Update Fleet Dashboards

on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: >
          Single consumer repo to collect (e.g. atlanhq/my-app).
          Leave empty to collect the full fleet.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write # OIDC for aws-actions/configure-aws-credentials

# Queue rather than cancel: two runs racing the per-repo history
# download → merge → upload would drop a line.
concurrency:
  group: fleet-dashboards
  cancel-in-progress: false

jobs:
  fleet-dashboards:
    name: Update Fleet Dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout application-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Org-wide, no `repositories:` list. The job reads every fleet repo's
      # Actions artifacts and a few files, which the per-repo shim did with
      # each repo's own GITHUB_TOKEN.
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq

      - name: Scope to one repo
        id: discover_single
        if: inputs.repo != ''
        env:
          SINGLE_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          printf 'repos=["%s"]\n' "$SINGLE_REPO" >> "$GITHUB_OUTPUT"

      # The same deterministic discovery the Renovate runner and the minutes
      # report use: atlan-*-app repos extending the shared preset, which is
      # the set bootstrap installed the retired shim into. --fail-on-empty
      # because the whole collection scope comes from this output.
      - name: Discover the fleet
        id: discover_fleet
        if: inputs.repo == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discover_org_consumers.py \
            --owner atlanhq \
            --fail-on-empty

      - name: Collect dashboard data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOS: ${{ steps.discover_fleet.outputs.repos || steps.discover_single.outputs.repos }}
        run: |
          set -euo pipefail
          python3 .github/scripts/fleet_dashboards_collect.py \
            --repos "$REPOS" \
            --base-allowlist .security/base-allowlist.json \
            --out-dir dashboards-out

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::733936409301:role/kryptonite-store_FullAccess

      # One publish per dashboard, each gated on having something to publish.
      # publish_fleet_dashboard.py refuses an empty directory, and a dashboard
      # with no live artifact anywhere is routine on a quiet day.
      - name: Deploy to Kryptonite (security)
        if: hashFiles('dashboards-out/security-dashboard/repos/*.json') != ''
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_fleet_dashboard.py \
            --dir dashboards-out/security-dashboard \
            --prefix security-dashboard \
            --partial-scan
          aws s3 cp .security/dashboard/index.html \
            s3://kryptonite-store/security-dashboard/index.html

      - name: Deploy to Kryptonite (conformance)
        if: hashFiles('dashboards-out/conformance-dashboard/repos/*.json') != ''
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_fleet_dashboard.py \
            --dir dashboards-out/conformance-dashboard \
            --prefix conformance-dashboard \
            --partial-scan

      - name: Deploy to Kryptonite (test-readiness)
        if: hashFiles('dashboards-out/test-readiness-dashboard/repos/*.json') != ''
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_fleet_dashboard.py \
            --dir dashboards-out/test-readiness-dashboard \
            --prefix test-readiness-dashboard \
            --partial-scan

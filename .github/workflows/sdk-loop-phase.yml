# One phase of an @sdk-loop round — review OR resolve, never both.
#
# Called once per phase by sdk-loop.yml. Being a separate `workflow_call` job
# is the isolation: each phase gets its own runner, so a review can never
# inherit the resolve agent's working tree, git index or agent session. The
# only thing that crosses between phases is this workflow's outputs.
#
# The two phases differ in exactly one security-relevant way, and it is
# deliberate: the review phase is granted `contents: read` and the resolve
# phase `contents: write`. The reviewer's read-only contract is therefore a
# property of its credential rather than a promise in a prompt — a prompt
# injection riding the PR diff cannot make it push, because it holds no token
# that could.
#
# All conditional logic lives in .github/scripts/sdk_loop_*.py with tests in
# .github/scripts/tests/, per docs/standards/ci.md. The `run:` blocks here are
# straight-line calls.

name: 'Reusable: SDK Loop phase'

on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
        description: 'review | resolve'
      round:
        type: number
        required: true
      pr:
        type: string
        required: true
      head_ref:
        type: string
        required: true
      base_sha:
        type: string
        required: true
        description: 'The sha this round is fenced against.'
      ours:
        type: string
        required: false
        default: ''
        description: 'Comma-separated shas this run pushed, so its own progress is not read as interference.'
      ledger:
        type: string
        required: false
        default: ''
        description: 'Dismissal ledger JSON carried forward from earlier rounds.'
      verdict_url:
        type: string
        required: false
        default: ''
      prior_sha:
        type: string
        required: false
        default: ''
      spent_so_far:
        type: string
        required: false
        default: ''
        description: 'USD this run has spent already. The phase refuses to start once it reaches the allowance.'
        description: 'Sha the previous round reviewed, for delta labelling. Never narrows the review.'
    secrets:
      LITELLM_API_KEY:
        required: true
      # The gateway endpoint is configuration, not source. It rides a secret so
      # the URL is never written into this repository, and the phase script
      # fails closed rather than defaulting to a guess.
      LITELLM_BASE_URL:
        required: true
      FLEET_APP_ID:
        required: true
      FLEET_APP_PRIVATE_KEY:
        required: true
    outputs:
      outcome:
        value: ${{ jobs.phase.outputs.outcome }}
      verdict:
        value: ${{ jobs.phase.outputs.verdict }}
      verdict_url:
        value: ${{ jobs.phase.outputs.verdict_url }}
      reviewed_head:
        value: ${{ jobs.phase.outputs.reviewed_head }}
      new_base_sha:
        value: ${{ jobs.phase.outputs.new_base_sha }}
      pushed_sha:
        value: ${{ jobs.phase.outputs.pushed_sha }}
      ledger:
        value: ${{ jobs.phase.outputs.ledger }}
      detail:
        value: ${{ jobs.phase.outputs.detail }}
      cost:
        value: ${{ jobs.phase.outputs.cost }}
      spent_total:
        value: ${{ jobs.phase.outputs.spent_total }}

permissions:
  contents: read

jobs:
  phase:
    runs-on: ubuntu-latest
    # Review is the slower phase: it walks the whole playbook, sub-agents
    # included. The headroom is for checkout and token minting, not the agent —
    # the agent's own budget is enforced inside sdk_loop_phase.py.
    timeout-minutes: ${{ inputs.phase == 'review' && 55 || 40 }}
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      verdict: ${{ steps.run.outputs.verdict }}
      verdict_url: ${{ steps.run.outputs.verdict_url }}
      reviewed_head: ${{ steps.run.outputs.reviewed_head }}
      new_base_sha: ${{ steps.run.outputs.new_base_sha }}
      pushed_sha: ${{ steps.run.outputs.pushed_sha }}
      ledger: ${{ steps.run.outputs.ledger }}
      detail: ${{ steps.run.outputs.detail }}
      cost: ${{ steps.run.outputs.cost }}
      spent_total: ${{ steps.run.outputs.spent_total }}
    steps:
      - name: Mint a scoped App token
        id: app-token
        # atlan-app-fleet, the same App the existing lanes use. It is granted
        # far more than this lane needs — actions, administration, checks,
        # packages, statuses — so every `permission-*` below is a NARROWING:
        # naming any of them scopes the minted token to those alone and drops
        # the rest. A phase never holds the App's full grant.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # The whole read-only guarantee for the review phase is this line.
          permission-contents: ${{ inputs.phase == 'resolve' && 'write' || 'read' }}
          permission-pull-requests: write
          # PR comments are an Issues-scope resource, which the existing lane
          # learned the hard way (see "Mint fleet App token" in sdk-review.yml).
          # The review phase posts its verdict as one, so without this it 403s
          # after the model has already been paid for.
          permission-issues: write

      - name: Checkout the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base_sha }}
          # Full history: the review playbook diffs against the base branch.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # The resolve phase pushes with this credential; the review phase
          # holds one that cannot.
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # A loop is up to 17 phase jobs, each on a fresh runner, so anything
      # installed per job is paid for 17 times. Cache the global npm store so
      # only the first job of a run pays the download.
      - name: Cache the opencode install
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.npm
          key: opencode-${{ runner.os }}-0.6.3

      - name: Install opencode
        run: npm install -g --prefer-offline opencode-ai@0.6.3

      - name: Configure git identity for the resolve phase
        if: inputs.phase == 'resolve'
        run: |
          git config user.name  "atlan-ci"
          git config user.email "atlan-ci@users.noreply.github.com"

      - name: Run the phase
        id: run
        # Untrusted-input discipline: nothing from the PR — title, body, diff,
        # comment text — is ever interpolated with ${{ }} into a shell that
        # holds the App token. Inputs ride env vars, which the shell treats as
        # data, and the script passes the prompt to the agent as an argv
        # element rather than through a shell at all.
        env:
          PHASE: ${{ inputs.phase }}
          ROUND: ${{ inputs.round }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          OURS: ${{ inputs.ours }}
          LEDGER: ${{ inputs.ledger }}
          VERDICT_URL: ${{ inputs.verdict_url }}
          PRIOR_SHA: ${{ inputs.prior_sha }}
          SPENT_SO_FAR: ${{ inputs.spent_so_far }}
          SDK_LOOP_MAX_USD: ${{ vars.SDK_LOOP_MAX_USD }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: python3 .github/scripts/sdk_loop_phase.py

      # GitHub truncates long job logs, and the interesting part of a failed
      # review is usually the middle. `always()` because a phase that died is
      # exactly the one whose transcript someone will want.
      # Uploaded twice on purpose. The artifact service returns a
      # non-retryable-looking 403 on finalize even when the bytes landed, and
      # upload-artifact fails the step on it — which on a gating path ejects
      # the whole run for a flake a second attempt absorbs. The repo enforces
      # this pairing in test_artifact_upload_retry.py.
      - name: Keep the agent transcript
        id: transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-loop-${{ inputs.phase }}-${{ inputs.round }}
          path: sdk-loop-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the agent transcript (retry)
        if: always() && steps.transcript.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-loop-${{ inputs.phase }}-${{ inputs.round }}
          path: sdk-loop-*.log
          if-no-files-found: ignore
          retention-days: 14
          # A finalize that failed can still leave the artifact behind, and
          # without this the retry 409s on its own first attempt.
          overwrite: true

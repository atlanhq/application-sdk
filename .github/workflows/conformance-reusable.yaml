      - name: "K · Contract toolkit"
        id: detect-contract-toolkit
        if: "!cancelled() && (steps.changes.outputs.contract-toolkit == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: K
          slug: contract-toolkit

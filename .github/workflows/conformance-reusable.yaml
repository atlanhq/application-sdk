# .github/workflows/conformance-reusable.yaml
#
# Reusable workflow: full conformance suite gate.
#
# ONE job runs every rule series (C, E, P, F, O, L, T, I, B, K, S, D) in
# sequence, plus the contract-ledger guard, and reports as the required check:
#   Conformance / suite / Conformance Gate
# (ruleset context `suite / Conformance Gate`: the caller's job id `suite`, then
# this job's name).
#
# It used to be a 12-leg matrix (one job per series) plus a `Contracts` job and
# a `Conformance Gate` job that aggregated them — 14 billed jobs a run, most of
# them a runner, a checkout and a one-minute minimum spent on a series whose
# paths had not changed (FND-3318).  Now the path filter is computed once, the
# series whose paths changed run one after another, and the rest are skipped
# steps that cost nothing.  Only `Conformance Gate` was ever a required
# context in the fleet rulesets, and this job carries that name, so the gate
# a merge waits on is unchanged; the per-series check runs are gone.
#
# The one other job, `queue-diff`, runs only on a merge-queue entry: a slim
# job that lets the suite skip when the queue commit's tree is the PR head's
# (FND-3321).  On every other event it is skipped and bills nothing.
#
# Per-series visibility without per-series jobs:
#   - every series is its own `<letter> · <name>` step, so a red series is red
#     in the job's step list;
#   - every series still uploads its own `conformance-<slug>-sarif` artifact,
#     the name conformance-upload-sarif-reusable.yaml and
#     fetch_conformance_sarif.py resolve, so the Security tab keeps one
#     `conformance-<slug>` category per series;
#   - the job summary carries a table of each series' outcome.
#
# A failing series must not stop the ones after it — the matrix ran with
# fail-fast off — so every series step is `if: !cancelled() && (relevant)`
# rather than relying on the implicit `success()`.  The job still fails if any
# series failed, which is the verdict the old gate job computed.
#
# Per-series path filters: C-series watches `.github/**`, D-series watches
# `**/pyproject.toml`, T-series watches `{tests/**,**/pyproject.toml,...}`,
# I-series watches `Dockerfile`, and the AST series (E/P/O/L/B/S) watch
# `**/*.py`.  Each is one named filter in the `changes` step.
#
# D runs LAST: it is the only series that materialises the caller's
# environment (`uv sync`), and running it first would leave a `.venv/` in the
# workspace for every later series to walk.
#
# Scope: the runner auto-detects whether the caller repo is the SDK or a consumer
# app (from its `[project].name`) and runs only the rules in scope.  The
# app-scoped rules (D001/D002 and the bootstrap-workflow-drift rule C002) no-op on
# the SDK itself with no per-caller configuration; the both-scoped rules — which
# include D003 (UnusedDependency) — run on the SDK as well.
#
# Usage from a connector SDK/app:
#   uses: atlanhq/application-sdk/.github/workflows/conformance-reusable.yaml@main
#
# Note: the default conformance-ref='' path requires atlan-application-sdk-conformance
# to be published on PyPI. Pin conformance-ref to a git SHA only when testing
# unreleased suite changes.
#
# ── Suppression vs path exclusion ─────────────────────────────────────────────
#
# There are two ways to reduce the set of findings a check reports.  They serve
# different purposes and carry different audit properties:
#
#   # conformance: ignore[Exxx] <reason>   (or  # noqa: S110 — <reason>)
#     A per-site, in-source suppression for a specific finding.  The finding is
#     still emitted to the SARIF artifact as a suppressed result with the
#     justification text preserved — it is counted in atlan/summary.suppressing
#     and downloadable as a build artifact.  Suppressed results are stripped
#     from the Security tab upload so they do not create alerts or PR
#     annotations.  Use this for production code in the SDK/app that has a
#     legitimate, site-specific carve-out.
#
#   exclude-paths-c / exclude-paths-e / exclude-paths-p / exclude-paths-f / exclude-paths-o / exclude-paths-i / exclude-paths-k
#     A path prefix removed from scanning entirely.  Nothing from that path
#     appears in the SARIF report.  Use this only for code that is categorically
#     outside the SDK/app surface — tooling, migration scripts, generated files,
#     or other paths that will never run in production.  Excluded paths are
#     recorded in atlan/excludedPaths in the SARIF run properties and surfaced
#     as a ::notice annotation so the reduced scope is always visible.
#     Extending this list to cover production code defeats the gate.
#
# ── conformance-ref override ──────────────────────────────────────────────────
#
#   conformance-ref: ""  (default)
#     Install atlan-application-sdk-conformance from PyPI (latest published).
#
#   conformance-ref: <branch|tag|sha>
#     Install from that git ref's subdirectory, enabling pre-release testing
#     of an unreleased conformance suite change before it is published.
#     The SDK's own conformance.yaml passes the PR HEAD sha here so it always
#     dogfoods its own in-flight suite.

name: "Conformance (reusable)"

on:
  workflow_call:
    inputs:
      conformance-ref:
        description: >
          Git ref of atlanhq/application-sdk to source the conformance suite from.
          Empty (default) uses the latest published PyPI package.
          Set to a branch/tag/sha to test an unreleased suite version.
        required: false
        default: ""
        type: string
      event_name:
        description: >
          Caller's github.event_name (push / pull_request / merge_group).
          Taken as an input, not read from the context, so a caller can
          declare push semantics deliberately — the SDK's sdk-gate.yaml
          does exactly that. (A called reusable workflow does see the
          caller's real event in github.event_name, not 'workflow_call';
          the input is a choice, not a workaround.)
        required: false
        default: ""
        type: string
      exclude-paths-c:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from C-series
          checks only, e.g. 'tools/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-e:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from E-series
          checks only, e.g. 'tools/,contract-toolkit/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-p:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from P-series
          (prescription) checks only, e.g. 'tools/,contract-toolkit/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-f:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from F-series
          (preflight-gate) checks only, e.g. 'tools/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-o:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from O-series
          (optimisation) checks only, e.g. 'tools/,contract-toolkit/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-d:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from D-series
          (dependency) checks only, e.g. 'tools/,contract-toolkit/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-l:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from L-series
          (logging) checks only, e.g. 'tools/,contract-toolkit/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-t:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from T-series
          (test-marking) checks only, e.g. 'tests/integration/_example/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-i:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from I-series
          (container image) checks only.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-b:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from B-series
          (deprecation) checks only, e.g. 'tools/,contract-toolkit/'.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-k:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from K-series
          (contract-toolkit) checks only.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      exclude-paths-s:
        description: >
          Comma-separated repo-root-relative path prefixes to exclude from S-series
          (security / secret-hygiene) checks only.  Default: nothing excluded.
        required: false
        default: ""
        type: string
      ledger-path:
        description: >
          Repo-relative path to the app's committed contract ledger
          (contract_schema.lock.json).  The guard compares this file between
          origin/main and HEAD and blocks any deletion, type change, skipped
          deprecation, or field that became required on an existing contract.
          Default: contract_schema.lock.json (repo root — the convention for app
          repos and the SDK alike; the SDK's conformance wheel packages its root
          ledger at build time).
        required: false
        default: "contract_schema.lock.json"
        type: string
      force-all:
        description: >
          Run every rule series regardless of which paths changed.  Same effect
          as event_name == 'push'; the SDK's sdk-gate.yaml sets this on
          release / version-bump branches and v* tags so a release dry-runs the
          full suite.  Default: false (per-series path selection applies).
        required: false
        default: false
        type: boolean
      apt-packages:
        required: false
        type: string
        default: ""
        description: |
          Space-separated Ubuntu packages apt-installed before the D
          series' `uv sync` (the detect action's needs-env step).  Only the
          D series materialises the caller's environment; every other
          series runs from an isolated `uvx` env, so this step is a no-op on
          them.  Empty (the default) skips the step entirely, so every existing
          caller is unaffected.

          Accepted form is deliberately narrow — plain package NAMES only,
          separated by whitespace, each matching Debian's own
          `[a-z0-9][a-z0-9+.-]*` (so `g++`, `libstdc++6`, `python3.11-dev` are
          fine).  Anything else fails the job before apt runs, including
          arch-qualified (`libkrb5-dev:amd64`) and version-pinned
          (`libkrb5-dev=1.2.3`) forms, apt flags, local `.deb` paths, and
          globs.  If a connector genuinely needs one of those, widen the
          allowlist in this workflow deliberately rather than working around it
          from the caller.
      private-git-deps:
        description: >
          Set true when the app's lockfile pins a PRIVATE atlanhq git dependency
          (e.g. query-redaction).  The D series is the only one that
          materialises the environment (`uv sync`, via the detect action's
          needs-env step), and an unauthenticated clone of a private atlanhq repo
          fails there — so with this flag the suite job rewrites atlanhq remotes
          to a token URL (ORG_PAT_GITHUB) first.  Requires the caller to pass
          `secrets: inherit`.  Leave false for apps with only public deps.
        required: false
        default: false
        type: boolean
      exit-zero:
        description: >
          When true, the detect command exits 0 even when blocking violations are
          found.  The SARIF invocation.exitCode still records the real result so
          Security-tab tracking is unaffected; only the CI job exit code changes.
          Use during soft-enforcement rollouts where violations should be observed
          but must not block merges.  Default: false (hard gate).
        required: false
        default: false
        type: boolean
      with-tests:
        description: >
          Deprecated no-op.  Kept so a caller that still passes it keeps
          working: a reusable rejects an undeclared input at startup, with no
          check run to say why.  Nothing reads it.  Conformance
          checks that the preflight scenarios are defined (F016 reads their
          registrations statically, and a fully defined matrix clears F019's
          value-level gaps); whether those tests pass is the test gate's measure,
          so no conformance series syncs an environment or runs pytest for it.
        required: false
        default: false
        type: boolean
    secrets:
      ORG_PAT_GITHUB:
        required: false
        description: >
          Token used to reach PRIVATE atlanhq git dependencies when
          `private-git-deps` is true.  Optional: a caller with only public deps
          passes nothing.  Declared so a caller that maps secrets EXPLICITLY
          (rather than `secrets: inherit`) is validated at parse time instead of
          silently supplying an empty token.

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Merge-queue entry: did combining with the base change the tree? ─────────
  # Conformance reads the tree and nothing else, so on a queue commit whose
  # tree is exactly the PR head's it can only repeat the verdict the PR already
  # earned — a PR cannot enter the queue until this gate is green on its head
  # (FND-3321).  This job answers that one question; `suite` skips on it.
  #
  # Runs only on a real queue entry and never when forcing: on every other
  # event it is skipped (not billed) and its outputs are empty, which `suite`
  # reads as "run".  Fails safe the same way — an error here leaves the outputs
  # empty and the suite runs.  docs/standards/ci.md ("What a merge-queue entry
  # re-runs") has the classification this is one row of.
  queue-diff:
    name: "Queue tree diff"
    if: github.event_name == 'merge_group' && inputs.event_name == 'merge_group' && !inputs.force-all
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      identical: ${{ steps.diff.outputs.identical }}
    steps:
      # The queue commit, depth 1. Credentials stay persisted: the script
      # fetches the PR head from this same remote, and the repo may be private.
      - name: "Checkout queue commit"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Pinned to `job.workflow_sha` so the script always matches the workflow
      # running it (same as tests-reusable.yaml's Detect merge queue).
      - name: "Fetch queue_tree_diff.py from SDK"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts/queue_tree_diff.py
          sparse-checkout-cone-mode: false
          path: _sdk
          persist-credentials: false

      - name: "Compare the queue commit with the PR head"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_SHA: ${{ github.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 _sdk/.github/scripts/queue_tree_diff.py

  # ── The suite, the ledger guard and the gate, in one job ────────────────────
  # `series`, `slug` and the filter globs are workflow-controlled constants;
  # the exclude-paths inputs are the only caller-controlled values, and they
  # reach the shell through the detect action's `EXCLUDE_PATHS` env var, quoted
  # — never interpolated into a `run:` script — so an exclude-path string can
  # never inject shell.
  #
  # The job-level `if:` skips it in exactly one case: a merge-queue entry whose
  # tree is identical to the PR head's.  A skipped job still files its
  # `Conformance Gate` check run, as `skipped`, which the required context
  # counts as a pass, so the queue drains on the PR's own verdict.  The queue
  # commit is unique to its entry, so no other run on that SHA can be the
  # "newest suite" that this skip would override.  Everywhere else the job
  # always runs: `!cancelled()` keeps it running when `queue-diff` is skipped
  # (every non-queue event) or fails, and an empty output is not `'true'`.  A
  # job of only skipped series steps passes, exactly as the old gate passed a
  # suite whose legs had all self-skipped.
  suite:
    name: "Conformance Gate"
    needs: [queue-diff]
    if: ${{ !cancelled() && needs.queue-diff.outputs.identical != 'true' }}
    runs-on: ubuntu-latest
    env:
      # Surfaced as env because a step-level `if:` cannot read the secrets
      # context, and the rewrite step must gate on the credential being
      # present rather than on the flag alone.
      GIT_TOKEN: ${{ secrets.ORG_PAT_GITHUB }}
    steps:
      # Full history only where the ledger guard runs (it diffs against
      # origin/main); push-to-main skips the guard, so it keeps the shallow
      # clone.  `push && 1 || 0`, not `!push && 0 || 1`: 0 is falsy in an
      # expression, so the latter always yields 1.
      - name: "Checkout caller repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.event_name == 'push' && 1 || 0 }}

      # Computed ONCE for every series — one named filter per series slug, so
      # `steps.changes.outputs.<slug>` is that series' relevance.
      #
      # Skipped when forcing (release/version-bump/tag) or on push-to-main: in
      # all those cases every series fires regardless (their `if:`s OR in
      # `inputs.event_name == 'push' || inputs.force-all`), and a tag push has
      # no clean diff base for paths-filter — running it could hard-fail the
      # job and turn the gate red on a release. Mirrors sdk-gate.yaml, which
      # skips its own outer filter for the same reason.
      #
      # picomatch never matches a leading dot with a wildcard, so `**/*.yaml`
      # never matches `.github/...`: every series that reads `.github/` names
      # it explicitly.  `test_series_globs_cover_their_checkers` fails if a
      # checker reads a tree its series' filter does not watch.
      - name: "Detect changed files"
        id: changes
        if: inputs.event_name != 'push' && !inputs.force-all
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            ci:
              - ".github/**"
            error-handling:
              - "**/*.py"
            # P016 reads both Python sources (@entrypoint code) and the
            # app/generated/ + contract/ trees (contract-side artifacts), so a
            # PR that only re-runs pkl eval and commits regenerated
            # app/generated/ files — the canonical BLDX-1425 drift shape — must
            # still trigger P.
            prescriptions:
              - "{**/*.py,app/generated/**,contract/**}"
            # F-series is the preflight gate.  F015 reads deployment
            # declarations under .github/workflows/, deploy/, deployment/,
            # helm/ and k8s/ for gate configuration removed by SDK PR #3685, so
            # a manifest-only PR must still trigger F.
            preflight:
              - "{**/*.py,.github/**,deploy/**,deployment/**,helm/**,k8s/**}"
            optimizations:
              - "**/*.py"
            logging:
              - "**/*.py"
            # T005-T009/T013 walk the whole `tests/` tree and T010-T012/
            # T014-T015 read `pyproject.toml`.  `.github/**` because
            # e2e_workflow_shape (T020-T022), e2e_deployment_name and
            # coverage_config read the workflows — a PR that ONLY edits
            # `.github/workflows/tests.yaml` is exactly the diff T020-T022
            # grade.  `app/generated/**` + `contract/**` because
            # e2e_generated_harness reads the committed `_e2e_base.py` under
            # both trees.  Remaining edge cases are caught on push to main,
            # where every series runs.  Acceptable at WARN tier.
            tests:
              - "{tests/**,**/pyproject.toml,.github/**,app/generated/**,contract/**}"
            # I-series is APP-scoped and no-ops on the SDK itself (the SDK
            # Dockerfile builds the base image, not a consumer app).
            container-image:
              - "Dockerfile"
            # B-series is mixed-scope: B001 (app) flags consumption of
            # deprecated SDK symbols, B002-B004 (sdk) check the SDK's own
            # deprecation authoring.  Scope is auto-detected per caller.
            deprecation:
              - "**/*.py"
            # K-series is APP-scoped and no-ops on the SDK itself.  Watches the
            # contract source (K001-K003) AND the generated artifacts
            # (K004/K005): a hand-edit to atlan.yaml or app/generated/** with no
            # contract/ change must still trigger K.
            contract-toolkit:
              - "{contract/**,atlan.yaml,app.yaml,app/generated/**}"
            # S-series (secret hygiene): S001 is 'both'; S002 is APP-scoped.
            security:
              - "**/*.py"
            # D003 (UnusedDependency) reads source imports too, but the filter
            # watches only `**/pyproject.toml` to keep this (env-syncing,
            # heavier) series off every `*.py` PR.  A PR that removes the last
            # import of a still-declared dependency won't re-run D; that is
            # caught on push to main.  Acceptable at WARN tier.
            dependency:
              - "**/pyproject.toml"

      # Unconditional: the ledger guard needs uv on every non-push event, and
      # a run where every series is skipped is a few seconds either way.
      - name: "Set up uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The flag promises a token; with ORG_PAT_GITHUB absent the rewrite below
      # would redirect every atlanhq URL — including a git-ref conformance
      # install — to an unauthenticated token URL, failing far from the cause.
      # Condition stays in `if:`, never in the shell (docs/standards/ci.md).
      - name: "Require ORG_PAT_GITHUB when private-git-deps is set"
        if: inputs.private-git-deps && env.GIT_TOKEN == ''
        shell: bash
        run: |
          echo "::error::private-git-deps is true but ORG_PAT_GITHUB is unset"
          exit 1

      # Only the D-series materialises the environment (the detect action's
      # needs-env `uv sync`).  --global writes ~/.gitconfig, so it applies to
      # the clone uv performs inside the action.
      - name: "Authenticate private atlanhq git dependencies"
        if: inputs.private-git-deps && env.GIT_TOKEN != ''
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "https://github.com/atlanhq/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/atlanhq/".insteadOf "ssh://git@github.com/atlanhq/"

      # ── Refused Renovate lock ───────────────────────────────────────────────
      # A refused Renovate lock bump is withheld by writing a lock no
      # `--locked` / `--check` consumer accepts (renovate_uv_lock_bounded.py,
      # `withhold`).  The required `scan / Build Image` used to reject it; since
      # FND-3328 that job skips on every PR but the bump-version PR.  The same
      # check also runs in checks-reusable.yaml's Pre-commit job, but not every
      # repo requires that context; every repo requires this one (FND-3404).
      # Same script, same base-diff rule: runs only when uv.lock differs from
      # the base.  Not subject to `exit-zero`, which softens conformance
      # findings, not this.  After the private-deps rewrite, since resolving
      # can reach a private git dependency.  Fetched at this workflow's own
      # SHA into its own path, and removed before any series walks the tree.
      - name: "Fetch check_uv_lock.py from SDK"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanhq/application-sdk
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts/check_uv_lock.py
          sparse-checkout-cone-mode: false
          path: .sdk-lock-check
          persist-credentials: false

      - name: "uv.lock matches pyproject.toml"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 .sdk-lock-check/.github/scripts/check_uv_lock.py

      - name: "Remove the fetched SDK script"
        if: "!cancelled()"
        run: rm -rf .sdk-lock-check

      # ── Series ──────────────────────────────────────────────────────────────
      # Each series is a detect step and a SARIF upload.  The upload is
      # `continue-on-error`: `upload-artifact` classifies the artifact
      # service's finalize 403 as non-retryable and fails on the first
      # occurrence, even though the bytes already landed — and a failed upload
      # would fail the gate and eject the merge-queue entry.  The series
      # verdict is the gate; the artifact only feeds the Security tab, and
      # conformance-upload-sarif.yaml already treats a missing artifact as an
      # expected state.  The retries follow the last series.
      #
      # Every upload sets `overwrite: true` on the FIRST attempt too: artifacts
      # survive across attempts of a run, so re-running a failed job would
      # otherwise 409 here.  It is also what holds the invariant every
      # consumer of these uploads globs on: at most ONE live artifact ever
      # matches `<name>*`.  `retention-days` is explicit, or it falls back to
      # the 90-day repo default (FND-3313); the one reader,
      # conformance-upload-sarif.yaml, fires on workflow_run as soon as this
      # run completes.
      - name: "C · CI"
        id: detect-ci
        if: "!cancelled() && (steps.changes.outputs.ci == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: C
          slug: ci
          exclude-paths: ${{ inputs.exclude-paths-c }}
          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}

      - name: "C · upload SARIF"
        id: upload-ci
        if: "!cancelled() && (steps.changes.outputs.ci == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-ci-sarif
          path: ci.sarif
          retention-days: 7
          overwrite: true

      - name: "E · Error handling"
        id: detect-error-handling
        if: "!cancelled() && (steps.changes.outputs.error-handling == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: E
          slug: error-handling
          exclude-paths: ${{ inputs.exclude-paths-e }}
          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}

      - name: "E · upload SARIF"
        id: upload-error-handling
        if: "!cancelled() && (steps.changes.outputs.error-handling == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-error-handling-sarif
          path: error-handling.sarif
          retention-days: 7
          overwrite: true

      - name: "P · Prescriptions"
        id: detect-prescriptions
        if: "!cancelled() && (steps.changes.outputs.prescriptions == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: P
          slug: prescriptions
          exclude-paths: ${{ inputs.exclude-paths-p }}
          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}

      - name: "P · upload SARIF"
        id: upload-prescriptions
        if: "!cancelled() && (steps.changes.outputs.prescriptions == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-prescriptions-sarif
          path: prescriptions.sarif
          retention-days: 7

        with:
          series: T
          slug: tests
          exclude-paths: ${{ inputs.exclude-paths-t }}
          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}

      - name: "T · upload SARIF"
        id: upload-tests
        if: "!cancelled() && (steps.changes.outputs.tests == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-tests-sarif
          path: tests.sarif
          retention-days: 7
          overwrite: true

      - name: "I · Container images"
        id: detect-container-image
        if: "!cancelled() && (steps.changes.outputs.container-image == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: I
          slug: container-image
          exclude-paths: ${{ inputs.exclude-paths-i }}
          exit-zero: ${{ inputs.exit-zero }}

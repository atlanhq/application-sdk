          overwrite: true

      - name: "B · Deprecations"
        id: detect-deprecation
        if: "!cancelled() && (steps.changes.outputs.deprecation == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: B
          slug: deprecation

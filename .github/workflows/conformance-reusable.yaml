          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}

      - name: "O · upload SARIF"
        id: upload-optimizations
        if: "!cancelled() && (steps.changes.outputs.optimizations == 'true' || inputs.event_name == 'push' || inputs.force-all)"

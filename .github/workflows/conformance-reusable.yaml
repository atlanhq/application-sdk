      - name: "K · upload SARIF"
        id: upload-contract-toolkit
        if: "!cancelled() && (steps.changes.outputs.contract-toolkit == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-contract-toolkit-sarif
          path: contract-toolkit.sarif
          retention-days: 7
          overwrite: true

      - name: "S · Security"
        id: detect-security
        if: "!cancelled() && (steps.changes.outputs.security == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        uses: ./.github/actions/run-conformance-detect
        with:
          series: S
          slug: security
          exclude-paths: ${{ inputs.exclude-paths-s }}
          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}

      - name: "S · upload SARIF"
        id: upload-security
        if: "!cancelled() && (steps.changes.outputs.security == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-security-sarif
          path: security.sarif
          retention-days: 7
          overwrite: true

      # D-series only: the detect action's needs-env `uv sync` builds the
      # caller's environment, and a native sdist (e.g. pykerberos needs
      # libkrb5-dev) fails there without its headers.  Follows D's relevance
      # gate, so it installs nothing on a PR that then skips D.  The value is
      # routed through env, never interpolated into the script, and matched
      # WHOLE against the same strict Debian package-name allowlist as
      # tests-reusable.yaml before it is used.  D detect does not run after a
      # failed install — it would only fail again, further from the cause.
      - name: Install system packages (apt-packages)
        id: apt-packages
        if: >-
          !cancelled() && inputs.apt-packages != ''
          && (steps.changes.outputs.dependency == 'true' || inputs.event_name == 'push' || inputs.force-all)
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          echo "Validating and installing apt packages: $APT_PACKAGES"
          printf '%s' "$APT_PACKAGES" | tr '\n' ' ' \
            | grep -xE '[a-z0-9][a-z0-9+.-]*([[:space:]]+[a-z0-9][a-z0-9+.-]*)*' >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: "D · Dependencies"
        id: detect-dependency
        if: >-
          !cancelled() && steps.apt-packages.outcome != 'failure'
          && (steps.changes.outputs.dependency == 'true' || inputs.event_name == 'push' || inputs.force-all)
        uses: ./.github/actions/run-conformance-detect
        with:
          series: D
          slug: dependency
          exclude-paths: ${{ inputs.exclude-paths-d }}
          exit-zero: ${{ inputs.exit-zero }}
          conformance-ref: ${{ inputs.conformance-ref }}
          needs-env: "true"

      - name: "D · upload SARIF"
        id: upload-dependency
        if: "!cancelled() && (steps.changes.outputs.dependency == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-dependency-sarif
          path: dependency.sarif
          retention-days: 7
          overwrite: true

      # A finalize 403 comes from an intermediary having a moment, and a retry
      # a second later lands in the same window.  One wait covers every series:
      # each retry below already runs at least this long after its own first
      # attempt.
      - name: Wait before the SARIF upload retries
        if: >-
          !cancelled() && (
          steps.upload-ci.outcome == 'failure'
          || steps.upload-error-handling.outcome == 'failure'
          || steps.upload-prescriptions.outcome == 'failure'
          || steps.upload-preflight.outcome == 'failure'
          || steps.upload-optimizations.outcome == 'failure'
          || steps.upload-logging.outcome == 'failure'
          || steps.upload-tests.outcome == 'failure'
          || steps.upload-container-image.outcome == 'failure'
          || steps.upload-deprecation.outcome == 'failure'
          || steps.upload-contract-toolkit.outcome == 'failure'
          || steps.upload-security.outcome == 'failure'
          || steps.upload-dependency.outcome == 'failure')
        run: sleep 20

      # A DISTINCT name, never the first attempt's: a FinalizeArtifact failure
      # leaves an unfinalized record holding that name for the whole run.  The
      # list API cannot see it, so `overwrite` cannot clear it and
      # CreateArtifact 409s — a same-named retry could never have worked.
      # Consumers resolve these artifacts by `<name>*` glob, not exact name.
      - name: "C · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-ci.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-ci-sarif-retry
          path: ci.sarif
          retention-days: 7
          overwrite: true

      - name: "E · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-error-handling.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-error-handling-sarif-retry
          path: error-handling.sarif
          retention-days: 7
          overwrite: true

      - name: "P · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-prescriptions.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-prescriptions-sarif-retry
          path: prescriptions.sarif
          retention-days: 7
          overwrite: true

      - name: "F · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-preflight.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-preflight-sarif-retry
          path: preflight.sarif
          retention-days: 7
          overwrite: true

      - name: "O · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-optimizations.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-optimizations-sarif-retry
          path: optimizations.sarif
          retention-days: 7
          overwrite: true

      - name: "L · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-logging.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-logging-sarif-retry
          path: logging.sarif
          retention-days: 7
          overwrite: true

      - name: "T · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-tests.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-tests-sarif-retry
          path: tests.sarif
          retention-days: 7
          overwrite: true

      - name: "I · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-container-image.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-container-image-sarif-retry
          path: container-image.sarif
          retention-days: 7
          overwrite: true

      - name: "B · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-deprecation.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-deprecation-sarif-retry
          path: deprecation.sarif
          retention-days: 7
          overwrite: true

      - name: "K · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-contract-toolkit.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-contract-toolkit-sarif-retry
          path: contract-toolkit.sarif
          retention-days: 7
          overwrite: true

      - name: "S · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-security.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-security-sarif-retry
          path: security.sarif
          retention-days: 7
          overwrite: true

      - name: "D · upload SARIF (retry)"
        if: "!cancelled() && steps.upload-dependency.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-dependency-sarif-retry
          path: dependency.sarif
          retention-days: 7
          overwrite: true

      # ── Contract ledger append-only guard ───────────────────────────────────
      # Verifies that no entry was deleted from the committed contract ledger,
      # no recorded type was changed, no entry moved straight from active to
      # sunset, no required entry was added to an existing contract, and no
      # entry moved from not required to required between origin/main and
      # HEAD.  Adding optional entries, new contracts and other status changes
      # are allowed; B005 is what blocks these in source.  Uses
      # `uvx atlan-application-sdk-conformance ledger-guard` so the guard
      # travels with the published package.  Skipped on push to main (no
      # base-ref diff).
      #
      # `continue-on-error`: this was its own `Contracts` job, which the old
      # gate did NOT depend on and no ruleset requires, so a ledger violation
      # never blocked a merge.  Folding it into the gate job must not change
      # that verdict; the failure is surfaced as an error annotation and in the
      # summary table instead of as a red check.
      - name: "Guard contract_schema.lock.json (published package)"
        id: ledger-published
        if: "!cancelled() && inputs.event_name != 'push' && inputs.conformance-ref == ''"
        continue-on-error: true
        env:
          LEDGER_PATH: ${{ inputs.ledger-path }}
        run: uvx atlan-application-sdk-conformance ledger-guard --base-ref origin/main --ledger-path "$LEDGER_PATH"

      - name: "Guard contract_schema.lock.json (in-flight conformance-ref)"
        id: ledger-ref
        if: "!cancelled() && inputs.event_name != 'push' && inputs.conformance-ref != ''"
        continue-on-error: true
        env:
          LEDGER_PATH: ${{ inputs.ledger-path }}
          # Through env, never interpolated into the script: the ref is a
          # caller-supplied string and `${{ }}` would splice it into shell source.
          CONFORMANCE_REF: ${{ inputs.conformance-ref }}
        run: >-
          uvx
          --from "atlan-application-sdk-conformance @ git+https://github.com/atlanhq/application-sdk@${CONFORMANCE_REF}#subdirectory=packages/conformance"
          atlan-application-sdk-conformance ledger-guard --base-ref origin/main --ledger-path "$LEDGER_PATH"

      - name: "Report a contract ledger violation"
        if: >-
          !cancelled()
          && (steps.ledger-published.outcome == 'failure' || steps.ledger-ref.outcome == 'failure')
        run: echo "::error title=Contract ledger guard::An entry was removed from, a recorded type changed in, an entry moved straight from active to sunset in, or a field became required on an existing contract in, the contract ledger. Not merge-blocking; see the guard step's log."

      # Per-series visibility in one place.  Straight-line by design
      # (docs/standards/ci.md): an outcome is `success`, `failure` or `skipped`
      # (nothing relevant changed), passed through env and printed as-is.
      - name: "Summarise series results"
        if: "!cancelled()"
        env:
          C_OUTCOME: ${{ steps.detect-ci.outcome }}
          E_OUTCOME: ${{ steps.detect-error-handling.outcome }}
          P_OUTCOME: ${{ steps.detect-prescriptions.outcome }}
          F_OUTCOME: ${{ steps.detect-preflight.outcome }}
          O_OUTCOME: ${{ steps.detect-optimizations.outcome }}
          L_OUTCOME: ${{ steps.detect-logging.outcome }}
          T_OUTCOME: ${{ steps.detect-tests.outcome }}
          I_OUTCOME: ${{ steps.detect-container-image.outcome }}
          B_OUTCOME: ${{ steps.detect-deprecation.outcome }}
          K_OUTCOME: ${{ steps.detect-contract-toolkit.outcome }}
          S_OUTCOME: ${{ steps.detect-security.outcome }}
          D_OUTCOME: ${{ steps.detect-dependency.outcome }}
          # A skipped step's outcome is the truthy 'skipped', so pick the one that ran.
          LEDGER_OUTCOME: ${{ inputs.conformance-ref == '' && steps.ledger-published.outcome || steps.ledger-ref.outcome }}
        run: |
          set -euo pipefail
          printf '### Conformance series\n\n| Series | Name | Result |\n| --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' C "CI" "${C_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' E "Error handling" "${E_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' P "Prescriptions" "${P_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' F "Preflight" "${F_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' O "Optimizations" "${O_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' L "Logging" "${L_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' T "Tests" "${T_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' I "Container images" "${I_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' B "Deprecations" "${B_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' K "Contract toolkit" "${K_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' S "Security" "${S_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| %s | %s | %s |\n' D "Dependencies" "${D_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          printf '| — | Contract ledger | %s |\n' "${LEDGER_OUTCOME:-skipped}" >> "$GITHUB_STEP_SUMMARY"

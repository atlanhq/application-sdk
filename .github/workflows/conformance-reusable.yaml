      - name: "B · upload SARIF"
        id: upload-deprecation
        if: "!cancelled() && (steps.changes.outputs.deprecation == 'true' || inputs.event_name == 'push' || inputs.force-all)"
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:

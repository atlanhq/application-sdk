name: Vuln Triage
run-name: "vuln triage ${{ inputs.selftest && 'SELFTEST' || inputs.ticket }}${{ inputs.dry_run && ' (dry run)' || '' }}"

# Deterministic CVE triage for one security-scan Linear ticket
# (.github/scripts/vuln_triage, config in .github/vuln-triage/config.toml).
#
# It replaces the mothership rover (vuln-triage-cron.yml + .mothership/vuln-triage):
# the same classification and the same two PR shapes, in tested Python. No model, no
# VPN, no sandbox. A run costs one short runner job and $0 in model spend; the rover cost
# ~$3.40 in model spend per ticket and needed Twingate/GlobalProtect to reach mothership.
#
# Triggered by daily-security-scan.yml (dispatch_vuln_triage.py) once per newly filed
# ticket, passing that scan's run id so the triage reads exactly the artifacts that
# produced the ticket. Manual dispatch re-runs one ticket (scan_run_id empty = the newest
# successful scan).
#
# Security shape:
#   * Only trusted code runs: the checkout is always main, for every input, including
#     selftest; there is no PR or branch code here.
#   * PRs are authored as atlan-app-fleet[bot] (a token minted per run, scoped to
#     contents/pull-requests/issues write). vuln_auto_merge_gate.py trusts that identity,
#     and atlan-ci stays free to approve (GitHub forbids approving your own PR). App-token
#     pushes also trigger CI, which GITHUB_TOKEN pushes would not.
#   * The gate, not this job, is the safety boundary: it auto-merges only an allowlist-only
#     or a pyproject.toml/uv.lock-only PR, and only once required CI is green.
#   * The job's own GITHUB_TOKEN only reads: the checkout and the scan artifact.
#
# Testing it:
#   * dry_run: every real step and check runs (allowlist edit + validator, `uv lock` +
#     lock checks) on the runner; nothing is pushed, opened or commented.
#   * selftest: a fake ticket and scan built from the live uv.lock (vuln_triage/selftest.py)
#     cover every case. Real PRs are opened, but as drafts, without the auto-merge label,
#     on selftest/ branches the gate never matches, and the same run closes them and
#     deletes the branches. No Linear call. Combine with dry_run to skip the PRs too.

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Linear ticket identifier to triage (e.g. FND-1234); not needed with selftest
        required: false
        type: string
        default: ""
      severity:
        description: Severity bucket of the ticket (CRITICAL/HIGH/MEDIUM/LOW)
        required: false
        type: string
        default: ""
      scan_run_id:
        description: Security-scan run whose artifacts to read (empty = newest successful)
        required: false
        type: string
        default: ""
      dry_run:
        description: Run every step and check and print the ticket comment; push, open and comment nothing
        required: false
        type: boolean
        default: false
      selftest:
        description: Fake ticket + scan; opens draft PRs and closes them again (never merged)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # download the scan's security-scan-raw-results artifact

# Two runs on one ticket would race to open the same branches.
concurrency:
  group: vuln-triage-${{ inputs.selftest && 'selftest' || inputs.ticket }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage ${{ inputs.ticket }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint atlan-app-fleet App token (PR author identity)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the chore/allowlist-* and fix/bump-* branches
          permission-pull-requests: write # open the PRs
          permission-issues: write # the vuln-auto-merge label

      # Checked out with the App token so the pushed branches trigger CI.
      # Always main, self-test included. The Triage step runs the checked-out code with the
      # App's write token and LINEAR_API_KEY in its environment, so it must only ever be
      # trusted code. A dispatched branch's code would be able to exfiltrate both. Test a
      # branch's triage code with the unit tests or a local `--selftest --dry-run`; the
      # CI self-test exercises what is on main.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      # Same uv as setup-deps and the security scan, so a Case-1 `uv lock` writes the
      # lock format CI expects.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Configure git identity
        run: |
          git config user.name "atlan-app-fleet[bot]"
          git config user.email "atlan-app-fleet[bot]@users.noreply.github.com"

      - name: Triage
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }} # artifact download and read-only gh calls
          PR_AUTHOR_TOKEN: ${{ steps.app.outputs.token }} # PR list/create/close only
          # A self-test makes no Linear call, so it is not handed the key at all.
          LINEAR_API_KEY: ${{ !inputs.selftest && secrets.LINEAR_API_KEY || '' }}
          REPO: ${{ github.repository }}
          ROOT: ${{ github.workspace }}
          TICKET: ${{ inputs.ticket }}
          SEVERITY: ${{ inputs.severity }}
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          # "true"/"false". The scan's dispatch omits it, so the input default (false)
          # applies; the CLI rejects any other value rather than running live.
          DRY_RUN: ${{ inputs.dry_run }}
          SELFTEST: ${{ inputs.selftest }}
        run: >-
          python3 -m vuln_triage
          --repo "$REPO"
          --root "$ROOT"
          --ticket "$TICKET"
          --severity "$SEVERITY"
          --scan-run-id "$SCAN_RUN_ID"
          --run-url "$RUN_URL"
          --run-id "$RUN_ID"
          --dry-run "$DRY_RUN"
          --selftest "$SELFTEST"

name: Bound the Renovate lock refresh

# The release-age cooldown for application-sdk's OWN lock-refresh lane (FND-376).
#
# The fleet gets this from a Renovate `postUpgradeTasks` command (FND-359), which
# only exists on the self-hosted runner because `allowedCommands` is admin-only.
# application-sdk's dependency PRs come from Mend, which has no such hook — so
# the repo that publishes the wheel ~100 repos install was the only one still
# adopting minutes-old transitive releases unattended. This runs the same tested
# driver at the only other point where it can reach this repo: the push Mend
# makes to its own branch.
#
# Deliberately NOT a workflow that opens its own PR. Keeping Mend as the PR author
# is what lets `renovate-auto-approve-reusable.yml` stay untouched — a
# self-authored PR would fail its author condition outright, and widening a
# fleet-wide approval gate for one repo is not a trade worth making. The gate's
# other condition, a green `renovate/artifacts`, does NOT survive our commit on
# its own: statuses are per-SHA and Renovate stamps only its own commits. The
# last step carries that state forward — see carry_artifact_status.py.
#
# Scope is `renovate/lock-file-maintenance` alone. The `update-lockfile` lanes
# (SDK, conformance) also write uv.lock, but each moves a single named package
# that is first-party and explicitly chosen — the cooldown has no business
# delaying a deliberate pick, only the unattended upgrade-everything refresh.
#
# The lane rewrites four lock files, and the npm one is bounded by a different
# mechanism from the three Python ones (FND-380): npm can express none of the
# per-package retention ceilings the uv bound relies on, so that file is gated
# whole — take the bounded resolve, or restore the base branch's lock verbatim.
# See renovate_npm_lock_bounded's docstring for the measurements behind that.
#
# When the bounded lock moves pyatlan, the driver also regenerates the
# conformance package's relationship_directions.json, which a drift test pins to
# the locked pyatlan. That installs and imports the freshly-resolved release, so
# the lane is two jobs: `bound` resolves and regenerates holding only a read-only
# GITHUB_TOKEN, and `publish` — the only job that ever sees the App token —
# copies the declared output paths out of its artifact, commits and pushes. No
# resolver and no third-party install runs where the push credential lives.
#
# All logic lives in the tested driver .github/scripts/bound_lock_branch.py; this
# workflow provides the toolchain, the baseline ref, and the push.

on:
  push:
    branches:
      - renovate/lock-file-maintenance
    paths:
      - "uv.lock"
      - "packages/conformance/uv.lock"
      # The npm lock moves on its own: measured on #3355, whose entire net diff
      # after the uv bound was this one file. Without it here that push runs no
      # job at all and the file merges unbounded.
      - "packages/conformance/conformance/package-lock.json"

permissions:
  contents: read

# A newer force-push from Renovate supersedes whatever we are resolving, and a
# bound computed against a branch that no longer exists is worth nothing —
# cancel rather than race it to the push.
concurrency:
  group: bound-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bound:
    name: Re-resolve the refreshed locks under the release-age window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two guards, for two unrelated reasons.
    #
    # ACTOR. This lane exists to serve pushes made by a Renovate identity, so run
    # for those and nothing else. The list is the same one the approval gate
    # accepts as a PR author (`renovate_approval_conditions.RENOVATE_AUTHORS`):
    # renovate[bot] is Mend, which is what drives this repo today, and
    # atlan-app-fleet[bot] is the self-hosted runner, kept so this lane does not
    # quietly stop working if that ever changes. A drift test pins the two lists
    # together rather than trusting them to stay in step by hand.
    #
    # Read this for what it is: defence in depth, not a control. The check is
    # evaluated from the workflow file at the pushed ref, so it constrains what
    # runs by accident, not what runs by intent — anything that can change what
    # this job does can change this line in the same breath. Restricting who may
    # push these branches is branch configuration, which lives outside the repo;
    # see FND-395.
    #
    # RE-ENTRANCY. Our own push re-fires this workflow (an App-token push does
    # trigger workflows — that is the whole reason we use one) and arrives as
    # atlan-app-fleet[bot], which the actor list admits. The driver is idempotent,
    # so a second run would find nothing to commit and exit clean, but it would
    # pay for two full `uv lock` resolves to learn that. Renovate's own commit
    # subject is "chore(deps): lock file maintenance", so this never skips a real
    # refresh.
    # Both continuation lines sit at the block's own indentation deliberately: a
    # more-indented line in a folded scalar keeps its newline instead of folding
    # to a space, which would leave a literal line break inside the `${{ }}`.
    if: >-
      ${{ contains(fromJSON('["atlan-app-fleet[bot]", "renovate[bot]"]'), github.actor)
      && !startsWith(github.event.head_commit.message, 'chore(deps): bound the refreshed locks') }}
    # Read-only, and no App token or secret anywhere in this job: it runs the
    # resolver and, when pyatlan moved, installs and imports the new release.
    permissions:
      contents: read
    steps:
      # The pushed SHA, not the branch: `publish` commits onto this same SHA, so
      # a branch that moves in between makes its push non-fast-forward instead
      # of landing these outputs on top of a newer refresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The baseline the bound is computed against — see the driver's
      # baseline_lock_text docstring. Only the tree at the tip of the base branch
      # is needed (one `git show` of each lock), so a depth-1 fetch is enough and
      # a full-history checkout is not.
      - name: Fetch the base branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      # Pinned to the same uv the fleet runner uses — a resolver version skew
      # here would show up as unexplained lock churn.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"

      # For the npm half of the bound. Pinned to the same major as renovate.yaml
      # rather than taking whatever the runner image ships: npm's major decides
      # the lockfileVersion it writes, and a runner rolling forward to a major
      # that writes a different one would turn every bounded resolve into a
      # whole-file rewrite. Verified on npm 11.x: an unbounded
      # `npm install --package-lock-only` reproduces the committed lock
      # byte for byte, so the lane's diffs stay reviewable.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # P3D matches the fleet. A shorter window here would put application-sdk's
      # CI on a different dependency set from the connectors again, which is half
      # of what FND-376 exists to fix.
      - name: Bound the refreshed locks
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        # `--with packaging`, pinned: the driver's rollback gate needs PEP 440
        # parsing, and the runner image shipping `packaging` for the system
        # interpreter is not a promise GitHub makes. Without it every ordinary
        # upgrade reads as a regression. `--no-project` keeps this off the repo's
        # own environment — the bound must not depend on a full dev sync.
        # `--no-commit`: committing is `publish`'s job, below.
        run: |
          set -euo pipefail
          uv run --no-project --with 'packaging==26.3' \
            python .github/scripts/bound_lock_branch.py \
            --window P3D \
            --baseline-ref "origin/$BASE_BRANCH" \
            --no-commit

      # Exactly the driver's OUTPUT_PATHS — a drift test pins the two together.
      # Every one of them exists on every run, so a missing file is an error,
      # not something to upload around.
      - name: Upload the bounded locks
        id: upload-locks
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bounded-locks
          path: |
            uv.lock
            packages/conformance/uv.lock
            packages/conformance/conformance/package-lock.json
            packages/conformance/conformance/data/relationship_directions.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # Same retry shape as conformance-reusable.yaml's SARIF uploads: a wait,
      # then a DISTINCT name (a failed finalize holds the first name for the
      # run), which `publish` picks up by `bounded-locks*` glob. No
      # continue-on-error: a second failure fails here, not as a confusing
      # missing-artifact error in `publish`.
      - name: Wait before the upload retry
        if: steps.upload-locks.outcome == 'failure'
        run: sleep 20

      - name: Upload the bounded locks (retry)
        if: steps.upload-locks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bounded-locks-retry
          path: |
            uv.lock
            packages/conformance/uv.lock
            packages/conformance/conformance/package-lock.json
            packages/conformance/conformance/data/relationship_directions.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Commit and push the bounded locks
    needs: bound
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # For the carry-forward below. Written with GITHUB_TOKEN rather than the
      # App token: publishing a commit status needs no identity that re-triggers
      # anything, so the narrower credential is the right one.
      statuses: write
    steps:
      # A real (non-github-actions[bot]) identity is required: the push below must
      # re-trigger the PR's required checks against the new commit, which a push
      # made with the default GITHUB_TOKEN does not. Confirmed empirically on this
      # repo's renovate/** branches — an App-token push does re-trigger them.
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk
          # Down-scope to the one permission this lane uses (FND-395). An
          # installation token has no *branch* scope — that is what the `bot
          # branches` ruleset is for — but it does have a permission scope, and
          # by default this step mints the App's whole installation grant on
          # this repo. Since the workflow definition and the scripts it runs
          # both come from the pushed branch, whatever the token can do is
          # reachable from that branch: contents-only is a materially smaller
          # blast radius than the full grant. The commit status published below
          # is written with GITHUB_TOKEN, so `statuses` is deliberately absent
          # here rather than an omission.
          permission-contents: write

      # The same SHA `bound` resolved against — see the comment on its checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}

      # Outside the checkout, so the artifact's paths cannot overwrite anything
      # in it except through the driver's allowlisted copy.
      - name: Download the bounded locks
        id: download-locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          # Glob, not the bare name: the upload's retry lands under
          # `bounded-locks-retry`. Both uploads overwrite, so exactly one is live.
          pattern: bounded-locks*
          merge-multiple: true
          path: ${{ runner.temp }}/bounded-locks

      - name: Wait before the download retry
        if: steps.download-locks.outcome == 'failure'
        run: sleep 20

      # No continue-on-error: a second failure fails the job rather than
      # committing nothing.
      - name: Download the bounded locks (retry)
        if: steps.download-locks.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bounded-locks*
          merge-multiple: true
          path: ${{ runner.temp }}/bounded-locks

      # Stdlib only, on the runner's python3: no resolver, no install, nothing
      # from the refreshed dependency set runs beside the App token.
      - name: Commit the bounded locks
        run: python3 .github/scripts/bound_lock_branch.py --apply-from "$RUNNER_TEMP/bounded-locks"

      # Unchanged outputs commit nothing, so HEAD is still the pushed SHA and this
      # is a no-op. A branch that moved since `bound` rejects it as
      # non-fast-forward, and the newer push's own run takes over.
      - name: Push
        run: git push origin "HEAD:$GITHUB_REF"

      # Commit statuses are per-SHA and Renovate stamps only its own commits, so
      # our push moves the head off the SHA `renovate/artifacts` lives on — which
      # the approval gate reads as not-green and withholds on, permanently. This
      # republishes the state read from our commit's parent, and only when that
      # state is `success`; anything else publishes nothing and the gate keeps
      # withholding. Runs after the push so it stamps the SHA that is actually
      # the head.
      - name: Carry renovate/artifacts forward
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/carry_artifact_status.py \
            --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

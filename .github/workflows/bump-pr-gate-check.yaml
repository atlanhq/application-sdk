name: Bump PR Gate Check

# Bump-version PR CI is opt-in (FND-3748): nothing heavy runs on a
# `bump-version-*` PR until a reviewer adds the `gate-check` label.
#
# Workflows that already subscribe to `labeled` (PR Checks, CodeQL) pick the
# label up from the event payload. SDK Gate deliberately does not subscribe: its
# required check is an inline job, so on an ordinary PR an unrelated label
# would skip it, and a skipped required check reads as a pass over an earlier
# failure. Instead, adding `gate-check` re-runs that commit's SDK Gate run here,
# and the re-run reads the PR's live labels (bump_pr_opt_in.py check).
#
# On every other label event the job is skipped by its `if:` and costs nothing.

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  rerun-sdk-gate:
    name: Re-run SDK Gate for gate-check
    if: >-
      startsWith(github.head_ref, 'bump-version') &&
      github.event.label.name == 'gate-check'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Re-run SDK Gate on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/bump_pr_opt_in.py rerun --workflow sdk-gate.yaml --sha "$HEAD_SHA"

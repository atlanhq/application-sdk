name: Publish Server SDK Package

# Publishes packages/server-sdk to PyPI as `atlan-server-sdk`.
#
# Mirrors conformance-publish.yml. Fires on a merged release PR labelled
# `release:server-sdk` whose head branch starts with `bump-version-server-sdk`,
# or manually via workflow_dispatch (which is how 0.1.0 gets published, since
# the Phase-A release-PR automation for this package does not exist yet).
#
# Builds the wheel + sdist from merged main, publishes, then creates the
# server-sdk-v<version> annotated tag. No GitHub Release is created — that
# would interleave server-sdk-v* versions with SDK v* releases on the repo
# releases page.

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'release:server-sdk') &&
        startsWith(github.event.pull_request.head.ref, 'bump-version-server-sdk')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Read release version
        id: meta
        run: |
          set -euo pipefail
          version="$(uvx --from=toml-cli toml get --toml-path=packages/server-sdk/pyproject.toml project.version)"
          if [ -z "$version" ]; then
            echo "::error::could not parse version from packages/server-sdk/pyproject.toml"
            exit 1
          fi
          tag="server-sdk-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing server-sdk ${tag} from $(git rev-parse HEAD)"

      - name: Build and publish to PyPI
        run: |
          cd packages/server-sdk
          uv build
          uv publish --trusted-publishing automatic

      - name: Create source tag
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          merge_sha="${{ steps.meta.outputs.merge_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists on origin; skipping tag push"
            exit 0
          fi

          git tag -a "$tag" "$merge_sha" -m "Release server-sdk $tag"
          git push origin "$tag"

      # No GitHub Release is created, for the same reason as conformance: the
      # annotated tag, the PyPI publish and CHANGELOG.md are the record.
      #
      # No Renovate fan-out job yet either — server-sdk's consumers (app server
      # packages) still carry PEP 508 git pins rather than in-range version
      # constraints, so there is nothing for Renovate to bump. Add the fan-out
      # step from conformance-publish.yml once those pins move to PyPI ranges.

name: Renovate (self-hosted fleet runner)

# Central OSS Renovate runner for the atlan-*-app fleet — the replacement for
# the free Mend-hosted app. Discovers consumers, then runs the OSS Renovate CLI
# once per repo (matrix) authenticated as the atlan-app-fleet App.
#
# Why runner-native (npm i -g renovate) rather than the containerised
# renovatebot/github-action: postUpgradeTasks and Renovate's NATIVE uv.lock
# updates both execute in Renovate's own environment. Running on the runner lets
# us provide the toolchain (uv, pkl, python, ruff) with the same steps the old
# renovate-pkl-sync.yaml glue used, instead of baking a custom Renovate image.
#
# LIVE: dry_run defaults to 'null', so scheduled runs and the release fan-out
# open/update real PRs across the discovered fleet. For a manual dry run,
# dispatch with dry_run='full' (and optionally scope with the repos input).
#
# A SECOND ENGINE COLLIDES WITH THIS ONE. Branch names come from the shared
# preset, not from the engine, so any other Renovate reading a fleet repo's
# renovate.json pushes to the same renovate/lock-file-maintenance — with every
# postUpgradeTask rejected, because allowedCommands is admin-only and a hosted
# engine cannot hold one. The Mend-hosted app stayed installed org-wide long
# after the fleet moved here (FND-1985); an earlier version of this comment
# asserted it had been uninstalled, which was not true. The reap step below is
# the backstop, not the fix — see docs/standards/ci.md, "Only one Renovate
# engine may serve a repo".

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renovate dry-run mode. 'null' = live (default, open/update PRs); 'full' = no changes (manual dry run)."
        type: choice
        options: ["full", "lookup", "null"]
        default: "null"
      repos:
        description: 'Optional JSON array of "owner/repo" to scope the run (pilot). Empty = full discovered fleet.'
        type: string
        default: ""
  schedule:
    # Baseline cadence. Best-effort (GitHub may delay scheduled runs under load);
    # on-demand immediacy comes from the release fan-out that dispatches this
    # workflow from tag-and-publish.yaml / contract-toolkit-publish.yml.
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  # ONLY A LIVE, UNSCOPED SWEEP JOINS THE SHARED GROUP. A dry run writes
  # nothing and a `repos`-scoped dispatch covers only the repos it lists, so
  # neither is a substitute for the full live pass — and under a shared
  # `cancel-in-progress: true` either would ABORT one. That is strictly worse
  # than what it replaces: the fleet ends up with a partial sweep and no
  # indication that the rest never ran. Under the previous
  # `cancel-in-progress: false` these merely queued behind live work, so the
  # flip below is what makes the distinction load-bearing.
  #
  # Everything that is not a live unscoped sweep therefore gets a run-unique
  # group, which cannot collide with anything: dry runs and pilots are free to
  # run alongside a live sweep, exactly as they did before, and only live
  # sweeps coalesce with each other.
  #
  # `inputs` is absent on `schedule`, where the properties read as null; null
  # compares equal to '' under GHA's numeric coercion, so a scheduled run takes
  # the live branch. A default dispatch sends dry_run='null' (the string,
  # meaning live) and repos='', so it does too — which is what keeps the
  # release fan-out on the shared group.
  group: >-
    ${{ (inputs.dry_run == 'full' || inputs.dry_run == 'lookup' || inputs.repos != '')
        && format('renovate-aside-{0}', github.run_id)
        || 'renovate-fleet' }}
  # COALESCE, do not queue. A sweep is idempotent and whole-fleet, so a newer
  # sweep subsumes whatever an older one had left to do — there is nothing to
  # preserve by letting both run, and real harm in it.
  #
  # `false` queued them instead, and the fleet App's hourly API budget is sized
  # for roughly ONE full-fleet sweep. On 2026-09-17 a release fan-out dispatch
  # (20:04), the 4-hourly schedule (20:04:52) and a second fan-out dispatch
  # (20:10) arrived inside seven minutes; the group held one pending slot so the
  # schedule was evicted, and the two dispatches ran back to back inside one
  # rate-limit hour. The second exhausted the budget 14 repos in, which is NOT a
  # clean failure — it degrades in three places at once:
  #
  #   * `enablePullRequestAutoMerge` 403s, so every PR the sweep created came
  #     out without auto-merge while Renovate logged `INFO: PR created` and
  #     exited 0 (38 conformance PRs, none merging).
  #   * Renovate then cannot even init (`Init: Can't get App details`), so the
  #     remaining 68 of 82 repos got no pass at all.
  #   * The GITHUB_TOKEN sharing that budget 403s inside
  #     rerun_evicted_tests_run.py, which fails open — leaving a stale failed
  #     `tests / Tests Gate` on the very PRs that cannot merge.
  #
  # Two releases minutes apart is normal (an SDK tag and a conformance tag), so
  # this is the common case, not a freak. The cost of coalescing is that a
  # cancelled sweep leaves some repos unprocessed until the cancelling sweep
  # reaches them, which it does in the same run; the 4-hourly schedule is the
  # backstop if a burst of dispatches keeps truncating one.
  #
  # Guarded by the same condition as the group, so it can only ever cancel a
  # live sweep. On the run-unique `renovate-aside-*` group the value is inert
  # (nothing shares the group); false is stated anyway so the two expressions
  # cannot drift into disagreeing about what is cancellable.
  cancel-in-progress: >-
    ${{ !(inputs.dry_run == 'full' || inputs.dry_run == 'lookup' || inputs.repos != '') }}

jobs:
  discover:
    name: Discover consumer repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repos: ${{ steps.discover.outputs.repos }}
    steps:
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover atlan-application-sdk consumers
        id: discover
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 .github/scripts/discover_org_consumers.py \
            --owner atlanhq \
            --exclude atlanhq/application-sdk

  renovate:
    name: Renovate ${{ matrix.repo }}
    needs: [discover]
    # Run when there is at least one repo — either the pilot `repos` input or the
    # discovered fleet. Ternary lives in a GitHub expression; no shell branching.
    if: ${{ (inputs.repos != '' && inputs.repos != '[]') || needs.discover.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    # Cap a hung renovate/gh call so a stuck matrix job frees the runner well
    # before GitHub's 6h default rather than occupying it for hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Cap concurrency to keep the shared fleet-App GitHub API budget under the
      # 15k/hr ceiling during a full-fleet sweep (see Model A scaling notes).
      max-parallel: 10
      matrix:
        # Pilot scope (`repos` input) when provided, else the discovered fleet.
        # `&&`/`||` short-circuit, so fromJson is never called on an empty string.
        repo: ${{ (inputs.repos != '' && fromJson(inputs.repos)) || fromJson(needs.discover.outputs.repos) }}
    env:
      # Live by default. workflow_dispatch supplies the input ('null' default);
      # scheduled runs have no inputs context, so the `|| 'null'` fallback applies.
      # A manual dry run = dispatch with dry_run='full'.
      RENOVATE_DRY_RUN: ${{ inputs.dry_run || 'null' }}
    steps:
      - name: Mint fleet App token
        id: app-token
        # Owner-scoped (not per-repo): each matrix job mints its own token, so
        # API budgets stay isolated.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq

      # application-sdk itself — provides the pkl-sync driver and the self-hosted
      # admin config. Renovate clones each target repo into its own base dir (a
      # temp dir), so this checkout is never disturbed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the pkl-sync driver as a bare PATH command. postUpgradeTasks
      # commands are NOT shell-expanded by Renovate, so the preset invokes
      # `renovate-pkl-sync` directly (no ${VAR} path to expand). The script's
      # `#!/usr/bin/env python3` shebang makes it directly executable.
      #
      # renovate_pkl_sync.py does `sys.path.insert(0, str(Path(__file__).parent))`
      # then `from pkl_contract_layout import ...` — so the sibling module must
      # land in the same directory on PATH, or the bare command 404s on import at
      # runtime (ModuleNotFoundError, every consumer repo, every run). Copying a
      # single file is what makes that possible at all — the retired
      # renovate-pkl-sync.yaml reusable sparse-checked out the whole
      # .github/scripts/ directory and so never hit it. Guarded by
      # check_renovate_pkl_sync_install.py so a future split doesn't silently
      # regress this again.
      - name: Install pkl-sync driver on PATH
        run: |
          sudo install -m 0755 .github/scripts/renovate_pkl_sync.py /usr/local/bin/renovate-pkl-sync
          sudo install -m 0644 .github/scripts/pkl_contract_layout.py /usr/local/bin/pkl_contract_layout.py

      # The release-age driver for the lock-refresh lane (FND-359), installed the
      # same way and for the same reason: postUpgradeTasks commands are not
      # shell-expanded, so the preset invokes `renovate-uv-lock-bounded` as a bare
      # PATH command. Single-file with no sibling imports, so unlike the pkl-sync
      # driver above there is nothing else to place beside it. If this step is
      # ever dropped, the command 404s, Renovate reports an artifact error, and
      # the auto-approve gate withholds approval — the lock does not silently
      # refresh unbounded (FND-367).
      - name: Install release-age lock driver on PATH
        run: sudo install -m 0755 .github/scripts/renovate_uv_lock_bounded.py /usr/local/bin/renovate-uv-lock-bounded

      # The contract-ledger driver (FND-607), installed the same way. It runs on
      # the conformance-package lane and after the bounded resolve on the
      # lock-refresh lane, regenerating contract_schema.lock.json at the version
      # the branch just locked — the ledger is a generated artifact whose content
      # depends on the generating version, while CI checks it with an unpinned
      # `uvx` install, so without this a conformance release that adds an SDK
      # contract-base field reds B006 on every repo that has not yet adopted it,
      # the adopting PR included. Single-file with no sibling imports. If this
      # step is dropped the command 404s, Renovate reports an artifact error, and
      # the auto-approve gate withholds approval — the bump does not silently
      # merge with a stale ledger.
      - name: Install contract-ledger driver on PATH
        run: sudo install -m 0755 .github/scripts/renovate_contract_ledger.py /usr/local/bin/renovate-contract-ledger

      # Provides `uv`/`uvx` — used by Renovate's native uv manager to refresh
      # uv.lock AND by the driver's `uvx ruff` formatting of generated Python.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      # Version omitted deliberately — as it now is at every call site: the
      # action resolves the single pin in application_sdk/pkl_version.py, so no
      # workflow carries a literal of its own to drift silently (FND-1864).
      - uses: ./.github/actions/install-pkl

      # Renovate 43 requires Node >=24.11 — newer than the ubuntu-latest default,
      # so pin the runtime explicitly rather than relying on the preinstalled one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Renovate CLI
        # Exact pin for reproducibility; bump deliberately (Renovate releases
        # multiple times a week). Keep in step with the setup-node version above.
        run: npm install -g renovate@44.3.2

      # Reap a lock-maintenance branch this pass can rebuild better, for either
      # of two reasons. Ordered immediately before Renovate on purpose: the
      # branch is deleted and recreated inside one job, so the repo is never
      # left without a lock PR and the PR timeline shows no delete/recreate
      # churn.
      #
      # (1) A refusal that has since expired — and only those stamped
      # `window-empty`. A yanked pin or an unsatisfiable floor keeps its
      # tripwire and stays red for a human, because recycling one of those
      # every four hours would hide it (FND-909).
      #
      # (2) A branch head some OTHER Renovate engine wrote, which therefore ran
      # none of our postUpgradeTasks and carries an unbounded lock (FND-1985).
      #
      # Never fails the job: Renovate runs regardless, so a reaper outage costs
      # one cycle of recovery latency, not the lock refresh.
      - name: Reap lock branches the next pass rebuilds better
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Both passed as env rather than interpolated into `run:`. TARGET_REPO
          # keeps a matrix value out of the shell line, and RENOVATE_DRY_RUN is
          # what stops a dry run deleting real branches: the job-level default
          # is the literal 'null' for a live run, and the script treats anything
          # else as --dry-run. Resolving that inside the script keeps the `run:`
          # line branch-free, per docs/standards/ci.md.
          TARGET_REPO: ${{ matrix.repo }}
          RENOVATE_DRY_RUN: ${{ env.RENOVATE_DRY_RUN }}
        run: python3 .github/scripts/renovate_reap_refused_locks.py

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          # Admin config: platform, autodiscover=false, allowedCommands allowlist,
          # and the github-actions manager disable.
          RENOVATE_CONFIG_FILE: ${{ github.workspace }}/renovate-config/self-hosted.js
          LOG_LEVEL: debug
          # Pass the matrix repo through the environment rather than interpolating
          # it into the shell string, so the value can never be parsed as shell.
          TARGET_REPO: ${{ matrix.repo }}
          RENOVATE_LOG: ${{ runner.temp }}/renovate.log
        # Positional arg = the single repository this job handles. The consumer's
        # own renovate.json (extending renovate-config/default.json) is read as usual.
        #
        # Tee'd so the guard below can read it. GitHub runs `run:` under
        # `bash -e -o pipefail`, so Renovate's own non-zero exit still fails this
        # step through the pipe — the guard covers the exit-0 failures only.
        run: renovate "$TARGET_REPO" 2>&1 | tee "$RENOVATE_LOG"

      # Renovate exits 0 after failing to enable auto-merge, so a sweep that
      # produced PRs nothing will ever merge is indistinguishable from a healthy
      # one until a human reads a PR. This turns that into a red job. See the
      # script's docstring and the concurrency comment above.
      - name: Guard — no silent sweep failures
        if: always()
        env:
          TARGET_REPO: ${{ matrix.repo }}
          RENOVATE_LOG: ${{ runner.temp }}/renovate.log
        run: |
          python3 .github/scripts/check_renovate_sweep.py \
            --log "$RENOVATE_LOG" \
            --repo "$TARGET_REPO"

name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  # Detect which files changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}
      # 'sdk'  — changes that can alter SDK behaviour, so the unit + integration
      #          tests must run. Deliberately EXCLUDES contract-toolkit/ (ships
      #          its own package + CI), docs/, and .github/ workflow-meta — a
      #          workflow-only or toolkit-only PR no longer drags in the full
      #          test matrix. The .github/actions/* entries are the test
      #          harness itself (the unit/integration deps + docstring-coverage
      #          wrappers), so changing *how* those checks run still re-runs them.
      sdk: ${{ steps.sdk-refine.outputs.sdk }}
      # 'ci'   — pull_request.yaml itself changed. Self-referential entry
      #          (mirrors sdk-gate.yaml's own self-test pattern) so that editing
      #          the connector / sdr-k8s-e2e dispatch glue re-runs those jobs
      #          in the merge queue — otherwise workflow-only PRs merge blind.
      ci: ${{ steps.filter.outputs.ci }}
      # 'scan' — wider net for the Trivy filesystem scan: every first-party
      #          source tree + the dependency lockfiles. Still short-circuits on
      #          pure docs/, .github-meta, and .security-only PRs.
      scan: ${{ steps.filter.outputs.scan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No explicit `base`: for pull_request, paths-filter diffs against the PR
      # base automatically; for merge_group it diffs the queued merge ref against
      # the default branch (the same proven setup the conformance jobs use).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # list-files: json is required so the sdk-refine step below can inspect
          # which files actually matched and suppress markdown-only false positives.
          list-files: json
          filters: |
            container:
              - 'Dockerfile'
              - 'entrypoint.sh'
              # The action that BUILDS and SCANS that Dockerfile, so a change to
              # how the image is produced re-runs the paths that produce it —
              # the container Trivy scan and the PR base-image build. Same
              # reasoning as the self-referential `ci:` entry below, and as
              # `sdk:` listing the test-harness action dirs: without it, a change
              # to the build/scan machinery merges without either ever running
              # against it. That is not hypothetical — the per-arch split of
              # build-sdk-base-image and the fix to this action's hardcoded scan
              # platform both landed on a PR where these jobs skipped.
              - '.github/actions/secure-build-push-apps/**'
            sdk:
              - 'application_sdk/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/unit-tests/**'
              - '.github/actions/setup-deps/**'
              - '.github/actions/docstring-coverage/**'
              # NOTE: do NOT add '!**/*.md' here. dorny/paths-filter passes '!'
              # patterns straight to picomatch, which interprets '!**/*.md' as
              # "match any file that is not a .md file" — a near-catch-all that
              # makes sdk=true for every non-markdown change in the repo. Markdown
              # exclusion is handled in the sdk-refine step below instead.
            ci:
              - '.github/workflows/pull_request.yaml'
            scan:
              - 'application_sdk/**'
              - 'contract-toolkit/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/trivy/**'

      # paths-filter sdk=true is necessary but not sufficient: the broad
      # application_sdk/** pattern also matches .md files, so a PR that only
      # touches e.g. application_sdk/README.md would incorrectly trigger the
      # docstring-coverage check and the SDK test matrix. Check whether ANY
      # matched file is non-.md; if all matched files are .md, suppress sdk=false.
      - name: Refine sdk — suppress markdown-only matches
        id: sdk-refine
        env:
          SDK_RESULT: ${{ steps.filter.outputs.sdk }}
          SDK_FILES: ${{ steps.filter.outputs.sdk_files }}
        run: |
          set -euo pipefail
          if [[ "$SDK_RESULT" != "true" ]]; then
            echo "sdk=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/sdk_changes_non_md.py

  # There is deliberately NO per-commit convention check here. This repo is
  # squash-merge-only (`allow_squash_merge` is the only method enabled) with
  # `squash_merge_commit_title: PR_TITLE` and `squash_merge_commit_message:
  # BLANK`, so the branch's individual commit subjects are discarded at merge
  # and never reach main. A gate on them polices text that cannot appear in the
  # history, the changelog, or the release-version bump — all three of which
  # read squash subjects, i.e. PR titles.
  #
  # The string that DOES survive is enforced, by two checks:
  #   * "Validate PR title" (pr-title-convention.yaml) — this repo's own
  #     path-aware rules, which are stricter than plain conventional commits
  #     because the title drives which component's release/changelog a merge
  #     lands in (application_sdk/ vs contract-toolkit/ vs packages/conformance/).
  #   * the fleet's commits.yaml reusable — the path-agnostic grammar guard the
  #     connector repos call. Not used here; this repo has the stricter one.

  docstr:
    name: Docstring Coverage
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/docstring-coverage"
        with:
          module-name: application_sdk
          fail-under: "30"

  # Security Checks
  # Required status check — must ALWAYS run and ALWAYS conclude (never skip via a
  # job-level `if:`, which GitHub reports as "skipped" and leaves a required check
  # pending forever, blocking the merge queue). Instead the job always runs and
  # short-circuits its real steps when no first-party source/deps changed.
  trivy:
    name: Trivy Code Scan
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Short-circuit when nothing to scan
        if: needs.changes.outputs.scan != 'true'
        run: echo "No first-party source or dependency changes — Trivy code scan not needed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.scan == 'true'
      - uses: "./.github/actions/trivy"
        if: needs.changes.outputs.scan == 'true'
        with:
          # Reporting and enforcement are separate switches on purpose — see the
          # action's input docs. Both are passed explicitly so that a future edit
          # to one is visibly not an edit to the other. The action itself skips
          # the comments on merge_group; enforcement runs on every event.
          add-report-comment-to-pr: "true"
          fail-on-findings: "true"

  trivy-container:
    name: Trivy Container Scan
    needs: changes
    if: needs.changes.outputs.container == 'true' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint fleet App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: ${{ github.event.repository.name }}
      - uses: "./.github/actions/trivy-container"
        with:
          chainguard-username: ${{ secrets.CHAINGUARD_USERNAME }}
          chainguard-password: ${{ secrets.CHAINGUARD_PASSWORD }}
          github-token: ${{ steps.app-token.outputs.token || secrets.ORG_PAT_GITHUB }}
          fail-on-vulns: 'true'

  # NOTE: SDK unit / integration / storage-emulator tests moved to
  # sdk-tests-reusable.yaml and now run under the composing sdk-gate.yaml.
  # The orthogonal checks below (docstring coverage, Trivy scans) and
  # the connector e2e dispatch stay here.

  matrix-builder:
    name: Build Test Matrix
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix
        id: set-matrix
        run: |
          # For pull_request, github.base_ref is the branch name (e.g. 'main').
          # For merge_group, github.base_ref is empty; use the event's base_ref
          # and strip the refs/heads/ prefix.
          TARGET_BRANCH="${{ github.base_ref }}"
          if [[ -z "$TARGET_BRANCH" ]]; then
            TARGET_BRANCH="${{ github.event.merge_group.base_ref }}"
            TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"
          fi
          MATRIX="{\"include\":[{\"repo_name\":\"atlan-openapi-app\",\"target_branch\":\"${TARGET_BRANCH}\"},{\"repo_name\":\"atlan-mysql-app\",\"target_branch\":\"${TARGET_BRANCH}\"},{\"repo_name\":\"atlan-metabase-app\",\"target_branch\":\"${TARGET_BRANCH}\"}]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # Build a PR-scoped SDK runtime base image so the connector e2e tests can
  # build the connector FROM the *rebuilt* base — exercising Dockerfile /
  # base-image / daprd-apk changes that the pip-install (application_sdk_ref)
  # path can't reach.
  #
  # Gated on the 'e2e' label ONLY (the same deliberate opt-in as
  # connector-tests below) — NOT on the `container` paths-filter or the
  # trivy-container scan. On merge_group this job is skipped and the
  # connector dispatch passes no base_image_ref, so the connector builds
  # FROM the released base exactly as before.
  #
  # Pushes to the public Harbor project (anonymous-pull), so the connector
  # build pulls it through the same path it already uses for
  # `FROM registry.atlan.com/public/app-runtime-base:<tag>` — no extra
  # registry auth on the connector side. Fork PRs are excluded (no secrets).
  build-sdk-base-image:
    name: Build SDK base image (e2e)
    needs: changes
    # sdk OR container: a Dockerfile-only PR (the prime base-image use case,
    # e.g. a daprd / base bump) is container==true / sdk==false — it must
    # still rebuild the base so the connector e2e exercises the new image.
    #
    # The `github.event.action != 'labeled'` term is the FND-48 gate and appears
    # on every `e2e`-labelled job in this workflow. `contains(...labels...)` is a
    # STATE check — "does the PR carry `e2e` right now" — but this workflow also
    # triggers on `labeled`, and GitHub offers no trigger-level filter for WHICH
    # label. So on a PR that already carries `e2e`, any unrelated label add (bots
    # churn size/, area/, dependency and review-state labels constantly) satisfies
    # the state check and re-fires the whole cross-repo e2e fan-out. Making the
    # `labeled` event count only when `e2e` is the label just added leaves every
    # other event type alone: a real push is `synchronize`, so it still
    # re-triggers, and re-adding `e2e` still triggers. The workflow RUN is still
    # created either way — the jobs now skip in seconds instead of dispatching
    # live-tenant suites. Enforced repo-wide by
    # .github/scripts/tests/test_label_trigger_gates.py.
    if: |
      (needs.changes.outputs.sdk == 'true' || needs.changes.outputs.container == 'true') &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
      github.event.pull_request.head.repo.fork != true &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # One architecture per job, each on a runner native to it — the same shape
    # build-e2e-image uses for the app image, and for the same reason: every leg
    # of that matrix does `FROM` this image, so this must serve both arches, and
    # emulating either half is a cost paid on every e2e-labelled PR. See
    # docs/standards/connector-ci-e2e.md.
    strategy:
      # Knowing whether ONE arch or BOTH failed is the diagnosis when a base
      # build breaks on an architecture rather than in general.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # NOT ubuntu-latest — that would build arm64 under QEMU and still
            # succeed, just slower, which is a regression that looks like
            # nothing in review. test_build_app_image_action pins the pairing.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      # The tag WITHOUT the per-arch suffix — what merge-sdk-base-image combines
      # into and what the connector actually builds FROM. Matrix job outputs are
      # last-writer-wins, which is safe here only because every leg writes the
      # same string; the per-arch refs are deliberately not surfaced.
      image-base: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Compute PR base image ref
        id: ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "image=registry.atlan.com/public/app-runtime-base:pr-${PR_NUMBER}-sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to Atlan Harbor Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.atlan.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Log in to Chainguard Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CHAINGUARD_USERNAME }}
          password: ${{ secrets.CHAINGUARD_PASSWORD }}
      - name: Mint fleet App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: ${{ github.event.repository.name }}
      - name: Build, scan, and push PR base image
        uses: ./.github/actions/secure-build-push-apps
        with:
          branch: ${{ github.ref_name }}
          context: .
          file: ./Dockerfile
          push: true
          # This leg's architecture only; merge-sdk-base-image combines the two.
          # The base MUST end up serving both: the connector's e2e image build
          # (tests-reusable's build-e2e-image) is itself a two-leg native matrix
          # — amd64 for the per-leg worker on the runner, arm64 for the tenant's
          # node — and each leg does `FROM <this image>`. A single-arch base
          # fails the arm64 leg outright with "no match for platform in
          # manifest" before a line of the Dockerfile runs, which is what took
          # down the arm64 leg of every e2e-labelled SDK PR. The claim the
          # comment here used to make ("the connector build is single-platform
          # too") went stale when that matrix landed.
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.ref.outputs.image }}-${{ matrix.arch }}
          # Per-arch cache scope, and it is load-bearing. The action defaults to
          # an unscoped `type=gha`, which both legs would then share: concurrent
          # builds overwrite each other's cache manifest, after which every later
          # run finds the other architecture's and misses. Nothing breaks; both
          # legs just go cold forever. Same trap tag-suffix closes for the app
          # image build.
          cache-from: type=gha,scope=sdk-base-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=sdk-base-${{ matrix.arch }}
          github-token: ${{ steps.app-token.outputs.token || secrets.ORG_PAT_GITHUB }}
        env:
          DOCKER_CLIENT_TIMEOUT: 600
          COMPOSE_HTTP_TIMEOUT: 600

  # Combine the two per-arch base images into the manifest list the connector
  # builds FROM. `imagetools create` is a registry-side operation on digests —
  # no build context, no pull, a handful of seconds — which is what makes the
  # native split nearly free next to emulating one half.
  merge-sdk-base-image:
    name: Merge SDK base image manifest
    needs: build-sdk-base-image
    # No label term needed: this inherits build-sdk-base-image's skip, and the
    # FND-48 gate lives on that job. A failed arch leg leaves this SKIPPED, not
    # failed, which is why every consumer below gates on BOTH results.
    if: needs.build-sdk-base-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ needs.build-sdk-base-image.outputs.image-base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Atlan Harbor Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.atlan.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      # Buildx for `imagetools`, which is a buildx subcommand.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Create the multi-arch manifest
        env:
          IMAGE: ${{ needs.build-sdk-base-image.outputs.image-base }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE" \
            "${IMAGE}-amd64" "${IMAGE}-arm64"

      # The assert that matters: this is the reference the connector's Dockerfile
      # resolves. A leg that quietly built the wrong architecture produces an
      # index with two of the same, and the failure would surface a repo away as
      # "no match for platform in manifest" — the error this whole change exists
      # to stop shipping.
      #
      # Retried, for the reason merge-e2e-image's copy is: `imagetools create`
      # writes the manifest list ONLY in the registry, so reading it back a step
      # later is exactly the read-after-write that returned `manifest unknown`
      # 0.7s after a push reported success. The retry wraps the inspect, not the
      # assertion over its output, so a genuinely single-arch manifest still
      # fails once rather than three times.
      - name: Assert the manifest serves both architectures
        env:
          IMAGE: ${{ needs.build-sdk-base-image.outputs.image-base }}
        run: |
          set -euo pipefail
          RAW=$(.github/scripts/with-retry.sh \
            docker buildx imagetools inspect --raw "$IMAGE")
          printf '%s' "$RAW" \
            | python3 .github/scripts/assert_image_platforms.py \
                --expected linux/amd64,linux/arm64

  # Connector tests: dispatches tests.yaml to each connector repo.
  # Triggers:
  #   merge_group — always runs on code-changing merge queue entries (the
  #     primary gate). Each entry has a unique SHA, but note the SDK's SHA is
  #     NOT what scopes the connector-side concurrency groups: on the dispatch
  #     path github.ref over there is the connector's own refs/heads/main. The
  #     unit/integration groups in tests-reusable are therefore run-unique off
  #     the PR path — see the long note on that job. Don't reintroduce a
  #     ref-keyed group for anything a merge-queue batch can reach.
  #     build-sdk-base-image is skipped here, so base_image_ref is omitted
  #     and connectors build FROM the released base.
  #   pull_request + 'e2e' label — opt-in during PR development; also used
  #     to release-gate the release PR before merging. Tenant access on the
  #     connector side is serialised by the (app, cloud) lease in
  #     tests-reusable's lease-tenant job, which is a real queue: concurrent
  #     e2e-labelled PRs wait their turn instead of the third one being
  #     silently evicted as `cancelled` (FND-218 / FND-250). No cap on how
  #     many can be in flight — a run that waits longer than the lease budget
  #     fails saying the tenant was busy, naming the run that holds it.
  #     On this path base_image_ref is the freshly-built PR base image, so
  #     the connector is rebuilt on top of the SDK PR's runtime image.
  connector-tests:
    name: Connector E2E dispatch (${{ matrix.repo_name }})
    needs: [changes, matrix-builder, build-sdk-base-image, merge-sdk-base-image]
    # always() so a *skipped* build-sdk-base-image (merge_group path) does
    # not auto-skip this job. The explicit result clause still BLOCKS this
    # job when the base build genuinely fails on the e2e path — a base that
    # won't build is the signal, not something to mask by silently falling
    # back to the released base.
    #
    # BOTH base-image jobs are named, and that is not belt-and-braces: a failed
    # arch leg leaves merge-sdk-base-image SKIPPED rather than failed (its `if`
    # is simply not satisfied), and 'skipped' is the benign value in these
    # clauses. Gating on the merge alone would dispatch the connectors with
    # base_image_ref pointing at a manifest tag that was never created — every
    # connector build then failing on a missing image, a repo away from the
    # cause. Gating on the build alone would miss a merge that failed on its
    # own. This is the same trap tests-reusable's e2e job documents.
    if: |
      always() &&
      needs.matrix-builder.result == 'success' &&
      (needs.build-sdk-base-image.result == 'success' || needs.build-sdk-base-image.result == 'skipped') &&
      (needs.merge-sdk-base-image.result == 'success' || needs.merge-sdk-base-image.result == 'skipped') && (
        (
          (needs.changes.outputs.sdk == 'true' || needs.changes.outputs.container == 'true' || needs.changes.outputs.ci == 'true') &&
          github.event_name == 'merge_group'
        ) ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'e2e') &&
          (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
          github.event.pull_request.head.repo.fork != true &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    runs-on: ubuntu-latest
    # The check run is created + updated with the atlan-app-fleet App token
    # (scoped to application-sdk below), NOT github.token. A check run can only
    # be updated by the App that created it, and the connector's own callback
    # (tests-reusable.yaml report-to-sdk) completes it with that same fleet App
    # — so it MUST be the creator too, or the callback's PATCH is rejected and
    # the check hangs until the watchdog. Creating it under the fleet App also
    # attributes it to the fleet App's check suite instead of an arbitrary
    # github-actions suite. In callback mode every check write goes through the
    # fleet token, so github.token needs only contents:read (the checkout) — the
    # sole github.token check/PR-writing step (Post dispatched-run status) is
    # wait-mode != 'callback' and never runs here. A job-level permissions block
    # replaces rather than merges with the workflow defaults, so contents:read
    # is spelled out explicitly.
    #
    # The three grants beyond that all belong to e2e-apps' duplicate-dispatch
    # guard (FND-646), which runs on github.token because the claim refs live in
    # THIS repo:
    #   contents: write     — create/delete refs/e2e-dispatch/<app>/<sha>, the
    #                         atomic CAS that decides which of several runs on one
    #                         SHA reaches a tenant. Same capability, same reason,
    #                         and the same "only in a job that runs no test code"
    #                         scoping as tests-reusable's lease-tenant job.
    #   checks: read        — has this SHA already been dispatched? The
    #                         'Connector E2E run / <app>' check is the evidence.
    #   actions: read       — tell a claimant that died before dispatching from
    #                         one that is mid-dispatch. Without it the run read
    #                         404s, a LIVE claimant reads as dead, and its claim
    #                         is reclaimed — a second connector run onto the same
    #                         tenants, i.e. the bug the guard exists to prevent.
    #                         The sibling lease-tenant job grants this for the
    #                         same reason.
    #   pull-requests: read — the stale-claim prune keeps a claim only while its
    #                         SHA is still an open PR head.
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dispatch token: fleet App scoped to the CONNECTOR repo (return-dispatch
      # triggers that repo's workflow).
      - name: Mint fleet App token (connector dispatch)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: ${{ matrix.repo_name }}
      # Checks token: same fleet App, scoped to THIS repo (application-sdk), so
      # the check run it creates is owned by the fleet App and the connector's
      # callback (same App) can complete it. Kept separate from the dispatch
      # token for least privilege — dispatch can't write SDK checks and vice
      # versa.
      - name: Mint fleet App token (SDK checks)
        id: checks-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: application-sdk
      - uses: "./.github/actions/e2e-apps"
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          checks-app-token: ${{ steps.checks-app-token.outputs.token }}
          repo-name: ${{ matrix.repo_name }}
          target-branch: "refs/heads/${{ matrix.target_branch }}"
          workflow: tests.yaml
          # distinct_id is passed explicitly: return-dispatch v4 no longer
          # injects it (see the e2e-apps workflow-inputs description). Here it
          # is only a human breadcrumb correlating the connector run back to
          # this SDK PR — tests-reusable's unit/integration groups are run-unique
          # off the PR path and its e2e legs are cancel-in-progress:false, so
          # nothing depends on it.
          # Set to the same SHA as check-sha below so the two line up.
          workflow-inputs: ${{ github.event_name == 'merge_group' && format('{{"application_sdk_ref":"{0}","distinct_id":"{1}"}}', github.sha, github.sha) || format('{{"application_sdk_ref":"{0}","run_e2e":"true","base_image_ref":"{1}","distinct_id":"{2}"}}', github.event.pull_request.head.sha, needs.merge-sdk-base-image.outputs.image, github.event.pull_request.head.sha) }}
          wait-mode: callback
          check-run-name: "Connector E2E run / ${{ matrix.repo_name }}"
          check-sha: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}

  # SDR-on-Kubernetes e2e — dispatched cross-repo to atlan-local-marketplace-app,
  # which owns the orchestrator + charts and runs the hermetic kind e2e. LM
  # git-installs the SDK at application_sdk_ref (no base image needed), so this
  # job doesn't depend on build-sdk-base-image. Heavy work happens in the
  # dispatched LM run; this job dispatches + mirrors it.
  #
  # Gate design (mirrors the sdk-gate.yaml self-test pattern):
  #   merge_group — fires on sdk/container/ci changes. The 'ci' entry covers
  #     pull_request.yaml itself, so editing this dispatch glue re-runs the job
  #     in the merge queue — workflow-only PRs no longer merge blind.
  #   pull_request + 'e2e' label — opt-in regardless of what changed. The label
  #     is the operator's explicit decision; it is NOT subordinated to the
  #     sdk/container/ci filter (decoupled so workflow-only PRs can be validated
  #     by adding the label without touching SDK code).
  sdr-k8s-e2e:
    name: SDR K8s E2E (LM)
    needs: [changes]
    if: |
      (
        (needs.changes.outputs.sdk == 'true' || needs.changes.outputs.container == 'true' || needs.changes.outputs.ci == 'true') &&
        github.event_name == 'merge_group'
      ) ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
        github.event.pull_request.head.repo.fork != true &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint fleet App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: atlanhq
          repositories: atlan-local-marketplace-app
      - uses: "./.github/actions/e2e-apps"
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo-name: atlan-local-marketplace-app
          target-branch: "refs/heads/main"
          workflow: sdr-k8s-e2e.yaml
          # distinct_id is LOAD-BEARING here and must stay. sdr-k8s-e2e.yaml
          # keys its concurrency group on it with cancel-in-progress:true, and
          # target-branch is always refs/heads/main — so an omitted distinct_id
          # coarsens that group, overlapping dispatches cancel each other, and
          # poll mode reports the dispatched run as `cancelled` and reds this
          # job. return-dispatch v4 stopped injecting it, which is what broke
          # this check when the v4 bump first landed (#2923, reverted in
          # #2939); it is now passed explicitly, and e2e-apps's `Require a
          # distinct_id in workflow-inputs` step fails the job if a caller ever
          # drops it again. The receiver's exact grouping expression is NOT
          # restated here — it lives in another repo and moves independently, so
          # an in-repo copy goes stale silently (it already did once).
          # docs/standards/connector-ci-e2e.md is the single source of truth for
          # it. Same SHA the deleted `Get the application-sdk commit SHA` step
          # used to compute.
          workflow-inputs: ${{ github.event_name == 'merge_group' && format('{{"application_sdk_ref":"{0}","distinct_id":"{1}"}}', github.sha, github.sha) || format('{{"application_sdk_ref":"{0}","distinct_id":"{1}"}}', github.event.pull_request.head.sha, github.event.pull_request.head.sha) }}
          # sdr-k8s-e2e.yaml (atlan-local-marketplace-app) doesn't yet report
          # back via the Checks API callback — stays on the legacy busy-poll
          # until that's added there too. Explicit so it doesn't silently
          # inherit a future default change.
          wait-mode: poll
          # This leg is the single biggest source of merge-queue ejections: it
          # dispatches into a k8s e2e that installs its whole toolchain from
          # github.com at job time, so its failures are overwhelmingly transient
          # infra rather than regressions (19/23 green on 2026-08-12, with all
          # four failures being release-asset 503s / refused HTTP/2 streams).
          # Because this job effectively only runs on merge_group, each of those
          # ejects a PR and costs a full re-queue. One retry; still visible in
          # the log and step summary when it fires.
          retry-once: "true"

  # (No dedicated two-store-e2e job: mysql's own tests.yaml hardcodes
  # `two-store: true` unconditionally, so its EXISTING full-DAG run —
  # already dispatched by connector-tests below via the 'e2e' label —
  # regression-guards the ADR-0014 two-store posture with no extra SDK-
  # side dispatch glue. A standalone per-connector job here would repeat
  # the exact mistake sdr-matrix-builder / sdr-e2e-apps / e2e-full-mysql
  # were removed for — see the comment near the bottom of this file.)

  # ── The single required check for the connector e2e area ────────────────────
  # Always runs and always concludes, so branch protection / the merge queue can
  # require exactly this one stable context instead of the matrix legs
  # (whose names are label-driven: "Connector E2E dispatch (<repo>)"). Without this,
  # the matrix legs are not required, so the merge queue (ALLGREEN) merges as
  # soon as the OTHER required contexts (SDK Gate, Trivy, …) conclude — even
  # while the connector legs are still running. This gate closes that window.
  #
  # Fail-closed, mirroring SDK Gate: connector-tests is skipped both legitimately
  # (docs-only PR: sdk==false && container==false) AND on upstream failure
  # (matrix-builder failed, or the e2e-path base build failed). A naive
  # "skipped → pass" would go green when ZERO connector tests ran because an
  # upstream job died. So we require changes + matrix-builder to have SUCCEEDED
  # and build-sdk-base-image to be success|skipped (never failure) before
  # treating a skipped connector-tests as the genuine docs-only skip.
  connector-gate:
    name: Connector Tests Gate
    needs:
      [
        changes,
        matrix-builder,
        build-sdk-base-image,
        merge-sdk-base-image,
        connector-tests,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      # Reading this PR's current head, so a poll for checks that will never
      # exist stops early. Missing, the read 403s, the poll warns and waits the
      # full budget — the old behaviour, which is why this is easy to drop and
      # never notice.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # connector-tests now only dispatches (e2e-apps wait-mode: callback) —
      # its own success means "dispatch succeeded", not "tests passed". The
      # actual pass/fail lands later via the Connector E2E run / <repo> check
      # runs that each connector completes directly (tests-reusable.yaml's
      # report-to-sdk job); this step still validates the upstream chain
      # that had to succeed for those checks to exist at all.
      - name: Verify upstream jobs + dispatch succeeded
        id: upstream
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MATRIX_RESULT: ${{ needs.matrix-builder.result }}
          BASE_IMAGE_RESULT: ${{ needs.build-sdk-base-image.result }}
          MERGE_BASE_IMAGE_RESULT: ${{ needs.merge-sdk-base-image.result }}
          CONNECTOR_RESULT: ${{ needs.connector-tests.result }}
        run: |
          python3 .github/scripts/verify_connector_gate_upstream.py \
            --changes-result "$CHANGES_RESULT" \
            --matrix-result "$MATRIX_RESULT" \
            --base-image-result "$BASE_IMAGE_RESULT" \
            --merge-base-image-result "$MERGE_BASE_IMAGE_RESULT" \
            --connector-result "$CONNECTOR_RESULT"

      # Rolls up every 'Connector E2E run / <repo>' check run in ONE endpoint
      # call per poll (not one busy-poll per matrix leg), using conditional
      # requests so an unchanged poll doesn't count against the rate limit.
      # Each check flips the instant its connector's own run reports back
      # (tests-reusable.yaml's report-to-sdk job) — this only has to notice
      # that within one poll interval, not sit through a whole poll cycle
      # itself.
      - name: Wait for connector check runs to complete
        if: steps.upstream.outputs.dispatched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_JSON: ${{ needs.matrix-builder.outputs.matrix }}
          SHA: ${{ github.event_name == 'merge_group' && github.sha || github.event.pull_request.head.sha }}
          # Lets this stop early instead of waiting out the full 130min for
          # checks that will never exist: when SHA is no longer this PR's head,
          # the dispatch guard declined to dispatch for it (FND-696). Empty on
          # the merge_group path, which keeps the previous behaviour there.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          NAMES_JSON=$(jq -c '[.include[] | "Connector E2E run / " + .repo_name]' <<< "$MATRIX_JSON")
          python3 .github/scripts/poll_check_runs_gate.py \
            --repo "${{ github.repository }}" \
            --sha "$SHA" \
            --names-json "$NAMES_JSON" \
            --pr-number "$PR_NUMBER"

  # Real-cloud storage integration tests (S3 / Azure / GCS) — exercise
  # create_store_from_binding + CloudStore against real buckets/vaults using the
  # *_integration markers (excluded from default addopts; conftest skips when a
  # cloud's creds are absent). Fork PRs are excluded (no secrets). Nightly
  # counterpart lives in schedule.yaml.
  #
  # FND-1153: gated on the SAME 'e2e' label as the other release-tier suites
  # above, not on a private 'storage-integration' one, and deliberately NOT on
  # the merge queue. Two reasons it stays off the required SDK Gate:
  #
  #   - The Entra federated identity credential is scoped to `pull_request`
  #     subjects. A merge-queue run presents
  #     `repo:atlanhq/application-sdk:ref:refs/heads/gh-readonly-queue/main/pr-N-<sha>`,
  #     which matches no FIC, so the Azure login dies with AADSTS700213 about
  #     30s in — before a single test runs. (AWS's trust policy is broad enough
  #     to accept it; GCP's WIF attribute condition is unverified because the
  #     step never got reached.) Re-gating this on merge_group requires fixing
  #     those cloud-side subject conditions first.
  #   - Even once that is fixed, the merge queue runs entries speculatively in
  #     parallel, so every queued PR would pay three cloud logins plus real
  #     S3 / Azure / GCS round trips whether or not it touched storage.
  #
  # The cost of this tier is real and accepted: the suite runs only when someone
  # applies 'e2e', so a storage change can reach main without a real-cloud
  # request. Apply the label on any PR touching application_sdk/storage/.
  storage-integration:
    name: Storage Integration Tests (S3 / Azure / GCS)
    # Same FND-48 shape as the e2e gates above — see build-sdk-base-image for the
    # full rationale. The previous form OR'd the event check with the state check,
    # which made the event arm redundant: `contains(...)` alone was already true
    # for the label-just-added case, so every unrelated label add on a PR carrying
    # the label re-ran the real-cloud suite. AND-ing it is the fix.
    if: |
      contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keyless: all three clouds authenticate via GitHub OIDC (no static secrets).
    # Resource identifiers are non-secret repo variables (vars.*_INTEG_*).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"
      - name: AWS — assume the integration role (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ vars.AWS_INTEG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_INTEG_REGION }}
      - name: Azure — login (OIDC federated, no secret)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.AZURE_INTEG_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_INTEG_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_INTEG_SUBSCRIPTION_ID }}
      - name: GCS — Workload Identity Federation (sets ADC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_INTEG_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INTEG_SA }}
      - name: Azure — write the federated token file for obstore WI auth
        run: |
          set -euo pipefail
          # Mint into a throwaway file and only publish it on success, so a failed
          # mint/parse can't leave a zero-byte token that yields an opaque AAD
          # error downstream instead of a clear "OIDC mint failed". --fail-with-body
          # makes curl exit non-zero on a non-2xx (still printing the body to debug).
          tmp="$(mktemp)"
          curl --fail-with-body -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | python3 -c 'import sys,json;sys.stdout.write(json.load(sys.stdin)["value"])' \
            > "$tmp"
          mv "$tmp" "${RUNNER_TEMP}/azure-federated-token"
      - name: Run storage integration tests (keyless)
        env:
          # AWS: ambient creds (AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN) set by the OIDC step.
          S3_BUCKET: ${{ vars.S3_INTEG_BUCKET }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_INTEG_REGION }}
          # Azure: federated workload identity (shared-key is disabled on the account).
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_INTEG_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_INTEG_CONTAINER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_INTEG_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_INTEG_TENANT_ID }}
          AZURE_FEDERATED_TOKEN_FILE: ${{ runner.temp }}/azure-federated-token
          # GCS: ADC (GOOGLE_APPLICATION_CREDENTIALS) set by the WIF step.
          GCS_BUCKET: ${{ vars.GCS_INTEG_BUCKET }}
          GCS_PROJECT_ID: ${{ vars.GCS_INTEG_PROJECT_ID }}
        run: |
          uv run pytest tests/integration/storage/ \
            -m "s3_integration or azure_integration or gcs_integration" \
            -v --timeout=60

  # (sdr-matrix-builder, sdr-e2e-apps, and e2e-full-mysql removed —
  # superseded by connector-tests + the 'e2e' label on tests.yaml)


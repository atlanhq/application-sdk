# This workflow is used to run CodeQL analysis on the repository.
# It is triggered on push or pull request to the main branch.
# It is also triggered daily at 12:45 UTC.
# Note: Github Advanced Security CodeQL Analysis requires this to be in a separate workflow file.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # No `labeled` (FND-3839): the bump-PR opt-in is a `/gate-check` comment.
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
  merge_group:
  schedule:
    - cron: '45 12 * * 0'

jobs:
  # Bump-version PR CI is opt-in (FND-3748). The `/gate-check` comment posts a
  # `gate-check` status and re-runs this run, so the opt-in is read live from
  # the commit here — a re-run replays the event payload, which cannot carry
  # it. Only bump PRs pay for this job; everywhere else it is skipped and the
  # jobs below run (FND-3839).
  opt-in:
    name: Bump-PR opt-in
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump-version')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      opted_in: ${{ steps.opt-in.outputs.opted_in }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check the bump-PR CI opt-in
        id: opt-in
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/bump_pr_opt_in.py check --head-ref "$HEAD_REF" --sha "$HEAD_SHA"

  analyze:
    needs: opt-in
    # `always()` because opt-in is skipped off bump PRs, and a skipped need
    # would otherwise skip this job. SDK Gate fails closed on an un-opted bump
    # PR.
    if: >-
      always() && github.event_name != 'merge_group' &&
      (!startsWith(github.head_ref, 'bump-version') || needs.opt-in.outputs.opted_in == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{matrix.language}}"
          upload: never
          output: codeql-results

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true
        with:
          sarif_file: codeql-results/python.sarif
          category: "/language:${{matrix.language}}"

      - name: Generate summary
        if: always()
        run: |
          echo "## CodeQL Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SARIF="codeql-results/python.sarif"
          if [ -f "$SARIF" ]; then
            COUNT=$(python3 -c "
          import json
          with open('$SARIF') as f:
              sarif = json.load(f)
          total = sum(len(run.get('results', [])) for run in sarif.get('runs', []))
          print(total)
          " 2>/dev/null || echo "unknown")

            if [ "$COUNT" = "0" ]; then
              echo "No security findings detected." >> $GITHUB_STEP_SUMMARY
            elif [ "$COUNT" = "unknown" ]; then
              echo "Analysis complete — could not parse results." >> $GITHUB_STEP_SUMMARY
            else
              echo "**$COUNT finding(s) detected.** Review the SARIF artifact for details." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              python3 -c "
          import json
          with open('$SARIF') as f:
              sarif = json.load(f)
          print('| Rule | Message | File | Line |')
          print('|------|---------|------|------|')
          shown = 0
          for run in sarif.get('runs', []):
              for result in run.get('results', []):
                  if shown >= 10:
                      break
                  rule = result.get('ruleId', 'unknown')
                  msg = result.get('message', {}).get('text', '').replace('|', '\\\\|')[:80]
                  locs = result.get('locations', [{}])
                  phys = locs[0].get('physicalLocation', {}) if locs else {}
                  path = phys.get('artifactLocation', {}).get('uri', '?')
                  line = phys.get('region', {}).get('startLine', '?')
                  print(f'| \`{rule}\` | {msg} | \`{path}\` | {line} |')
                  shown += 1
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            fi
          else
            echo "No SARIF output found." >> $GITHUB_STEP_SUMMARY
          fi

      # `upload-artifact` classifies the artifact service's finalize 403 as
      # non-retryable and fails on the first occurrence, even though the bytes
      # already landed and the next attempt normally succeeds. That failed the
      # job, which failed the aggregate gate, which ejected the merge-queue
      # entry. So: retry once, and never fail the gate on it:
      # results reach the Security tab via codeql-action/upload-sarif;
      # this artifact is a debugging copy.
      - name: Upload SARIF as artifact
        id: upload-codeql-sarif
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
          # Overwrite on the FIRST attempt too. Artifacts survive across attempts of
          # a run, so re-running a failed job would otherwise 409 here and burn the
          # retry on a conflict that has nothing to do with a finalize failure. It is
          # also what holds the invariant every consumer of this upload globs on:
          # at most ONE live artifact ever matches `<name>*`.
          overwrite: true

      # A finalize 403 comes from an intermediary having a moment, and the
      # retry runs about a second later — well inside the same window. Wait
      # it out, so the two attempts fail independently or not at all.
      - name: Wait before the upload retry
        if: steps.upload-codeql-sarif.outcome == 'failure'
        run: sleep 20

      - name: Upload SARIF as artifact (retry)
        if: steps.upload-codeql-sarif.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # A DISTINCT name, never the first attempt's: a FinalizeArtifact
          # failure leaves an unfinalized record holding that name for the whole
          # run. The list API cannot see it, so `overwrite` cannot clear it and
          # CreateArtifact 409s — a same-named retry could never have worked.
          # Consumers resolve this artifact by `<name>*` glob, not exact name.
          name: codeql-sarif-retry
          path: codeql-results/
          retention-days: 30
          overwrite: true

  # Code Quality Checks
  lint:
    name: Pre-commit Checks
    needs: opt-in
    # Same opt-in as analyze above.
    if: >-
      always() &&
      (!startsWith(github.head_ref, 'bump-version') || needs.opt-in.outputs.opted_in == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

# This workflow is used to run CodeQL analysis on the repository.
# It is triggered on push or pull request to the main branch.
# It is also triggered daily at 12:45 UTC.
# Note: Github Advanced Security CodeQL Analysis requires this to be in a separate workflow file.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [ "main" ]
  merge_group:
  schedule:
    - cron: '45 12 * * 0'

jobs:
  analyze:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{matrix.language}}"
          upload: never
          output: codeql-results

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        continue-on-error: true
        with:
          sarif_file: codeql-results/python.sarif
          category: "/language:${{matrix.language}}"

      - name: Generate summary
        if: always()
        run: |
          echo "## CodeQL Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SARIF="codeql-results/python.sarif"
          if [ -f "$SARIF" ]; then
            COUNT=$(python3 -c "
          import json
          with open('$SARIF') as f:
              sarif = json.load(f)
          total = sum(len(run.get('results', [])) for run in sarif.get('runs', []))
          print(total)
          " 2>/dev/null || echo "unknown")

            if [ "$COUNT" = "0" ]; then
              echo "No security findings detected." >> $GITHUB_STEP_SUMMARY
            elif [ "$COUNT" = "unknown" ]; then
              echo "Analysis complete — could not parse results." >> $GITHUB_STEP_SUMMARY
            else
              echo "**$COUNT finding(s) detected.** Review the SARIF artifact for details." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              python3 -c "
          import json
          with open('$SARIF') as f:
              sarif = json.load(f)
          print('| Rule | Message | File | Line |')
          print('|------|---------|------|------|')
          shown = 0
          for run in sarif.get('runs', []):
              for result in run.get('results', []):
                  if shown >= 10:
                      break
                  rule = result.get('ruleId', 'unknown')
                  msg = result.get('message', {}).get('text', '').replace('|', '\\\\|')[:80]
                  locs = result.get('locations', [{}])
                  phys = locs[0].get('physicalLocation', {}) if locs else {}
                  path = phys.get('artifactLocation', {}).get('uri', '?')
                  line = phys.get('region', {}).get('startLine', '?')
                  print(f'| \`{rule}\` | {msg} | \`{path}\` | {line} |')
                  shown += 1
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            fi
          else
            echo "No SARIF output found." >> $GITHUB_STEP_SUMMARY
          fi

      # `upload-artifact` classifies the artifact service's finalize 403 as
      # non-retryable and fails on the first occurrence, even though the bytes
      # already landed and the next attempt normally succeeds. That failed the
      # job, which failed the aggregate gate, which ejected the merge-queue
      # entry. So: retry once, and never fail the gate on it:
      # results reach the Security tab via codeql-action/upload-sarif;
      # this artifact is a debugging copy.
      - name: Upload SARIF as artifact
        id: upload-codeql-sarif
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30

      - name: Upload SARIF as artifact (retry)
        if: steps.upload-codeql-sarif.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
          overwrite: true

  # Code Quality Checks
  lint:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-deps"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

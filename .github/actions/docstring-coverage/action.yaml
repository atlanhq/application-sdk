name: Docstring Coverage Reporting for Atlan Apps
description: |
  Reports python docstring coverage in a specified python module as a docstring comment using interrogate.
  This action analyzes python files for missing docstrings in functions, classes, and modules, generates
  both summary and detailed coverage reports, and can fail the build if coverage falls below the specified
  threshold (default is 80%).

inputs:
  fail-under:
    description: Minimum required docstring coverage percentage
    required: false
    default: '80'
  module-name:
    description: 'Target python module for coverage check'
    required: false
    default: 'app'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python 3.14
      id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.14"

    - name: Install interrogate
      shell: bash
      # Pinned: an unpinned install takes whatever PyPI serves on the day.
      run: pip install interrogate==1.7.0

    - name: Create Coverage Report Header
      shell: bash
      run: |
        echo "### 📜 Docstring Coverage Report" > docstring-cov.md
        echo >> docstring-cov.md

    # Inputs reach the shell through env, never `${{ }}` in the script, so a
    # caller's value is data and cannot inject commands.
    #
    # continue-on-error so a below-floor run still writes the detailed report
    # and posts the PR comment; the last step fails the action on it.
    - name: Run Basic Coverage Check
      id: basic
      continue-on-error: true
      shell: bash
      env:
        MODULE_NAME: ${{ inputs.module-name }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set -o pipefail
        interrogate "$MODULE_NAME" --fail-under "$FAIL_UNDER" | tee -a docstring-cov.md

    - name: Add Detailed Report Section
      shell: bash
      run: |
        echo >> docstring-cov.md
        echo >> docstring-cov.md
        echo "<details><summary>Detailed Coverage Report</summary>" >> docstring-cov.md
        echo >> docstring-cov.md
        echo "\`\`\`" >> docstring-cov.md

    # Report only: the verdict is the basic check's. `--fail-under 0` because
    # interrogate's own default floor is 80.
    - name: Run Detailed Coverage Check
      shell: bash
      env:
        MODULE_NAME: ${{ inputs.module-name }}
      run: |
        interrogate "$MODULE_NAME" --fail-under 0 -v >> docstring-cov.md

    - name: Close Detailed Report Section
      shell: bash
      run: |
        echo "\`\`\`" >> docstring-cov.md
        echo "</details>" >> docstring-cov.md

    # Only a PR has somewhere to comment. In the merge queue (merge_group)
    # the coverage check is the whole job.
    - name: Comment Docstring Coverage on PR
      if: github.event_name == 'pull_request'
      uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
      with:
        message-id: "docstring-coverage"
        message-path: docstring-cov.md

    - name: Fail when coverage is below the floor
      if: steps.basic.outcome == 'failure'
      shell: bash
      env:
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        echo "::error title=Docstring coverage::Coverage is below the ${FAIL_UNDER}% floor. See the report above or the PR comment."
        exit 1

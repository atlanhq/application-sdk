name: Mint a token scoped to the app's private git dependencies
description: |
  Mints a read-only atlan-app-fleet App token scoped to exactly the private
  atlanhq repositories the app names as git dependencies (every
  `pyproject.toml` and `uv.lock` under `project-dir`), for fetching them.
  `.github/scripts/git_auth.py repos` decides the list; a repository counts as
  private when an unauthenticated `git ls-remote` of it fails.

  The mint is skipped when the list is empty: `create-github-app-token` with
  no `repositories` would grant every repository in the installation, so this
  action never mints unscoped. A failed mint leaves `token` empty rather than
  failing the job; callers that require the token check it with
  `repositories != '' && token == ''`.

  Hand the token only to `git_auth.py run` (which mirrors the repositories and
  keeps the token out of uv's environment) or to an image build's `git_token`
  BuildKit secret. Never write it to git config.

inputs:
  app-id:
    description: "FLEET_APP_ID"
    required: true
  private-key:
    description: "FLEET_APP_PRIVATE_KEY"
    required: true
  project-dir:
    description: "The app checkout to read the dependencies from."
    required: false
    default: "."

outputs:
  token:
    description: "The scoped read-only token; empty when nothing needs one or the mint failed."
    value: ${{ steps.mint.outputs.token }}
  repositories:
    description: "Comma-separated private atlanhq repositories the app names; empty when none."
    value: ${{ steps.repos.outputs.repositories }}

runs:
  using: composite
  steps:
    - name: List the private atlanhq repos the app names
      id: repos
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        GIT_AUTH: ${{ github.action_path }}/../../scripts/git_auth.py
      run: python3 "$GIT_AUTH" repos --project-dir "$PROJECT_DIR"

    - name: Mint a read-only token for those repos
      id: mint
      if: steps.repos.outputs.repositories != ''
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: atlanhq
        repositories: ${{ steps.repos.outputs.repositories }}
        permission-contents: read

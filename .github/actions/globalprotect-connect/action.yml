name: "GlobalProtect VPN Connect (local fork)"
description: "Local copy of atlanhq/github-actions/globalprotect-connect-action with --local-hostname support. Temporary; upstream once verified."
author: "Atlan"

# This is a near-verbatim copy of
#   https://github.com/atlanhq/github-actions/tree/main/globalprotect-connect-action
# with one addition: the optional `computer-name` input is forwarded to
# openconnect via `--local-hostname=<name>` (which the GP backend advertises
# as the `computer` field during auth). Without it, every runner reports
# the same default `uname -n` to GlobalProtect, and a second login from any
# other job sharing the GP account force-logs-out the first session — which
# is what tore down the tunnel mid-poll in run 25492349986.

inputs:
  portal-url:
    description: "GlobalProtect portal URL"
    required: true
  username:
    description: "GlobalProtect username"
    required: true
  password:
    description: "GlobalProtect password"
    required: true
  max-attempts:
    description: "Maximum number of connection attempts"
    required: false
    default: "3"
  computer-name:
    description: "Unique GP client identity, forwarded to openconnect --local-hostname (GP reads this as the `computer` value during auth). Required when used in matrix/parallel jobs sharing one GP account."
    required: false
    default: ""

outputs:
  vpn-connected:
    description: "Whether VPN connection was successful"
    value: ${{ steps.openconnect-connection.outputs.connected }}

runs:
  using: "composite"
  steps:
    - name: Connect via OpenConnect
      uses: nick-fields/retry@v3
      id: openconnect-connection
      with:
        max_attempts: ${{ fromJSON(inputs.max-attempts) }}
        timeout_minutes: 10
        shell: bash
        command: |
          echo "🔄 Connecting to GlobalProtect VPN using OpenConnect..."

          # Install OpenConnect
          echo "📦 Installing OpenConnect..."
          sudo apt-get update
          sudo apt-get install -y openconnect

          # Check required inputs
          if [ -z "${{ inputs.portal-url }}" ]; then
            echo "❌ portal-url input not provided"
            exit 1
          fi

          if [ -z "${{ inputs.username }}" ]; then
            echo "❌ username input not provided"
            exit 1
          fi

          if [ -z "${{ inputs.password }}" ]; then
            echo "❌ password input not provided"
            exit 1
          fi

          # Build optional --local-hostname flag. openconnect's GP backend
          # advertises this as the `computer` field in the auth/getconfig
          # POSTs, which is what GlobalProtect uses to identify the client
          # session. Empty input → flag omitted, behaviour matches upstream
          # (openconnect uses uname -n).
          HOSTNAME_FLAG=()
          if [ -n "${{ inputs.computer-name }}" ]; then
            echo "🖥️  Using --local-hostname=${{ inputs.computer-name }}"
            HOSTNAME_FLAG=(--local-hostname="${{ inputs.computer-name }}")
          else
            echo "⚠️  No computer-name supplied; using runner default hostname (collision-prone in matrix/parallel jobs)"
          fi

          echo "🌐 Attempting OpenConnect to: ${{ inputs.portal-url }}"

          # Create credentials file for OpenConnect
          echo "${{ inputs.password }}" | sudo openconnect \
            --protocol=gp \
            --user="${{ inputs.username }}" \
            --passwd-on-stdin \
            "${HOSTNAME_FLAG[@]}" \
            --background \
            "${{ inputs.portal-url }}" || {
            echo "❌ OpenConnect connection failed"
            exit 1
          }

          # Wait a moment for connection to establish
          sleep 10

          # Initial connectivity test
          echo "🔍 Testing initial connectivity to Phoenix AI..."
          time curl -k -sS https://phoenix-ai.atlan.com -o /dev/null

          if [ $? -eq 0 ]; then
            echo "✅ Initial connectivity test successful"
          else
            echo "❌ Initial connectivity test failed"
            exit 1
          fi


          # Set output to indicate successful connection
          echo "connected=true" >> $GITHUB_OUTPUT
          echo "✅ VPN connection established successfully"

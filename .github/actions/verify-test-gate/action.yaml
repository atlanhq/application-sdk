name: Verify Tests Gate
description: |
  Evaluate the aggregator Tests Gate from the tests + e2e job results. Emits the
  pass/fail decision AND the human-readable status strings the PR summary table
  renders, so the displayed status and the enforced result share one tested
  source of truth (docs/standards/ci.md). The caller enforces via a branch-free
  `if: outputs.passed != 'true'` step — this action never exits non-zero itself.
  Co-located driver, checked out with the action in consumer repos.

inputs:
  unit-result:
    description: needs.unit.result (unit-tests job; runs on every event).
    required: true
  integration-result:
    description: |
      needs.integration.result (integration-tests job). "skipped" is a valid
      pass: the job is skipped on pull_request and when the connector has no
      integration suite.
    required: true
  detect-integration-result:
    description: |
      needs.detect-integration.result (the suite-detection job gating the
      integration tier). "skipped" (no integration tier for this event) and
      "success" are passes; a "failure" must fail the gate rather than silently
      skip integration.
    required: true
  detect-merge-queue-result:
    description: |
      needs.detect-merge-queue.result (decides whether the integration tier runs
      in the merge queue or on the PR). "skipped" (non-PR events) and "success"
      are passes; a "failure" must fail the gate rather than silently drop the
      integration tier. Optional and defaults to "skipped" so callers pinned at
      @main that have not yet added the job keep working unchanged.
    required: false
    default: skipped
  discover-e2e-result:
    description: needs.discover-e2e.result (skipped = e2e not requested).
    required: true
  build-e2e-image-result:
    description: |
      needs.build-e2e-image.result (the per-arch image matrix). It gates the
      manifest merge, which gates prepare-tenant, which gates the e2e matrix —
      so a failure here drops e2e to a skip and must fail the gate rather than
      read as "e2e not requested". "skipped" (install path off, or e2e not
      requested) and "success" are passes. Optional, defaulting to "skipped",
      so callers pinned at @main keep working before they wire it.
    required: false
    default: skipped
  merge-e2e-image-result:
    description: |
      needs.merge-e2e-image.result (combines the per-arch images into the
      manifest list the tenant pulls). Same reasoning and same default as
      build-e2e-image-result.
    required: false
    default: skipped
  lease-tenant-result:
    description: |
      needs.lease-tenant.result (queues for the shared (app, cloud) tenant
      before anything installs onto it). A failure here means the tenant was
      busy, not that the change is broken, so it must be named rather than left
      to surface as the downstream "matrix skipped" anomaly (FND-250). Same
      reasoning and same default as build-e2e-image-result.
    required: false
    default: skipped
  prepare-tenant-result:
    description: |
      needs.prepare-tenant.result (installs the image under test onto each
      cloud's tenant). The last of the four install-path jobs the e2e matrix
      gates on. Same reasoning and same default as build-e2e-image-result.
    required: false
    default: skipped
  e2e-result:
    description: needs.e2e.result (matrix aggregate; skipped = not requested).
    required: true
  superseded:
    description: |
      needs.sdk-head-recheck.outputs.superseded — "true" when the run stood its
      e2e down because the application-sdk commit it was dispatched for is no
      longer the head of the PR that dispatched it (FND-701).

      That stand-down produces the exact shape of the "matrix skipped despite
      discovered suites" anomaly: a successful discovery, a skipped matrix, and
      no install-path failure to explain it. Without this input the gate reds and
      `report-to-sdk` mirrors conclusion=failure onto the dispatching SDK commit
      — "your change broke the connector" for a run that deliberately stood down,
      which is the misattribution the cancelled/failure split exists to prevent.

      Only the literal "true" explains the skip. Optional, defaulting to "false",
      so callers pinned at @main that have not wired the recheck job keep the
      previous behaviour — and so an unexplained skip stays an anomaly.
    required: false
    default: "false"

outputs:
  passed:
    description: '"true" when every required job passed, else "false".'
    value: ${{ steps.gate.outputs.passed }}
  conclusion:
    description: |
      The same verdict as `passed`, spelled as a GitHub Checks API conclusion
      ("success" / "failure" / "cancelled"). Lets the cross-repo callback
      complete the SDK-side check run from this action directly, instead of
      re-deriving the verdict.

      "cancelled" is emitted for a BLOCKED gate whose only non-passing results
      are cancellations — a manual cancel, a superseded commit, or a
      concurrency-group eviction. `passed` is still "false" there (an un-run
      test must never green a merge), but reporting it as "failure" tells a
      reviewer on the dispatching SDK PR that their change broke the connector,
      which sends them into the wrong diff (FND-218).
    value: ${{ steps.gate.outputs.conclusion }}
  unit-status:
    description: Human-readable status for the unit row.
    value: ${{ steps.gate.outputs.unit-status }}
  integration-status:
    description: Human-readable status for the integration row.
    value: ${{ steps.gate.outputs.integration-status }}
  e2e-status:
    description: Human-readable status for the e2e row.
    value: ${{ steps.gate.outputs.e2e-status }}
  overall-status:
    description: Human-readable overall status.
    value: ${{ steps.gate.outputs.overall-status }}

runs:
  using: composite
  steps:
    - name: Evaluate Tests Gate
      id: gate
      shell: bash
      # Route job results through env (quoted below), not inline ${{ }}.
      env:
        UNIT_RESULT: ${{ inputs.unit-result }}
        INTEGRATION_RESULT: ${{ inputs.integration-result }}
        DETECT_INTEGRATION_RESULT: ${{ inputs.detect-integration-result }}
        DETECT_MERGE_QUEUE_RESULT: ${{ inputs.detect-merge-queue-result }}
        DISCOVER_E2E_RESULT: ${{ inputs.discover-e2e-result }}
        BUILD_E2E_IMAGE_RESULT: ${{ inputs.build-e2e-image-result }}
        MERGE_E2E_IMAGE_RESULT: ${{ inputs.merge-e2e-image-result }}
        LEASE_TENANT_RESULT: ${{ inputs.lease-tenant-result }}
        PREPARE_TENANT_RESULT: ${{ inputs.prepare-tenant-result }}
        E2E_RESULT: ${{ inputs.e2e-result }}
        SUPERSEDED: ${{ inputs.superseded }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/verify_test_gate.py" \
          --unit "$UNIT_RESULT" \
          --integration "$INTEGRATION_RESULT" \
          --detect-integration "$DETECT_INTEGRATION_RESULT" \
          --detect-merge-queue "$DETECT_MERGE_QUEUE_RESULT" \
          --discover-e2e "$DISCOVER_E2E_RESULT" \
          --build-e2e-image "$BUILD_E2E_IMAGE_RESULT" \
          --merge-e2e-image "$MERGE_E2E_IMAGE_RESULT" \
          --lease-tenant "$LEASE_TENANT_RESULT" \
          --prepare-tenant "$PREPARE_TENANT_RESULT" \
          --e2e "$E2E_RESULT" \
          --superseded "$SUPERSEDED" >> "$GITHUB_OUTPUT"

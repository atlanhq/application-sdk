name: E2E tenant lease
description: |
  Acquire or release the (app, cloud) tenant lease that serialises e2e runs
  against a shared tenant, replacing the ref-keyed concurrency groups that could
  only hold one pending run and silently evicted the rest (FND-218 / FND-250).

  Exclusion is an atomic compare-and-swap: one fixed-name ref per tenant, where
  GitHub's 422 on creating a ref that already exists IS the lock. Consumed at
  @main by every contender ON PURPOSE — they all have to agree on that ref name,
  so the protocol must not vary with whichever ref a caller happened to check
  out. See e2e_tenant_lease.py, including why an ordered ticket queue was tried
  first and does not work.

  Requires `contents: write` (to create and delete the ticket ref) and
  `actions: read` (to tell a live holder from a dead one). Without them `acquire`
  FAILS, naming the missing grant.

  It used to warn and proceed lease-less instead. That fail-open was never real:
  `prepare-tenant` verifies its own tenant's lease before installing, finds none,
  and reds every install leg two jobs later with an error that cannot be acted on
  (FND-702). Note that a caller's `permissions:` block is exhaustive rather than
  additive, so a caller that declares one must declare every scope the reusable
  workflow's jobs use — declaring less is what CAUSES this failure.

inputs:
  mode:
    description: |
      "acquire", "verify" or "release".

      "verify" confirms this run currently holds the lease and fails the step if
      not. It exists because a matrix job cannot depend on its own leg of an
      upstream matrix job — `needs.lease-tenant.result` is the AGGREGATE across
      clouds, so it says "some cloud's lease succeeded", never "mine did". The
      install therefore gates on the lease job having RUN and confirms its own
      tenant with this.
    required: true
  app:
    description: App under test; one half of the lease key.
    required: true
  cloud:
    description: |
      Cloud whose tenant this is; the other half of the lease key. Empty is
      valid and means the single-tenant fallback path, keyed as "default".

      Mutually exclusive with `clouds`: passing both non-empty fails rather than
      picking one, because silently preferring one would leave the other's tenant
      unserialised while the job still went green.
    required: false
    default: ""
  clouds:
    description: |
      Comma-separated clouds to lease as ONE ordered set. `acquire` takes them
      in a fixed order (sorted by name) under a single total `wait-seconds`
      budget, and hands back everything it took if it cannot get the whole set;
      `release` gives the same set back.

      This is what makes a cross-CSP run safe. The per-cloud matrix it replaces
      acquired every cloud in parallel and held each while blocking on the rest
      — hold-and-wait, which deadlocked as soon as two runs queued behind one
      holder and split the freed set between them (FND-646). Ordering by name
      makes a cycle structurally impossible, and the order MUST stay a pure
      function of the names: derive it from anything per-run and two contenders
      disagree about which lock comes first, which is the whole guarantee.

      Names are canonicalised to the lease key before they are ordered, so
      spelling cannot reorder the locks: `aws, gcp` and `aws,gcp` are one pair of
      tenants taken in one order, and a difference in case or spacing between two
      callers cannot invert them.

      Empty falls back to `cloud`, so a caller can pass both unconditionally —
      no branching shell — and the single-tenant path, where the resolved cloud
      list is legitimately empty, keeps leasing "default".

      NOT accepted by `verify`, deliberately: each install leg must confirm its
      OWN tenant, and a set-shaped verify would invite it to check the aggregate
      again — the approximation `verify` was added to replace.
    required: false
    default: ""
  wait-seconds:
    description: |
      How long to queue for the tenant before giving up. Default 90min: long
      enough to sit behind one full install-plus-legs run ahead in the queue,
      short enough that a wedged tenant is reported the same working day.
    required: false
    default: "5400"
  poll-seconds:
    description: |
      Gap between attempts. A waiting pass costs TWO API calls (read the lease
      ref; check the holding run's status — the holder record is memoised by the
      ref's target sha), and FOUR on the pass that takes the lease (plus a fifth
      to reap a dead holder).

      That budget is 1000 requests/hour per REPOSITORY, and every matrix leg of
      every concurrent run shares it. So raise this rather than lower it when
      several clouds contend: at 30s, one leg waiting the full 90min budget draws
      ~360 calls, and three clouds waiting together draw ~1080 over that 90
      minutes — about 720/hour, which is close enough to the ceiling to matter
      once the rest of the run's API use is counted.

      A rate-limit 403 no longer disables the lease: it is told apart from a
      permission 403, backs off (honouring Retry-After), and fails loudly if it
      never clears. Staying inside the budget is still much better than relying
      on that.
    required: false
    default: "30"
  ttl-seconds:
    description: |
      How long a holder may HOLD the lease before a waiter treats it as wedged
      and breaks it. Measured from the acquisition time the holder recorded in
      its own holder record — so it is lease-hold time, not run age, and none of
      the pre-lease span (discovery, image build, manifest merge, runner queue
      time) counts against it.

      Must exceed the longest legitimate hold: the install plus the leg ceiling.
      Sized against the workflow's own job timeouts by a test, so raising either
      forces this up rather than silently eating the margin. Errs long on
      purpose — breaking a live holder's lease puts a second installer on the
      tenant, which is the race the lease exists to close, whereas breaking one
      late costs a blocked tenant that a waiter is already reporting loudly.
      0 disables the backstop.

      Raised from 14400 when prepare-tenant's ceiling went to 48 min to fit the
      publish retry (FND-760). That is the sizing test doing its job, not a
      margin being spent: the hold this must clear is now 48+120 min, and a TTL
      that no longer cleared it by 1.5x would start breaking live holders.
    required: false
    default: "16200"
  on-timeout:
    description: |
      "fail" (default) — go red naming the holding run. "warn" — proceed
      unserialised.
    required: false
    default: fail

outputs:
  acquired:
    description: '"true" only when this run now holds the lease.'
    value: ${{ steps.lease.outputs.acquired }}
  state:
    description: |
      "acquired"; "denied" (no ref-write permission in the calling workflow);
      "timeout" (the tenant stayed busy); or "rate-limited" (the API never
      cleared). Only "acquired" exits 0 — every other state fails the step, so a
      green lease job means a lease was genuinely taken.
    value: ${{ steps.lease.outputs.state }}
  lease-ref:
    description: |
      The lease ref the outcome hinged on: the tenant this run raced for in
      single-cloud mode, and in `clouds` mode the last one taken when the whole
      set was acquired or the one that blocked otherwise. One specific tenant to
      name in an error, never a guess about which of the set it was.
    value: ${{ steps.lease.outputs.lease-ref }}
  lease-refs:
    description: |
      Every lease ref this run now holds, comma-separated; empty unless
      `acquired` is true. Acquisition is all-or-nothing, so this is either the
      whole requested set or nothing — never a partial hold.
    value: ${{ steps.lease.outputs.lease-refs }}
  clouds:
    description: The clouds this run leased, comma-separated and in acquisition order.
    value: ${{ steps.lease.outputs.clouds }}
  holder-run-id:
    description: The run holding the lease when this one gave up waiting; else empty.
    value: ${{ steps.lease.outputs.holder-run-id }}

runs:
  using: composite
  steps:
    - name: ${{ inputs.mode == 'release' && 'Release' || inputs.mode == 'verify' && 'Confirm' || 'Acquire' }} the tenant lease
      id: lease
      shell: bash
      # Inputs routed through env rather than inline ${{ }} so nothing
      # interpolates into the command line (docs/standards/ci.md).
      env:
        MODE: ${{ inputs.mode }}
        APP: ${{ inputs.app }}
        CLOUD: ${{ inputs.cloud }}
        CLOUDS: ${{ inputs.clouds }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        POLL_SECONDS: ${{ inputs.poll-seconds }}
        TTL_SECONDS: ${{ inputs.ttl-seconds }}
        ON_TIMEOUT: ${{ inputs.on-timeout }}
        # The lease lives in the repository the run belongs to. Every run that
        # contends for a given app's tenant runs there too — a connector PR, a
        # push, and a cross-repo dispatch from application-sdk all execute in the
        # app repo. (The one exception, application-sdk's manual install
        # workflow, is outside the lease domain: see FND-254.)
        LEASE_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/e2e_tenant_lease.py" \
          --mode "$MODE" \
          --repo "$LEASE_REPO" \
          --app "$APP" \
          --cloud "$CLOUD" \
          --clouds "$CLOUDS" \
          --run-id "$RUN_ID" \
          --run-attempt "$RUN_ATTEMPT" \
          --wait-seconds "$WAIT_SECONDS" \
          --poll-seconds "$POLL_SECONDS" \
          --ttl-seconds "$TTL_SECONDS" \
          --on-timeout "$ON_TIMEOUT"

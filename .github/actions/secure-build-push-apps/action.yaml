name: 'Build, Trivy Scan, and Push'
description: >-
  Builds an image for the runner's own architecture, Trivy-scans it, then
  builds and pushes the requested platforms. The scan reports fixable
  CRITICAL/HIGH findings and blocks the push only when fail-on-vulns is 'true';
  by default it is advisory.

# Called only from this repo's own workflows (pull_request.yaml's
# build-sdk-base-image and harbor-release.yaml's build), after a checkout of
# this repo, which is what lets it reach trivy-image-scan by its `./` path.
# The fleet's `secure-build-push-apps` is a different action, in atlanhq/.github.
#
# Inputs are the ones those callers set. It used to restate all of
# docker/build-push-action's inputs, 23 of which no caller set, plus a
# `secret-files` pass-through that was never declared and so was always empty
# (FND-4904).

inputs:
  tags:
    description: 'Tags for the image, one per line. The first is the one scanned.'
    required: true
  push:
    description: "'true' to push after the scan."
    required: false
    default: 'false'
  fail-on-vulns:
    description: >-
      'true' fails the action, before anything is pushed, when the scan finds a
      CRITICAL or HIGH vulnerability that has a fix. 'false' reports and pushes.
    required: false
    default: 'false'
  context:
    description: 'Build context.'
    required: false
    default: '.'
  file:
    description: 'Path to the Dockerfile.'
    required: false
  platforms:
    description: 'Platforms to build and push. The scan always builds the runner''s own.'
    required: false
  cache-from:
    description: 'External cache sources.'
    required: false
    default: 'type=gha'
  cache-to:
    description: 'Cache export destinations.'
    required: false
    # `ignore-error=true`: see build-and-scan.yaml — a cache-service hiccup must not fail a build.
    default: 'type=gha,mode=min,ignore-error=true'
  github-token:
    description: 'GitHub token for docker/build-push-action.'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build single-platform image for scanning
      id: build_for_scan
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        cache-from: ${{ inputs.cache-from }}
        # Cache is exported here
        cache-to: ${{ inputs.cache-to }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        github-token: ${{ inputs.github-token }}
        # Build only for the runner's native platform for scanning.
        #
        # Derived from `runner.arch` rather than hardcoded to linux/amd64, which
        # is what this said while claiming to be native. Every caller ran on an
        # x64 runner, so the two agreed and the lie was invisible — until a
        # caller moved a leg to `ubuntu-24.04-arm`, where the hardcode silently
        # builds amd64 under QEMU for the scan and then scans an image that is
        # not the one being pushed. A step-level expression, not conditional
        # shell, so it stays within docs/standards/ci.md.
        platforms: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        tags: ${{ inputs.tags }}
        # Load the image for the scanner to use
        load: true
        push: false

    - name: Extract primary image tag for the scan
      id: extract_tag
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
      run: echo "primary_tag=$(printf '%s\n' "$TAGS" | head -n 1)" >> "$GITHUB_OUTPUT"

    # The pinned Trivy CLI, not aquasecurity/trivy-action: that action's bundled
    # Trivy reports no OS findings on the Chainguard base this builds from (see
    # trivy-image-scan). A gate failure ends the action here, so the push below
    # never runs.
    - name: Trivy scan
      uses: ./.github/actions/trivy-image-scan
      with:
        image-ref: ${{ steps.extract_tag.outputs.primary_tag }}
        severity: CRITICAL,HIGH
        ignore-unfixed: 'true'
        output: trivy-results.json
        fail-severity: ${{ inputs.fail-on-vulns == 'true' && 'CRITICAL,HIGH' || '' }}

    - name: Cleanup loaded scanning image
      shell: bash
      env:
        PRIMARY_TAG: ${{ steps.extract_tag.outputs.primary_tag }}
      run: docker rmi "$PRIMARY_TAG" || true

    # A second build, for the requested platforms. Layers come from the cache
    # the scan build exported.
    - name: Build and Push multi-platform image
      id: docker_push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        # Cache is imported here
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        github-token: ${{ inputs.github-token }}
        # Use the platforms the developer originally requested
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        push: ${{ inputs.push }}

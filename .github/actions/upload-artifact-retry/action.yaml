name: Upload artifact (with retry)
description: |
  `actions/upload-artifact` with the retry every gating upload in this repo
  needs. `upload-artifact` treats the artifact service's `FinalizeArtifact` 403
  ("Error from intermediary") as non-retryable and fails on the first
  occurrence, even though the bytes already landed. This action is the one
  place the retry lives; docs/standards/ci.md ("Artifacts move through the
  retry composites") has the reasoning behind each rule:

    1. The first attempt is `continue-on-error`, so a 403 does not end the job
       before the retry runs.
    2. A 20-second wait sits between the attempts. The 403 comes from an
       intermediary having a moment; an immediate retry lands in the same
       window.
    3. The retry uploads under `<name>-retry`. A failed finalize leaves an
       invisible record holding `<name>` for the rest of the run, so a
       same-named retry 409s. Readers glob `<name>*` (see
       `download-artifact-retry`).
    4. Both attempts set `overwrite: true`, so a re-run job replaces the
       earlier attempt's artifact and at most one artifact ever matches
       `<name>*`.

  The step fails only when both attempts fail. Set `continue-on-error: true`
  on the calling step when a lost artifact must not fail the job.

  The caller's `if:` is the only gate: the first attempt runs whenever this
  step does, including after an earlier step failed (`if: always()` here).

  Reusable workflows and composites must reference this as
  `atlanhq/application-sdk/.github/actions/upload-artifact-retry@main`, not
  `./…`: a relative path resolves against the caller's workspace, which in a
  consumer repo has no copy of this action.

inputs:
  name:
    required: true
    description: Artifact name. The retry uploads `<name>-retry`.
  path:
    required: true
    description: Files to upload, as `actions/upload-artifact`'s `path`.
  retention-days:
    required: true
    description: |
      Days to keep the artifact, 1 to 30. Required: without it the artifact
      lives for the 90-day repo default (FND-3313).
  if-no-files-found:
    required: false
    default: warn
    description: "`warn`, `error` or `ignore`, as `actions/upload-artifact`."

runs:
  using: composite
  steps:
    - name: Upload
      id: upload
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true

    - name: Wait before the upload retry
      if: always() && steps.upload.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Upload (retry)
      if: always() && steps.upload.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}-retry
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true

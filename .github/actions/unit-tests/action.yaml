name: Unit Tests for application-sdk

description: |
  Runs unit tests for Atlan Application SDK.

  This action executes a comprehensive suite of unit tests for application-sdk, ensuring code quality and functionality.

  It includes:
  - Running pytest for all test files in the tests/ directory
  - Generating code coverage reports in XML and HTML formats
  - Enforcing a minimum coverage threshold of 60%
  - Adding coverage report comments to pull requests

inputs:
  github-token:
    required: true
    description: The GitHub token to use for the action.
  fail-under:
    required: false
    description: The minimum coverage threshold to enforce. Default is 60%.
    default: "50"
  python-version:
    required: false
    description: The Python version to use for the action.
    default: "3.11"

runs:
  using: "composite"
  steps:
    - uses: "./.github/actions/setup-deps"
      with:
        python-version: ${{ inputs.python-version }}

    - name: Get branch name
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
      id: get_branch

    - name: Run Unit and Integration Tests with Coverage
      shell: bash
      env:
        ATLAN_ENABLE_OBSERVABILITY_DAPR_SINK: "false"
      run: |
        PYTHON_MINOR=$(echo "${{ inputs.python-version }}" | cut -d. -f2)
        UV_RUN="uv run --frozen"
        PYTEST_IGNORE=""
        if [ "${PYTHON_MINOR}" -ge 14 ] 2>/dev/null; then
          UV_RUN="uv run --frozen --no-group dev"
          # Skip tests that require libcst (dev-only, no 3.14 support) or
          # pyatlan pydantic-v1 compat (upstream fix: atlan-python PR #893)
          PYTEST_IGNORE="--ignore=tests/unit/tools --ignore=tests/unit/clients/test_atlan_client.py --ignore=tests/unit/credentials/test_atlan_client.py"
        fi
        # pytest-socket: on Linux/macOS the event loop uses os.pipe()/AF_UNIX for its
        # self-pipe, so --allow-unix-socket is sufficient. On Windows, ProactorEventLoop
        # uses AF_INET socket pairs internally; --disable-socket would break asyncio
        # entirely there, so we skip the guard on Windows. Linux CI still enforces it.
        if [ "${RUNNER_OS}" != "Windows" ]; then
          SOCKET_FLAGS="--disable-socket --allow-unix-socket"
        else
          SOCKET_FLAGS=""  # intentionally empty — see comment above
        fi
        # -n auto: the suite is ~8,700 tests and was single-threaded, so a leg
        # took 6-10 minutes while the runner sat on 4 idle vCPUs. Roughly a
        # third of that was tests sleeping on real clocks, which parallelism
        # hides for free. See FND-961.
        #
        # --cov rather than `coverage run -m pytest`: coverage only traces the
        # parent process, so under xdist the workers' coverage is silently lost
        # and --fail-under reads well under half the true number.
        #
        # --capture=no is deliberately absent. xdist ignores it in workers, and
        # leaving it on means a failing test's stdout is written to a worker
        # process nobody reads instead of being replayed in the failure report.
        # --log-cli-level is deliberately absent, and it is the single biggest
        # remaining lever: it costs 42% of wall time under xdist (77.6s -> 45.3s
        # locally) and 93s of CPU, because every worker formats each record and
        # ships it over execnet. It also forces per-test verbose headers even
        # without -v, which is what made a job log 20,000 lines. Under xdist the
        # live stream is dropped for passing tests anyway; a failing test still
        # gets its `Captured log call` section.
        $UV_RUN pytest --import-mode=importlib tests/ $PYTEST_IGNORE \
          -n auto --hypothesis-show-statistics ${SOCKET_FLAGS} \
          --durations=25 --durations-min=1.0 \
          --cov=application_sdk --cov-report=xml --cov-report=html \
          --cov-report=term --cov-fail-under=${{ inputs.fail-under }}

    - name: Comment Coverage Report on PR
      uses: orgoro/coverage@ca0c362dc1a4f100447309405e6dfea47e251495 # v3.3.1
      continue-on-error: true
      with:
        coverageFile: coverage.xml
        token: ${{ inputs.github-token }}


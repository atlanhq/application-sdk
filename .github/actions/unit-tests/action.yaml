name: Unit Tests for application-sdk

description: |
  Runs unit tests for Atlan Application SDK.

  This action executes a comprehensive suite of unit tests for application-sdk, ensuring code quality and functionality.

  It includes:
  - Running pytest for all test files in the tests/ directory
  - Generating code coverage reports in XML and HTML formats (when `coverage` is "true")
  - Enforcing the minimum coverage threshold `fail-under`
  - Adding coverage report comments to pull requests

  Tests marked `perf` are excluded by `addopts`; the SDK workflow runs them in
  a separate single-process job.

inputs:
  github-token:
    required: true
    description: The GitHub token to use for the action.
  fail-under:
    required: false
    description: The minimum coverage threshold to enforce. Default is 60%.
    default: "50"
  python-version:
    required: false
    description: The Python version to use for the action.
    default: "3.11"
  coverage:
    required: false
    description: |
      "true" to measure coverage, enforce fail-under and comment the report on
      the PR. Tracing costs ~20-30% of a leg's wall time, so the SDK matrix
      turns it on for one leg only.
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: "./.github/actions/setup-deps"
      with:
        python-version: ${{ inputs.python-version }}

    - name: Get branch name
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
      id: get_branch

    - name: Run Unit Tests
      shell: bash
      env:
        ATLAN_ENABLE_OBSERVABILITY_DAPR_SINK: "false"
        # Inputs reach the shell as env vars, never as `${{ }}` in `run:`:
        # GitHub expands an expression before bash parses the line, so a
        # quote in an input would become shell syntax.
        UNIT_TEST_PYTHON_VERSION: ${{ inputs.python-version }}
        UNIT_TEST_COVERAGE: ${{ inputs.coverage }}
        UNIT_TEST_FAIL_UNDER: ${{ inputs.fail-under }}
      # Every per-leg decision (uv groups on 3.14, socket guard, timeout
      # method, coverage) is made by the script, which has tests; see its
      # docstring and docs/standards/ci.md.
      run: >-
        python .github/scripts/unit_test_command.py
        --python-version "$UNIT_TEST_PYTHON_VERSION"
        --runner-os "$RUNNER_OS"
        --coverage "$UNIT_TEST_COVERAGE"
        --fail-under "$UNIT_TEST_FAIL_UNDER"

    - name: Comment Coverage Report on PR
      if: inputs.coverage == 'true'
      uses: orgoro/coverage@ca0c362dc1a4f100447309405e6dfea47e251495 # v3.3.1
      continue-on-error: true
      with:
        coverageFile: coverage.xml
        token: ${{ inputs.github-token }}


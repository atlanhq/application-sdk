name: SDR Integration Tests
description: |
  Run a connector app's SDR (Self-Deployed Runtime) integration tests
  against a real customer-style stack — atlan-configurator-generated
  docker compose, Dapr embedded, Temporal on a CI test tenant — running
  entirely on the GitHub Actions runner.

  The composite handles: PR image build, configurator download +
  invocation, Dapr component overrides, container start + health wait,
  pytest run, Temporal workflow link extraction, GitHub Step Summary,
  PR comment, commit status, and teardown.

  Caller is responsible for:
  - Checking out the PR (this action does NOT call actions/checkout)
  - Setting the standard CI tenant secrets as job-level env vars:
    SDR_TEST_TENANT, SDR_CLIENT_ID, SDR_CLIENT_SECRET
  - Setting any connector-specific secrets the test class reads
    (typically E2E_<APP>_HOST/PORT/USERNAME/PASSWORD/DATABASE)
  - Providing a secrets-bundle script at the configured path that writes
    /app/secrets/credentials.json (the canonical SDR test secrets path)

  Optional caller-side overrides on top of SDK defaults (paths under
  .github/sdr-e2e/ for new adopters; .github/e2e/ is also accepted for
  backward compatibility):
  - <sdr-config-dir>/components/*.yaml — additional or replacement Dapr components
  - <sdr-config-dir>/docker-compose.ci.yml — additional compose layer
  - <sdr-config-dir>/test-config.yaml.tmpl — replacement configurator input
  - <sdr-config-dir>/app.yaml — configurator input (legacy: app.yaml at repo root)

inputs:
  app-name:
    description: |
      Connector short name (e.g. "mssql", "saperp"). Used as the
      ATLAN_APPLICATION_NAME for credential auto-discovery and to label
      log lines / artifacts. Must match the app's pyproject and CI conventions.
    required: true
  app-image-name:
    description: |
      GHCR image name (e.g. "atlan-mssql-app"). The composite tags the
      built image as ghcr.io/atlanhq/<app-image-name>:sdr-test-<short-sha>.
    required: true
  test-path:
    description: Pytest target directory containing the SDR test suite.
    required: false
    default: tests/sdr/
  report-title:
    description: |
      Short label used in the PR-comment / step-summary report title and
      the PR comment marker. When empty (the default), the action derives
      a title from `test-path`:
        tests/sdr/        → "SDR Integration Tests (testcontainer)"
        tests/full_dag/   → "E2E Full Tests (system apps)"
        tests/<other>/    → "<other> Tests" (with hyphens/underscores
                            replaced by spaces and the first letter
                            uppercased).
      Override to a literal label if the auto-derived one doesn't fit.
    required: false
    default: ""
  secrets-script:
    description: |
      Path (relative to repo root) to a bash or python script that writes
      <sdr-config-dir>/secrets/credentials.json from job-level env vars
      (where <sdr-config-dir> is .github/sdr-e2e or .github/e2e, whichever
      the app uses). The script is invoked once before the SDR container
      starts. Must produce a JSON file the local.file Dapr secret store
      can read.
    required: false
    default: .github/sdr-e2e/make-secrets.sh
  container-health-timeout-seconds:
    description: |
      How long to wait for the SDR container's /server/health endpoint to
      respond before failing. Connectors with heavy native deps (e.g. SAP
      JCo) may need 180s+; default fits most.

      INVARIANT: keep this strictly greater than the SDK's max startup
      sidecar wait (ATLAN_DAPR_SIDECAR_WAIT_TIMEOUT, default 60 in
      application_sdk/infrastructure/_dapr/http.py). The health bind happens
      after that wait, so an equal value makes the gate a coin-flip. See
      CNCT-66.
    required: false
    default: "120"
  pytest-extra-args:
    description: Extra arguments appended to the pytest invocation.
    required: false
    default: ""
  artifact-suffix:
    description: |
      Suffix appended to the uploaded results artifact name so parallel
      callers (e.g. the e2e matrix, one leg per suite) don't collide on
      upload-artifact, which rejects duplicate names within a run. Empty
      (default) keeps the historical single-artifact name.
    required: false
    default: ""
  post-pr-comment:
    description: |
      Whether the action posts its per-run summary comment on the connector
      PR. "true" (default) preserves current behaviour. Set "false" when a
      caller posts one aggregated summary itself (e.g. the e2e matrix, so N
      legs don't post N comments).
    required: false
    default: "true"
  application-sdk-ref:
    description: |
      Optional application-sdk commit SHA / ref applied to BOTH sides
      (container runtime AND host pytest harness) unless a side-specific
      ref below overrides it. When supplied, the action re-pins
      atlan-application-sdk in the caller's pyproject.toml to this ref
      before building the Docker image and again after setup-deps (which
      re-checks-out the workspace). Used by cross-repo dispatches from
      apps-sdk PRs so an SDK change is exercised end-to-end on both sides.
      Prefer `runtime-sdk-ref` / `harness-sdk-ref` when you need the two
      sides pinned independently; this stays as the shared fallback for
      back-compat.
    required: false
    default: ""
  runtime-sdk-ref:
    description: |
      Optional application-sdk ref for the CONNECTOR RUNTIME under test —
      i.e. the pre-build repin that the Docker image (and its manifest
      regeneration) is built from. Empty (default) falls back to
      `application-sdk-ref`, and if that is also empty the image is built
      from the connector's OWN pinned/locked SDK. Set this to pin the
      runtime independently of the harness (usually you leave it empty so
      the app is tested AS SHIPPED, on its own SDK).
    required: false
    default: ""
  harness-sdk-ref:
    description: |
      Optional application-sdk ref for the TEST HARNESS — i.e. the
      post-setup repin of the host pytest runtime that provides
      `application_sdk.testing.e2e` (the SDR e2e scaffolding). Empty
      (default) falls back to `application-sdk-ref`, and if that is also
      empty the harness comes from the connector's own pinned SDK. Set
      this (e.g. to the consolidated e2e harness branch/tag) to run the
      LATEST test logic against the connector's own runtime WITHOUT
      bumping the connector's SDK — the harness drives the app over the
      wire (AE submit / Temporal poll / manifest fetch / Atlas), so it
      only needs the manifest/AE-payload/DAG wire contracts to be
      compatible, not an in-process SDK match.
    required: false
    default: ""
  base-image-ref:
    description: |
      Optional runtime base image to build the connector FROM, injected as
      the BASE_IMAGE build-arg. Set by apps-sdk cross-repo dispatch to a
      freshly-built PR base image so Dockerfile / base-image / daprd changes
      in the SDK PR are exercised through a real connector build + run.
      Empty (the default) leaves the connector Dockerfile's own default
      FROM untouched — the merge-queue / non-e2e path is unchanged.
    required: false
    default: ""
  config-dir:
    description: |
      Explicit SDR config dir (holds app.yaml + secrets/ + optional
      test-config.yaml.tmpl). Overrides the default auto-resolution, which
      prefers `.github/sdr-e2e` over `.github/e2e`. A repo that has BOTH an
      SDR (testcontainer) setup under `.github/sdr-e2e/` AND a full-DAG setup
      under `.github/e2e/` MUST set this from the full-DAG caller (to
      `.github/e2e`), else the full-DAG run mis-resolves to the SDR dir and
      the full-DAG secrets/app.yaml don't match. Empty = auto-resolve.
    required: false
    default: ""
  components-dir:
    description: |
      App-level directory holding additional Dapr component YAMLs to
      stack on top of the SDK defaults. Defaults to `$SDR_CONFIG_DIR/components`
      so single-pipeline apps need no override. Multi-pipeline apps
      (e.g. mysql-app's separate SDR + full-DAG stacks living in one
      .github/e2e/ dir) override this from their caller workflow to
      point at the per-pipeline overrides directory (e.g.
      `.github/e2e/e2e-full-components`).
    required: false
    default: ""
  compose-overlay:
    description: |
      App-level docker-compose overlay to stack on top of the
      configurator output + SDK CI defaults. Defaults to
      `$SDR_CONFIG_DIR/docker-compose.ci.yml`. Override from a caller
      workflow when the pipeline needs a different compose layer
      (e.g. mysql-app's `.github/e2e/e2e-full-docker-compose.yaml`
      which propagates AWS_* env vars to the worker and sets a unique
      agent-name so the worker registers on its own Temporal queue).
    required: false
    default: ""
  git-token:
    description: |
      Optional GitHub token forwarded to the docker buildx build as the
      `git_token` build secret. Connectors whose pyproject.toml declares
      git+ssh / git+https dependencies on other private atlanhq repos
      (e.g. `query-redaction` from `atlan-query-intelligence-app`) need
      this so `uv sync` inside the Docker build can authenticate the
      clone. The caller workflow passes the org-scoped PAT from its own
      secrets context (typically `secrets.ORG_PAT_GITHUB`).

      When empty (the default), no `--secret` flag is appended to the
      docker buildx invocation — connectors with PyPI-only dependencies
      stay unaffected.

      Consumed by the Dockerfile as:
          RUN --mount=type=secret,id=git_token,uid=1000 \
              git config --global url."https://x-access-token:$(cat /run/secrets/git_token)@github.com/".insteadOf "ssh://git@github.com/" \
              && uv sync --locked --no-install-project
    required: false
    default: ""
  enable-two-store:
    description: |
      Opt-in ADR-0014 two-store SDR posture (docs/adr/0014-two-store-
      storage-architecture.md). When "true": the connector's `objectstore`
      component is forced to the SDK default (an app-level
      `objectstore.yaml` override is ignored) so it stays physically
      distinct from the configurator-emitted `atlan-objectstore`; the
      composite hard-fails if `atlan-objectstore.yaml` isn't present; and
      ENABLE_ATLAN_UPLOAD=true / ATLAN_DEPLOYMENT_ARTIFACT_DUAL_WRITE=required
      are set on the worker via docker-compose.two-store.yml. Set by
      e2e-full-reusable.yaml's `two-store` input; the pure-SDR pipeline
      never sets this.
    required: false
    default: "false"
  source-available:
    description: |
      Whether an extraction source is provisioned for this connector in CI.
      Sourcing is the app owner's responsibility. When "true" (default) the
      full-DAG e2e runs unchanged (extract -> publish -> assert assets in
      Atlas). When "false" the run degrades to a worker-up-only check — the
      harness asserts only that the app worker deploys and serves
      /server/health, and skips extraction/publish/Atlas assertions (read by
      BaseE2ETest.setup_method via the E2E_SOURCE_AVAILABLE env var). Apps
      with no free container / no wired credentials set this false until they
      provision a source.
    required: false
    default: "true"
  full-dag:
    description: |
      Opt-in full-DAG queue-alignment overlay. When "true" the SDK-owned
      docker-compose.full-dag.yml is layered (below any app overlay, above the
      SDK CI defaults), pinning ATLAN_DEPLOYMENT_NAME=e2e-full-ci-${GITHUB_RUN_ID}
      so the CI worker registers on the same per-run Temporal queue the full-DAG
      harness's extract node dispatches to (+ a longer Dapr sidecar wait). Set by
      full-DAG e2e callers; replaces the byte-identical per-app compose overlay.
      Leave "false" (default) for the pure-SDR / worker-up pipelines.
    required: false
    default: "false"
  extra-env:
    description: |
      JSON object of extra environment variables to export before the secrets
      bundle is generated and pytest runs. This is how a caller that cannot set
      job-level `env:` — notably tests-reusable.yaml, where the job is owned by
      the SDK and the connector's SOURCE credential names are unknowable — gets
      them to the secrets-script and the test class.

      Values must be JSON-encoded by the caller (`toJSON(secrets.NAME)`): a
      key-pair PEM or service-account JSON is multi-line, and $GITHUB_ENV needs
      the heredoc form for those. Empty (the default) is a no-op, so callers
      that already set job-level env are unaffected.
    required: false
    default: ""
  ghcr-token:
    description: |
      Optional token used to authenticate the GHCR login for the test-image
      build/push (and the compose worker's subsequent pull). The connector's
      `sdr-test-<sha>` image is pushed to `ghcr.io/atlanhq/<app-image-name>`,
      and some connector packages are PAT-published (created by
      build-and-publish via `ORG_PAT_GITHUB`) and are NOT writable by the
      default `GITHUB_TOKEN` — so a plain-token push 403s for those apps.
      Pass the org-scoped PAT here (typically `secrets.ORG_PAT_GITHUB`, the
      same one build-and-publish uses) to push with the package-owning
      identity, which works uniformly across every connector package.

      When empty (the default), the login falls back to `github.token`, so
      callers that don't wire this stay on the previous behaviour.
    required: false
    default: ""
  prebuilt-image:
    description: |
      Full image reference to use INSTEAD of building one here. When set, the
      build/push (and the interpreter assertion that goes with it) is skipped
      and this reference is used everywhere the built image would have been —
      the configurator's `app_image`, and the action's `image` output.

      Set by the full-DAG pipeline (FND-31): the image is built once per run,
      ahead of the e2e matrix, so `prepare-tenant` can install it onto the
      target tenant before any leg starts. Every cloud leg then reuses that
      exact reference instead of rebuilding the same deterministic
      `sdr-test-<short-sha>` tag N times.

      The caller is responsible for the reference being present in GHCR before
      it invokes this action; nothing here waits for a push.
    required: false
    default: ""
  expected-app-version:
    description: |
      GM version string the target tenant must be running for this leg to be
      meaningful. When set, the action asserts the tenant reports exactly this
      version immediately before pytest, and fails the leg naming both versions
      if it does not.

      Why a re-check when the caller already installed it: the installation is
      tenant-scoped (one per app per tenant) and GitHub has no cross-job lease, so
      a concurrent run — or a hand-deploy — can replace it between the install and
      the assertions. Since Heracles fetches the DAG from the tenant-deployed pod
      at AE submit, testing against a replaced version silently exercises somebody
      else's code. This turns that into a loud failure (FND-31).

      Empty (the default) skips the check entirely, so the repos that call this
      action directly without an install step are completely unaffected.

      Requires the leg's tenant env (ATLAN_BASE_URL + the OAuth pair) to already
      be resolved, which the reusable workflows do before invoking this action.
    required: false
    default: ""
  expected-python-version:
    description: |
      The Python major.minor the built worker image is expected to ship — the
      connector Dockerfile's golden base tag. The action pins the host pytest
      harness to this version AND asserts the built image's interpreter matches
      it, so the connector is exercised on exactly the Python it runs in the
      container. This closes the CNCT-85 gap: a concurrent-decode segfault that
      reproduces only on the container's Python (3.13) would be missed by a
      harness left on the setup-deps default (3.11). Override only if a
      connector's runtime base is not on the SDK default.
    required: false
    default: "3.13"
outputs:
  test-outcome:
    description: pytest exit outcome (success/failure)
    value: ${{ steps.tests.outcome }}
  test-summary:
    description: One-line pytest summary (e.g. "9 passed, 1 failed in 38s")
    value: ${{ steps.tests.outputs.summary }}
  image:
    description: |
      The full image reference used for this run — the one built here, or
      `prebuilt-image` when the caller supplied it.
    value: ${{ steps.image.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # Prefer the caller-supplied org PAT (writes PAT-published connector
        # packages); fall back to github.token when unset (unchanged behaviour
        # for callers that don't pass ghcr-token).
        password: ${{ inputs.ghcr-token != '' && inputs.ghcr-token || github.token }}

    # Stash the entire action directory to /tmp before setup-deps'
    # actions/checkout wipes the workspace. When this action is invoked
    # as a LOCAL action (uses: ./.application-sdk/.github/actions/sdr-e2e),
    # ${{ github.action_path }} sits inside the workspace and is wiped
    # along with everything else. Post-setup steps that reference the
    # repin script, test-config template, Dapr component overlays, or
    # the compose overlay must fall back to /tmp/sdr-e2e/ — those
    # references are guarded by env vars (SDR_E2E_ROOT_*) resolved
    # immediately after setup-deps.
    - name: Stash action assets
      shell: bash
      run: |
        rm -rf /tmp/sdr-e2e
        cp -R "${{ github.action_path }}" /tmp/sdr-e2e
        chmod +x /tmp/sdr-e2e/repin-application-sdk.sh || true

    # Resolve the effective SDK ref for each side ONCE, so the
    # (runtime||shared) / (harness||shared) fallback isn't repeated as a GHA
    # `(a && a || b)` ternary at every call site. Plain `${VAR:-$SHARED}`
    # parameter expansion (straight-line, no branching — ci.md-compliant); an
    # empty output means "no repin" — the harness side skips via `if:` below,
    # and the runtime side is handed to build-app-image, which skips its own
    # repin on empty. The precedence lives here rather than in build-app-image
    # because the harness side needs it too, and two owners would be two places
    # for the sides to disagree.
    - name: Resolve effective application-sdk refs
      id: sdk_refs
      shell: bash
      env:
        RUNTIME_SDK_REF: ${{ inputs.runtime-sdk-ref }}
        HARNESS_SDK_REF: ${{ inputs.harness-sdk-ref }}
        SHARED_SDK_REF: ${{ inputs.application-sdk-ref }}
      run: |
        {
          echo "runtime_ref=${RUNTIME_SDK_REF:-$SHARED_SDK_REF}"
          echo "harness_ref=${HARNESS_SDK_REF:-$SHARED_SDK_REF}"
        } >> "$GITHUB_OUTPUT"

    # Build the image (repin -> regenerate manifest -> buildx -> push ->
    # interpreter assert). Lives in its own composite so the full-DAG pipeline
    # can build ONCE per run, ahead of the e2e matrix, and install that image
    # onto the target tenant before any leg starts (FND-31). Skipped entirely
    # when the caller passes `prebuilt-image` — which is exactly what the
    # full-DAG legs do, so they reuse the reference rather than rebuilding the
    # same deterministic tag N times.
    #
    # Runs before setup-deps so the workspace is still pristine — no host
    # .venv yet, so the Dockerfile's COPY . . won't pull in a host-built
    # virtualenv whose Python symlinks point outside the image.
    #
    # Runtime side: runtime-sdk-ref wins, else the shared application-sdk-ref,
    # else empty = build from the connector's OWN pinned SDK.
    - name: Build and push PR image
      id: build
      if: inputs.prebuilt-image == ''
      uses: atlanhq/application-sdk/.github/actions/build-app-image@main
      with:
        app-name: ${{ inputs.app-name }}
        app-image-name: ${{ inputs.app-image-name }}
        application-sdk-ref: ${{ steps.sdk_refs.outputs.runtime_ref }}
        base-image-ref: ${{ inputs.base-image-ref }}
        git-token: ${{ inputs.git-token }}
        ghcr-token: ${{ inputs.ghcr-token }}
        expected-python-version: ${{ inputs.expected-python-version }}

    # One writer of the image reference, so no downstream step has to know
    # whether it was built here or handed in. `${VAR:-$OTHER}` rather than a
    # GHA ternary: straight-line parameter expansion, ci.md-compliant, and it
    # reads the same on both paths.
    #
    # A skipped step's outputs are empty, so when `prebuilt-image` is set the
    # build output is empty and the prebuilt reference wins; when it isn't, the
    # build output is the only non-empty value. Both empty is a bug, not a
    # degraded mode — fail rather than let the configurator template an empty
    # app_image and surface as an opaque compose pull error.
    - name: Resolve effective image reference
      id: image
      shell: bash
      env:
        PREBUILT: ${{ inputs.prebuilt-image }}
        BUILT: ${{ steps.build.outputs.image }}
      run: |
        REF="${PREBUILT:-$BUILT}"
        test -n "$REF" || {
          echo "::error::No image reference resolved: prebuilt-image is empty and the build produced no image. If the build step was skipped, pass prebuilt-image; if it ran, check its logs."
          exit 1
        }
        echo "Using image: $REF"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"

    # Must run before atlan-configurator generates ci-deploy/ — setup-deps
    # uses actions/checkout internally which would wipe generated files.
    #
    # Pin the host pytest harness to the same Python the worker image ships
    # (expected-python-version) so the boundary the SDR test drives — agent
    # contracts, BaseSDRIntegrationTest — is import-compatible with the code
    # under test, and the whole E2E job runs one interpreter end to end.
    - name: Setup Python and dependencies
      uses: atlanhq/application-sdk/.github/actions/setup-deps@v3.32.1
      with:
        python-version: ${{ inputs.expected-python-version }}

    # setup-deps' actions/checkout wipes the pre-build re-pin above. Do
    # it again so the host pytest runtime resolves the dispatched SDK
    # (the BaseSDRIntegrationTest, agent contracts, etc.). Followed by
    # an explicit uv sync so the lockfile reflects the new pin.
    #
    # Important: when this action is invoked as a LOCAL action (uses:
    # ./.application-sdk/.github/actions/sdr-e2e), setup-deps' inner
    # actions/checkout wipes the entire workspace — including
    # ${{ github.action_path }}/repin-application-sdk.sh itself, so we
    # can't reference it again here. The "stash repin script" step
    # below copies the script to /tmp before setup-deps runs; this step
    # exec's from the stash.
    # Resolve the action-asset root after setup-deps. When invoked as a
    # local action the workspace (and ${{ github.action_path }}) has been
    # wiped — fall back to the /tmp stash that the "Stash action assets"
    # step populated before setup-deps ran. Exported as a step output so
    # downstream steps can reference it as ${{ steps.action_root.outputs.path }}.
    - name: Resolve action-asset root
      id: action_root
      shell: bash
      run: |
        if [ -d "${{ github.action_path }}" ] && [ -f "${{ github.action_path }}/test-config.yaml.tmpl" ]; then
          ROOT="${{ github.action_path }}"
        else
          ROOT="/tmp/sdr-e2e"
        fi
        echo "Using SDR action assets from: $ROOT"
        echo "path=$ROOT" >> "$GITHUB_OUTPUT"

    - name: Pin application-sdk to dispatched ref (post-setup)
      # Harness side (host pytest runtime that provides testing.e2e):
      # harness-sdk-ref wins, else the shared application-sdk-ref, else empty
      # = harness comes from the connector's OWN pinned SDK. Set harness-sdk-ref
      # (with runtime-sdk-ref left empty) to run the latest test harness against
      # the connector's own runtime without bumping its SDK.
      if: steps.sdk_refs.outputs.harness_ref != ''
      shell: bash
      env:
        SDK_REF: ${{ steps.sdk_refs.outputs.harness_ref }}
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
      run: |
        "$SDR_E2E_ROOT/repin-application-sdk.sh"
        uv lock
        uv sync --all-extras --all-groups

    - name: Download atlan-configurator
      shell: bash
      run: |
        "${{ github.action_path }}/../../scripts/with-retry.sh" \
          curl -fsSL -O https://atlan-public.s3.amazonaws.com/apps/docker-compose-configurator-amd64.tgz
        tar -xvf docker-compose-configurator-amd64.tgz
        mv docker-compose-generator/generate atlan-configurator
        chmod +x atlan-configurator

    # Locate the SDR-specific config directory and app.yaml. Adopter apps
    # historically used .github/e2e/ at the root alongside app.yaml; the new
    # convention is to namespace everything under .github/sdr-e2e/ (and move
    # app.yaml inside it) so connector repos don't get cluttered with
    # SDR-only files at the root. We accept both layouts so adopters can
    # migrate at their own pace.
    - name: Resolve SDR config paths
      shell: bash
      env:
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
        CONFIG_DIR_INPUT: ${{ inputs.config-dir }}
      run: |
        python3 "$SDR_E2E_ROOT/resolve_config_paths.py" \
          --config-dir "${CONFIG_DIR_INPUT}" >> "$GITHUB_ENV"

    # Give each matrix leg its own worker + Temporal queue. The queue is
    # atlan-{ATLAN_APPLICATION_NAME}-{ATLAN_DEPLOYMENT_NAME}; parallel legs
    # share the run id, so without a per-leg suffix their workers co-serve one
    # queue and Temporal splits a single workflow's activities across them —
    # which, under the two-store posture (per-container localstorage), makes a
    # FileReference written by one leg's worker invisible to the other. Derive a
    # per-leg ATLAN_DEPLOYMENT_NAME (base + sanitised artifact-suffix) here, so
    # both the worker (compose reads it below) and the harness (agent_spec reads
    # the same env) land on the same isolated queue. Empty suffix (single-suite
    # callers) keeps the original e2e-full-ci-<run_id> shape.
    - name: Derive per-leg deployment name
      shell: bash
      env:
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
        ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
      run: |
        python3 "$SDR_E2E_ROOT/derive_deployment_name.py" \
          --run-id "${GITHUB_RUN_ID}" \
          --suffix "${ARTIFACT_SUFFIX}" >> "$GITHUB_ENV"

    - name: Resolve app.yaml
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_IMAGE: ${{ steps.image.outputs.ref }}
      run: envsubst < "$APP_YAML_PATH" > app-resolved.yaml

    # Use the app's test-config template if it overrides the SDK default.
    - name: Resolve test-config.yaml
      shell: bash
      env:
        CI_RUN_SUFFIX: ${{ github.run_id }}
        SDK_TMPL: ${{ steps.action_root.outputs.path }}/test-config.yaml.tmpl
      run: |
        if [ -f "$SDR_CONFIG_DIR/test-config.yaml.tmpl" ]; then
          echo "Using app-level test-config.yaml.tmpl override"
          envsubst < "$SDR_CONFIG_DIR/test-config.yaml.tmpl" > test-config.yaml
        else
          echo "Using SDK default test-config.yaml.tmpl"
          envsubst < "${SDK_TMPL}" > test-config.yaml
        fi

    - name: Generate SDR deployment files
      shell: bash
      run: |
        ./atlan-configurator \
          --app app-resolved.yaml \
          --config test-config.yaml \
          --output ./ci-deploy \
          --overwrite

    # Caller-supplied connector SOURCE credentials, exported before the secrets
    # bundle is written (the script below reads them) and therefore visible to
    # every later step, pytest included. Straight-line call into a tested script
    # per docs/standards/ci.md; the heredoc form it emits is what makes
    # multi-line values (PEM, service-account JSON) survive $GITHUB_ENV.
    #
    # `--mask-only` first, then the env write — the ordering is the security
    # property, not a style choice. `extra-env` arrives as one registered secret,
    # and the runner's log masker matches registered strings rather than
    # substrings of one, so each value pulled out of the blob is unredacted until
    # `::add-mask::` registers it. That command is read from the step's stdout,
    # which the second invocation redirects into $GITHUB_ENV — hence two passes,
    # masks to the log first. Once the values are in $GITHUB_ENV, the next step
    # to render its `env:` group has already leaked them.
    #
    # No live caller yet: tests-reusable.yaml exports the same payload inline
    # because it pins this action @main, so `extra-env` is invisible to it until
    # this merges. The relative script path below is asserted by
    # test_composite_action_invokes_this_script_at_a_real_path; collapsing the
    # duplication is tracked in that test's TODO(follow-up).
    - name: Export caller-supplied env
      if: inputs.extra-env != ''
      shell: bash
      env:
        EXTRA_ENV: ${{ inputs.extra-env }}
      run: |
        python3 "${{ github.action_path }}/../../scripts/export_extra_env.py" \
          --json "$EXTRA_ENV" --mask-only
        python3 "${{ github.action_path }}/../../scripts/export_extra_env.py" \
          --json "$EXTRA_ENV" >> "$GITHUB_ENV"

    - name: Generate secrets bundle
      shell: bash
      run: |
        mkdir -p "$SDR_CONFIG_DIR/secrets"
        SCRIPT="${{ inputs.secrets-script }}"
        if [ ! -f "${SCRIPT}" ]; then
          echo "::error::secrets-script not found at ${SCRIPT}. Provide one that writes ${SDR_CONFIG_DIR}/secrets/credentials.json from env vars."
          exit 1
        fi
        case "${SCRIPT}" in
          *.py) python3 "${SCRIPT}" ;;
          *)    bash "${SCRIPT}" ;;
        esac
        if [ ! -f "$SDR_CONFIG_DIR/secrets/credentials.json" ]; then
          echo "::error::secrets-script ran but did not produce ${SDR_CONFIG_DIR}/secrets/credentials.json"
          exit 1
        fi

    # SDK defaults first, app overrides on top so apps can replace any single
    # component file without forking the whole set. Two-store mode is the one
    # exception: see select_dapr_components.py docstring for why the app's
    # own objectstore.yaml override is skipped in that mode. Branching logic
    # lives in the tested script per docs/standards/ci.md; this step is
    # straight-line.
    - name: Select CI Dapr components
      shell: bash
      env:
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
        APP_COMPONENTS: ${{ inputs.components-dir }}
        TWO_STORE: ${{ inputs.enable-two-store }}
      run: |
        python3 "$SDR_E2E_ROOT/select_dapr_components.py" \
          --ci-components-dir ci-deploy/components \
          --sdk-components-dir "$SDR_E2E_ROOT/components" \
          --app-components-dir "${APP_COMPONENTS}" \
          --sdr-config-dir "$SDR_CONFIG_DIR" \
          --two-store "${TWO_STORE}"

    # Order: configurator-generated base → SDK CI overrides → optional app
    # layer → two-store overlay (only when enabled, always last — see
    # build_compose_chain.py). Branching logic lives in the tested script
    # per docs/standards/ci.md; this step is straight-line.
    - name: Build compose -f chain
      id: compose_files
      shell: bash
      env:
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
        APP_COMPOSE: ${{ inputs.compose-overlay }}
        TWO_STORE: ${{ inputs.enable-two-store }}
        FULL_DAG: ${{ inputs.full-dag }}
      run: |
        OUT=$(python3 "$SDR_E2E_ROOT/build_compose_chain.py" \
          --base-compose ci-deploy/docker-compose.yaml \
          --sdk-compose "$SDR_E2E_ROOT/docker-compose.ci.yml" \
          --app-compose "${APP_COMPOSE}" \
          --sdr-config-dir "$SDR_CONFIG_DIR" \
          --two-store "${TWO_STORE}" \
          --two-store-compose "$SDR_E2E_ROOT/docker-compose.two-store.yml" \
          --full-dag "${FULL_DAG}" \
          --full-dag-compose "$SDR_E2E_ROOT/docker-compose.full-dag.yml")
        echo "$OUT" >> "$GITHUB_OUTPUT"

    # GH-runner docker bridges have no global IPv6 routing, but
    # temporalio's bundled Rust gRPC resolver returns AAAA records and
    # tries them first. With temporalio 1.27.x, the IPv6 → IPv4 fallback
    # doesn't fit inside the container-health timeout and the worker
    # never finishes connecting. Resolve the Temporal + auth hostnames
    # to IPv4 on the runner (which has working IPv4) and inject them
    # into /etc/hosts via compose extra_hosts so the resolver only ever
    # sees A records.
    #
    # Hostnames are derived from SDR_TEST_TENANT
    # (convention: <tenant>.atlan.com → <tenant>-temporal.atlan.com).
    - name: Resolve Temporal + auth hostnames to IPv4
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${SDR_TEST_TENANT:-}" ]; then
          echo "::error::SDR_TEST_TENANT is not set; the caller workflow must export it as a job-level env var."
          exit 1
        fi
        AUTH_HOST="$SDR_TEST_TENANT"
        TEMPORAL_HOST="${SDR_TEST_TENANT%.atlan.com}-temporal.atlan.com"
        AUTH_IPV4=$(dig +short A "$AUTH_HOST" | head -1)
        TEMPORAL_IPV4=$(dig +short A "$TEMPORAL_HOST" | head -1)
        if [ -z "$AUTH_IPV4" ] || [ -z "$TEMPORAL_IPV4" ]; then
          echo "::error::Failed to resolve TEMPORAL_HOST=$TEMPORAL_HOST or AUTH_HOST=$AUTH_HOST"
          exit 1
        fi
        echo "Resolved $AUTH_HOST -> $AUTH_IPV4"
        echo "Resolved $TEMPORAL_HOST -> $TEMPORAL_IPV4"
        # Export for compose extra_hosts substitution.
        {
          echo "AUTH_HOST=$AUTH_HOST"
          echo "AUTH_IPV4=$AUTH_IPV4"
          echo "TEMPORAL_HOST=$TEMPORAL_HOST"
          echo "TEMPORAL_IPV4=$TEMPORAL_IPV4"
        } >> "$GITHUB_ENV"

    - name: Start SDR container
      shell: bash
      run: docker compose ${{ steps.compose_files.outputs.files }} up -d

    - name: Wait for app to be ready
      shell: bash
      run: |
        TIMEOUT="${{ inputs.container-health-timeout-seconds }}"
        echo "Waiting for SDR container on :8000/server/health (timeout=${TIMEOUT}s)..."
        for i in $(seq 1 "${TIMEOUT}"); do
          if curl -sf http://localhost:8000/server/health > /dev/null 2>&1; then
            echo "SDR container ready after ${i}s"
            break
          fi
          if [ "$i" -eq "${TIMEOUT}" ]; then
            echo "::error::SDR container failed to start within ${TIMEOUT}s"
            docker compose ${{ steps.compose_files.outputs.files }} logs
            exit 1
          fi
          sleep 1
        done

    # Last gate before the assertions: prove the tenant is still running the
    # version this leg is testing. Placed here rather than earlier on purpose —
    # the window that matters is the one immediately before the DAG is submitted,
    # since Heracles fetches the manifest from the tenant-deployed pod at submit
    # and that DAG is what executes. Checking any sooner leaves a gap a concurrent
    # run can slip through.
    #
    # Self-skips when `expected-app-version` is empty, which is every caller that
    # does not install to the tenant (FND-31).
    - name: Verify the tenant runs the version under test
      if: inputs.expected-app-version != ''
      shell: bash
      env:
        EXPECTED: ${{ inputs.expected-app-version }}
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
      run: |
        set -euo pipefail
        python3 "$SDR_E2E_ROOT/../../scripts/e2e_tenant_app.py" verify \
          --base-url "$ATLAN_BASE_URL" \
          --expected "$EXPECTED"

    # Does every entrypoint's workflow-setup page actually resolve? (FND-1667)
    #
    # The FND-1593 contract migration 404'd both of a connector's setup pages
    # while every local and CI check stayed green: the generated artifacts were
    # self-consistent, conformance was clean, and the freshness gate passed. The
    # break lived only in the join between what the contract generates and what
    # the tenant serves, and no gate looked there — a human opened the UI and
    # found it. Any contract change that moves a marketplace card's identity
    # does the same thing.
    #
    # WHY HERE, and not in `prepare-tenant`. Three constraints intersect at
    # exactly this step, and only here:
    #
    #   * the app must be INSTALLED, so it has to follow prepare-tenant. The
    #     `e2e` job that calls this action has prepare-tenant in its `needs:`,
    #     so everything in this composite is strictly after the install.
    #   * the SDK must be IMPORTABLE. The check reads the same three facts the
    #     configmap endpoint serves from (`application_sdk.app.generated_tree`),
    #     rather than re-deriving them into a second copy that could drift from
    #     the server. prepare-tenant runs a bare `python3` with no `uv sync`, so
    #     the SDK is not importable there; by this point in this action it is.
    #   * the tenant CREDENTIALS must be resolved, which the calling job has
    #     already exported into ATLAN_BASE_URL / ATLAN_API_KEY.
    #
    # Placed BEFORE the assertions rather than after, for the same reason as the
    # version verify above: an app whose setup page will not load is not
    # installed in any useful sense, so there is nothing to learn from running
    # the DAG against it.
    #
    # Same `expected-app-version` gate as the version verify, which is precisely
    # "this run installed the app under test". A caller that did not install is
    # pointed at whatever version the tenant already served, and the served-form
    # subset check would then report a stale image as a contract break.
    #
    # Everything reaches the shell through env:, nothing through `${{ }}` inside
    # run:, per docs/standards/ci.md.
    - name: Verify workflow-setup routes resolve
      if: inputs.expected-app-version != ''
      shell: bash
      env:
        SDR_E2E_ROOT: ${{ steps.action_root.outputs.path }}
      run: |
        set -euo pipefail
        uv run python "$SDR_E2E_ROOT/verify_setup_routes.py" \
          --base-url "$ATLAN_BASE_URL"

    - name: Run SDR integration tests
      id: tests
      shell: bash
      env:
        ATLAN_APPLICATION_NAME: ${{ inputs.app-name }}
        # Read by BaseE2ETest.setup_method() to warn if two-store is on
        # but the test class runs in RunMode.DIRECT, where it has no effect.
        TWO_STORE: ${{ inputs.enable-two-store }}
        # Read by BaseE2ETest.setup_method(): "false" degrades the full-DAG
        # e2e to a worker-up-only check when no source is provisioned.
        E2E_SOURCE_AVAILABLE: ${{ inputs.source-available }}
        # The host pytest harness is a test CLIENT: no daprd, and no components
        # directory. `ObservabilityBase._components_dir()` resolves to
        # `DAPR_COMPONENTS_PATH` or `./components`, and neither exists here --
        # the CI components this action selects land in `ci-deploy/components`,
        # which is mounted into the worker container, not the runner. So every
        # observability flush resolved the `objectstore` binding, raised
        # StorageBindingNotFoundError, and logged a full traceback at WARNING.
        # Non-fatal by design, but pure noise: the harness has no deployment
        # store to ship its own telemetry to, and pointing it at the CI
        # component would not help either (bindings.localstorage, rootPath
        # /tmp/atlan-data -- a path inside the container).
        #
        # Only connectors that set pytest's `log_cli` ever SAW it, because the
        # SDK emits this one through stdlib `logging`, not loguru. The failing
        # lookup happened on every connector regardless.
        ATLAN_ENABLE_OBSERVABILITY_STORE_SINK: "false"
      run: |
        mkdir -p results
        set +e
        uv run pytest "${{ inputs.test-path }}" -v \
          --tb=short \
          --junit-xml=results/sdr-test-results.xml \
          ${{ inputs.pytest-extra-args }} \
          2>&1 | tee results/sdr-test-output.txt
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        set -e

        SUMMARY=$(grep -E "^(FAILED|ERROR|=)" results/sdr-test-output.txt | tail -1)
        echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
        echo "exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"
        exit "${TEST_EXIT_CODE}"

    - name: Extract Temporal workflow links
      id: wf_links
      if: always()
      shell: bash
      run: |
        uv run python3 - <<'PYEOF'
        import json, os, secrets, xml.etree.ElementTree as ET
        from pathlib import Path

        # Map scenario name → pytest test class. Only used to group links by
        # suite for multi-class apps (e.g. saperp's ECC + S4); single-class
        # apps fall through to a flat list.
        class_by_scenario: dict[str, str] = {}
        try:
            tree = ET.parse("results/sdr-test-results.xml")
            for tc in tree.getroot().iter("testcase"):
                classname = (tc.get("classname") or "").rsplit(".", 1)[-1]
                scenario = (tc.get("name") or "").removeprefix("test_")
                if classname and scenario:
                    class_by_scenario[scenario] = classname
        except Exception:
            pass  # JUnit XML missing → fall through to ungrouped list

        ICONS = {"passed": "✅", "failed": "❌", "skipped": "⏭"}

        # Multi-class apps land per-class summaries via the SDR base class;
        # single-class apps still write only the shared file. Read all that
        # exist so neither case loses data.
        per_class = sorted(Path(".").glob("integration-test-summary-*.json"))
        if per_class:
            summary_files = per_class
        elif Path("integration-test-summary.json").exists():
            summary_files = [Path("integration-test-summary.json")]
        else:
            summary_files = []

        tenant = os.environ.get("SDR_TEST_TENANT", "")
        # Preserve scenario insertion order (== test execution order) within
        # each class so the output is deterministic.
        by_class: dict[str, list[str]] = {}
        for summary_file in summary_files:
            if not tenant:
                break
            data = json.loads(summary_file.read_text())
            for s in data.get("scenarios", []):
                if s.get("api") != "workflow":
                    continue
                assertions = s.get("assertions") or {}
                wf  = assertions.get("data.workflow_id", {}).get("actual", "")
                run = assertions.get("data.run_id",      {}).get("actual", "")
                # No workflow_id means /workflow/start failed before
                # returning IDs — there's nothing to link to.
                if not (wf and run):
                    continue
                url = (
                    f"https://{tenant}/api/temporal/namespaces/default"
                    f"/workflows/{wf}/{run}/history"
                )
                icon = ICONS.get(s.get("status", ""), "❓")
                cls = class_by_scenario.get(s["name"], "")
                by_class.setdefault(cls, []).append(
                    f"{icon} [{s['name']}]({url})"
                )

        # Single suite OR no class info → flat list separated by ` · `.
        # Multiple suites → bulleted list grouped by class on its own line.
        if not by_class:
            out = ""
        elif len(by_class) == 1:
            out = " · ".join(next(iter(by_class.values())))
        else:
            lines = [""]
            for cls, items in by_class.items():
                label = f"**{cls}:**" if cls else "**(unknown suite):**"
                lines.append(f"  - {label} {' · '.join(items)}")
            out = "\n".join(lines)

        # Multi-line outputs need the heredoc syntax.
        delim = "EOF_LINKS_" + secrets.token_hex(8)
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"links<<{delim}\n{out}\n{delim}\n")
        print(f"Temporal links:\n{out or '(none)'}")
        PYEOF

    - name: Write GitHub Step Summary
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.tests.outcome }}
        APP_NAME: ${{ inputs.app-name }}
        REPORT_TITLE_OVERRIDE: ${{ inputs.report-title }}
        TEST_PATH: ${{ inputs.test-path }}
      run: |
        uv run python3 - <<'PYEOF'
        import os, re, xml.etree.ElementTree as ET
        from pathlib import Path

        outcome  = os.environ.get("OUTCOME", "unknown")
        app_name = os.environ.get("APP_NAME", "app")
        icon     = "✅" if outcome == "success" else "❌"

        # Title is either explicit (via `report-title` input) or derived
        # from the pytest target path. Keeps the report self-labelling
        # when the action is reused across different suites in the same
        # repo (e.g. tier-3 sdr-integration-tests vs e2e-full).
        def _title_from_test_path(path: str) -> str:
            specials = {
                "sdr": "SDR Integration Tests (testcontainer)",
                "full_dag": "E2E Full Tests (system apps)",
            }
            seg = path.strip("/").split("/")[-1] if path else ""
            if seg in specials:
                return specials[seg]
            if not seg:
                return "Tests"
            return seg.replace("-", " ").replace("_", " ").title() + " Tests"

        report_title = os.environ.get("REPORT_TITLE_OVERRIDE") or (
            _title_from_test_path(os.environ.get("TEST_PATH", ""))
        )

        totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
        scenarios: list[tuple[str, str, str, float, str]] = []

        try:
            tree = ET.parse("results/sdr-test-results.xml")
            for suite in tree.getroot().iter("testsuite"):
                totals["tests"]    += int(suite.get("tests",    0))
                totals["failures"] += int(suite.get("failures", 0))
                totals["errors"]   += int(suite.get("errors",   0))
                totals["skipped"]  += int(suite.get("skipped",  0))
                totals["time"]     += float(suite.get("time",   0))
            for tc in tree.getroot().iter("testcase"):
                raw_name = tc.get("name", "")
                t        = float(tc.get("time", 0))
                short    = raw_name.removeprefix("test_")
                group    = short.split("_")[0]
                if tc.find("skipped") is not None:
                    status = "⏭"
                    msg = (tc.find("skipped").get("message") or "")[:80]
                elif tc.find("failure") is not None:
                    status = "❌"
                    msg = (tc.find("failure").get("message") or "")[:80]
                elif tc.find("error") is not None:
                    status = "💥"
                    msg = (tc.find("error").get("message") or "")[:80]
                else:
                    status = "✅"
                    msg = ""
                scenarios.append((group, short, status, t, msg))
        except Exception:
            pass

        passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]

        raw_summary = ""
        try:
            with open("results/sdr-test-output.txt") as f:
                for line in f:
                    if re.match(r"^=+", line) and ("passed" in line or "failed" in line or "error" in line):
                        raw_summary = line.strip()
        except Exception:
            pass

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
        with open(summary_path, "w") as f:
            f.write(f"## {icon} {report_title} — {app_name}\n\n")

            if totals["tests"]:
                f.write("### Test results\n\n")
                f.write("| Result | Count |\n|--------|-------|\n")
                f.write(f"| ✅ Passed  | {passed} |\n")
                f.write(f"| ❌ Failed  | {totals['failures'] + totals['errors']} |\n")
                f.write(f"| ⏭ Skipped | {totals['skipped']} |\n")
                f.write(f"| ⏱ Total time | {totals['time']:.1f}s |\n\n")

            if raw_summary:
                f.write(f"```\n{raw_summary}\n```\n\n")

            if scenarios:
                from itertools import groupby
                f.write("### Scenario details\n\n")
                for group, group_scenarios in groupby(scenarios, key=lambda s: s[0]):
                    rows = list(group_scenarios)
                    f.write(f"<details>\n<summary><b>{group.capitalize()}</b> "
                            f"({sum(1 for r in rows if r[2]=='✅')} passed, "
                            f"{sum(1 for r in rows if r[2] in ('❌','💥'))} failed, "
                            f"{sum(1 for r in rows if r[2]=='⏭')} skipped)</summary>\n\n")
                    f.write("| Status | Scenario | Time |\n|--------|----------|------|\n")
                    for _, short, status, t, msg in rows:
                        time_str = f"{t:.1f}s" if t >= 0.1 else "<0.1s"
                        note = f" — _{msg}_" if msg else ""
                        f.write(f"| {status} | `{short}`{note} | {time_str} |\n")
                    f.write("\n</details>\n\n")
        PYEOF

    - name: Dump SDR container logs
      if: always()
      shell: bash
      run: |
        mkdir -p results
        docker compose ${{ steps.compose_files.outputs.files }} logs 2>&1 | tee results/sdr-container.log || true

    - name: Tear down SDR container
      if: always()
      shell: bash
      run: docker compose ${{ steps.compose_files.outputs.files }} down -v

    # Scrape the connector container log for per-workflow extract /
    # transform counts. The SDK's SqlApp logs lines like
    #
    #     correlation_id=<uuid> ... - Extracted <entity>: N raw records
    #     correlation_id=<uuid> ... - Transformed <entity>: N records
    #
    # one per entity per workflow scenario. We group by correlation_id so
    # multi-workflow scenarios show separately, and try to attach each
    # group to the workflow_id observed in the same correlation block —
    # which lets the PR comment link directly into the tenant Temporal UI.
    - name: Compute asset extraction summary
      id: asset_summary
      # Always runs (no pull_request gate): the workflow_dispatch path
      # used by apps-sdk cross-repo dispatch also needs the summary
      # markdown so the rendered pr-comment-body.md captures asset +
      # lineage tables for the SDK PR's sticky.
      if: always()
      shell: bash
      env:
        SDR_TEST_TENANT: ${{ env.SDR_TEST_TENANT }}
        TWO_STORE: ${{ inputs.enable-two-store }}
      run: |
        uv run python3 - <<'PYEOF'
        import os
        import re
        import secrets
        from collections import defaultdict
        from pathlib import Path

        log_path = Path("results/sdr-container.log")
        if not log_path.exists():
            print("No container log; skipping asset summary.")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("markdown=\n")
            raise SystemExit

        text = log_path.read_text(errors="replace")

        # correlation_id=<uuid>  ...  Extracted <entity>: N raw records
        extract_re = re.compile(
            r"correlation_id=(?P<cid>[0-9a-f-]+)[^\n]*?"
            r"Extracted (?P<entity>[A-Za-z0-9_-]+): (?P<n>\d+) raw records"
        )
        transform_re = re.compile(
            r"correlation_id=(?P<cid>[0-9a-f-]+)[^\n]*?"
            r"Transformed (?P<entity>[A-Za-z0-9_-]+): (?P<n>\d+) records"
        )
        # Match workflow_id + run_id emitted under the same correlation
        # block — usually from the handler/service "Starting workflow"
        # log. The Atlan Temporal proxy at
        # /api/temporal/namespaces/default/workflows/<wf>/<run>/history
        # rejects requests missing the run_id (just /workflows/<wf>/history
        # 404s), so we capture both and only link when we have the pair.
        wf_re = re.compile(
            r"correlation_id=(?P<cid>[0-9a-f-]+)[^\n]*?workflow_id=(?P<wf>[\w-]+)"
        )
        run_re = re.compile(
            r"correlation_id=(?P<cid>[0-9a-f-]+)[^\n]*?run_id=(?P<run>[\w-]+)"
        )

        cids: list[str] = []  # insertion-ordered for deterministic table order
        extracted: dict[str, dict[str, int]] = defaultdict(dict)
        transformed: dict[str, dict[str, int]] = defaultdict(dict)
        wf_id_by_cid: dict[str, str] = {}
        run_id_by_cid: dict[str, str] = {}

        def _seen(cid: str) -> None:
            if cid not in cids:
                cids.append(cid)

        for m in extract_re.finditer(text):
            cid = m.group("cid")
            _seen(cid)
            extracted[cid][m.group("entity")] = int(m.group("n"))
        for m in transform_re.finditer(text):
            cid = m.group("cid")
            _seen(cid)
            transformed[cid][m.group("entity")] = int(m.group("n"))
        for m in wf_re.finditer(text):
            cid = m.group("cid")
            wf_id_by_cid.setdefault(cid, m.group("wf"))
        for m in run_re.finditer(text):
            cid = m.group("cid")
            run_id_by_cid.setdefault(cid, m.group("run"))

        # Drop correlation groups that produced no asset rows (handler-level
        # auth / preflight scenarios run through the same scenario runner
        # but never emit extract/transform lines).
        cids = [c for c in cids if extracted.get(c) or transformed.get(c)]

        if not cids:
            print("No extract/transform lines in container log.")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("markdown=\n")
            raise SystemExit

        tenant = os.environ.get("SDR_TEST_TENANT", "")
        lines: list[str] = ["### Extracted + transformed assets", ""]
        for idx, cid in enumerate(cids, start=1):
            wf = wf_id_by_cid.get(cid, "")
            run = run_id_by_cid.get(cid, "")
            header = f"**Workflow run {idx}**"
            if wf and run and tenant:
                wf_url = (
                    f"https://{tenant}/api/temporal/namespaces/default"
                    f"/workflows/{wf}/{run}/history"
                )
                header += f" — [{wf}]({wf_url})"
            elif wf:
                # Workflow id without a run id — show the id verbatim but
                # don't emit a clickable link; the proxy 404s on
                # /workflows/<wf>/history without the run id.
                header += f" — `{wf}`"
            lines.append(header)
            lines.append("")
            lines.append("| Entity | Extracted | Transformed |")
            lines.append("|--------|-----------|-------------|")
            entities = sorted(set(extracted[cid]) | set(transformed[cid]))
            for entity in entities:
                ext = extracted[cid].get(entity)
                tr = transformed[cid].get(entity)
                ext_s = "—" if ext is None else str(ext)
                tr_s = "—" if tr is None else str(tr)
                lines.append(f"| {entity} | {ext_s} | {tr_s} |")
            lines.append("")

        # Full-DAG runs append two Atlas-side sections mirroring the
        # Atlan workflow-center UI cards (Assets / Lineage coverage):
        #   "Atlas inventory under <qn>: {<typeName>: <count>, ...}"
        #   "Lineage inventory under <qn>: {<typeName>: <count>, ...} lineage_present=<bool>"
        # SDR runs never emit these lines, so the sections are added
        # only when matches are found — keeps the SDR comment unchanged.
        import ast

        def _safe_dict(literal: str) -> dict[str, int]:
            try:
                value = ast.literal_eval(literal)
            except (ValueError, SyntaxError):
                return {}
            return value if isinstance(value, dict) else {}

        def _render_section(title: str, qn: str, counts: dict[str, int]) -> list[str]:
            total = sum(counts.values())
            section = [f"### {title}", "", f"**Connection:** `{qn}`", "", f"**Total:** {total}", ""]
            if counts:
                section.append("| Type | Count |")
                section.append("|------|-------|")
                for type_name in sorted(counts):
                    section.append(f"| {type_name} | {counts[type_name]} |")
                section.append("")
            return section

        test_log = Path("results/sdr-test-output.txt")
        if test_log.exists():
            test_text = test_log.read_text(errors="replace")
            assets_re = re.compile(
                r"Atlas inventory under (?P<qn>\S+):\s+(?P<counts>\{.*?\})"
            )
            lineage_re = re.compile(
                r"Lineage inventory under (?P<qn>\S+):\s+(?P<counts>\{.*?\})\s+lineage_present=(?P<lin>True|False)"
            )
            # Take the last match in case retries logged earlier ones.
            assets_match = next(iter(list(assets_re.finditer(test_text))[::-1]), None)
            lineage_match = next(iter(list(lineage_re.finditer(test_text))[::-1]), None)
            if assets_match:
                atlas_counts = _safe_dict(assets_match.group("counts"))
                lines.extend(_render_section(
                    "Assets in Atlas",
                    assets_match.group("qn"),
                    atlas_counts,
                ))
                # Two-store diagnostic (not a gate — the existing
                # expected_min_asset_counts / require_nonempty_assets
                # assertions already fail the run on this condition).
                # Extraction succeeding locally while nothing reaches
                # Atlas is exactly the ADR-0014 hand-off gap this posture
                # exists to catch: the interceptor wrote to `objectstore`
                # but the connector never bridged it to `atlan-objectstore`
                # via App.upload(), so publish/QI/lineage read an empty
                # upstream bucket.
                if os.environ.get("TWO_STORE") == "true":
                    total_transformed = sum(
                        n
                        for entity_counts in transformed.values()
                        for n in entity_counts.values()
                    )
                    if total_transformed > 0 and sum(atlas_counts.values()) == 0:
                        lines.append(
                            "> ⚠️ **Possible missing hand-off:** the connector "
                            f"transformed {total_transformed} record(s) locally "
                            "but 0 assets reached Atlas. Check for a missing "
                            "`App.upload()` bridging the transformed-data prefix "
                            "from the deployment `objectstore` to "
                            "`atlan-objectstore` (see ADR-0014)."
                        )
                        lines.append("")
            if lineage_match:
                lineage_counts = _safe_dict(lineage_match.group("counts"))
                lines.extend(_render_section(
                    "Lineage coverage",
                    lineage_match.group("qn"),
                    lineage_counts,
                ))
                if lineage_match.group("lin") == "False" and sum(lineage_counts.values()) == 0:
                    lines.append("> No lineage assets observed — waived when the seed dataset has no view-derived lineage.")
                    lines.append("")

        markdown = "\n".join(lines)
        delim = "EOF_ASSETS_" + secrets.token_hex(8)
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"markdown<<{delim}\n{markdown}\n{delim}\n")
        print(markdown)
        PYEOF

    # Delete any prior SDR comment (matched by sticky marker) and post a
    # fresh one. Using github-script + a sticky HTML-comment marker instead
    # of mshick/add-pr-comment's edit-in-place behaviour: re-runs land as
    # new comments at the bottom of the conversation rather than silently
    # mutating an old one, which makes "what's the latest run" obvious.
    - name: Render PR comment + post (when on a PR)
      # Suppressed when the caller aggregates its own summary (e.g. the e2e
      # matrix sets post-pr-comment=false so N legs don't post N comments).
      if: always() && inputs.post-pr-comment == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        APP_NAME: ${{ inputs.app-name }}
        OUTCOME: ${{ steps.tests.outcome }}
        SUMMARY: ${{ steps.tests.outputs.summary }}
        WF_LINKS: ${{ steps.wf_links.outputs.links }}
        ASSET_SUMMARY: ${{ steps.asset_summary.outputs.markdown }}
        REPORT_TITLE_OVERRIDE: ${{ inputs.report-title }}
        TEST_PATH: ${{ inputs.test-path }}
      with:
        github-token: ${{ github.token }}
        script: |
          const appName = process.env.APP_NAME;
          const outcome = process.env.OUTCOME;
          const summary = process.env.SUMMARY || 'No summary';
          const wfLinks = process.env.WF_LINKS || '';
          const assetSummary = process.env.ASSET_SUMMARY || '';

          // Derive a self-describing title from test-path unless the caller
          // overrode it explicitly. Mirrors the python helper in the
          // step-summary step so both report surfaces stay aligned.
          const titleFromTestPath = (path) => {
            const specials = {
              "sdr": "SDR Integration Tests (testcontainer)",
              "full_dag": "E2E Full Tests (system apps)",
            };
            const seg = (path || "").replace(/\/+$/, "").split("/").pop() || "";
            if (seg in specials) return specials[seg];
            if (!seg) return "Tests";
            return seg.replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase()) + " Tests";
          };
          const reportTitle = process.env.REPORT_TITLE_OVERRIDE
            || titleFromTestPath(process.env.TEST_PATH);
          // Sticky marker uses a slug of the title so different suites
          // running on the same PR keep their own comments instead of
          // overwriting each other.
          const stickySlug = reportTitle.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

          const sticky = `<!-- ${stickySlug}:${appName} -->`;
          const status = outcome === 'success' ? 'Passed ✅' : 'Failed ❌';
          const runLink = `[${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          const linksLine = wfLinks ? `\n**Temporal workflows:** ${wfLinks}\n` : '';
          // assetSummary is the multiline markdown table block produced by
          // the "Compute asset extraction summary" step. Empty string when
          // no workflow scenarios ran (auth/preflight only).
          const assetBlock = assetSummary ? `\n${assetSummary}\n` : '';

          // Validation bullets + stack/re-run footer are pipeline-specific.
          // The two legs differ by how much of the DAG runs, not by tier:
          // the first drives the connector's own handlers + workflow
          // against a testcontainer source; Full-DAG additionally drives
          // publish, query-intelligence, lineage-app and lineage-publish
          // system apps and asserts asset counts + lineage in Atlas. Both
          // reach the CI tenant's Temporal — neither is hermetic. Keep the
          // surface narrow per pipeline so reviewers don't get a
          // misleading "this also validates X" claim, and do not claim a
          // leg proves credential resolution: that is application-sdk's
          // tests/unit/credentials.
          const SDR_TITLE = "SDR Integration Tests (testcontainer)";
          const FULL_DAG_TITLE = "E2E Full Tests (system apps)";

          const validatesByPipeline = {
            [SDR_TITLE]: [
              `- **Agent credential routing** — workflow \`username\`/\`password\` come from the Dapr \`local.file\` secret store via \`extraction_method=agent\` + \`agent_json\` → \`AgentCredentialSpec\`, not inline. Routing only: resolution itself is proven in application-sdk's \`tests/unit/credentials/\`.`,
              `- **Auth** — valid credentials succeed; invalid credentials and unreachable host fail correctly`,
              `- **Preflight** — connectivity, schema/table checks; bad credentials fail correctly`,
              `- **Workflow** — full extraction run on the test instance, polled to \`COMPLETED\` on the tenant's Temporal cluster`,
            ],
            [FULL_DAG_TITLE]: [
              `- **Connector extract + transform** — workflow polled to \`COMPLETED\` on the tenant's Temporal cluster; asset JSON written to the tenant object store`,
              `- **System apps DAG** — \`publish\` → \`query-intelligence\` → \`lineage-app\` → \`lineage-publish\` all reach \`Succeeded\` on their respective task queues`,
              `- **Connection materialised in Atlas** — \`/api/meta/entity\` resolves the Connection QN that the workflow published`,
              `- **Asset counts in Atlas** — per-typeName descendant counts meet the connector's \`expected_min_asset_counts\` floor (Database, Schema, Table, View, Column, …)`,
              `- **Lineage in Atlas** — at least one \`Process\` / \`ColumnProcess\` asset under the Connection QN (waived when the seed dataset has no view definitions)`,
              `- **Agent + connection contract** — \`agent_spec\` / \`connection_spec\` accepted by AE workflow + version create endpoints; credentials resolved via \`AgentCredentialSpec\``,
            ],
          };
          const validates = validatesByPipeline[reportTitle] || validatesByPipeline[SDR_TITLE];

          const stackByPipeline = {
            [SDR_TITLE]: `> Stack: atlan-configurator generated compose, Dapr sidecar embedded, Temporal worker on CI tenant.`,
            [FULL_DAG_TITLE]: `> Stack: atlan-configurator generated compose, Dapr sidecar embedded, worker registered with the CI tenant's Temporal + the live publish/qi/lineage system apps.`,
          };
          const stackLine = stackByPipeline[reportTitle] || stackByPipeline[SDR_TITLE];

          const rerunHintByPipeline = {
            [SDR_TITLE]: `Push a new commit, or re-run from the Actions tab.`,
            [FULL_DAG_TITLE]: `Remove and re-add the \`e2e-full\` label, or re-run from the Actions tab.`,
          };
          const rerunHint = rerunHintByPipeline[reportTitle] || rerunHintByPipeline[SDR_TITLE];

          const body = [
            sticky,
            `## 🧪 ${reportTitle} — ${appName}`,
            ``,
            `**Status:** ${status}`,
            `**Summary:** \`${summary}\``,
            `**Run:** ${runLink}`,
            linksLine,
            assetBlock,
            `### What this validates`,
            ...validates,
            ``,
            stackLine,
            ``,
            `<details><summary>Re-run</summary>`,
            ``,
            rerunHint,
            `</details>`,
          ].join('\n');

          // Always serialise the rendered body to the results artifact
          // so the cross-repo dispatch caller (apps-sdk side) can post
          // an identical sticky on its own PR. The artifact upload step
          // further down packages results/ as-is.
          const fs = require('fs');
          fs.mkdirSync('results', { recursive: true });
          fs.writeFileSync('results/pr-comment-body.md', body);

          // Only post a comment when we're on a pull_request event with
          // a `context.issue.number` to target — workflow_dispatch runs
          // (used by the apps-sdk cross-repo path) skip the API call and
          // rely on the artifact above being consumed by the caller.
          if (context.eventName !== 'pull_request' || !context.issue.number) {
            core.info('Not a pull_request event with a PR number — skipping comment post; body persisted to results/pr-comment-body.md for the cross-repo caller to reuse.');
            return;
          }

          // Sticky update: find an existing comment carrying our marker
          // and patch its body in-place, otherwise create a fresh one.
          // Earlier iterations did delete+create, which re-pushed the
          // PR thread on every retry and pinged subscribers each time.
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(sticky));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
      continue-on-error: true

    # Artifact upload deliberately runs AFTER the comment-render step
    # so results/pr-comment-body.md (written by that step) ships with
    # the rest of the suite output. apps-sdk's e2e-apps composite
    # downloads this same artifact and posts the body verbatim on the
    # SDK PR (only the sticky marker line differs), so both PRs see
    # the same rendered report.
    # Retry once: `upload-artifact` treats the artifact service's finalize 403
    # as non-retryable and fails the step even though the bytes already landed,
    # which on a gating path ejects the merge-queue entry. Still fatal if both
    # attempts fail — a consumer in another repo depends on this artifact.
    - name: Upload test results
      id: upload-e2e-results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        # artifact-suffix keeps parallel matrix legs from colliding on this
        # name (upload-artifact rejects duplicate names within a run); empty
        # suffix preserves the historical single-artifact name.
        name: sdr-integration-tests-${{ inputs.app-name }}${{ inputs.artifact-suffix != '' && format('-{0}', inputs.artifact-suffix) || '' }}-results
        path: results/
        retention-days: 14

    - name: Upload test results (retry)
      if: steps.upload-e2e-results.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        # artifact-suffix keeps parallel matrix legs from colliding on this
        # name (upload-artifact rejects duplicate names within a run); empty
        # suffix preserves the historical single-artifact name.
        name: sdr-integration-tests-${{ inputs.app-name }}${{ inputs.artifact-suffix != '' && format('-{0}', inputs.artifact-suffix) || '' }}-results
        path: results/
        retention-days: 14
        overwrite: true

    # No explicit `createCommitStatus` step: the workflow job already
    # surfaces a check_run on the PR (e.g. `E2E Full Tests (system
    # apps)` or `SDR Integration Tests (testcontainer)`). Posting an
    # additional commit status duplicates that signal under a separate
    # `sdr-e2e-tests` row and, when two callers share this composite,
    # they overwrite each other on the same head SHA.

    # GH Actions re-reads ${{ github.action_path }}/action.yaml when
    # running each step's `post:` hook. When this composite is invoked
    # as a LOCAL action (`uses: ./.application-sdk/.github/actions/sdr-e2e`),
    # setup-deps' inner actions/checkout earlier in the run wiped that
    # path. Restore it from the /tmp/sdr-e2e stash so post-hooks find
    # the action manifest (otherwise the job fails after a green
    # test run with "Can't find 'action.yml' under ...").
    - name: Restore action assets for post-hooks
      if: always()
      shell: bash
      run: |
        if [ ! -f "${{ github.action_path }}/action.yaml" ] && [ -d /tmp/sdr-e2e ]; then
          mkdir -p "${{ github.action_path }}"
          cp -R /tmp/sdr-e2e/. "${{ github.action_path }}/"
        fi

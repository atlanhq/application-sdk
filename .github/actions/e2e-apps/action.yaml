name: End to End Tests for Atlan Apps

description: |
  Runs End-to-End (E2E) tests for Atlan Apps.

  This action executes a comprehensive suite of end-to-end tests for Atlan applications.
  It validates the functionality of apps by:
  - Triggering E2E integration tests in the target app repository
  - Monitoring the test execution status
  - Ensuring tests complete successfully within timeout limits
  - Verifying the app works correctly with the latest SDK changes

  The tests ensure that Atlan apps remain compatible with SDK updates and
  continue to function as expected in a production-like environment.

inputs:
  github-token:
    required: true
    description: The GitHub token to use for the action.
  repo-name:
    required: true
    description: The name of the app repository to test.
  target-branch:
    required: true
    description: The target branch to test.
  workflow:
    required: false
    default: tests.yaml
    description: |
      Filename of the workflow to dispatch in the target repo. Defaults
      to tests.yaml. Override only when a different workflow filename
      should be dispatched.
  workflow-inputs:
    required: false
    default: "{}"
    description: |
      JSON object of inputs to pass to the dispatched workflow. Used by the
      SDR path to forward application_sdk_ref so the connector can pin
      atlan-application-sdk to the apps-sdk PR's head SHA. Defaults to
      an empty object so codex-/return-dispatch always sees valid JSON.

      IMPORTANT — every caller must include a "distinct_id" key here, set to
      the dispatching SHA. codex-/return-dispatch v3 injected distinct_id into
      the dispatch payload itself; v4 dropped the input and injects nothing, so
      it is now the caller's job. This is not cosmetic: receivers key their
      concurrency group on it, and cross-repo dispatches all land on
      refs/heads/main, so an omitted distinct_id coarsens that group — overlapping
      dispatches cancel each other, the dispatched run returns "cancelled" and
      poll mode reds the job. That is exactly what broke when the v4 bump first
      landed (#2923, reverted in #2939). The "Require a distinct_id" step below
      fails the job rather than letting a caller rediscover this.

      The receiver's exact grouping expression is NOT restated here — it lives in
      another repo and moves independently, so a copy in this file goes stale
      silently (it already did once). docs/standards/connector-ci-e2e.md is the
      single source of truth for it; read that before changing either side.

      NOTE — do not write a literal GitHub expression (dollar-brace-brace) in
      this file's description text. Composite-action manifests template those
      strings at load time, where the inputs context does not exist, so the
      whole manifest fails with "Unrecognized named-value: 'inputs'" and every
      job that uses this action dies before its first step.
  wait-mode:
    required: false
    default: poll
    description: |
      'poll' (default, legacy): dispatch, then busy-poll the dispatched
      run's status via the REST API every 60s for up to 2h, all against
      the shared org PAT. 'callback': create an in_progress GitHub check
      run on this repo's own SHA (owned by the fleet App via
      checks-app-token, so the connector's callback can complete it),
      dispatch + do a short bounded locate of the resulting run (so the
      check has a real link to click, not just the connector's generic
      Actions tab), then exit — the connector's own workflow completes
      the check run directly when it finishes (see tests-reusable.yaml's
      report-to-sdk job), so there is no waiting for the actual test
      result on this side, only for the dispatch to become visible.
      Requires check-run-name + check-sha.
  checks-app-token:
    required: false
    default: ""
    description: |
      Required when wait-mode is 'callback'. A GitHub App installation token
      scoped to THIS repo with checks:write, used to create + update the check
      run. Must be the same App the connector's callback (tests-reusable.yaml
      report-to-sdk) uses to complete it — a check run can only be updated by
      the App that created it. Do NOT pass github.token here: github-actions
      would own the check, the fleet-App callback could not complete it, and it
      would be filed under an arbitrary github-actions check suite.
  check-run-name:
    required: false
    default: ""
    description: Required when wait-mode is 'callback'. Name of the check run to create, e.g. "Connector E2E run / atlan-mysql-app".
  check-sha:
    required: false
    default: ""
    description: Required when wait-mode is 'callback'. SHA on this repo to attach the check run to (the PR head or merge-queue SHA).

runs:
  using: "composite"
  steps:
    # Guards both modes, so it runs before the callback-mode checkout below and
    # uses the caller's working tree instead — a job cannot reference this local
    # composite action at all without having checked the repo out first.
    - name: Require a distinct_id in workflow-inputs
      shell: bash
      env:
        WORKFLOW_INPUTS: ${{ inputs.workflow-inputs }}
      run: |
        python3 .github/scripts/validate_dispatch_inputs.py \
          --workflow-inputs "$WORKFLOW_INPUTS"

    # Only callback mode needs its own checkout: it runs .github/scripts/*.py at
    # a pinned ref. Poll mode's remaining steps (codex-/return-dispatch, curl,
    # gh api, github-script) never touch local files, and the calling job has
    # already checked out the repo before invoking this local composite
    # action anyway — so this would be a pure no-op there.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.wait-mode == 'callback'
      with:
        ref: ${{ github.ref }}

    # ── callback mode: create the check, dispatch, exit — no polling ──────
    - name: Validate callback-mode inputs
      if: inputs.wait-mode == 'callback'
      shell: bash
      env:
        CHECK_RUN_NAME: ${{ inputs.check-run-name }}
        CHECK_SHA: ${{ inputs.check-sha }}
        CHECKS_APP_TOKEN: ${{ inputs.checks-app-token }}
      run: |
        if [ -z "$CHECK_RUN_NAME" ] || [ -z "$CHECK_SHA" ] || [ -z "$CHECKS_APP_TOKEN" ]; then
          echo "::error::wait-mode=callback requires check-run-name, check-sha, and checks-app-token"
          exit 1
        fi

    - name: Create pending check run
      id: create_check
      if: inputs.wait-mode == 'callback'
      shell: bash
      env:
        # Fleet App token (this repo), NOT github.token — the connector's
        # callback completes this check with the same App, and a check run can
        # only be updated by its creating App.
        GH_TOKEN: ${{ inputs.checks-app-token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.check-sha }}
        NAME: ${{ inputs.check-run-name }}
        REPO_NAME: ${{ inputs.repo-name }}
      run: |
        python3 .github/scripts/create_check_run.py \
          --repo "$REPO" \
          --sha "$SHA" \
          --name "$NAME" \
          --details-url "https://github.com/atlanhq/${REPO_NAME}/actions" \
          --summary "Dispatched to ${REPO_NAME}; awaiting results — this check completes when that run finishes."

    # Dispatches and returns the resulting run id/url so the check above can get
    # a real, clickable link instead of the connector's generic Actions tab.
    # Since v4 the run details come straight back from the dispatch response
    # (github.blog/changelog/2026-02-19-workflow-dispatch-api-now-returns-run-ids),
    # so this resolves in seconds — there is no locate, no polling, and no
    # workflow_timeout_seconds to tune past a backlogged runner queue.
    #
    # continue-on-error: unlike poll mode, a failed dispatch here must not fail
    # this job — the check-run already exists and the connector's own callback
    # will still complete it correctly regardless of whether we captured a
    # pretty link for it. Worst case the check keeps its generic fallback URL,
    # or (the dispatch call itself failed) the check surfaces that later via
    # the gate/watchdog timeout rather than an immediate job failure.
    - name: Dispatch connector workflow
      id: return_dispatch_callback
      if: inputs.wait-mode == 'callback'
      continue-on-error: true
      uses: codex-/return-dispatch@2e404d40b641ba1deb44be941660bb34828e4f6d # v4.0.0
      with:
        token: "${{ inputs.github-token }}"
        ref: ${{ inputs.target-branch }}
        repo: ${{ inputs.repo-name }}
        owner: "atlanhq"
        workflow: "${{ inputs.workflow }}"
        workflow_inputs: ${{ inputs.workflow-inputs }}

    - name: Update check run with dispatched run link
      if: always() && inputs.wait-mode == 'callback' && steps.return_dispatch_callback.outputs.run_url != ''
      continue-on-error: true
      shell: bash
      env:
        # Same fleet App token that created the check (see Create step).
        GH_TOKEN: ${{ inputs.checks-app-token }}
        REPO: ${{ github.repository }}
        CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
        RUN_URL: ${{ steps.return_dispatch_callback.outputs.run_url }}
      run: |
        python3 .github/scripts/update_check_run_details_url.py \
          --repo "$REPO" \
          --check-run-id "$CHECK_RUN_ID" \
          --details-url "$RUN_URL"

    # ── poll mode (legacy): dispatch, busy-poll, fetch artifact, comment ──
    - name: Trigger E2E Integrations Tests
      if: inputs.wait-mode != 'callback'
      uses: codex-/return-dispatch@2e404d40b641ba1deb44be941660bb34828e4f6d # v4.0.0
      id: return_dispatch
      with:
        token: "${{ inputs.github-token }}"
        ref: ${{ inputs.target-branch }}
        repo: ${{ inputs.repo-name }}
        owner: "atlanhq"
        workflow: "${{ inputs.workflow }}"
        # v4 returns run_id from the dispatch response itself, so the run is
        # identified immediately — no step-name trawl to wait out, which is why
        # the old workflow_timeout_seconds / workflow_job_steps_retry_seconds
        # tuning (600s, to see past the dispatched run's 1–3 min queue delay)
        # is gone. The busy-poll of run *status* below is unrelated and stays.
        workflow_inputs: ${{ inputs.workflow-inputs }}

    - name: Check the test logs using the below run URL
      if: inputs.wait-mode != 'callback'
      shell: bash
      run: |
        echo ${{steps.return_dispatch.outputs.run_id}}
        echo ${{steps.return_dispatch.outputs.run_url}}

    - name: Check Workflow Status
      if: inputs.wait-mode != 'callback'
      id: status
      shell: bash
      run: |
        repo_owner="atlanhq"
        repo_name="${{ inputs.repo-name }}"
        run_id="${{steps.return_dispatch.outputs.run_id}}"

        echo "Checking status of workflow run $run_id in $repo_name"

        status="in_progress"
        conclusion=""
        start_time=$(date +%s)
        # Match the dispatched workflow's own timeout-minutes ceiling.
        # mysql-app's e2e-full-reusable.yaml sets timeout-minutes: 120
        # (the full-DAG harness needs ~20-40 min wall-time; the SDR
        # testcontainer suite stays well under this). 600s was the
        # earlier value tuned only for SDR — full-DAG was timing out
        # the SDK-side poll loop while the dispatched run was still
        # legitimately running.
        timeout=7200
        # Heartbeat cadence: 60s matches the connector-side AE poll
        # cadence emitted by AEWorkflowClient.poll_native_status so
        # the SDK-side log doesn't out-spam the dispatched run's own
        # progress glyphs. Drop to 30s only when nearing the timeout.
        poll_interval=60
        glyph_for_status() {
          case "$1" in
            queued|waiting|pending) echo "🟡" ;;
            in_progress)            echo "🔄" ;;
            completed)              echo "✅" ;;
            *)                      echo "❔" ;;
          esac
        }
        while [[ "$status" == "in_progress" || "$status" == "queued" || "$status" == "pending" || "$status" == "waiting" ]]; do
          sleep $poll_interval
          response=$(curl -s -H "Authorization: Bearer ${{ inputs.github-token }}" \
            https://api.github.com/repos/$repo_owner/$repo_name/actions/runs/$run_id)
          status=$(echo $response | jq -r '.status')
          conclusion=$(echo $response | jq -r '.conclusion')

          current_time=$(date +%s)
          elapsed_time=$((current_time - start_time))

          # Mirror the connector-side poll-line shape:
          #   🔄 dispatched run [120s] in_progress
          # so the SDK PR's log scans the same way as the mysql-app
          # PR's worker log (test-tube emoji + elapsed + status).
          printf '%s dispatched run [%3ds] %s\n' \
            "$(glyph_for_status "$status")" "$elapsed_time" "$status"

          if [[ $elapsed_time -ge $timeout ]]; then
            echo "⏰ Workflow run timeout reached after $timeout seconds"
            echo "status=timeout" >> "$GITHUB_OUTPUT"
            echo "conclusion=timeout" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        if [[ "$conclusion" != "success" ]]; then
          echo "Workflow run $run_id in $repo_name failed with conclusion $conclusion"
        else
          echo "Workflow run $run_id in $repo_name succeeded"
        fi

    # Pull the dispatched run's rendered PR-comment body out of the
    # uploaded results artifact so the SDK-side sticky shows the same
    # markdown as the connector-side sticky (status, summary, asset
    # tables, lineage coverage, validates block). Workflow-dispatch
    # can't return step outputs to the caller, so the results artifact
    # is the only channel from the dispatched run's output back to the
    # apps-sdk PR comment.
    #
    # Falls back to a status-only body when the artifact is missing
    # (dispatch failed, run cancelled before tests, etc.).
    - name: Fetch dispatched-run report body
      id: dispatched_summary
      if: always() && inputs.wait-mode != 'callback' && steps.return_dispatch.outputs.run_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO_NAME: ${{ inputs.repo-name }}
        RUN_ID: ${{ steps.return_dispatch.outputs.run_id }}
      run: |
        set -uo pipefail
        artifact_id=$(gh api \
          "repos/atlanhq/${REPO_NAME}/actions/runs/${RUN_ID}/artifacts" \
          --jq '.artifacts[] | select(.name | test("results$")) | .id' \
          | head -1)
        body_path=""
        if [ -n "${artifact_id}" ]; then
          work=$(mktemp -d)
          gh api \
            "repos/atlanhq/${REPO_NAME}/actions/artifacts/${artifact_id}/zip" \
            > "${work}/results.zip" 2>/dev/null || true
          unzip -qq -o "${work}/results.zip" -d "${work}" 2>/dev/null || true
          if [ -f "${work}/pr-comment-body.md" ]; then
            body_path="${work}/pr-comment-body.md"
            echo "Found rendered comment body in artifact."
          fi
        fi
        echo "body_path=${body_path}" >> "$GITHUB_OUTPUT"

    # Sticky comment back on the calling SDK PR so reviewers see the
    # cross-repo dispatch outcome without clicking through to the
    # connector run. Uses updateComment in-place when a prior marker
    # exists so re-pushes don't spam the PR thread.
    #
    # This comments on THIS repo's PR (context.repo), so it uses the
    # workflow's own GITHUB_TOKEN — NOT inputs.github-token, which is the
    # fleet App token scoped to the *connector* repo (owner/repositories:
    # <connector>) and therefore gets 403 "Resource not accessible by
    # integration" when it tries to write an issue comment here. The calling
    # workflow already grants `issues: write` + `pull-requests: write`
    # (see pull_request.yaml permissions). All other steps below keep
    # inputs.github-token — they legitimately act on the connector repo.
    - name: Post dispatched-run status to SDK PR
      if: always() && inputs.wait-mode != 'callback' && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        REPO_NAME: ${{ inputs.repo-name }}
        WORKFLOW: ${{ inputs.workflow }}
        RUN_ID: ${{ steps.return_dispatch.outputs.run_id }}
        RUN_URL: ${{ steps.return_dispatch.outputs.run_url }}
        DISPATCHED_CONCLUSION: ${{ steps.status.outputs.conclusion }}
        DISPATCHED_STATUS: ${{ steps.status.outputs.status }}
        RENDERED_BODY_PATH: ${{ steps.dispatched_summary.outputs.body_path }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const repoName = process.env.REPO_NAME;
          const workflow = process.env.WORKFLOW;
          const runId    = process.env.RUN_ID;
          const runUrl   = process.env.RUN_URL;
          const conclusion = process.env.DISPATCHED_CONCLUSION || '';
          const status    = process.env.DISPATCHED_STATUS || '';
          const renderedPath = process.env.RENDERED_BODY_PATH || '';

          const sticky = `<!-- e2e-apps-cross-repo:${workflow}:${repoName} -->`;

          const hasRenderedBody = renderedPath && fs.existsSync(renderedPath);
          const hasKnownConclusion = [
            "success", "failure", "cancelled", "timeout",
          ].includes(conclusion);

          // Skip the comment entirely when we have nothing useful to say:
          // no rendered body from the dispatched run AND no resolved
          // conclusion. The job check_run on the SDK PR still signals
          // the failure — a "Status: Unknown" sticky just adds noise.
          if (!hasRenderedBody && !hasKnownConclusion) {
            core.info('No rendered body and no resolved conclusion — skipping SDK-side PR comment.');
            return;
          }

          // Prefer the connector-side rendered body so both PRs (the
          // connector PR and this SDK PR) show identical content. The
          // connector sticky line (e.g. <!-- sdr-integration-tests... -->)
          // gets stripped and replaced with this side's marker so
          // sticky-updates don't collide.
          let body = '';
          if (hasRenderedBody) {
            const raw = fs.readFileSync(renderedPath, 'utf8');
            const lines = raw.split('\n');
            const startsWithMarker = /^<!--\s.*\s-->\s*$/.test(lines[0] || '');
            const stripped = startsWithMarker ? lines.slice(1).join('\n') : raw;
            body = sticky + '\n' + stripped.trimStart();
          } else {
            // The normal path: a slim status sticky. The dispatched run's own
            // per-suite jobs (and their live logs) carry the detail, so we
            // deliberately keep this to status + run link rather than
            // reproducing a large report here.
            const titlesByWorkflow = {
              "tests.yaml": `Connector Tests — ${repoName}`,
            };
            const title = titlesByWorkflow[workflow] || `${workflow} — ${repoName}`;
            const statusLine =
                conclusion === "success"   ? "Passed ✅"
              : conclusion === "failure"   ? "Failed ❌"
              : conclusion === "cancelled" ? "Cancelled 🚫"
              :                              "Timed out ⏰ (dispatched run still in progress when the SDK side gave up — check the run link)";
            const runLine = runId
              ? `[${runId}](${runUrl})`
              : `_dispatch failed before a run id was assigned_`;
            body = [
              sticky,
              `## 🧪 ${title}`,
              ``,
              `**Status:** ${statusLine}`,
              `**Dispatched run:** ${runLine}`,
              ``,
              `> Cross-repo dispatch from this SDK PR — per-suite results and live logs are in the dispatched run.`,
            ].join('\n');
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(sticky));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
      continue-on-error: true

    # Re-emit the failure exit code AFTER the comment lands, so the job
    # still fails the PR check but the reviewer sees a comment either way.
    # Only applies to poll mode: in callback mode this job's own success
    # means "dispatched OK" — the actual pass/fail comes later via the
    # check run the connector completes directly (report-to-sdk).
    - name: Fail job if dispatched run did not succeed
      if: always() && inputs.wait-mode != 'callback'
      shell: bash
      env:
        DISPATCHED_CONCLUSION: ${{ steps.status.outputs.conclusion }}
      run: |
        if [[ "$DISPATCHED_CONCLUSION" != "success" ]]; then
          echo "Dispatched run conclusion: $DISPATCHED_CONCLUSION"
          exit 1
        fi

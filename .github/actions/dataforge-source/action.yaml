name: DataForge source credentials
description: >
  Resolve a connector e2e source from dataforge — a provisioned resource's
  artifacts (resource mode) or a vault-managed credential (managed mode, the
  only home for SaaS sources) — normalize the fields onto the canonical
  E2E_SOURCE_* / E2E_<PREFIX>_* contract, register every value with the log
  masker, and export the result to $GITHUB_ENV for the sdr-e2e secrets-script
  and pytest to read. Fetch/normalize lives in
  .github/scripts/fetch_dataforge_source.py; masking + env emission delegate
  to the audited mask-first two-pass exporter in .github/scripts.

  tests-reusable.yaml deliberately does NOT use this action — it runs the same
  scripts from its own job.workflow_sha sparse checkout (see the @main-pinning
  race documented there). This wrapper is for standalone callers: per-repo e2e
  workflows like atlan-postgres-app's e2e-dataforge.yaml.

inputs:
  api-key:
    description: Dataforge API key (df_<id>_<secret>). Pass from secrets.
    required: true
  datasource:
    description: Dataforge datasource name (postgres, snowflake, powerbi, …).
    required: true
  mode:
    description: >
      "resource" reads a provisioned resource's artifacts (needs resource-id);
      "managed" reveals a vault-managed credential (resource-id optional — when
      empty, the newest active entry for the datasource is used).
    required: false
    default: "resource"
  resource-id:
    description: Resource UUID (resource mode) or managed-credential UUID.
    required: false
    default: ""
  env-tier:
    description: Managed-credential tier filter (dev/stg/prd). Managed mode only.
    required: false
    default: ""
  instance-name:
    description: Managed-credential instance-name filter. Managed mode only.
    required: false
    default: ""
  output-prefix:
    description: Prefix for the alias env set (default = uppercased datasource).
    required: false
    default: ""
  field-map:
    description: JSON object merged over dataforge_field_maps.json for this call.
    required: false
    default: ""
  base-url:
    description: Dataforge API base URL.
    required: false
    default: "https://api.dataforge.atlan.dev"

outputs:
  resolved-id:
    description: The resource / managed-credential UUID actually used.
    value: ${{ steps.fetch.outputs.resolved-id }}

runs:
  using: composite
  steps:
    # Stdout of the fetch is captured into a shell variable, so credential
    # values never reach the log unregistered; export_extra_env.py then runs
    # its two passes — masks first, so nothing is written to $GITHUB_ENV
    # before it is redactable (same protocol as tests-reusable.yaml).
    - id: fetch
      shell: bash
      env:
        DATAFORGE_API_KEY: ${{ inputs.api-key }}
        DATAFORGE_BASE_URL: ${{ inputs.base-url }}
        DF_DATASOURCE: ${{ inputs.datasource }}
        DF_MODE: ${{ inputs.mode }}
        DF_RESOURCE_ID: ${{ inputs.resource-id }}
        DF_ENV_TIER: ${{ inputs.env-tier }}
        DF_INSTANCE_NAME: ${{ inputs.instance-name }}
        DF_OUTPUT_PREFIX: ${{ inputs.output-prefix }}
        DF_FIELD_MAP: ${{ inputs.field-map }}
      run: |
        set -euo pipefail
        DF_ENV_JSON="$(python3 "${{ github.action_path }}/../../scripts/fetch_dataforge_source.py" \
          --datasource "$DF_DATASOURCE" \
          --mode "$DF_MODE" \
          --resource-id "$DF_RESOURCE_ID" \
          --env-tier "$DF_ENV_TIER" \
          --instance-name "$DF_INSTANCE_NAME" \
          --output-prefix "$DF_OUTPUT_PREFIX" \
          --field-map "$DF_FIELD_MAP")"
        python3 "${{ github.action_path }}/../../scripts/export_extra_env.py" \
          --json "$DF_ENV_JSON" --mask-only
        python3 "${{ github.action_path }}/../../scripts/export_extra_env.py" \
          --json "$DF_ENV_JSON" >> "$GITHUB_ENV"

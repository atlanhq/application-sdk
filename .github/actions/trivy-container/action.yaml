name: Trivy Container Scan for Atlan Apps

description: |
  Runs Trivy security scanner on container images to detect and report vulnerabilities.
  Builds the Docker image with Chainguard base image authentication and scans it.
  Results are uploaded to the GitHub Security tab.

inputs:
  chainguard-username:
    description: >-
      Chainguard registry username. Optional: the login step is skipped when
      empty. Only builds whose Dockerfile pulls a cgr.dev base image need it --
      that is application-sdk's own Dockerfile
      (FROM cgr.dev/atlan.com/app-framework-golden), not the connector apps,
      which build from registry.atlan.com, docker.io or registry.access.redhat.com.
      The credentials live as repo-level secrets on application-sdk and so are
      unavailable to any other repo by construction (FND-447).
    required: false
  chainguard-password:
    description: Chainguard registry password. Same handling as chainguard-username.
    required: false
  github-token:
    description: GitHub token for Docker build secrets
    required: true
  fail-on-vulns:
    description: Whether to fail if HIGH/CRITICAL vulnerabilities with fixes are found
    required: false
    default: 'false'
  skip-files:
    description: Comma-separated list of files or directories to be skipped
    required: false

outputs:
  results-file:
    description: Path to the JSON results file
    value: ${{ steps.scan.outputs.results-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    # Skipped when no credentials are supplied. docker/login-action errors on an
    # empty username, so an unconditional login turned "this build does not need
    # cgr.dev" into a hard failure -- which is how every connector app's scan
    # died even once its secrets reached the reusable (FND-447).
    - name: Log in to Chainguard Container Registry
      if: inputs.chainguard-username != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: cgr.dev
        username: ${{ inputs.chainguard-username }}
        password: ${{ inputs.chainguard-password }}

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: trivy-scan-target:latest
        cache-from: type=gha
        # `ignore-error=true`: see build-and-scan.yaml — a cache-service hiccup must not fail a build.
        cache-to: type=gha,mode=max,ignore-error=true
        secrets: |
          "PRIVATE_REPO_ACCESS_TOKEN=${{ inputs.github-token }}"

    # ── Trivy ─────────────────────────────────────────────────────────────
    # The same recipe as the trivy-image-scan composite: install-only
    # setup-trivy at the repo's one CLI pin, never aquasecurity/trivy-action,
    # whose bundled Trivy reports no OS findings on the Chainguard base that
    # application-sdk's own Dockerfile builds from (FND-4904).
    #
    # Inline rather than `uses:` that composite because this action also runs
    # in connector repos (trivy-container.yaml), where `./.github/actions/...`
    # names the connector's tree. test_trivy_image_scan.py holds the
    # setup-trivy SHA and the version below to trivy-image-scan's.
    - name: Install Trivy CLI
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.70.0
        cache: true

    # setup-trivy caches the binary only; see trivy-image-scan for why the DB
    # is cached too.
    - name: Get date for the Trivy DB cache key
      id: trivy-db-date
      shell: bash
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore Trivy DB cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/trivy/db
          ~/.cache/trivy/java-db
        key: trivy-db-${{ runner.os }}-${{ steps.trivy-db-date.outputs.date }}
        restore-keys: trivy-db-${{ runner.os }}-

    # skip-files applies to the JSON report too, not only to the SARIF copy as
    # it used to: trivy-container.yaml gates on this report, so a skipped path
    # that still gated was the opposite of what the input says.
    - name: Run Trivy scan (JSON)
      id: scan
      shell: bash
      env:
        TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
        TRIVY_SKIP_FILES: ${{ inputs.skip-files }}
      run: |
        trivy image \
          --scanners vuln \
          --severity CRITICAL,HIGH \
          --format json \
          --output trivy-container-results.json \
          trivy-scan-target:latest
        echo "results-file=trivy-container-results.json" >> "$GITHUB_OUTPUT"

    - name: Show Trivy findings
      shell: bash
      run: trivy convert --scanners vuln --format table trivy-container-results.json

    - name: Write SARIF
      shell: bash
      run: trivy convert --format sarif --output trivy-container-results.sarif trivy-container-results.json

    - name: Upload scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-container-results.sarif'
        category: 'trivy-container'

    - name: Fail on HIGH/CRITICAL vulnerabilities (with fix available)
      if: inputs.fail-on-vulns == 'true'
      shell: bash
      env:
        TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
        TRIVY_SKIP_FILES: ${{ inputs.skip-files }}
      run: |
        trivy image \
          --scanners vuln \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --exit-code 1 \
          --format table \
          trivy-scan-target:latest

name: DataForge source lifecycle
description: |
  Wake (resume) a paused DataForge e2e source before a run and pause it after,
  refcounted across concurrent runs so the first leg/PR to finish never pauses
  the pinned instance out from under the others (FND-1992).

  `wake` registers a per-run holder ref, resumes the pinned instance if it is
  paused, and polls the state read until it is PROVISIONED — credentials
  resolving is not the same as the instance accepting connections, so readiness
  is a state poll, not a 2xx. `pause` (run under `if: always()`) deregisters
  this run and pauses the instance only when no OTHER live run still holds it;
  an abandoned holder from a cancelled run is reaped by whoever pauses next,
  exactly like an abandoned tenant lease.

  This is the LIFECYCLE path — it mutates instance state, so it exchanges the
  run's GitHub OIDC token for a SERVICE token carrying
  `resource:lifecycle resource:read` (not the fetch script's `credentials:read`).
  The repo's DataForge workload binding must ALLOW those scopes.

  Requires `id-token: write` (OIDC exchange), `contents: write` (create/delete
  the holder ref) and `actions: read` (tell a live holder from a dead one). It
  is a no-op success when no resource is pinned, so a managed-mode caller can
  wire it unconditionally.

inputs:
  mode:
    description: '"wake" or "pause".'
    required: true
  resource-id:
    description: |
      The pinned instance UUID (the DATAFORGE_RESOURCE_ID secret). Empty = no
      pin, and the action is a no-op success.
    required: false
    default: ""
  base-url:
    description: DataForge API base URL.
    required: false
    default: "https://api.dataforge.atlan.dev"
  ready-timeout-seconds:
    description: |
      wake only. How long to poll for the instance to reach PROVISIONED after a
      resume before failing with a named error. Default 10min.
    required: false
    default: "600"
  poll-seconds:
    description: wake only. Gap between readiness state reads.
    required: false
    default: "15"
  ttl-seconds:
    description: |
      pause only. How long a holder may hold the source awake before a pauser
      treats its run as wedged and reaps it, even if the Actions API still
      reports it running. Sized like the tenant lease's TTL (install + leg
      ceiling). 0 disables the backstop.
    required: false
    default: "16200"

runs:
  using: composite
  steps:
    - name: ${{ inputs.mode == 'pause' && 'Pause' || 'Wake' }} the dataforge source
      shell: bash
      # Inputs routed through env, never inline ${{ }}, so nothing interpolates
      # into the command line (docs/standards/ci.md). The OIDC request env vars
      # (ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN) are injected automatically when the
      # calling job has `permissions: id-token: write`.
      env:
        MODE: ${{ inputs.mode }}
        DATAFORGE_RESOURCE_ID: ${{ inputs.resource-id }}
        DATAFORGE_BASE_URL: ${{ inputs.base-url }}
        READY_TIMEOUT_SECONDS: ${{ inputs.ready-timeout-seconds }}
        POLL_SECONDS: ${{ inputs.poll-seconds }}
        TTL_SECONDS: ${{ inputs.ttl-seconds }}
        LEASE_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/dataforge_source_lifecycle.py" \
          --mode "$MODE" \
          --resource-id "$DATAFORGE_RESOURCE_ID" \
          --repo "$LEASE_REPO" \
          --run-id "$RUN_ID" \
          --run-attempt "$RUN_ATTEMPT" \
          --ready-timeout-seconds "$READY_TIMEOUT_SECONDS" \
          --poll-seconds "$POLL_SECONDS" \
          --ttl-seconds "$TTL_SECONDS" \
          --base-url "$DATAFORGE_BASE_URL"

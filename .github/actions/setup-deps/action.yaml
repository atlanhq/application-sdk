name: Setup Python Dependencies for Atlan Apps
description: |
  Sets up Python project dependencies and manages dependency caching for Atlan Apps.
  This action installs Python (by default the version the app image ships), the uv package
  manager, and project dependencies.
  It implements efficient caching strategies to speed up workflow execution by storing and reusing
  the virtual environment.

inputs:
  cache:
    description: "Enable dependency caching"
    required: false
    default: "true"
  python-version:
    required: false
    description: |
      The Python major.minor to install and test on. Empty (the default) means
      the version the app image ships: the golden base tag in the SDK
      `Dockerfile`, read by `container_python_version.py resolve`. Pass a value
      only to test on another version on purpose (the SDK's own unit matrix).
      Either way the job exports `UV_PYTHON`, which outranks a repo's
      `.python-version`, so every later `uv` command runs on this version.
    default: ""
  lookup-only:
    required: false
    description: |
      "true" to check for the venv cache entry without downloading it. On a
      hit nothing is installed; on a miss the venv is built and saved as usual.
      For jobs that only seed the cache (warm-caches.yaml).
    default: "false"
  git-auth-token:
    required: false
    description: |
      A read-only GitHub token for an app that pins a PRIVATE atlanhq git
      dependency. Empty (the default) installs without one. When set, the
      install runs through `.github/scripts/git_auth.py`: only git sees the
      token, to mirror-clone the private deps, and `uv sync` installs from the
      local mirrors with no token in its env, so no build backend and no later
      step (tests, hooks, app code) can read it (FND-4740). Never pass
      ORG_PAT_GITHUB here; the reusables mint a read-only fleet App token
      scoped to the app's private deps (`private-deps-token`).
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    # Test on the Python the app image ships (FND-4611). A literal default here
    # ("3.11" until FND-4611) let every connector's unit and integration tiers
    # run on 3.11 while the image ran 3.13. The SDK Dockerfile's golden tag is
    # the single source (CNCT-85); the Dockerfile read is the one in this
    # action's own checkout of the SDK, never the caller's. Skipped when the
    # caller names a version, so the SDK's Windows legs never need python3.
    - name: Resolve the app image's Python version
      id: image-python
      if: inputs.python-version == ''
      shell: bash
      env:
        SDK_ROOT: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        VERSION=$(python3 "${SDK_ROOT}/.github/scripts/container_python_version.py" print-version \
          --dockerfile "${SDK_ROOT}/Dockerfile")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    # One value for the rest of the action. UV_PYTHON outranks a repo's
    # .python-version, so a stale pin there cannot move the tests off it, and
    # it reaches every later `uv` command in the job, not just this action's.
    #
    # The value must be exactly one major.minor before it reaches a command
    # file. A caller-supplied input with a newline would otherwise write a
    # second line to $GITHUB_ENV (e.g. BASH_ENV=...) and run code in every later
    # bash step. `[[ =~ ]]` matches the WHOLE string, unlike a per-line grep,
    # and an empty value fails it too; under `set -e` a mismatch fails the step.
    - name: Export the Python version
      id: python-version
      shell: bash
      env:
        VERSION: ${{ inputs.python-version || steps.image-python.outputs.version }}
      run: |
        set -euo pipefail
        [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "UV_PYTHON=${VERSION}" >> "$GITHUB_ENV"

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ steps.python-version.outputs.version }}

    # The key's version must be the one `Install uv` installs, or the restored
    # binary is never the one setup-uv wants and the cache only costs time (it
    # sat at 0.11.21 while installs moved to 0.13.4). Renovate bumps both
    # literals together (the regex manager in renovate.json), and
    # test_setup_deps_uv_cache_key.py fails if they ever diverge.
    - name: Cache uv binary
      id: cache-uv-bin
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/uv
        key: uv-bin-${{ runner.os }}-${{ runner.arch }}-0.13.7

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        github-token: ${{ github.token }}
        download-from-astral-mirror: false

    - name: Cache virtual environment
      id: cache-venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        # Hash the whole importable conformance package, not just uv.lock: it is
        # a non-editable path dependency baked into .venv as a wheel, and
        # `uv sync` only runs on a cache miss (see below). Keyed on uv.lock
        # alone, a source-only change reuses a stale build, so type-checks/tests
        # run against outdated code. Hash `conformance/**` (not just `*.py`) so
        # bundled non-.py wheel assets the rules read at runtime — data/*.json
        # (e.g. toolkit_baseline.json), suite/schema/*.json, bootstrap/templates/*
        # — also bust the cache. The sibling tests/, pyproject.toml, and README
        # are outside conformance/ and correctly excluded (not in the wheel).
        #
        # `pyc` marks entries that carry bytecode (see Install dependencies). It
        # was added so entries saved before that were never restored again.
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-pyc-${{ hashFiles('uv.lock', 'packages/conformance/conformance/**') }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Install dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true' && inputs.git-auth-token == ''
      shell: bash
      # Compile bytecode into the venv so the saved entry carries it. Without
      # it, every leg's xdist workers compile the same ~6,500 modules at once
      # during collection: -n 4 --collect-only took 24.7s on a plain venv vs
      # 17.3s on a compiled one, at 33% more cache (177 -> 236 MB compressed).
      # Compiling here only runs on a miss, where it costs about what it saves
      # for that leg (FND-4309). Every miss compiles, not just warm-caches.yaml,
      # because whichever job saves a key on main first owns that entry.
      env:
        UV_COMPILE_BYTECODE: "1"
      run: |
        PYTHON_MINOR=$(echo "${{ steps.python-version.outputs.version }}" | cut -d. -f2)
        if [ "${PYTHON_MINOR}" -ge 14 ] 2>/dev/null; then
          # Python 3.14+: skip dev group (libcst's pyo3 doesn't support 3.14 yet)
          "${{ github.action_path }}/../../scripts/with-retry.sh" uv sync --all-extras --no-group dev
        else
          "${{ github.action_path }}/../../scripts/with-retry.sh" uv sync --all-extras --all-groups
        fi

    # The same install for an app with a private atlanhq git dependency: the
    # token reaches `uv sync` (and the git it starts) through git_auth.py, and
    # nothing later in the job. A separate step, not a wrapper on the one
    # above, so a caller with no token never needs `python3` (the SDK's
    # Windows legs). No 3.14 dev-group carve-out: it exists for the SDK's own
    # unit matrix, which never passes a token. A venv-cache hit already holds
    # the dependency, so this, like the step above, runs only on a miss.
    - name: Install dependencies (private git dependencies)
      if: steps.cache-venv.outputs.cache-hit != 'true' && inputs.git-auth-token != ''
      shell: bash
      env:
        UV_COMPILE_BYTECODE: "1"
        GIT_TOKEN: ${{ inputs.git-auth-token }}
        PRIVATE_GIT_DEPS: "true"
      run: |
        python3 "${{ github.action_path }}/../../scripts/git_auth.py" run -- \
          "${{ github.action_path }}/../../scripts/with-retry.sh" uv sync --all-extras --all-groups

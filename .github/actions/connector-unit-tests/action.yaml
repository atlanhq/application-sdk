name: Unit Tests for Atlan Connector Apps

description: |
  Runs unit tests for an Atlan connector app (atlan-*-app repository).

  Reusable across every connector built on atlan-application-sdk v3+. The
  connector repo's workflow `uses:` this action; per-app variation is limited
  to the `python-version` and `fail-under` inputs.

  Steps:
  - Sets up Python + uv via `setup-deps` (which also checks out the caller repo).
  - Runs `pytest tests/unit/` with coverage.
  - Enforces a minimum coverage threshold (`fail-under`) via `coverage report`.
  - Comments the coverage delta on the PR.

  Does NOT upload coverage to S3 — that wiring is per-app and stays in the
  caller's workflow if desired.

outputs:
  summary:
    description: |
      One-line pytest summary parsed from the test-output's final
      `=== ... ===` line (e.g. "227 passed, 15 warnings in 4.01s").
      Caller workflows can surface this in PR comments.
    value: ${{ steps.tests.outputs.summary }}

inputs:
  github-token:
    required: true
    description: GitHub token used to comment coverage results on the PR.
  python-version:
    required: false
    description: Python version to use.
    default: "3.11"
  fail-under:
    required: false
    description: |
      Minimum coverage percentage to enforce on the final `coverage report`
      step. CLI flag overrides `[tool.coverage.report].fail_under` in the
      consumer's pyproject.toml.
    default: "60"
  application-sdk-ref:
    required: false
    description: |
      Branch/SHA of atlanhq/application-sdk to pin before running tests.
      Empty = use the lockfile version. Used by cross-repo dispatch from
      application-sdk PRs so the unit tier exercises the SDK branch under
      review too — parity with connector-integration-tests.
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Python, uv, and dependencies
      uses: atlanhq/application-sdk/.github/actions/setup-deps@main
      with:
        python-version: ${{ inputs.python-version }}

    - name: Pin application-sdk to dispatched ref
      if: inputs.application-sdk-ref != ''
      shell: bash
      env:
        SDK_REF: ${{ inputs.application-sdk-ref }}
      # Reuse the integration action's repin script (a generic pyproject
      # [tool.uv.sources] rewriter, not integration-specific) rather than
      # keeping a third copy. Both actions are checked out together from the
      # application-sdk tree, so the sibling path resolves — the same
      # cross-action-file pattern connector-integration-tests already relies on
      # for ../../scripts/ and ../../../application_sdk/version.py.
      run: |
        REPIN="${{ github.action_path }}/../connector-integration-tests/repin-application-sdk.sh"
        chmod +x "$REPIN"
        "$REPIN"
        uv sync --all-extras --all-groups

    - name: Run unit tests with coverage
      id: tests
      shell: bash
      # xml/html subcommands ALSO honor pyproject.toml's
      # [tool.coverage.report].fail_under. Pin them to --fail-under=0 so
      # artifact generation never short-circuits the run. The actual
      # threshold gate is the final `coverage report` step — its CLI flag
      # overrides pyproject.toml on that step.
      run: |
        set +e
        mkdir -p results
        # `coverage` is installed transiently via `uv run --with` so callers do
        # not need to declare it as a dependency — the same pattern the
        # connector-integration-tests action uses for pytest-cov/pytest-xdist.
        # The `.coverage` data file persists in the cwd between invocations, so
        # the later xml/json/html/report calls read the same run's data.
        uv run --with coverage coverage run -m pytest tests/unit -v \
          --junit-xml=results/test-results.xml 2>&1 | tee /tmp/unit-test-output.txt
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        # Extract pytest summary line for caller PR comments. Strip ANSI codes
        # first: a repo that forces `--color=yes` in its own pytest config
        # (dataplex's pytest.ini) wraps the summary in escapes, the anchored
        # grep then matches nothing — and under `set -e` that killed the step
        # AFTER a fully green suite (FND-110). `|| true` keeps a missing
        # summary cosmetic: the fallback text below is the contract.
        ESC=$(printf '\033')
        SUMMARY=$(sed "s/${ESC}\[[0-9;]*m//g" /tmp/unit-test-output.txt | grep -E "^=+ .* =+$" | tail -1 | sed -E 's/^=+ *//; s/ *=+$//' || true)
        echo "summary=${SUMMARY:-no summary parsed}" >> "$GITHUB_OUTPUT"
        # Always emit coverage artifacts, even if pytest failed. `coverage json`
        # is the machine-readable form the test-readiness scorecard reads (the
        # aggregation job feeds it as --unit-coverage); xml/html stay for humans
        # and the PR coverage comment.
        uv run --with coverage coverage xml --fail-under=0 || true
        uv run --with coverage coverage json --fail-under=0 || true
        uv run --with coverage coverage html --fail-under=0 || true
        # Evaluate the coverage gate only when the tests themselves passed —
        # a failing suite's coverage number is not meaningful.
        COVERAGE_EXIT_CODE=0
        if [ "$TEST_EXIT_CODE" -eq 0 ]; then
          # `set -e` is active here (re-enabled above), so the gate has to run
          # with it off — otherwise a below-threshold report aborts the step
          # before the exit code can be recorded, which is the very failure
          # mode this change exists to remove.
          set +e
          uv run --with coverage coverage report --fail-under=${{ inputs.fail-under }}
          COVERAGE_EXIT_CODE=$?
          set -e
        fi
        # Record the verdict instead of exiting here. Exiting non-zero from a
        # composite-action step TERMINATES the whole composite: every later step
        # is dropped, and `if: always()` does NOT rescue them the way it does for
        # job-level steps. That silently skipped "Upload coverage artifacts", so a
        # repo whose unit tests failed produced NO unit-test-coverage artifact at
        # all — no JUnit XML, so the scorecard aggregation short-circuits, so the
        # repo never reaches the Test Maturity dashboard. It vanished from the tab
        # instead of showing its true failing grade. The failure is re-raised in
        # the final step below, after the evidence has been uploaded.
        echo "test_exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"
        echo "coverage_exit_code=${COVERAGE_EXIT_CODE}" >> "$GITHUB_OUTPUT"

    # Ordered BEFORE the failure is re-raised, so the evidence survives a red
    # suite. `if: always()` is kept as a belt-and-braces guard for a step above
    # that fails without going through the verdict-recording path.
    # `upload-artifact` classifies the artifact service's finalize 403 as
    # non-retryable and fails on the first occurrence, even though the bytes
    # already landed and the next attempt normally succeeds. That failed this
    # composite, which failed the caller's Tests check, which ejected its
    # merge-queue entry. Retry once, and never fail on it: the scorecard job
    # downloads this with continue-on-error already.
    - name: Upload coverage artifacts
      id: upload-unit-coverage
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: unit-test-coverage
        path: |
          coverage.xml
          coverage.json
          htmlcov/
          results/
        retention-days: 14

    - name: Upload coverage artifacts (retry)
      if: steps.upload-unit-coverage.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: unit-test-coverage
        path: |
          coverage.xml
          coverage.json
          htmlcov/
          results/
        retention-days: 14
        overwrite: true

    # Gate on the recorded verdict: after this change the tests step always
    # succeeds (it records instead of exiting), so a bare pull_request gate
    # would post a coverage number computed from a partial, red-suite run —
    # easy to misread as a valid result. Only comment when tests passed.
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && steps.tests.outputs.test_exit_code == '0'
      uses: orgoro/coverage@71cf993a407154ad9d8dd027c88a374b0ed002a9 # v3.3
      with:
        coverageFile: coverage.xml
        token: ${{ inputs.github-token }}

    # Re-raise the recorded verdict. Keeps the job's pass/fail identical to
    # before this change — only the ordering moved, so a red suite still fails
    # the build, it just no longer takes the evidence down with it.
    - name: Fail if unit tests or the coverage gate failed
      if: always()
      shell: bash
      env:
        TEST_EXIT_CODE: ${{ steps.tests.outputs.test_exit_code }}
        COVERAGE_EXIT_CODE: ${{ steps.tests.outputs.coverage_exit_code }}
      run: |
        # Empty means the step above never recorded a verdict (it died early);
        # treat that as a failure rather than silently passing.
        if [ -z "${TEST_EXIT_CODE}" ]; then
          echo "::error::unit test step did not report a verdict"
          exit 1
        fi
        if [ "${TEST_EXIT_CODE}" -ne 0 ]; then
          echo "::error::unit tests failed (exit ${TEST_EXIT_CODE})"
          exit "${TEST_EXIT_CODE}"
        fi
        if [ "${COVERAGE_EXIT_CODE:-0}" -ne 0 ]; then
          echo "::error::coverage below --fail-under=${{ inputs.fail-under }} (exit ${COVERAGE_EXIT_CODE})"
          exit "${COVERAGE_EXIT_CODE}"
        fi
        echo "unit tests and coverage gate passed"

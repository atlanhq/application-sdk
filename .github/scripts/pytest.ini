# pytest config for the CI script suite (.github/scripts/tests).
#
# pytest picks this file up whenever its arguments sit under .github/scripts —
# `pytest .github/scripts/tests` from the repo root, as the `CI script tests`
# workflow runs it, or any single test file — and it then wins over the root
# pyproject.toml's [tool.pytest.ini_options], which configures the SDK suite.
#
# pythonpath puts the scripts and the shared test helpers (_frozen_clock.py,
# _gha_expr.py, …) on sys.path, so a test imports the script it covers with a
# plain `import <script>`. Do not add a `sys.path.insert` for either directory
# to a test file; test_pytest_ini.py fails on one. A script that lives
# somewhere else (.github/actions/*/, build_and_publish/, …) still needs its
# own insert.
[pytest]
testpaths = tests
pythonpath = . tests
# An unregistered mark is a collection error, as in the SDK suite.
addopts = --strict-markers

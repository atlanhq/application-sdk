# App release train (FND-3529, FND-4036). Read by .github/scripts/release_train.py,
# run by .github/workflows/release-train.yml. Reviewed like code: a change here
# changes when apps ship. See docs/standards/release-flow.md#release-train-scheduler.
#
# This is the ONE list of apps on the train and when each releases. An app that
# is not listed under `schedule` is never touched. Edit by PR; the CI script
# tests parse this file, so an invalid day/slot fails the PR, not the 08:00 run.
#
# This repo is public: listing an app publishes its repo name and release slot.
# The job's own logs show counts only; per-app detail stays on each bump PR.
schema_version: 1
timezone: IST            # fixed UTC+05:30
# Only mon..thu are accepted: nothing ships into a weekend.
days: [mon, tue, wed, thu]
# Each slot must be one the workflow's slot cron fires for (09/12/15/18/21 IST).
slots: ["09:00", "12:00", "15:00", "18:00", "21:00"]
per_slot_cap: 10
per_day_cap: 40
max_regate_per_pr: 2
# owner/repo -> 1..4 releases a week, each {day, slot}, at most one a day.
# More than per_slot_cap apps in a slot is allowed: the extras move to the
# next slot with room that day.
schedule:
  atlanhq/atlan-openapi-app: [{day: mon, slot: "12:00"}]
  atlanhq/atlan-mysql-app: [{day: mon, slot: "12:00"}]
  atlanhq/atlan-metabase-app: [{day: mon, slot: "12:00"}]

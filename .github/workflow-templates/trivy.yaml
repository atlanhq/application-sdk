name: Atlan Application Trivy files scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '35 21 * * 3'

permissions:
  contents: read
  pull-requests: write
  actions: read
  security-events: write

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: "ubuntu-26.04"
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install-only setup-trivy at a pinned CLI, not aquasecurity/trivy-action:
      # that action's bundled Trivy under-reports on Chainguard/Wolfi images,
      # and application-sdk keeps one engine for every scan. Keep the SHA and
      # version in step with application-sdk's trivy-image-scan composite.
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Run Trivy vulnerability scanner in repo mode
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
        run: |
          # vuln,secret: what trivy-action ran when it named no scanners.
          trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: 'trivy-results.sarif'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlan-application-sdk-conformance"
version = "0.61.0"
description = "Conformance suite, remediation programs, and CLI for the Atlan Application SDK"
license = "Apache-2.0"
authors = [
    {name = "Atlan App Team", email = "connect@atlan.com"}
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["atlan", "sdk", "conformance", "linting", "remediation"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "pydantic>=2.10.6,<3.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "jinja2>=3.1.0,<4.0.0",
    # D010 evaluates PEP 508 markers on uv.lock edges. Without this the
    # import silently falls back to "every marker contributes", which
    # reinstates the bug the marker check exists to fix, undetectably.
    # Uncapped above: Marker(text).evaluate() is stable across packaging 26.x,
    # and capping here downgrades the shared repo environment for every
    # consumer.
    "packaging>=24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    # [sql] pulls duckdb, which test_p040_keyword_set_matches_pinned_duckdb
    # needs. Without it that drift guard is permanently SKIPPED in the only job
    # that runs this package's tests, and the P040 reserved-keyword constant
    # could silently diverge from the DuckDB it claims to describe.
    "atlan-application-sdk[sql]",
]

[project.scripts]
atlan-application-sdk-conformance = "conformance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["conformance"]

# The SDK's contract ledger is committed once, at the repository root, and
# shipped as package data by a build hook (FND-3108). The sdist carries a copy
# so a build from it still has one.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build_ledger.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build_ledger.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Dev tooling. ruff is a genuine test dependency here, not only a
# pre-commit hook: tests/test_bootstrap_scaffold_lint.py runs it over the
# scaffolds bootstrap force-writes into consumer repos (FND-445), which
# have to stay lint-clean under configs stricter than this repo's.
# Unpinned here on purpose: this package shares the root uv.lock (FND-4671),
# which holds one ruff for the whole workspace, so the root dev group's exact
# `ruff==` pin is the version this group installs too. A second pin here could
# only agree with it or fail to lock.
[dependency-groups]
dev = ["ruff"]

[tool.ruff.lint]
# This file is the nearest ruff config for packages/conformance/, so the root
# pyproject's [tool.ruff.lint] never applies here. Spelled out for the same
# reasons as the root: pin the rule set across ruff bumps, and sort imports
# with ruff (`I`), which replaced isort repo-wide in FND-4247.
select = ["E4", "E7", "E9", "F", "I"]
# The root's extend-select, mirrored rule for rule (FND-4670): without it this
# package was exempt from every guard the root enforces. preview +
# explicit-preview-rules is how the root opts into PLC0415 alone.
preview = true
explicit-preview-rules = true
extend-select = [
    "G001",    # % operator inline in log call (not lazy)
    "G003",    # string concatenation in log call
    "G004",    # f-string in log call
    "T201",    # print() in production code
    "PLC0415", # imports must be at top of module
    "S110",    # try-except-pass detected
    "S112",    # try-except-continue detected
    "LOG009",  # logger.warn() is deprecated — use .warning()
]

# Function size and complexity (FND-4668). The thresholds are ruff's defaults,
# spelled out because tests/test_complexity_baseline.py measures C901 and
# PLR0915 at them. Neither rule is in `select`: ~190 existing functions exceed
# them, so they are held to ruff_complexity_baseline.json, which only shrinks.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.format]
# *.md: same reason as the root pyproject (ruff 0.17 formats Markdown code blocks).
exclude = ["conformance/bootstrap/templates/renovate.json", "*.md"]

[tool.ruff.lint.per-file-ignores]
# Same reasons as the root's tests/**: inline imports isolate fixtures, and
# preview mode makes F841 stricter on tuple unpacking. Only codes that fire
# are listed; an exemption nobody needs is dead config.
"tests/**" = ["PLC0415", "F841"]
# Also a CLI (pre-commit and CI run it as a script): its report is the output.
"tests/test_complexity_baseline.py" = ["T201"]
# CLI entry points: stdout is the product (SARIF, scorecard JSON, generated
# files, help text) and diagnostics go to stderr. The package has no logger.
# cli.py dispatches each subcommand through an inline import so one
# subcommand never loads another's dependencies (generate-sdk-contract-fields
# needs application_sdk, which only the `test` extra installs).
"conformance/cli.py" = ["T201", "PLC0415"]
"conformance/bootstrap/args.py" = ["T201"]
"conformance/bootstrap/autodetect.py" = ["T201"]
"conformance/bootstrap/command.py" = ["T201"]
"conformance/renovate/scan.py" = ["T201"]
"conformance/scorecard/cli.py" = ["T201"]
"conformance/suite/runner.py" = ["T201"]
"conformance/suite/checks/_ast_common/_cli.py" = ["T201"]
# Generators run as scripts, like the root's tools/**.
"conformance/tools/**" = ["T201", "PLC0415"]
"conformance/tools/generate_rule_docs.py" = ["E402"]

# The `test` extra's atlan-application-sdk resolves from this checkout, not
# PyPI (FND-4256). 19 test files import application_sdk, and the parity tests
# (tests/test_app_name_alignment.py) compare conformance's copied helpers with
# the SDK's: against a PyPI pin they checked whichever release was pinned, not
# the code beside them. This package is a member of the root uv workspace
# (FND-4671), so the SDK is the workspace root, installed editable, and the
# root uv.lock is the only lock: the resolver index pin (FND-1928) and the
# security constraint-dependencies live in the root pyproject.toml, which uv
# applies to every member. [tool.uv.sources] is never published metadata, so
# the released wheel still declares a plain `atlan-application-sdk[sql]`
# requirement.
[tool.uv.sources]
atlan-application-sdk = { workspace = true }

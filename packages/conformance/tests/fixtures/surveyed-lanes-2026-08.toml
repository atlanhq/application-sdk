# VERIFICATION FIXTURE - not an input to scoring.
#
# A hand-classification of ten connectors, surveyed 2026-08-05/06 against their
# main branches. It exists to check the deriver against human judgment: the
# workflow lists and integration/e2e boundaries here were worked out by reading
# the repos, and conformance/ledger/derive.py must reproduce them from generated
# artifacts alone.
#
# Do not add rows to make a connector score better - scoring never reads this
# file. If the deriver disagrees with a row here, one of the two is wrong and
# that is the finding.
#
# One row per PRODUCT WORKFLOW per connector, recording the best integration
# lane that exercises it. See README.md for the rationale and for why this is
# a hand-maintained inventory rather than runtime tracing.
#
# Axes:
#   realism  L live source | R replay of captured real data | S synthetic | - none
#   depth    G golden/record comparison | V schema-or-contract validation
#            | C counts + qualifiedName | E envelope only | - none
#   cadence  A automatic (push/PR/cron) | g label/env/dispatch gated | - not in CI
#
# `cadence` is ADVISORY. compute.py re-derives it from the GitHub Actions API
# using ci_workflow / ci_job; writing `A` here earns nothing if the job does
# not actually run on an automatic trigger. The denominator is likewise
# re-derived by AST-scanning each repo for product-workflow declarations.
#
# TOML, not YAML: the conformance package deliberately ships only pydantic,
# jsonschema and jinja2 - tomllib is stdlib on the supported Python floor.
#
# Surveyed 2026-08-05/06 against each repo's main branch.

version = 1


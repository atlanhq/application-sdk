# Automatically post an atlan-ci code-owner approval on Renovate
# dependency-only PRs once all required CI checks are green on the current HEAD.
#
# All approval logic lives in the reusable renovate-auto-approve-reusable.yml
# in atlanhq/application-sdk. This caller is responsible only for:
#   - Wiring the trigger (workflow_run on this repo's required-check workflows)
#   - Filtering out failed/cancelled upstream runs before spending a runner
#   - Fanning the triggers in to one run per SHA (see the job's `if:`)
#   - Forwarding event context as inputs to the reusable

name: Renovate — auto-approve dependency-only PRs

on:
  workflow_run:
    workflows: [Tests, Conformance, Pre-commit Checks, Vulnerability Scan]
    types: [completed]
    branches: ['renovate/**']
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate (for manual testing / re-approval)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    # One billed run per Renovate SHA, not one per workflow above (FND-3317).
    # Only event-payload fields are used, so a skipped trigger never gets a
    # runner. A successful run passes when it is:
    #   - Tests, the anchor: usually the last to finish. If another required
    #     check is still running, the reusable waits for it (checks_wait_minutes),
    #     and if it is STILL running when the wait ends, dispatches this workflow
    #     once with pr_number, so a late first-attempt finish is not lost.
    #   - any re-run (run_attempt > 1), so re-running a flaked workflow after
    #     the anchor already gave up still re-evaluates the PR.
    # workflow_dispatch always runs (manual testing, conformance-resync nudge).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.name == 'Tests'
              || github.event.workflow_run.run_attempt > 1))
    uses: atlanhq/application-sdk/.github/workflows/renovate-auto-approve-reusable.yml@main
    with:
      event_name: ${{ github.event_name }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      pr_number: ${{ inputs.pr_number }}
      checks_wait_minutes: 15
    secrets: inherit

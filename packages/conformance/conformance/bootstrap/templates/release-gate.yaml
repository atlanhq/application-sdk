name: Release Gate

# Blocks release PRs (auto-labeled `release` by the SDK release-version-bump
# workflow) from being merged until a reviewer adds the `e2e` label, which
# triggers the full e2e tests as the final gate before a release is cut.
#
# The label is consumed: the SDK's Tests Gate removes it once the run finishes
# and records the verdict as an `e2e` commit status on the head (FND-3411). So
# the gate passes on EITHER the label OR a successful `e2e` status on the head
# commit. A push moves the head to a commit with no status, which re-blocks
# until the label is added again. The decision lives in
# .github/scripts/release_gate.py, vendored alongside this file.
#
# All other PRs pass this check immediately — it exists solely to gate the
# auto-created bump-version PRs without requiring `e2e` on every PR.
#
# Branch-protection target: "Release Gate"
# Add this alongside "tests / Tests Gate" in branch protection so that:
# (a) this check blocks release PRs missing the label, and (b) the
# Tests Gate check enforces that unit, integration, and e2e tests all pass.
#
# Those two strings are shaped differently because a ruleset's
# required_status_checks `context` is the check-run name, which never includes
# the workflow name:
#   * an inline job  → just the job's `name:`               ("Release Gate")
#   * a job that `uses:` a reusable → "<caller job id> / <called job name>"
#     ("tests / Tests Gate" — `tests:` is the job in tests.yaml that calls
#     tests-reusable.yaml, whose gate job is named "Tests Gate")
# The UI's checks list shows the workflow name as an extra leading segment;
# that display form is not what the API matches on, and a context that matches
# no check silently protects nothing.

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]
    branches: [main]
  # A merge queue evaluates required contexts against the `merge_group` event
  # on the gh-readonly-queue/<base>/pr-N-<sha> ref, not against the pull
  # request. Without this trigger no "Release Gate" check-run is ever created
  # for the merge group, so the required context sits at "Expected — waiting
  # for status to be reported" forever and the queue never drains (FND-851).
  # Same shape as release-files-guard.yaml and sdk-gate.yaml in
  # application-sdk, which are the two in-repo guards of this kind.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  # Reads the head commit's `e2e` status once the label has been consumed.
  statuses: read

# A new commit retires the previous commit's run; see conformance.yaml for why
# the group is run-unique off the PR path and why only `synchronize` cancels.
# That matters doubly here: `labeled`/`unlabeled` fire on the SAME head SHA
# (the bump-version PR is labelled `release` at creation; a reviewer adds
# `e2e`), so they take a run-unique group. In the PR's group, two label events
# on top of a running check would evict the pending one and leave a
# `cancelled` "Release Gate" on the head. Run-unique, each runs to completion,
# and the newest run's verdict is the one the required check reads.
concurrency:
  group: release-gate-${{ github.event_name == 'pull_request' && contains(fromJSON('["opened", "synchronize"]'), github.event.action) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  release-gate:
    name: Release Gate
    # `github.event.pull_request` does not exist on `merge_group`, so the label
    # lookup can only run on the pull_request event. The skip is at JOB level:
    # a job that starts only to skip its one step is billed a runner minute on
    # every queue entry (FND-3320), while a skipped job bills nothing and still
    # files its `Release Gate` check run with conclusion `skipped` — which a
    # required check counts as a pass, so the queue still drains. Keep the
    # `name:` static: the skipped run must carry the same context string.
    # Nothing is lost by passing here: a release PR missing `e2e` fails this
    # gate on the PR itself and so never becomes eligible to enter the queue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A failed lookup leaves the file empty, which the gate reads as "no e2e
      # verdict" and fails on - see release_gate.py.
      #
      # The endpoint pages its `statuses` list, so on a commit with many
      # contexts `e2e` can sit past the first page; `--paginate` walks them
      # all. `--jq` runs once per page, and the script takes the last
      # non-blank line. Not `--slurp`: gh rejects it alongside `--jq`, and
      # that error would leave the file empty on every run.
      - name: Fetch the head commit's e2e status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/commits/${HEAD_SHA}/status?per_page=100" \
            --paginate \
            --jq '.statuses[] | select(.context == "e2e") | .state' > e2e-state.txt

      - name: Verify release readiness
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          touch e2e-state.txt
          python3 .github/scripts/release_gate.py \
            --labels "$LABELS" \
            --e2e-state-file e2e-state.txt

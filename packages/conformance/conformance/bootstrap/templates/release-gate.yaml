name: Release Gate

# Blocks release PRs (bump-version branches, labelled `release` by the SDK
# release-version-bump workflow) from merging until their full release gate —
# tests with e2e, pre-commit, conformance and the vulnerability scan — has run
# AND passed on the head commit. No CI runs on a release PR until a reviewer
# comments `/gate-check` (FND-3748, FND-3839). The PR's own run skips every job
# inside the gated reusables (`skip-on-bump-pr`, FND-3947), so their required
# `<caller> / <job>` checks resolve as `skipped`, which reads as a pass. This
# check is therefore the only thing holding a release PR, and it must stay
# fail-closed.
#
# The verdict is the head commit's `gate-check` status. `/gate-check` posts it
# as `pending` and dispatches the gated workflows (test-commands.yaml); when the
# last of them finishes it becomes `success` or `failure`, and this workflow is
# re-run to read it. A push moves the head to a commit with no status, which
# re-blocks until `/gate-check` is asked again. The decision lives in
# .github/scripts/release_gate.py, vendored alongside this file.
#
# All other PRs pass this check immediately.
#
# Branch-protection target: "Release Gate"
# Add this alongside "tests / Tests Gate" in branch protection so that:
# (a) this check blocks release PRs whose release gate has not passed on the
# head commit, and (b) the Tests Gate check enforces that unit, integration,
# and e2e tests all pass.
#
# Those two strings are shaped differently because a ruleset's
# required_status_checks `context` is the check-run name, which never includes
# the workflow name:
#   * an inline job  → just the job's `name:`               ("Release Gate")
#   * a job that `uses:` a reusable → "<caller job id> / <called job name>"
#     ("tests / Tests Gate" — `tests:` is the job in tests.yaml that calls
#     tests-reusable.yaml, whose gate job is named "Tests Gate")
# The UI's checks list shows the workflow name as an extra leading segment;
# that display form is not what the API matches on, and a context that matches
# no check silently protects nothing.

on:
  pull_request:
    # No `labeled`/`unlabeled`: a label is no longer the opt-in, and a same-SHA
    # label event only ever added a duplicate run (FND-3839). The verdict
    # arriving re-runs this workflow instead.
    types: [opened, synchronize, reopened]
    branches: [main]
  # A merge queue evaluates required contexts against the `merge_group` event
  # on the gh-readonly-queue/<base>/pr-N-<sha> ref, not against the pull
  # request. Without this trigger no "Release Gate" check-run is ever created
  # for the merge group, so the required context sits at "Expected — waiting
  # for status to be reported" forever and the queue never drains (FND-851).
  # Same shape as release-files-guard.yaml and sdk-gate.yaml in
  # application-sdk, which are the two in-repo guards of this kind.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  # Reads the head commit's `gate-check` status.
  statuses: read

# A new commit retires the previous commit's run; see conformance.yaml for why
# the group is run-unique off the PR path and why only `synchronize` cancels.
concurrency:
  group: release-gate-${{ github.event_name == 'pull_request' && contains(fromJSON('["opened", "synchronize"]'), github.event.action) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  release-gate:
    name: Release Gate
    # `github.event.pull_request` does not exist on `merge_group`, so the label
    # lookup can only run on the pull_request event. The skip is at JOB level:
    # a job that starts only to skip its one step is billed a runner minute on
    # every queue entry (FND-3320), while a skipped job bills nothing and still
    # files its `Release Gate` check run with conclusion `skipped` — which a
    # required check counts as a pass, so the queue still drains. Keep the
    # `name:` static: the skipped run must carry the same context string.
    # Nothing is lost by passing here: a release PR without a passed
    # `gate-check` fails this gate on the PR itself and so never becomes
    # eligible to enter the queue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A failed lookup leaves the file empty, which the gate reads as "no
      # verdict" and fails on - see release_gate.py.
      #
      # The per-commit statuses list, not the combined status: only the list
      # carries each status's `creator`, and the script trusts a verdict only
      # from github-actions[bot] (FND-3947). The list is newest first and
      # paged; `--paginate` walks every page, and `--jq` prints one
      # `<state> <creator>` line per gate-check status. Not `--slurp`: gh
      # rejects it alongside `--jq`, and that error would leave the file empty
      # on every run.
      - name: Fetch the head commit's gate-check status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses?per_page=100" \
            --paginate \
            --jq '.[] | select(.context == "gate-check") | "\(.state) \(.creator.login)"' > gate-check-state.txt

      - name: Verify release readiness
        env:
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          touch gate-check-state.txt
          python3 .github/scripts/release_gate.py \
            --head-ref "$HEAD_REF" \
            --labels "$LABELS" \
            --gate-check-state-file gate-check-state.txt

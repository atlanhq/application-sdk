name: "Conformance"

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: [main]
  # Force-refresh: re-run the full suite against the latest published rules
  # once a day, independent of whether Renovate's conformance-package lock
  # bump has been merged. Daily, not 6-hourly (FND-3315): four force-all runs
  # a day, each with its SARIF and dashboard follow-ons, cost ~70 billed jobs
  # per repo before any PR activity, and push to main already refreshes the
  # dashboard whenever the code moves. Timed 30 min ahead of one of
  # connector-pulse's fleet ingests (refresh-conformance-dashboard.yml polls
  # k.atlan.dev at :47 past every 6th hour UTC) so this run, plus the
  # dashboard publish it triggers, land before the 03:47 pull.
  schedule:
    - cron: "17 3 * * *"
  # Lets a human force an out-of-band refresh right after a conformance
  # release lands, without waiting for the next cron tick.
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

# A new commit on a PR retires the previous commit's run (FND-3314) — without
# this every push, and every Renovate rebase, ran all series to completion.
#
# The group is shared only by the pull_request events that can bring a new
# commit: opened, synchronize, reopened. Everything else — main, schedule,
# workflow_dispatch, merge_group, and the same-SHA PR events other callers
# subscribe to (labeled, unlabeled, pull_request_review) — is run-unique,
# because a shared group holds ONE pending run and a third arrival evicts it,
# leaving a `cancelled` check (FND-218, docs/standards/ci.md "`concurrency:` is
# not a lock, and not a queue"). Two label events on top of a running check
# would do exactly that on the head SHA.
#
# Only `synchronize` cancels. That event always brings a new head SHA, so the
# `cancelled` check runs it leaves land on a commit that is no longer head.
# Cancelling on a same-SHA event (`opened` racing `reopened`) would park a
# `cancelled` check on the head itself, and Renovate never merges a branch
# with one (see commits.yaml in application-sdk) — those queue instead.
concurrency:
  group: conformance-${{ github.event_name == 'pull_request' && contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  suite:
    uses: atlanhq/application-sdk/.github/workflows/conformance-reusable.yaml@main
<% if conformance_private_git_deps %>    # private-git-deps needs ORG_PAT_GITHUB from the reusable's declared secrets.
    secrets: inherit
<% endif %>    with:
      event_name: ${{ github.event_name }}
<% if conformance_private_git_deps %>      # This repo pins a private atlanhq dep via ssh:// in pyproject.toml. The
      # D-series leg materialises the env with `uv sync`, and an
      # unauthenticated runner can only clone that dep off a warm uv cache —
      # on a cache miss the leg dies with `Permission denied (publickey)` and
      # takes the Conformance Gate down with it. `exit-zero` does not help:
      # it suppresses rule violations, and this is a crash before detect runs.
      private-git-deps: << conformance_private_git_deps >>
<% endif %>      # Scheduled/manual force-refresh runs have no PR base to diff against
      # and nothing to block — always run every series, and never fail the
      # run itself. The SARIF still records the real result, so the
      # dashboard/Security tab reflect the true drift.
      force-all: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      exit-zero: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || << exit_zero >> }}

name: Generated Artifact Freshness

# Managed shim (BLDX-1414). Delegates to the reusable freshness gate in
# application-sdk: on a PR that touches the contract or its generated outputs,
# regenerate from contract/app.pkl and flag any stale or hand-edited artifact.
# Informational (non-blocking) — see the reusable workflow for details.

on:
  pull_request:
    branches: [main]
    paths:
      - 'contract/**'
      - 'atlan.yaml'
      - 'app.yaml'
      - 'app/generated/**'

permissions:
  contents: read
  pull-requests: write

# A new commit retires the previous commit's run; see conformance.yaml for why
# only `synchronize` cancels. The reusable carries its own workflow-level group
# (`generated-freshness-<PR number>`, queue-only); this name must never equal
# it, or GitHub cancels the call as a concurrency deadlock.
concurrency:
  group: generated-freshness-caller-${{ startsWith(github.ref, 'refs/pull/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  freshness:
    uses: atlanhq/application-sdk/.github/workflows/generated-freshness.yaml@main
    # An app that intentionally hand-maintains its generated artifacts opts out:
    # with:
    #   check-freshness: false

name: "Conformance SARIF Upload"
# Thin caller. Uploads SARIF results from the Conformance workflow to the GitHub
# Security tab. The whole body — the GHAS eligibility probe, the artifact
# download, the suppression strip and the upload — lives in the reusable, so the
# third-party action pins it needs are maintained in application-sdk rather than
# in this repo's copy (FND-1994).
#
# Two things cannot move into the reusable and so stay here:
#   - the `workflow_run` trigger: a reusable workflow may only declare
#     `workflow_call`. It runs as a separate workflow from the gate so that it
#     always exits 0 — GitHub Code Scanning marks a tool as "reporting errors"
#     whenever the workflow that uploads its SARIF fails, and the gate
#     intentionally exits 1 on blocking violations.
#   - the `permissions:` block below: permissions are caller-granted.

on:
  workflow_run:
    workflows: ["Conformance"]
    types: [completed]
    branches: [main]

# A `permissions:` block is exhaustive, not additive: every scope it omits
# is `none`, whatever the repository default is. `contents: read` is
# therefore load-bearing — without it `actions/checkout` cannot read the
# availability probe, and the job this workflow exists to keep green fails on
# exactly the 77 repos FND-1149 is about.
permissions:
  contents: read  # required to check out the availability probe script
  security-events: write
  actions: read  # required to download artifacts from the triggering run

jobs:
  upload:
    if: github.event.workflow_run.conclusion != 'cancelled'
    uses: atlanhq/application-sdk/.github/workflows/conformance-upload-sarif-reusable.yaml@main
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      head_sha: ${{ github.event.workflow_run.head_sha }}

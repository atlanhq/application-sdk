name: Pre-commit Checks
# Thin caller. All of the body — checkout, the optional system-deps step,
# setup-deps and pre-commit itself — lives in the reusable, so the third-party
# action pins it needs are maintained in application-sdk rather than in this
# repo's copy (FND-1994). This file is responsible only for the trigger, the
# permissions grant, the concurrency group, and whichever apt packages this
# repo needs installed before `uv sync`.
#
# `permissions:` is exhaustive, not additive: every scope it omits is `none`.
# `contents: read` is what lets the reusable's `actions/checkout` read this repo.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  merge_group:
  # A `/gate-check` comment on a bump-version PR dispatches this (FND-3839).
  workflow_dispatch:

jobs:
  pre-commit:
    # Bump-version PR CI is opt-in (FND-3748): a `/gate-check` comment
    # dispatches this workflow on the bump branch, and that run checks
    # everything. On the PR's own run, `skip-on-bump-pr` skips every job inside
    # the reusable (FND-3947). Each skipped job still files its required
    # `pre-commit / …` check, which costs no runner and resolves the PR's
    # required checks; Release Gate is the blocker, failing until the
    # `/gate-check` verdict on the head commit passes. Skipping this caller job
    # instead would file only `pre-commit` and leave `pre-commit / Pre-commit`
    # "Expected" forever, because GitHub does not count a dispatched run toward
    # a PR's required checks. No `labeled` trigger: a label add on the same
    # commit started a second run that evicted the first (FND-3839).
    uses: atlanhq/application-sdk/.github/workflows/checks-reusable.yaml@main
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
<% if checks_private_git_deps %>    # private-git-deps needs ORG_PAT_GITHUB from the reusable's declared secrets.
    secrets: inherit
<% endif %>    with:
      skip-on-bump-pr: true
<% if system_deps %>      # Extra apt packages this repo needs before setup-deps' `uv sync`: a
      # dependency with no manylinux wheel is built from sdist on the runner
      # and needs its C headers present first. Managed by bootstrap's
      # --system-deps and auto-detected off this file on re-run, so
      # the value survives an always-overwrite re-sync (and C002 doesn't read it
      # as drift).
      system_deps: "<< system_deps >>"
<% endif %><% if checks_private_git_deps %>      # This repo pins a private atlanhq dep via ssh:// in pyproject.toml, and
      # setup-deps' `uv sync` has to clone it before any hook runs.
      private-git-deps: << checks_private_git_deps >>
<% endif %>
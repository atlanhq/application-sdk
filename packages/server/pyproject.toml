[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlan-application-sdk-server"
version = "0.1.0"
description = "Consolidated API server runtime for Atlan app servers — the auth / preflight / metadata handler surface plus FastAPI assembly, with no worker or data-processing dependencies"
license = "Apache-2.0"
authors = [
    {name = "Atlan App Team", email = "connect@atlan.com"}
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["atlan", "sdk", "server", "fastapi", "consolidation"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]
# Serving surface only. Deliberately NO temporalio, dapr, daft, duckdb, pandas,
# pyarrow, boto3, pyatlan, opentelemetry in the base install — those are
# worker-side, and this package is what the consolidated common-api-server
# installs once per pod for every hosted app. Keeping the base thin is the whole
# reason the host fits many apps in one process; see the extras below for the
# capabilities that genuinely need more.
#
# This is ALSO why the package lives here rather than being folded into
# `atlan-application-sdk` itself: that distribution's core requires pyatlan,
# obstore, boto3, azure-identity, google-auth, temporalio and the OTEL stack,
# and its own comments record that those cannot be optional extras. Shipping
# separately — exactly as `atlan-application-sdk-conformance` does — keeps one
# repo, one release train and one conformance gate without forcing the host to
# carry the worker's dependency tree.
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "starlette>=0.40.0",
    # Fast, stable JSON serialization for stored-config / configmap output.
    "orjson>=3.10.0,<4.0.0",
]

# Generic capability extras only — each backs code that lives IN this package.
# The package knows nothing about specific connectors; a connector declares its
# own driver dependencies (sqlalchemy-redshift, snowflake-sqlalchemy, ...) in
# its own package and pulls the capability extras it needs from here.
[project.optional-dependencies]
# SQL auth/metadata path: SQLAlchemy + the psycopg tolerant-text decoder.
sql = ["sqlalchemy>=2.0.0,<3.0.0"]
# AWS-IAM helpers for AWS-hosted SQL sources (server_sdk.aws): region
# resolution, assume-role, boto3 session/client creation.
aws = ["boto3>=1.34.0"]
# Convenience for running a server standalone (the common-api-server brings its own).
serve = ["uvicorn>=0.30.0"]
# Enables POST /workflows/v1/start by pulling in temporalio. The route is not
# registered at all when this extra is absent (see server_sdk.workflow), so an
# app that never starts workflows from its serving path pays nothing for it.
workflow = ["temporalio>=1.25.0,<2.0.0"]
test = [
    "pytest>=8.3.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    # starlette's TestClient (via fastapi.testclient) refuses to import without
    # this: starlette >=1.0 moved off httpx onto httpx2, and the failure is an
    # import-time RuntimeError, so omitting it does not skip the HTTP-surface
    # tests — it fails collection for the whole suite.
    "httpx2>=0.28.0",
    # The suites exercise the SQL client and the AWS IAM helpers directly, so
    # the capability extras this package defines have to be installed for them
    # to run rather than silently skip.
    "atlan-application-sdk-server[sql,aws,workflow]",
]

[tool.hatch.build.targets.wheel]
packages = ["server_sdk"]

[tool.hatch.build.targets.sdist]
include = ["server_sdk", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff==0.16.7"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["G004", "PLC0415", "F841", "T201"]

# Pin the resolver's default index to PyPI explicitly (FND-1928).
#
# This package carries its own `uv.lock`, so it needs its own pin: a project-level default
# index is what stops the machine-wide Endor Labs package firewall in `~/.config/uv/uv.toml`
# from rewriting every URL in that lock to `factory.endorlabs.com/...` on the next `uv`
# command. The rewrite is silent, changes no version or hash, and makes CI fail at dependency
# install with `401 Unauthorized` once committed. See the longer note in the repo-root
# pyproject.toml; D012/D013 in this very suite are what enforce it fleet-wide.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

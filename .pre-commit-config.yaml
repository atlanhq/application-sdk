repos:
  # Ruff is the only linter, formatter AND import sorter (isort was dropped in
  # FND-4247: the hook and the dev group pinned different isort versions, so
  # `uv run isort` rewrote files CI accepted). The rev must equal the
  # `ruff==` pin in pyproject.toml's dev group and in
  # packages/conformance/pyproject.toml, so `uv run ruff` sorts and formats
  # exactly like this hook. Renovate bumps all three in one PR (the `ruff`
  # group in renovate.json); .github/scripts/tests/test_lint_guards.py fails
  # if they ever disagree.
  #
  # `--fix` keeps the auto-fix isort used to give: an unsorted import block
  # is rewritten in place (and the hook still fails, so CI stays a check).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      # Guard the composite-action manifests: a malformed action.yaml fails to
      # load for EVERY repo that `uses:` it via @main, taking the whole connector
      # fleet down before any step runs. Parse them on every commit so an invalid
      # manifest can never reach main again.
      - id: check-yaml
        name: check-yaml (GitHub composite-action manifests)
        files: ^\.github/actions/.*/action\.ya?ml$
  # Validate workflows against GitHub's ACTUAL schema, not a parser that is
  # more permissive than the one that will reject them. Three consecutive
  # workflow startup failures reached main because every local check used
  # yaml.safe_load — which accepts duplicate keys — while GitHub refused to
  # parse the file. A workflow GitHub cannot parse runs NO jobs, so the symptom
  # is silence and CI stays green while the workflow is dead. actionlint catches
  # that class (duplicate keys, undefined `needs.<job>` references, unknown
  # context properties) at commit time.
  #
  # shellcheck is disabled for now: it reports 64 pre-existing findings in
  # `run:` blocks, which are a separate and much lower-stakes concern than a
  # workflow that will not start. Config and grandfathered findings live in
  # .github/actionlint.yaml.
  #
  # `files` widens the upstream hook's default (`^\.github/workflows/`) to cover
  # .github/workflow-templates/ as well. Those starter workflows are handed to
  # other repos verbatim, so a parse error there is shipped rather than merely
  # suffered — the same silent-failure class, one repo further downstream.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-shellcheck=']
        files: ^\.github/(workflows|workflow-templates)/.*\.ya?ml$
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/renovatebot/pre-commit-hooks
    # Pinned to the SAME renovate version the fleet runner installs
    # (.github/workflows/renovate.yaml), so a config that validates here cannot
    # fail on the runner: this tag's additional_dependencies is renovate@<rev>.
    # Parity is enforced by .github/scripts/tests/test_renovate_validator_pin.py.
    # language_version is `lts` upstream, so pre-commit provisions its own node
    # rather than depending on whatever the runner image ships.
    rev: 44.3.2
    hooks:
      - id: renovate-config-validator
        # Why this hook exists: nothing validated these files until FND-359, and
        # they are read by every repo in the fleet — a malformed shared preset
        # breaks Renovate everywhere at once. The silent failures matter more
        # than the loud ones: an option set in the wrong object is a *warning*
        # that this validator exits 1 on, but that Renovate itself only logs.
        # prPriority sat inside lockFileMaintenance being ignored from the lane's
        # introduction until FND-359 for exactly that reason.
        #
        # The upstream file filter only matches renovate.json / .renovaterc, so
        # widen it to the two files that carry the fleet-wide blast radius: the
        # shared preset every repo extends, and the runner's admin config. The
        # validator accepts the JS one too.
        files: ^(renovate\.json|renovate-config/(default\.json|self-hosted\.js))$

  # pyright over the SDK tree, held to the repo-root pyright_baseline.json
  # (FND-4295). reportArgumentType, reportAttributeAccessIssue and
  # reportFunctionMemberAccess are errors, with findings that predate that, so
  # a plain pyright hook (the pyright-python one this replaces) fails on every
  # run. This fails on a NEW error instead, per file and rule. pyright is the
  # exact `dev`-group pin; every extra and group is installed so imports
  # resolve as in CI's venv. In CI, PYRIGHT_BASELINE_BASE_SHA (codeql.yaml)
  # also holds the baseline to the base revision's.
  - repo: local
    hooks:
      - id: pyright
        name: pyright (baseline)
        entry: uv run --frozen --all-extras --all-groups python .github/scripts/check_pyright_baseline.py --scope sdk
        language: system
        files: ^(.*\.py|pyright_baseline\.json|pyproject\.toml|uv\.lock)$
        pass_filenames: false
  # Every `extra_javascript` entry in mkdocs.yml runs on every docs page.
  # polyfill.io sat there after its domain was taken over in 2024 and began
  # serving malicious JavaScript (FND-4243). Only local paths pass; vendor
  # scripts into docs/static/javascripts/.
  - repo: local
    hooks:
      - id: check-mkdocs-script-hosts
        name: check mkdocs extra_javascript hosts
        entry: python .github/scripts/check_mkdocs_script_hosts.py
        language: python
        additional_dependencies: ["pyyaml==6.0.4"]
        files: ^(mkdocs\.yml|\.github/scripts/check_mkdocs_script_hosts\.py)$
        pass_filenames: false
      # The pyright hook above never sees .github/scripts ([tool.pyright]
      # excludes .github/**); CI's `pyright .github/scripts` job holds them to
      # .github/scripts/pyright_baseline.json instead. Run the same ratchet here
      # so a PR finds out before push. It also triggers on pyproject.toml /
      # uv.lock: adding or dropping a package changes how the scripts' imports
      # resolve (dropping httpx2 made starlette's TestClient unknown). Locally
      # without a base SHA, so a same-PR baseline raise is caught only in CI.
      - id: pyright-scripts-baseline
        name: pyright .github/scripts baseline
        entry: uv run --frozen --extra workflows python .github/scripts/check_pyright_baseline.py
        language: system
        files: ^(\.github/scripts/.*\.py|\.github/scripts/pyright_baseline\.json|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # C901 / PLR0915 are not in packages/conformance's ruff `select` (~190
      # existing functions exceed them); they are held to a per-file baseline
      # that only shrinks (FND-4668, docs/standards/ci.md). Needs only ruff,
      # which the root env pins to the same version as the package.
      - id: conformance-complexity-baseline
        name: conformance complexity baseline
        entry: uv run --frozen python packages/conformance/tests/test_complexity_baseline.py
        language: system
        files: ^packages/conformance/(conformance/.*\.py|ruff_complexity_baseline\.json|pyproject\.toml)$
        pass_filenames: false
      # ruff ANN401 (`typing.Any` in a signature) is not in ruff's `select`:
      # application_sdk/ had ~490 sites when it was enabled. They are held to
      # .github/scripts/ann401_baseline.json, per file, which only shrinks
      # (FND-4301, docs/standards/coding.md). Locally without a base SHA; CI's
      # `CI script tests` job also holds the baseline to the base revision's.
      - id: ann401-baseline
        name: ANN401 (Any in signatures) baseline
        entry: uv run --frozen python .github/scripts/check_ann401_baseline.py
        language: system
        files: ^(application_sdk/.*\.py|\.github/scripts/(ann401_baseline\.json|check_ann401_baseline\.py)|pyproject\.toml)$
        pass_filenames: false

schema_type: dataframe
version: 0.22.1
columns:
  typeName:
    dtype: str
    nullable: false
    required: true
    checks:
      isin:
        value: [Table, View, MaterialisedView, TablePartition]
  status:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ACTIVE
  attributes.name:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.qualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+/.+/.+
  attributes.connectionQualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+
  attributes.connectionName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.connectorName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: postgres
  attributes.databaseName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.databaseQualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+
  attributes.schemaName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.schemaQualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+/.+
  attributes.columnCount:
    dtype: int64
    nullable: false
    required: true
  attributes.tenantId:
    dtype: str
    nullable: false
    required: true
  attributes.lastSyncRunAt:
    dtype: int64
    nullable: false
    required: true
  customAttributes.table_type:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
checks:
  check_record_count_ge:
    value: 1
strict: false
coerce: false
unique_column_names: false
add_missing_columns: false
title: Transformed Table Contract
description: Required transformed Table/View attributes for active crawler output.

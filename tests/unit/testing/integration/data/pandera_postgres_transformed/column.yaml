schema_type: dataframe
version: 0.22.1
columns:
  typeName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: Column
  status:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ACTIVE
  attributes.name:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.qualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+/.+/.+/.+
  attributes.connectionQualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+
  attributes.connectionName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.connectorName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: postgres
  attributes.databaseName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.databaseQualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+
  attributes.schemaName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.schemaQualifiedName:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: ^.+/.+/.+
  attributes.dataType:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
  attributes.isNullable:
    dtype: bool
    nullable: false
    required: true
  attributes.isPrimary:
    dtype: bool
    nullable: false
    required: true
  attributes.isForeign:
    dtype: bool
    nullable: false
    required: true
  attributes.isPartition:
    dtype: bool
    nullable: false
    required: true
  attributes.numericScale:
    dtype: int64
    nullable: false
    required: true
  attributes.tenantId:
    dtype: str
    nullable: false
    required: true
  attributes.lastSyncRunAt:
    dtype: int64
    nullable: false
    required: true
  customAttributes.type_name:
    dtype: str
    nullable: false
    required: true
    checks:
      str_matches:
        value: .+
checks:
  check_record_count_ge:
    value: 1
strict: false
coerce: false
unique_column_names: false
add_missing_columns: false
title: Transformed Column Contract
description: Required transformed Column attributes for active crawler output.
